  // P3-a: GPS stale — userPos 마지막 갱신 시각 추적
  const gpsLastUpdateRef = useRef(0);
  const [gpsStale, setGpsStale] = useState(false);
  const authTokenRef = useRef("");
  const tokenIssuedAtRef = useRef(0); // P0-1: 토큰 발급 시각 — visibilitychange 시 사전 재발급 판단
  const [progTimeBase, setProgTimeBase] = useState(() => LS.get("progbase", "now")); // now|trip

  // TTS
  const [voices, setVoices] = useState([]);
  const [selectedVoiceURI, setSelectedVoiceURI] = useState(() => LS.get("voice", null));
  const [ttsStatus, setTtsStatus] = useState("unknown");
  const [ttsPrimed, setTtsPrimed] = useState(false);
  const [chimeEnabled, setChimeEnabled] = useState(() => LS.get("chime", "1") === "1");
  const [useClips, setUseClips] = useState(() => LS.get("clips", "0") === "1");

  const watchIdRef = useRef(null);
  const announcedRef = useRef(new Set());
  const utterRef = useRef(null);
  const audioCtxRef = useRef(null);
  const audioElRef = useRef(null);
  const legSwitchArmedRef = useRef(false);
  const legDepartCountRef = useRef(0);     // 종점 이탈 연속 카운트 (자동 전환 히스테리시스)
  const resetStopRef = useRef(null);       // 레그 변경 시 currentIdx를 0이 아닌 특정 정류장으로 설정(GPS 스냅)
  const wakeLockRef = useRef(null);
  const rateRef = useRef(rate);            // 자동 안내 시 최신 값 참조용
  const voiceRef = useRef(selectedVoiceURI);
  useEffect(() => { rateRef.current = rate; }, [rate]);
  useEffect(() => { voiceRef.current = selectedVoiceURI; }, [selectedVoiceURI]);

  // 현재 시각 — 설정한 주기마다 갱신해 운행 상태/남은 시간/회차 판정을 최신으로 유지
  const [tickSec, setTickSec] = useState(() => parseInt(LS.get("ticksec", "5")) || 5);
  useEffect(() => LS.set("ticksec", String(tickSec)), [tickSec]);
  const [nowTick, setNowTick] = useState(() => Date.now());
  useEffect(() => {
    const id = setInterval(() => setNowTick(Date.now()), tickSec * 1000);
    return () => clearInterval(id);
  }, [tickSec]);

  // Persist on change
  useEffect(() => LS.set("mode", mode), [mode]);
  useEffect(() => LS.setJSON("coords", coords), [coords]);

  /* --- 좌표 동기화 (Firebase) — 운영자가 수정한 정류장 좌표를 모든 승객에게 반영 --- */
  const coordsFirstRef = useRef(true);
  useEffect(() => {
    if (!shareUrl) return;
    fetch(`${shareUrl.replace(/\/+$/, "")}/coords.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => {
        if (!d || typeof d !== "object" || Array.isArray(d)) return;
        const clean = {};
        Object.entries(d).forEach(([k, v]) => {
          if (v && typeof v.lat === "number" && typeof v.lng === "number") clean[k] = { lat: v.lat, lng: v.lng };
        });
        if (Object.keys(clean).length) {
          coordsFirstRef.current = true; // 곧 발생할 setCoords가 트리거하는 PUT을 한 번 건너뜀
          setCoords((prev) => ({ ...prev, ...clean }));
          LS.setJSON("coords", { ...LS.getJSON("coords", {}), ...clean });
        }
      })
      .catch(() => {});
  }, [shareUrl]);
  useEffect(() => {
    if (coordsFirstRef.current) { coordsFirstRef.current = false; return; } // 첫 마운트/fetch 직후엔 업로드 생략
    if (!shareUrl) return;
    const auth = authTokenRef.current;
    if (!auth) return; // 로그인 안 됨 → 로컬만 저장. 위치 공유를 한 번 켜면 토큰 발급되어 다음 수정부터 동기화
    fetch(`${shareUrl.replace(/\/+$/, "")}/coords.json?auth=${encodeURIComponent(auth)}`, {
      method: "PUT", body: JSON.stringify(coords),
    }).catch(() => {});
  }, [coords, shareUrl]);
  useEffect(() => LS.set("rate", String(rate)), [rate]);
  useEffect(() => LS.set("radius", String(triggerRadius)), [triggerRadius]);
  useEffect(() => { if (selectedVoiceURI) LS.set("voice", selectedVoiceURI); }, [selectedVoiceURI]);
  useEffect(() => LS.set("chime", chimeEnabled ? "1" : "0"), [chimeEnabled]);
  useEffect(() => LS.set("clips", useClips ? "1" : "0"), [useClips]);
  useEffect(() => LS.set("autoleg", autoLegSwitch ? "1" : "0"), [autoLegSwitch]);
  useEffect(() => LS.set("festday", festivalDay), [festivalDay]);
  useEffect(() => LS.set("progbase", progTimeBase), [progTimeBase]);
  useEffect(() => LS.set("shareurl", shareUrl), [shareUrl]);
  useEffect(() => LS.set("busid", busId), [busId]);
  useEffect(() => LS.set("driveremail", driverEmail), [driverEmail]);
  useEffect(() => LS.set("driverpass", driverPass), [driverPass]);
  useEffect(() => LS.set("apikey", apiKey), [apiKey]);

  // 안내에 사용할 축제일 결정 (수동 지정 우선, 아니면 오늘 날짜로 판단)
  const resolveFestivalDay = () => {
    if (festivalDay === "day1" || festivalDay === "day2") return festivalDay;
    const d = getNow();
    if (d.getMonth() === 5 && d.getDate() === 13) return "day1";
    if (d.getMonth() === 5 && d.getDate() === 14) return "day2";
    return null;
  };

  const route = ROUTES[direction];
  const stops = route.stops;
  const trip = route.trips[tripIdx];

  /* --- 운행 회차 수: 6.14(일)은 5회차까지만, 그 외 6회차.
     기준일 설정(festivalDay)이 지정되면 그에 따르고, 자동이면 기기 날짜로 판단 --- */
  const tripsToday = useMemo(() => {
    if (festivalDay === "day2") return 5;
    if (festivalDay === "day1") return ROUTES.outbound.trips.length;
    const d = getNow();
    if (d.getMonth() === 5 && d.getDate() === 14) return 5;
    return ROUTES.outbound.trips.length;
  }, [nowTick, festivalDay]);

  /* --- Circular route: next leg computation ---
     outbound n → inbound n (15분 후, 축제장 휴식)
     inbound n → outbound n+1 (즉시 환승, 같은 시각 — 단 inbound 1 → outbound 2 는 점심휴식 1h40m)
     마지막 회차 → 운행 종료
     A10: 점심휴식·15분 휴식은 시간표 데이터 자체에 반영됨 — timetableMode tick 이 nextLeg trips[0] 시각까지 대기 */
  const nextLeg = useMemo(() => {
    if (direction === "outbound") return { direction: "inbound", tripIdx };
    if (tripIdx < tripsToday - 1)
      return { direction: "outbound", tripIdx: tripIdx + 1 };
    return null; // last leg of the day
  }, [direction, tripIdx, tripsToday]);

  const nextLegInfo = nextLeg ? {
    label: ROUTES[nextLeg.direction].label,
    departTime: ROUTES[nextLeg.direction].trips[nextLeg.tripIdx][0],
    tripNum: nextLeg.tripIdx + 1,
  } : null;

  const isAtTerminus = currentIdx === stops.length - 1;

  // P2-5: 운행 일지 — direction/tripIdx 변경 시 직전 leg 정보를 /journal 에 자동 기록
  const tripStartedAtRef = useRef(Date.now());
  const tripStopArrivalRef = useRef({}); // { stopIdx: ts }
  const writeJournalEntry = (wasDir, wasTrip) => {
    try {
      if (!shareUrl || !busId) return;
      const base = shareUrl.replace(/\/+$/, "");
      const auth = authTokenRef.current ? `?auth=${encodeURIComponent(authTokenRef.current)}` : "";
      const tripPrefix = `${wasDir}|${wasTrip + 1}|`;
      let board = 0, alight = 0;
      Object.entries(countsRef.current || {}).forEach(([k, v]) => {
        if (!k.startsWith(tripPrefix) || !v) return;
        board += Number(v.board) || 0;
        alight += Number(v.alight) || 0;
      });
      const route = ROUTES[wasDir];
      const stopArrivals = {};
      Object.entries(tripStopArrivalRef.current || {}).forEach(([idx, ts]) => {
        const nm = route && route.stops[Number(idx)]?.name;
        if (nm) stopArrivals[nm] = ts;
      });
      const entry = {
        dir: wasDir, trip: wasTrip + 1, busId,
        startAt: tripStartedAtRef.current || null,
        endAt: Date.now(),
        stopArrivals,
        counts: { board, alight, onboard: Math.max(0, board - alight) },
        broadcastFails: broadcastStats?.failCount || 0,
      };
      fetch(`${base}/journal/${dateKey}/${encodeURIComponent(busId)}/${wasDir}-${wasTrip + 1}.json${auth}`, {
        method: "PUT", body: JSON.stringify(entry), keepalive: true,
      }).catch(() => {});
    } catch (_) {}
  };
  const prevDirRef = useRef(direction);
  const prevTripRef = useRef(tripIdx);
  useEffect(() => {
    const wasDir = prevDirRef.current, wasTrip = prevTripRef.current;
    if (wasDir !== direction || wasTrip !== tripIdx) {
      writeJournalEntry(wasDir, wasTrip);
      tripStartedAtRef.current = Date.now();
      tripStopArrivalRef.current = {};
    }
    prevDirRef.current = direction;
    prevTripRef.current = tripIdx;
  }, [direction, tripIdx]);
  // pagehide/freeze 시점에 현재 leg 의 부분 일지 기록 — 탭 종료 손실 방지
  useEffect(() => {
    const onHide = () => writeJournalEntry(direction, tripIdx);
    window.addEventListener("pagehide", onHide);
    document.addEventListener("freeze", onHide);
    return () => {
      window.removeEventListener("pagehide", onHide);
      document.removeEventListener("freeze", onHide);
    };
  }, [direction, tripIdx, shareUrl, busId, dateKey]);

  const goToNextLeg = () => {
    if (!nextLeg) return;
    // 회차 전환 전: 종점이면 잔여 인원 전원 하차 자동 적용 + 카운트 큐 flush
    const cs = stops[currentIdx];
    if (cs && cs.terminus) { try { alightAll(); } catch (_) {} }
    try { flushCountsWrites(); } catch (_) {}
    legSwitchArmedRef.current = false;
    legDepartCountRef.current = 0;
    setDirection(nextLeg.direction);
    setTripIdx(nextLeg.tripIdx);
    setCurrentIdx(0);
    announcedRef.current = new Set();
  };

  /* --- 현재 시각 기준으로 운행 중/다음 회차 선택 (마운트 시 1회 + 수동 재설정 버튼)
     R1: 모드 ref(lastAnnounceRef·arrivedStateRef·departedFromRef) 명시 리셋
     R3: 결과 토스트 표시 (3초 후 자동 닫힘)
     R4: timetableMode ON 시 ttLastAnnouncedRef 도 함께 -1 로 리셋해 다음 tick 에서 즉시 재안내
     R6: '지연 40분 허용' 매직넘버를 다음 회차 출발 시각으로 자연 cutoff (whichever 더 작은) */
  const RESET_GRACE_MIN = 40;
  const [resetToast, setResetToast] = useState(null); // { text, at }
  useEffect(() => {
    if (!resetToast) return;
    const id = setTimeout(() => setResetToast(null), 3000);
    return () => clearTimeout(id);
  }, [resetToast]);
  const selectLegByClock = () => {
    const now = getNow();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const all = [];
    ["outbound", "inbound"].forEach(dir => {
      ROUTES[dir].trips.forEach((t, i) => {
        if (i >= tripsToday) return;
        all.push({ dir, idx: i, dep: toMin(t[0]), arr: toMin(t[t.length - 1]) });
      });
    });
    all.sort((a, b) => a.dep - b.dep);
    // R6: 현재 회차 cutoff = min(arr + GRACE, 다음 회차 dep). 휴식·점심 갭 자연 처리
    let target = null;
    for (let i = 0; i < all.length; i++) {
      const l = all[i];
      const nextDep = i + 1 < all.length ? all[i + 1].dep : Infinity;
      const cutoff = Math.min(l.arr + RESET_GRACE_MIN, nextDep);
      if (nowMin >= l.dep && nowMin < cutoff) { target = l; break; }
    }
    if (!target) target = all.find(l => l.dep > nowMin) || all[all.length - 1] || null;
    if (!target) return;

    // GPS가 있으면 그 방향에서 현재 위치와 가장 가까운 정류장을 현재 승강장으로 설정
    let ni = 0;
    if (userPos) {
      let bd = Infinity;
      ROUTES[target.dir].stops.forEach((s, i) => {
        const c = coords[coordKey(target.dir, s.name)];
        if (!c) return;
        const d = distanceMeters(userPos, c);
        if (d < bd) { bd = d; ni = i; }
      });
    }
    const sameLeg = direction === target.dir && tripIdx === target.idx;
    resetStopRef.current = ni;
    setDirection(target.dir);
    setTripIdx(target.idx);
    if (sameLeg) {
      setCurrentIdx(ni);
      const set = new Set();
      for (let k = 0; k < ni; k++) set.add(k);
      announcedRef.current = set;
      resetStopRef.current = null;
    }
    // R1: 모드 ref 일괄 리셋 — 재설정 직후 안내·도착 히스테리시스 깨끗하게 시작
    lastAnnounceRef.current = { idx: -1, at: 0 };
    arrivedStateRef.current = false;
    departedFromRef.current = null;
    // R4: timetableMode ON 이면 ttLastAnnouncedRef 리셋 — 다음 tick 이 새 currentIdx 부터 다시 안내
    if (timetableMode) ttLastAnnouncedRef.current = -1;
    // R3: 토스트 표시
    const stopName = ROUTES[target.dir].stops[ni]?.name || "";
    setResetToast({
      text: `⟳ ${ROUTES[target.dir].label} ${target.idx + 1}회차${stopName ? ` · ${stopName}` : ""}`,
      gps: !!userPos,
      at: Date.now(),
    });
  };
  useEffect(() => { selectLegByClock(); }, []); // mount only

  /* --- 운행 회차 수가 줄면(예: 6.14 선택) 현재 회차를 범위 안으로 보정 --- */
  useEffect(() => {
    if (tripIdx > tripsToday - 1) setTripIdx(tripsToday - 1);
  }, [tripsToday, tripIdx]);

  /* --- Reset position when leg (direction or trip) changes ---
     resetStopRef가 지정돼 있으면(GPS 스냅) 그 정류장으로, 아니면 0(출발지)으로 --- */
  useEffect(() => {
    const ni = resetStopRef.current != null ? resetStopRef.current : 0;
    setCurrentIdx(ni);
    const set = new Set();
    for (let k = 0; k < ni; k++) set.add(k); // 지나온 정류장은 안내 완료 처리
    announcedRef.current = set;
    resetStopRef.current = null;
    legSwitchArmedRef.current = false;
    legDepartCountRef.current = 0;
  }, [direction, tripIdx]);

  /* --- Cleanup on unmount --- */
  useEffect(() => () => {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (watchIdRef.current !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchIdRef.current);
  }, []);

  /* --- Permission state --- */
  useEffect(() => {
    if (!navigator.permissions?.query) return;
    let permRef = null;
    navigator.permissions.query({ name: "geolocation" })
      .then((p) => { permRef = p; setPermissionState(p.state); p.onchange = () => setPermissionState(p.state); })
      .catch(() => {});
    return () => { if (permRef) permRef.onchange = null; };
  }, []);

  /* --- TTS voices --- */
  useEffect(() => {
    if (!window.speechSynthesis) { setTtsStatus("unsupported"); return; }
    const load = () => {
      const list = window.speechSynthesis.getVoices();
      setVoices(list);
      const ko = list.filter(v => v.lang === "ko-KR" || v.lang.startsWith("ko"));
      if (list.length === 0) return;
      if (ko.length === 0) setTtsStatus("no-korean");
      else {
        setTtsStatus("ready");
        setSelectedVoiceURI((prev) => prev && ko.find(v => v.voiceURI === prev) ? prev :
          (ko.find(v => v.localService) || ko[0]).voiceURI);
      }
    };
    load();
    window.speechSynthesis.onvoiceschanged = load;
    // iOS는 getVoices()가 처음 비어 있고 onvoiceschanged가 늦거나 안 올 수 있어 재시도
    const retries = [400, 1200, 3000].map(ms => setTimeout(load, ms));
    return () => {
      if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = null;
      retries.forEach(clearTimeout);
    };
  }, []);

  /* --- Wake Lock: 앱이 떠 있는 동안 화면이 자동으로 꺼지지 않게 유지 ---
     (모바일은 화면이 꺼지면 음성·GPS가 멈추므로 화면을 깨워둠. 단, 전원 버튼으로
      직접 끄는 것은 막을 수 없음) */
  useEffect(() => {
    const acquire = async () => {
      try {
        if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLockRef.current) {
          wakeLockRef.current = await navigator.wakeLock.request("screen");
          wakeLockRef.current.addEventListener?.("release", () => { wakeLockRef.current = null; });
        }
      } catch (_) {}
    };
    const onVis = () => {
      if (document.visibilityState === "visible") {
        acquire();
        if (audioCtxRef.current?.state === "suspended") audioCtxRef.current.resume();
        if (window.speechSynthesis?.paused) window.speechSynthesis.resume();
      }
    };
    acquire();
    document.addEventListener("visibilitychange", onVis);
    return () => {
      document.removeEventListener("visibilitychange", onVis);
      try { wakeLockRef.current?.release?.(); } catch (_) {}
      wakeLockRef.current = null;
    };
  }, []);

  /* 긴 문장은 브라우저가 ~15초에서 끊으므로 문장·쉼표 단위로 짧게 분할 */
  const chunkText = (text) => {
    const out = [];
    (text.match(/[^.!?。]+[.!?。]?/g) || [text]).forEach(s => {
      let seg = s.trim(); if (!seg) return;
      if (seg.length <= 110) { out.push(seg); return; }
      let buf = "";
      seg.split(/,\s*/).forEach(part => {
        if (buf && (buf + ", " + part).length > 110) { out.push(buf); buf = part; }
        else buf = buf ? buf + ", " + part : part;
      });
      if (buf) out.push(buf);
    });
    return out.length ? out : [text];
  };

  const speak = (text) => {
    if (!window.speechSynthesis) { setTtsStatus("unsupported"); return; }
    if (window.speechSynthesis.paused) window.speechSynthesis.resume();
    window.speechSynthesis.cancel();
    // 모든 발화에 spokenName 정규화 강제 — '5·18' 누락 사고 방지
    text = spokenName(text);
    const wantURI = voiceRef.current || selectedVoiceURI;
    const chosen = voices.find(v => v.voiceURI === wantURI)
      || voices.find(v => v.lang === "ko-KR" || v.lang.startsWith("ko"));
    const parts = chunkText(text);
    // cancel() 직후 약간의 지연을 둔 뒤 분할 발화를 순차 큐잉
    setTimeout(() => {
      parts.forEach((p, i) => {
        const u = new SpeechSynthesisUtterance(p);
        u.lang = "ko-KR"; u.rate = rateRef.current || rate; u.pitch = 1.0;
        if (chosen) u.voice = chosen;
        if (i === 0) u.onstart = () => setIsAnnouncing(true);
        if (i === parts.length - 1) u.onend = () => setIsAnnouncing(false);
        u.onerror = (e) => {
          if (e.error && e.error !== "interrupted" && e.error !== "canceled") {
            setIsAnnouncing(false); setTtsStatus("error");
          }
        };
        utterRef.current = u;
        window.speechSynthesis.speak(u);
      });
    }, 60);
  };

  /* SpeechSynthesis가 장시간 발화 중 멈추는 크롬 버그 방지 — pause 없이 resume만 (모바일 안전) */
  useEffect(() => {
    if (!window.speechSynthesis) return;
    const id = setInterval(() => {
      const s = window.speechSynthesis;
      if (s.speaking && !s.paused) s.resume();
    }, 10000);
    return () => clearInterval(id);
  }, []);

  /* 화면 복귀 시 오디오 컨텍스트 재개 (잠금 후 음성/벨 무음 방지) */
  useEffect(() => {
    const onVis = () => {
      if (document.visibilityState !== "visible") return;
      if (audioCtxRef.current && audioCtxRef.current.state === "suspended") audioCtxRef.current.resume();
      if (window.speechSynthesis && window.speechSynthesis.paused) window.speechSynthesis.resume();
    };
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, []);

  /* Bus arrival chime — two-tone "딩-동" via Web Audio, then speak */
  const playChime = (onDone) => {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { onDone && onDone(); return; }
      if (!audioCtxRef.current) audioCtxRef.current = new Ctx();
      const ctx = audioCtxRef.current;
      if (ctx.state === "suspended") ctx.resume();
      const t0 = ctx.currentTime + 0.02;
      const dur = 0.5;
      [{ f: 988, t: 0 }, { f: 740, t: 0.22 }].forEach(({ f, t }) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, t0 + t);
        g.gain.setValueAtTime(0.0001, t0 + t);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + dur);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t0 + t);
        osc.stop(t0 + t + dur + 0.05);
      });
      if (onDone) setTimeout(onDone, 850);
    } catch (_) { onDone && onDone(); }
  };

  const chimeThenSpeak = (text) => {
    if (chimeEnabled) playChime(() => speak(text));
    else speak(text);
  };

  /* mp3 우선 재생, 없거나 실패하면 기기 TTS로 폴백. audioKey 없으면 바로 TTS */
  const speakOrClip = (text, audioKey) => {
    const run = () => {
      if (useClips && audioKey) {
        try {
          if (audioElRef.current) { audioElRef.current.pause(); audioElRef.current = null; }
          const a = new Audio(`audio/${audioKey}.mp3`);
          audioElRef.current = a;
          let fallen = false;
          const fallback = () => { if (fallen) return; fallen = true; audioElRef.current = null; speak(text); };
          a.onplay = () => setIsAnnouncing(true);
          a.onended = () => { setIsAnnouncing(false); audioElRef.current = null; };
          a.onerror = fallback; // 파일 없으면 TTS (가드: 단 한 번만)
          a.play().catch(fallback);
        } catch (_) { speak(text); }
      } else {
        speak(text);
      }
    };
    if (chimeEnabled) playChime(run); else run();
  };

  const primeTTS = () => {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        if (!audioCtxRef.current) audioCtxRef.current = new Ctx();
        if (audioCtxRef.current.state === "suspended") audioCtxRef.current.resume();
      }
    } catch (_) {}
    if (!window.speechSynthesis || ttsPrimed) return;
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0; u.rate = 1;
    try { window.speechSynthesis.speak(u); setTtsPrimed(true); } catch (_) {}
  };

  const testVoice = () => { primeTTS(); chimeThenSpeak("안녕하세요. 무등산 인문축제 셔틀버스 음성 안내 테스트입니다."); };

  const lastAnnounceRef = useRef({ idx: -1, at: 0 });
  const announceStop = (idx) => {
    // 같은 정류장을 10초 안에 다시 안내하지 않음 (GPS 노이즈로 인한 중복 트리거 방지)
    const now = Date.now();
    if (lastAnnounceRef.current.idx === idx && now - lastAnnounceRef.current.at < 10000) return;
    lastAnnounceRef.current = { idx, at: now };
    const cur = stops[idx]; if (!cur) return;
    const nxt = stops[idx + 1];
    const curSay = spokenName(cur.name);
    // 축제장 방향 출발지(5·18민주광장) — 축제 환영 안내 (다음 정류장 안내는 생략)
    if (direction === "outbound" && idx === 0) {
      speakOrClip(ments.welcome, AUDIO_KEYS.welcome);
      return;
    }
    // 민주광장 방향 출발지(축제장) — 하차 안내 포함
    if (direction === "inbound" && idx === 0) {
      let t = ments.alight;
      if (nxt) t += ` 다음 정류장은 ${spokenName(nxt.name)}입니다.`;
      speakOrClip(t, AUDIO_KEYS.alight);
      return;
    }
    // 그 외 출발(시작) 승강장 — 도착 안내 대신 출발 안내
    if (idx === 0 && nxt) {
      chimeThenSpeak(`잠시 후 출발합니다. 다음 정류장은 ${spokenName(nxt.name)}입니다.`);
      return;
    }
    let text;
    if (nxt) {
      // 축제장 방향: 대부분 종점까지 가므로 일반 정류장 도착 안내는 생략하고 축제 홍보/프로그램만
      if (direction === "outbound") {
        if (ments.promos[cur.name]) { speakOrClip(ments.promos[cur.name], AUDIO_KEYS[cur.name]); return; }
        if (cur.name === ments.programStop) {
          // 기준 시각: 시간표 기준이면 이 회차의 축제장 도착 시각, 아니면 현재 시각 + 남은 운행 시간
          let arrivalMin;
          if (progTimeBase === "trip") {
            arrivalMin = toMin(trip[trip.length - 1]);
          } else {
            const now = getNow();
            const remain = Math.max(0, toMin(trip[trip.length - 1]) - toMin(trip[idx]));
            arrivalMin = now.getHours() * 60 + now.getMinutes() + remain;
          }
          chimeThenSpeak(buildProgramText(ments, resolveFestivalDay(), arrivalMin));
          return;
        }
        return; // 그 외 중간 정류장은 안내 없음
      }
      // 민주광장 방향: 하차가 많으므로 정류장 안내 전체 유지
      text = `이번 정류장은 ${curSay}, ${curSay}입니다. 다음 정류장은 ${spokenName(nxt.name)}입니다.`;
    } else {
      // Terminus — include circular connection info
      const base = direction === "outbound"
        ? `종점, 무등생각 축제장에 도착했습니다. 함께해 주셔서 감사합니다. 즐거운 축제 되세요. 차가 완전히 멈춘 뒤 안전하게 내려주시기 바랍니다.`
        : `이번 정류장은 ${curSay}입니다. 이번 정류장이 종점입니다. 안전하게 내려주세요.`;
      if (nextLegInfo) {
        // 출발 예정 시각이 이미 지났으면(지연 운행) 절대 시각 대신 '잠시 후'로 안내
        const nowMin = getNowMin();
        const onTime = toMin(nextLegInfo.departTime) >= nowMin;
        const when = onTime ? `${spokenTime(nextLegInfo.departTime)}에` : "잠시 후";
        text = `${base} ${when} ${nextLegInfo.label} ${nextLegInfo.tripNum}회차 셔틀버스가 출발합니다.`;
      } else {
        text = `${base} 오늘 운행이 종료되었습니다. 이용해 주셔서 감사합니다.`;
      }
    }
    chimeThenSpeak(text);
  };

  // 탭하면 항상 현재 정류장을 (다시) 안내 — 실수로 한 번 더 눌러도 무음 전환되지 않음
  const announce = () => { primeTTS(); announceStop(currentIdx); };
  // 진행 중인 안내를 멈춤 (정지 버튼 전용)
  const stopAnnounce = () => {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (audioElRef.current) { try { audioElRef.current.pause(); } catch (_) {} audioElRef.current = null; }
    setIsAnnouncing(false);
  };

  const next = () => currentIdx < stops.length - 1 && setCurrentIdx(currentIdx + 1);
  const prev = () => currentIdx > 0 && setCurrentIdx(currentIdx - 1);

  const swapDirection = () => {
    setDirection(direction === "outbound" ? "inbound" : "outbound");
    setTripIdx(t => Math.min(t, tripsToday - 1)); // 일요일 6회차 등 비운행 회차 방지
  };

  const setStopCoordHere = (i) => {
    if (!userPos) { setGpsError("먼저 자동 모드를 켜서 GPS를 활성화하세요"); return; }
    setCoords(prev => ({ ...prev, [coordKey(direction, stops[i].name)]: { lat: userPos.lat, lng: userPos.lng } }));
  };

  // Coordinate editor (map + manual input)
  const [editing, setEditing] = useState(null); // { idx, lat, lng }
  const openCoordEditor = (i) => {
    const c = coords[coordKey(direction, stops[i].name)];
    setEditing({ idx: i, lat: c ? c.lat : 35.130, lng: c ? c.lng : 126.940 });
  };
  const saveCoordEditor = () => {
    if (!editing) return;
    const la = parseFloat(editing.lat), ln = parseFloat(editing.lng);
    if (Number.isFinite(la) && Number.isFinite(ln)) {
      setCoords(prev => ({ ...prev, [coordKey(direction, stops[editing.idx].name)]: { lat: la, lng: ln } }));
    }
    setEditing(null);
  };

  // 좌표 백업·복원 (내보내기/불러오기)
  const [backup, setBackup] = useState(null);     // null | 텍스트(JSON)
  const [backupMsg, setBackupMsg] = useState("");
  const openBackup = () => { setBackupMsg(""); setBackup(JSON.stringify(coords, null, 2)); };
  const resetCoords = () => {
    const base = {};
    ["outbound", "inbound"].forEach(dir => {
      ROUTES[dir].stops.forEach(s => {
        if (s.lat != null && s.lng != null) base[coordKey(dir, s.name)] = { lat: s.lat, lng: s.lng };
      });
    });
    setCoords(base);
    setBackup(JSON.stringify(base, null, 2));
    setBackupMsg("기본 좌표로 초기화했어요");
  };
  const copyBackup = () => {
    try { navigator.clipboard.writeText(backup); setBackupMsg("클립보드에 복사했어요"); }
    catch (_) { setBackupMsg("복사 실패 — 직접 선택해 복사하세요"); }
  };
  const applyBackup = () => {
    try {
      const obj = JSON.parse(backup);
      const clean = {};
      Object.entries(obj).forEach(([k, v]) => {
        if (v && Number.isFinite(+v.lat) && Number.isFinite(+v.lng)) clean[k] = { lat: +v.lat, lng: +v.lng };
      });
      if (!Object.keys(clean).length) { setBackupMsg("유효한 좌표가 없습니다"); return; }
      setCoords(prev => ({ ...prev, ...clean }));
      setBackupMsg(`${Object.keys(clean).length}개 좌표를 불러왔어요`);
    } catch (_) { setBackupMsg("형식이 올바르지 않습니다 (JSON 확인)"); }
  };
  const downloadBackup = () => {
    try {
      const blob = new Blob([JSON.stringify(coords, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "무등생각셔틀-좌표.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setBackupMsg("파일로 저장했어요");
    } catch (_) { setBackupMsg("파일 저장 실패"); }
  };
  const uploadBackup = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { setBackup(String(reader.result)); setBackupMsg("파일을 불러왔어요. '불러오기'를 눌러 적용하세요"); };
    reader.readAsText(file);
  };

  // 멘트(안내 문구) 백업·복원
  const [mentBackup, setMentBackup] = useState(null);
  const [mentMsg, setMentMsg] = useState("");
  const [showTimetable, setShowTimetable] = useState(false);
  const [showViaEditor, setShowViaEditor] = useState(false);
  const [showZoneEditor, setShowZoneEditor] = useState(false);
  const [showNoticeEditor, setShowNoticeEditor] = useState(false);
  const [showBackup, setShowBackup] = useState(false);
  const openMentBackup = () => { setMentMsg(""); setMentBackup(JSON.stringify(ments, null, 2)); };
  const copyMent = () => {
    try { navigator.clipboard.writeText(mentBackup); setMentMsg("클립보드에 복사했어요"); }
    catch (_) { setMentMsg("복사 실패 — 직접 선택해 복사하세요"); }
  };
  const applyMent = () => {
    try {
      const obj = JSON.parse(mentBackup);
      if (typeof obj !== "object" || !obj.welcome) { setMentMsg("멘트 형식이 올바르지 않습니다"); return; }
      setMents({ ...FESTIVAL, ...obj });
      setMentMsg("멘트를 불러왔어요");
    } catch (_) { setMentMsg("형식이 올바르지 않습니다 (JSON 확인)"); }
  };
  const resetMent = () => { setMents(FESTIVAL); setMentBackup(JSON.stringify(FESTIVAL, null, 2)); setMentMsg("기본 멘트로 되돌렸어요"); };
  const downloadMent = () => {
    try {
      const blob = new Blob([JSON.stringify(ments, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "무등생각셔틀-멘트.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setMentMsg("파일로 저장했어요");
    } catch (_) { setMentMsg("파일 저장 실패"); }
  };
  const uploadMent = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { setMentBackup(String(reader.result)); setMentMsg("파일을 불러왔어요. '불러오기'를 눌러 적용하세요"); };
    reader.readAsText(file);
  };

  /* --- GPS watch — GPS 자동(노선 자동화) 또는 위치 공유(📍 ON)일 때 좌표 수신 --- */
  useEffect(() => {
    const wantGps = autoMode || (sharing && locShare);
    if (!wantGps) {
      if (watchIdRef.current !== null && navigator.geolocation) { navigator.geolocation.clearWatch(watchIdRef.current); watchIdRef.current = null; }
      setUserPos(null); return;
    }
    if (!navigator.geolocation) { setGpsError("이 기기는 GPS를 지원하지 않아요"); if (autoMode) setAutoMode(false); return; }
    if (permissionState === "denied") { setGpsError("위치 권한이 차단되어 있어요"); if (autoMode) setAutoMode(false); return; }
    setGpsError(null);
    watchIdRef.current = navigator.geolocation.watchPosition(
      (pos) => {
        const speed = pos.coords.speed; // m/s, null on some devices
        const accuracy = pos.coords.accuracy;
        // P0-2: 정확도 가드 — 80m 이상 노이즈는 무시 (단 최근 30초 안에 양호한 fix가 있을 때만)
        if (accuracy > 80 && gpsLastUpdateRef.current && Date.now() - gpsLastUpdateRef.current < 30000) return;
        gpsLastUpdateRef.current = Date.now();
        setUserPos({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy, speed });
        setGpsError(null);
        if (permissionState !== "granted") setPermissionState("granted");
      },
      (err) => {
        if (err.code === 1) { setPermissionState("denied"); setGpsError("위치 권한이 거부되었어요"); }
        else if (err.code === 2) setGpsError("위치 신호를 가져올 수 없어요 (실외에서 다시 시도)");
        else setGpsError("위치 요청 시간 초과");
        if (autoMode) setAutoMode(false);
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
    return () => { if (watchIdRef.current !== null) { navigator.geolocation.clearWatch(watchIdRef.current); watchIdRef.current = null; } };
  }, [autoMode, permissionState, sharing, locShare]);

  /* GPS stale 감지 — 30초 이상 갱신 없으면 경고 (autoMode 또는 좌표 공유 켜져 있을 때만) */
  useEffect(() => {
    const wantGps = autoMode || (sharing && locShare);
    if (!wantGps) { setGpsStale(false); return; }
    const id = setInterval(() => {
      if (gpsLastUpdateRef.current === 0) return; // 아직 첫 신호 안 들어옴
      setGpsStale(Date.now() - gpsLastUpdateRef.current > 30000);
    }, 5000);
    return () => clearInterval(id);
  }, [autoMode, sharing, locShare]);

  const retryPermission = () => {
    setGpsError(null);
    if (navigator.permissions?.query) {
      navigator.permissions.query({ name: "geolocation" }).then((p) => {
        setPermissionState(p.state);
        if (p.state !== "denied") setAutoMode(true);
        else setGpsError("아직 차단된 상태예요. 브라우저 설정을 확인해주세요.");
      });
    } else setAutoMode(true);
  };

  const ua = typeof navigator !== "undefined" ? navigator.userAgent : "";
  const isIOS = /iPad|iPhone|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);

  /* --- Auto announce: 반경 내 가장 가까운 '아직 안내 안 한 전방 정류장'을 선택,
         지나친 정류장은 passed 처리해 건너뜀에서 복구 가능하도록 함 --- */
  useEffect(() => {
    if (!autoMode || !userPos) return;
    if (manualWaiting) return; // P1-1: 일시정지(대기) 중에는 자동 안내 잠금
    // 최대 3 정류장 앞까지만 검색 — 테스트/노이즈로 인한 큰 점프 방지
    const searchLimit = Math.min(currentIdx + 4, stops.length);
    let nearestIdx = -1, nearestDist = Infinity;
    for (let i = currentIdx; i < searchLimit; i++) {
      const c = coords[coordKey(direction, stops[i].name)]; if (!c) continue;
      const d = distanceMeters(userPos, c);
      if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
    }
    if (nearestIdx === -1) return;
    // per-stop radius: 정류장에 radius가 정의되어 있으면 우선, 없으면 글로벌 triggerRadius
    const nearStopRadius = stops[nearestIdx]?.radius || triggerRadius;
    if (nearestDist <= nearStopRadius && !announcedRef.current.has(nearestIdx)) {
      // 건너뛴 앞쪽 정류장들은 지나간 것으로 표시 (이후 재안내 방지)
      for (let k = currentIdx; k < nearestIdx; k++) announcedRef.current.add(k);
      announcedRef.current.add(nearestIdx);
      setCurrentIdx(nearestIdx);
      // 시작 승강장 안내: 출발지(5·18민주광장 환영 / 축제장 하차 안내)도 자동 방송
      announceStop(nearestIdx);
      // 종점 도착 시 자동 회차 전환 무장
      if (nearestIdx === stops.length - 1 && nextLeg) { legSwitchArmedRef.current = true; legDepartCountRef.current = 0; }
      return;
    }
    // 안내한 현재 정류장을 통과(반경 밖 + 다음 정류장이 더 가까움)하면 표시를 다음 정류장으로 전환
    if (currentIdx < stops.length - 1 && announcedRef.current.has(currentIdx)) {
      const curC = coords[coordKey(direction, stops[currentIdx].name)];
      const nextC = coords[coordKey(direction, stops[currentIdx + 1].name)];
      if (curC && nextC) {
        const dCur = distanceMeters(userPos, curC);
        const dNext = distanceMeters(userPos, nextC);
        const curStopRadius = stops[currentIdx]?.radius || triggerRadius;
        if (dCur > curStopRadius && dNext < dCur) setCurrentIdx(currentIdx + 1);
      }
    }
  }, [userPos, autoMode, stops, triggerRadius, coords, direction, currentIdx]);

  /* --- Auto leg-switch: 종점 도착 후, 연속으로 반경*1.5를 벗어나면 전환 (GPS 노이즈 히스테리시스) --- */
  useEffect(() => {
    if (!autoMode || !autoLegSwitch || !userPos) return;
    if (manualWaiting) return; // P1-1: 일시정지(대기) 중에는 자동 회차 전환 잠금
    if (!isAtTerminus || !nextLeg || !legSwitchArmedRef.current) return;
    const tc = coords[coordKey(direction, stops[stops.length - 1].name)];
    if (!tc) return;
    if (distanceMeters(userPos, tc) > triggerRadius * 1.5) {
      legDepartCountRef.current += 1;
      if (legDepartCountRef.current >= 3) goToNextLeg(); // 연속 3회 확인 후 전환
    } else {
      legDepartCountRef.current = 0; // 다시 반경 안이면 리셋
    }
  }, [userPos, autoMode, autoLegSwitch, isAtTerminus, nextLeg, triggerRadius, coords, manualWaiting]);

  useEffect(() => { if (!autoMode) { announcedRef.current = new Set(); legSwitchArmedRef.current = false; legDepartCountRef.current = 0; } }, [autoMode]);

  /* --- 시간표 자동 모드 — 시각표에 따라 currentIdx 진행 + 자동 안내 + 회차 전환 ---
     Phase 0 패치:
       A1) 시각표 범위 밖(첫 회차 전, 종료 1h 후) 가드 — wrap/잘못된 점프 방지
       A3) nextLeg trip 데이터 누락 시 NaN 데드락 방지
       A4) manualWaiting 해제 직후 catch-up — 바로 직전 누락 정류장 1개 발화
       A5) effect deps 에 stops/trip/nextLeg 추가 — stale closure 방지 */
  const ttWasWaitingRef = useRef(false);
  useEffect(() => {
    if (!timetableMode) return;
    const TT_LEAD_SEC = 30;
    const TT_TAIL_SEC = 60 * 60; // 종점 시각 1시간 이후엔 자동 OFF
    const tick = () => {
      // P1-1 / A4: manualWaiting 진행 잠금 — 해제 직후 catch-up 표식
      if (manualWaiting) { ttWasWaitingRef.current = true; return; }
      const now = getNow();
      const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      // A1: 시각표 범위 가드 — 시각표가 없거나 첫 출발 전 / 종점 후엔 진행 X
      const startT = trip && trip[0] ? toMin(trip[0]) : null;
      const endT = trip && trip[trip.length - 1] ? toMin(trip[trip.length - 1]) : null;
      if (startT == null || endT == null) return;
      const tripStartSec = startT * 60, tripEndSec = endT * 60;
      if (nowSec < tripStartSec - TT_LEAD_SEC * 2) return; // 첫 회차 전 — 휴식 카드만 노출
      // 시각표상 현재 시점에 도달해야 할 최신 정류장 인덱스
      let k = -1;
      for (let i = 0; i < stops.length; i++) {
        const t = trip[i]; if (!t) continue;
        const sched = toMin(t) * 60;
        if (sched - TT_LEAD_SEC <= nowSec) k = i;
      }
      if (k < 0) return;
      const cIdx = currentIdxRef.current;
      // A4: 대기 직후엔 누락 1개 catch-up 발화(jump>1 인 경우만, 중복 안내는 announceStop 의 10초 쿨다운으로 방지)
      const resuming = ttWasWaitingRef.current;
      ttWasWaitingRef.current = false;
      if (k > cIdx) {
        for (let i = cIdx + 1; i < k; i++) announcedRef.current.add(i);
        announcedRef.current.add(k);
        setCurrentIdx(k);
      }
      if (resuming && k - 1 > ttLastAnnouncedRef.current && k - 1 > cIdx) {
        announceStop(k - 1);
        ttLastAnnouncedRef.current = k - 1;
      }
      if (k > ttLastAnnouncedRef.current) {
        announceStop(k);
        ttLastAnnouncedRef.current = k;
      }
      // 종점 도달 + 다음 leg 출발 시각 지나면 자동 회차 전환 (A3: 데이터 누락 시 데드락 방지)
      if (k === stops.length - 1 && nextLeg) {
        legSwitchArmedRef.current = true;
        const nl = ROUTES[nextLeg.direction]?.trips?.[nextLeg.tripIdx];
        if (nl && nl[0]) {
          const nlSec = toMin(nl[0]) * 60;
          if (Number.isFinite(nlSec) && nowSec >= nlSec) goToNextLeg();
        }
      }
      // 종점 시각 1시간 이상 지났는데 nextLeg 없으면 모드 자동 OFF — 운행 종료 상태
      if (!nextLeg && nowSec > tripEndSec + TT_TAIL_SEC) {
        setTimetableMode(false);
      }
    };
    tick();
    const id = setInterval(tick, 5000);
    return () => clearInterval(id);
  }, [timetableMode, direction, tripIdx, manualWaiting, stops, trip, nextLeg]);

  // 시간표 모드 OFF 시 announced/last/wait 플래그 리셋(다시 켤 때 깨끗하게 시작)
  useEffect(() => {
    if (!timetableMode) {
      ttLastAnnouncedRef.current = -1;
      ttWasWaitingRef.current = false;
    }
  }, [timetableMode]);

  /* 같은 busId로 다른 세션이 송신 중인지 검사 — 충돌 시 자동 송신 중지 + 경고 */
  useEffect(() => {
    if (!sharing || !shareUrl || !busId) { setBusIdConflict(false); return; }
    const base = shareUrl.replace(/\/+$/, "");
    const check = () => {
      fetch(`${base}/buses/${encodeURIComponent(busId)}.json`).then((r) => r.json()).then((data) => {
        if (!data) return;
        const fresh = data.ts && Date.now() - data.ts < 30000;
        const diff = data.session && data.session !== sessionRef.current;
        if (fresh && diff) {
          setBusIdConflict(true);
          // 자동 송신 중지 — 중복 데이터 손상 방지(운영자가 확인 후 다시 켜야 함)
          setSharing(false);
        }
      }).catch(() => {});
    };
    check();
    const id = setInterval(check, 10000);
    return () => clearInterval(id);
  }, [sharing, shareUrl, busId]);

  /* 승하차 카운트 — 마운트 시 localStorage 먼저 로드, 가능하면 Firebase로 덮어쓰기 */
  useEffect(() => {
    // 1) localStorage 즉시 복원 — P0-6: 새 날짜로 바뀌면 빈 객체로 초기화(이전 일자 잔존 방지)
    const lsKey = `counts:${dateKey}`;
    const stored = LS.getJSON(lsKey, null);
    setCounts(stored && typeof stored === "object" ? stored : {});
    // 2) Firebase 동기화(가능하면) — 서버 응답으로 완전 교체
    if (!shareUrl) return;
    const base = shareUrl.replace(/\/+$/, "");
    fetch(`${base}/counts/${dateKey}.json`).then((r) => r.json()).then((data) => {
      if (!data || typeof data !== "object") return;
      const flat = {};
      Object.entries(data).forEach(([dir, tripMap]) => {
        if (!tripMap || typeof tripMap !== "object") return;
        Object.entries(tripMap).forEach(([trip, stopMap]) => {
          if (!stopMap || typeof stopMap !== "object") return;
          Object.entries(stopMap).forEach(([stop, v]) => {
            const key = `${dir}|${trip}|${decodeURIComponent(stop)}`;
            flat[key] = { board: Number(v?.board) || 0, alight: Number(v?.alight) || 0 };
          });
        });
      });
      setCounts(flat);
    }).catch(() => {});
  }, [shareUrl, dateKey]);
  /* counts 상태가 바뀌면 localStorage에 즉시 저장(새로고침 후에도 복원) */
  useEffect(() => { LS.setJSON(`counts:${dateKey}`, counts); }, [counts, dateKey]);

  const writeCount = (key, data) => {
    if (!shareUrl) return;
    const [dir, trip, stop] = key.split("|");
    const base = shareUrl.replace(/\/+$/, "");
    const auth = authTokenRef.current ? `?auth=${encodeURIComponent(authTokenRef.current)}` : "";
    const path = `${base}/counts/${dateKey}/${dir}/${trip}/${encodeURIComponent(stop)}.json${auth}`;
    // P1-5: keepalive=true — pagehide/탭 종료 직전 호출돼도 OS가 살려 보냄
    fetch(path, { method: "PUT", body: JSON.stringify(data), keepalive: true }).catch(() => {});
  };

  /* 이전 정류장(현 정류장 제외)까지의 누적 (탑승 합 − 하차 합) = 도착 시점 탑승 인원. 음수 0 캡. */
  const computeOnboardArriving = (prev, csName) => {
    const tripPrefix = `${direction}|${tripIdx + 1}|`;
    const stopIdx = stops.findIndex((s) => s.name === csName);
    if (stopIdx <= 0) return 0; // 시발지면 도착 시 탑승 0
    let onboard = 0;
    for (let i = 0; i < stopIdx; i++) {
      const k = `${tripPrefix}${stops[i].name}`;
      const v = prev[k] || {};
      onboard += (v.board || 0) - (v.alight || 0);
    }
    return Math.max(0, onboard);
  };

  const updateCount = (kind, delta) => {
    const cs = stops[currentIdx];
    if (!cs) return;
    // 종점에서는 승차 금지 (하차만 허용)
    if (kind === "board" && cs.terminus) return;
    const tripPrefix = `${direction}|${tripIdx + 1}|`;
    const key = `${tripPrefix}${cs.name}`;
    setCounts((prev) => {
      const cur = prev[key] || { board: 0, alight: 0 };
      let nextVal = Math.max(0, (cur[kind] || 0) + delta);
      if (kind === "alight" && delta > 0) {
        // 하차 캡: 이 정류장 도착 시점에 버스 안에 있던 인원까지만(=이전 정류장까지 탑승−하차)
        const maxAlightHere = computeOnboardArriving(prev, cs.name);
        nextVal = Math.min(nextVal, maxAlightHere);
        if (nextVal === cur[kind]) return prev; // 변경 없음 — 디바운스 트리거 안 함
      }
      const next = { ...cur, [kind]: nextVal };
      const updated = { ...prev, [key]: next };
      const tk = countsWriteTimerRef.current;
      if (tk[key]) clearTimeout(tk[key]);
      tk[key] = setTimeout(() => writeCount(key, next), 500);
      return updated;
    });
  };

  /* 전원 하차 — 종점에서 도착 시점 잔여 인원만큼 일괄 하차 처리(이전 탑승까지만) */
  const alightAll = () => {
    const cs = stops[currentIdx];
    if (!cs) return;
    const tripPrefix = `${direction}|${tripIdx + 1}|`;
    const key = `${tripPrefix}${cs.name}`;
    setCounts((prev) => {
      const remain = computeOnboardArriving(prev, cs.name);
      const next = { ...(prev[key] || { board: 0, alight: 0 }), alight: remain };
      const updated = { ...prev, [key]: next };
      const tk = countsWriteTimerRef.current;
      if (tk[key]) clearTimeout(tk[key]);
      tk[key] = setTimeout(() => writeCount(key, next), 500);
      return updated;
    });
  };

  /* 현재 회차(방향+회차) 승하차 기록만 초기화 */
  const resetCountsCurrentTrip = () => {
    if (!window.confirm(`${ROUTES[direction].label} ${tripIdx + 1}회차 승하차 기록을 초기화합니다. 계속할까요?`)) return;
    const tripPrefix = `${direction}|${tripIdx + 1}|`;
    setCounts((prev) => {
      const updated = { ...prev };
      Object.keys(updated).forEach((k) => { if (k.startsWith(tripPrefix)) delete updated[k]; });
      return updated;
    });
    // Firebase 해당 회차 삭제
    if (shareUrl) {
      const base = shareUrl.replace(/\/+$/, "");
      const auth = authTokenRef.current ? `?auth=${encodeURIComponent(authTokenRef.current)}` : "";
      fetch(`${base}/counts/${dateKey}/${direction}/${tripIdx + 1}.json${auth}`, { method: "DELETE" }).catch(() => {});
    }
    // 해당 회차 디바운스 큐도 비움
    const tk = countsWriteTimerRef.current;
    Object.keys(tk).forEach((k) => { if (k.startsWith(tripPrefix)) { clearTimeout(tk[k]); delete tk[k]; } });
  };

  /* 오늘 승하차 기록 전체 초기화 — 상태/로컬/원격(가능 시) 모두 비우기 */
  const resetCountsToday = () => {
    setCounts({});
    try { LS.setJSON(`counts:${dateKey}`, {}); } catch (_) {}
    if (shareUrl) {
      const base = shareUrl.replace(/\/+$/, "");
      const auth = authTokenRef.current ? `?auth=${encodeURIComponent(authTokenRef.current)}` : "";
      fetch(`${base}/counts/${dateKey}.json${auth}`, { method: "DELETE" }).catch(() => {});
    }
    // 디바운스 큐도 비움
    const tk = countsWriteTimerRef.current;
    Object.keys(tk).forEach((k) => { clearTimeout(tk[k]); delete tk[k]; });
  };

  /* counts 디바운스 큐 즉시 flush — leg-switch/unmount 시 마지막 입력 손실 방지 */
  const countsRef = useRef(counts);
  useEffect(() => { countsRef.current = counts; }, [counts]);
  const flushCountsWrites = () => {
    const tk = countsWriteTimerRef.current;
    Object.entries(tk).forEach(([key, timerId]) => {
      clearTimeout(timerId);
      delete tk[key];
      const v = countsRef.current[key];
      if (v) writeCount(key, v);
    });
  };
  useEffect(() => () => flushCountsWrites(), []); // unmount 시 강제 flush
  // P0-6: ref 로 노출해 자정 롤오버 인터벌에서도 호출 가능
  useEffect(() => { flushCountsWritesRef.current = flushCountsWrites; });
  /* P1-5: pagehide/freeze 시점에 디바운스 큐 즉시 flush — keepalive=true 로 OS 가 살려 보냄 */
  useEffect(() => {
    const onHide = () => flushCountsWrites();
    window.addEventListener("pagehide", onHide);
    document.addEventListener("freeze", onHide);
    return () => {
      window.removeEventListener("pagehide", onHide);
      document.removeEventListener("freeze", onHide);
    };
  }, []);

  /* 현재 회차의 누적 탑승 인원 (탑승합계 - 하차합계) */
  const onboardCount = (() => {
    const tripPrefix = `${direction}|${tripIdx + 1}|`;
    let b = 0, a = 0;
    Object.entries(counts).forEach(([k, v]) => {
      if (!k.startsWith(tripPrefix)) return;
      b += v.board || 0; a += v.alight || 0;
    });
    return Math.max(0, b - a);
  })();

  const curStop = stops[currentIdx];
  const nextStop = stops[currentIdx + 1];
  const curCoord = curStop ? coords[coordKey(direction, curStop.name)] : undefined;
  const nextCoord = nextStop ? coords[coordKey(direction, nextStop.name)] : undefined;
  const distToNext = autoMode && userPos && nextCoord ? distanceMeters(userPos, nextCoord) : null;
  const fmtDist = (m) => (m == null ? null : m < 1000 ? `${Math.round(m)}m` : `${(m / 1000).toFixed(2)}km`);

  /* 위치 공유 토글 — 켜는 순간 로그인 사전 검증해 즉시 실패 피드백 */
  const toggleSharing = () => {
    if (!shareUrl) { setGpsError("먼저 DB 주소를 입력하세요(고급)"); setMode("advanced"); return; }
    if (sharing) { setSharing(false); return; }
    if (driverEmail && driverPass) {
      setGpsError("로그인 확인 중…");
      authTokenRef.current = "";
      authRetryAtRef.current = 0;
      firebaseSignIn().then((d) => {
        if (d && d.idToken) {
          authTokenRef.current = d.idToken; // 토큰 즉시 저장 (이전 버전 빠뜨려 401 발생)
          tokenIssuedAtRef.current = Date.now();
          setGpsError(null);
          if (!autoMode) primeTTS();
          broadcastFailRef.current = 0; setBroadcastStatus("ok"); setLastBroadcastStatus(null);
          setSharing(true);
        } else {
          setGpsError("⚠ 로그인 실패 — " + ((d && d.error && d.error.message) || "이메일/비번 확인"));
        }
      }).catch(() => setGpsError("⚠ 로그인 오류 — 네트워크 확인"));
      return;
    }
    if (!autoMode) primeTTS();
    setSharing(true);
  };

  /* --- 기사 쓰기 로그인(선택): 이메일/비밀번호가 있으면 로그인해 토큰 발급(50분마다 갱신). 없으면 인증 없이 공개 쓰기. --- */
  const firebaseSignIn = async () => {
    const key = apiKey || SHARE_API_KEY;
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${key}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: driverEmail, password: driverPass, returnSecureToken: true }),
    });
    return r.json();
  };
  const testLogin = async () => {
    const key = apiKey || SHARE_API_KEY;
    if (!key) { setAuthStatus("❌ 웹 API 키를 입력하세요"); return; }
    if (!driverEmail || !driverPass) { setAuthStatus("❌ 이메일·비밀번호를 입력하세요"); return; }
    setAuthStatus("로그인 시도 중…");
    try {
      const d = await firebaseSignIn();
      if (d.idToken) setAuthStatus(`✅ 로그인 성공! 규칙에 넣을 UID: ${d.localId}`);
      else setAuthStatus("❌ " + ((d.error && d.error.message) || "로그인 실패"));
    } catch (_) { setAuthStatus("❌ 네트워크 오류"); }
  };
  useEffect(() => {
    if (!sharing) return;
    if (!(apiKey || SHARE_API_KEY) || !driverEmail || !driverPass) return; // 로그인 미설정 → 테스트 모드(공개 쓰기)
    let stopped = false, timer;
    const signIn = async () => {
      try {
        const d = await firebaseSignIn();
        if (d.idToken) {
          authTokenRef.current = d.idToken;
          tokenIssuedAtRef.current = Date.now();
          setGpsError("");
        }
        else { authTokenRef.current = ""; setGpsError("쓰기 로그인 실패: " + ((d.error && d.error.message) || "정보 확인")); }
      } catch (_) { setGpsError("쓰기 로그인 네트워크 오류"); }
    };
    signIn();
    timer = setInterval(() => { if (!stopped) signIn(); }, 30 * 60 * 1000);
    // P0-1: 포커스 복귀 시 토큰 잔여 시간 짧으면 사전 재발급 + GPS 재요청
    const onVis = () => {
      if (document.visibilityState !== "visible" || stopped) return;
      const ageMin = (Date.now() - tokenIssuedAtRef.current) / 60000;
      if (!authTokenRef.current || ageMin > 25) signIn();
      // GPS 60초 이상 stale이면 한 번 강제 refresh
      if (gpsLastUpdateRef.current && Date.now() - gpsLastUpdateRef.current > 60000 && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            gpsLastUpdateRef.current = Date.now();
            setUserPos({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, speed: pos.coords.speed });
          },
          () => {},
          { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
        );
      }
    };
    document.addEventListener("visibilitychange", onVis);
    return () => { stopped = true; clearInterval(timer); document.removeEventListener("visibilitychange", onVis); };
  }, [sharing, driverEmail, driverPass, apiKey]);

  /* --- 실시간 위치 공유: 켜져 있을 때 3초마다 broadcast (GPS 없어도 운행 정보 송신 가능) --- */
  const [_shareTick, _setShareTick] = useState(0);
  useEffect(() => {
    if (!sharing) return;
    const id = setInterval(() => _setShareTick((t) => t + 1), 5000);
    return () => clearInterval(id);
  }, [sharing]);
  useEffect(() => {
    if (!sharing || !shareUrl) return;
    const now = Date.now();
    // 송신 주기: 기본 5초. 실패 누적 시 지수 백오프(최대 60초)
    const fails = broadcastFailRef.current;
    const minGap = Math.min(60000, 5000 * Math.pow(1.5, Math.min(fails, 6)));
    if (now - lastShareRef.current < minGap) return;
    lastShareRef.current = now;
    const base = shareUrl.replace(/\/+$/, "");
    const auth = authTokenRef.current ? `?auth=${encodeURIComponent(authTokenRef.current)}` : "";
    // 좌표는 locShare ON 이고 GPS userPos가 있을 때만 첨부. 운행 정보는 항상 송신.
    const hasGps = locShare && userPos;
    const distToCur = hasGps && curCoord ? distanceMeters(userPos, curCoord) : null;
    // P1: arrived 히스테리시스 + 속도 기반 — 진입 & 저속이면 arrived 확정, 해제>50m
    const speed = userPos && typeof userPos.speed === "number" ? userPos.speed : null;
    // 속도 정보가 보고되면 1.5 m/s(=5.4km/h) 미만일 때만 정차로 간주, 보고 안되면 더 엄격한 거리(<15m)로 폴백
    const speedSlow = speed != null && speed < 1.5;
    const arrivedDist = speed != null ? 30 : 15; // 속도 없을 땐 15m 안일 때만 도착 인정
    const canEnterArrived = (speed != null ? speedSlow : true);
    const prevArrived = arrivedStateRef.current;
    let arrivedNow = prevArrived;
    // P1-1: 일시정지(대기) 중에는 도착 히스테리시스/자동 출발 TTS 잠금
    if (manualWaiting) {
      arrivedNow = false;
    } else if (distToCur != null) {
      if (!prevArrived && distToCur < arrivedDist && canEnterArrived) arrivedNow = true;
      if (prevArrived && distToCur > 50) arrivedNow = false;
    } else if (prevArrived && (!hasGps)) {
      // GPS 끊기면 잠시 도착 유지하다가 다음 cycle에서 자연 해제
    }
    // P2: 이탈 전환 시 정류장명 기록 (90초 유지) + 출발 음성 cue (60초 쿨다운으로 노이즈 반복 방지)
    if (prevArrived && !arrivedNow && curStop?.name) {
      departedFromRef.current = { stop: curStop.name, at: now };
      if (autoMode && now - departureSpokenRef.current > 60000) {
        chimeThenSpeak("출발합니다. 안전하게 손잡이를 잡아주세요.");
        departureSpokenRef.current = now;
      }
      // 운행 모드: 이탈 즉시 다음 정류장으로 currentIdx advance
      // (반경 도달 전 화면에 N이 그대로 남아 있는 문제 해결)
      if (autoMode && currentIdx < stops.length - 1) {
        announcedRef.current.add(currentIdx);
        setCurrentIdx(currentIdx + 1);
      }
    }
    // 도착 진입 시 카운트 영역에 펄스 알람 + P2-5 운행 일지에 정류장별 도착 시각 기록
    if (!prevArrived && arrivedNow) {
      setArrivedPulse(Date.now());
      if (!tripStopArrivalRef.current[currentIdx]) {
        tripStopArrivalRef.current[currentIdx] = Date.now();
      }
    }
    arrivedStateRef.current = arrivedNow;
    const dep = departedFromRef.current;
    const departedInfo = dep && (now - dep.at < 90000) ? dep : null;
    const body = JSON.stringify({
      ...(hasGps ? { lat: userPos.lat, lng: userPos.lng } : {}),
      dir: direction, trip: tripIdx + 1,
      stop: curStop?.name || "", ts: now,
      session: sessionRef.current,
      waiting: manualWaiting || undefined,
      ...(arrivedNow ? { arrived: true } : {}),
      ...(departedInfo ? { departedFrom: departedInfo.stop, departedAt: departedInfo.at } : {}),
    });
    fetch(`${base}/buses/${encodeURIComponent(busId || "1")}.json${auth}`, { method: "PUT", body })
      .then((r) => {
        if ((r.status === 401 || r.status === 403) && driverEmail && driverPass) {
          // 인증 토큰 만료/거부 — 1분에 1회로 제한해 재로그인 시도(중복 호출 방지)
          const now2 = Date.now();
          if (!authRetryAtRef.current || now2 - authRetryAtRef.current > 60000) {
            authRetryAtRef.current = now2;
            authTokenRef.current = "";
            firebaseSignIn().then((d) => { if (d && d.idToken) { authTokenRef.current = d.idToken; tokenIssuedAtRef.current = Date.now(); } }).catch(() => {});
          }
        }
        if (!r.ok) throw new Error(String(r.status));
        if (broadcastFailRef.current !== 0) { broadcastFailRef.current = 0; setBroadcastStatus("ok"); setLastBroadcastStatus(null); }
        setBroadcastStats((p) => ({ lastAt: Date.now(), count: p.count + 1, failCount: 0 }));
      })
      .catch((err) => {
        const msg = String(err && err.message || err || "");
        // P0-1: 401/403(인증)은 broadcast 백오프에 포함하지 않음 — 토큰 재발급 경로(별도)에서 처리
        const isAuthErr = msg === "401" || msg === "403";
        if (!isAuthErr) broadcastFailRef.current += 1;
        // HTTP 숫자 코드인지, 네트워크 오류인지 구분
        const code = /^\d{3}$/.test(msg) ? msg : (typeof navigator !== "undefined" && navigator.onLine === false ? "오프라인" : "네트워크");
        setLastBroadcastStatus(code);
        setBroadcastStats((p) => ({ ...p, failCount: p.failCount + 1 }));
        if (broadcastFailRef.current >= 8) setBroadcastStatus("failing");
      });
  }, [_shareTick, userPos, sharing, shareUrl, busId, direction, tripIdx, curStop, curCoord, manualWaiting, locShare]);

  // 공유를 끄면(켰다가 끈 경우만) 내 위치 노드 삭제 — 지도에서 사라지게
  const wasSharingRef = useRef(false);
  useEffect(() => {
    if (sharing) { wasSharingRef.current = true; return; }
    if (!wasSharingRef.current || !shareUrl) return;
    wasSharingRef.current = false;
    const base = shareUrl.replace(/\/+$/, "");
    const auth = authTokenRef.current ? `?auth=${encodeURIComponent(authTokenRef.current)}` : "";
    fetch(`${base}/buses/${encodeURIComponent(busId || "1")}.json${auth}`, { method: "DELETE" }).catch(() => {});
  }, [sharing]);

  /* --- Trip status (출발 전/운행 중/지연/종료) — 지연 운행을 '종료'로 오표시하지 않음 --- */
  const tripStatus = useMemo(() => {
    const now = getNow(); const nowMin = now.getHours() * 60 + now.getMinutes();
    const start = toMin(trip[0]); const end = toMin(trip[trip.length - 1]);
    if (nowMin < start) return { state: "upcoming", label: `${start - nowMin}분 후 출발`, color: "#22d65f" };
    if (nowMin <= end + 5) return { state: "active", label: "운행 중", color: "#fbbf24" };
    if (nowMin <= end + 40) return { state: "active", label: "운행 중(지연)", color: "#fb923c" };
    return { state: "done", label: "운행 종료", color: "#64748b" };
  }, [trip, nowTick]);

  /* ===== SIMPLE MODE — operator/driver view ===== */
  // R3: 재설정 토스트 노드 — simple/advanced 양쪽 return 에서 재사용
  const resetToastNode = resetToast ? (
    <div role="status" aria-live="polite"
      style={{ position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)",
        background: "#0a0b0f", color: "#fbbf24", padding: "10px 16px",
        border: "2px solid #fbbf24", borderRadius: 12,
        fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 13,
        boxShadow: "3px 3px 0 #fbbf2466",
        zIndex: 100, maxWidth: "92vw", textAlign: "center" }}>
      {resetToast.text}
      {!resetToast.gps && (
        <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 3, fontWeight: 400 }}>GPS OFF — 정류장은 출발지로 설정됨</div>
      )}
    </div>
  ) : null;
  if (mode === "simple") {
    const arrivalDistText = distToNext != null ? fmtDist(distToNext) : null;
    // 시간표상 다음 정류장 예정 시각까지 남은 시간(초). +면 여유, -면 지연
    const _now = new Date();
    const nowSecNow = _now.getHours() * 3600 + _now.getMinutes() * 60 + _now.getSeconds();
    const nextSchedDiffSec = nextStop ? toMin(trip[currentIdx + 1]) * 60 - nowSecNow : null;
    // 이번 정류장 예정 시각 대비 (음수=지연, 양수=빠름)
    const curSchedDiffSec = curStop ? toMin(trip[currentIdx]) * 60 - nowSecNow : null;
    const fmtMS = (sec) => { const a = Math.abs(sec); const m = Math.floor(a / 60), s = a % 60; return m > 0 ? `${m}분 ${s}초` : `${s}초`; };
    return (
      <div className="min-h-screen w-full flex flex-col items-stretch"
        style={{ background: "radial-gradient(ellipse at top, #1a1d29 0%, #0a0b10 60%, #050608 100%)" }}>
        {resetToastNode}
        <div className="w-full max-w-2xl mx-auto flex flex-col" style={{ flex: 1 }}>

          {/* Compact header — 풀스크린: 카드 외곽 제거 */}
          <div className="px-5 py-3 flex items-center justify-between"
            style={{ background: "linear-gradient(180deg, #2d3142 0%, #1c1f2b 100%)", borderBottom: "1px solid #3a3f54" }}>
            <div>
              <div className="text-[10px] text-amber-400/80 tracking-widest">제4회 무등산 인문축제</div>
              <div className="text-base font-bold leading-tight"
                style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
                {route.label} · {tripIdx + 1}회차
              </div>
              <div className="text-[10px] text-slate-400 mt-0.5"
                style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                {trip[0]} 출발 · {trip[trip.length - 1]} 도착 · <span style={{ color: tripStatus.color }}>{tripStatus.label}</span>
              </div>
            </div>
            <div className="flex flex-col items-end gap-1">
              <div className="flex items-center gap-1.5">
                {autoMode && <Navigation2 size={11} className={userPos ? "" : "animate-pulse"}
                  style={{ color: userPos ? "#22d65f" : "#fbbf24" }} />}
                <div className={`w-2 h-2 rounded-full ${isAnnouncing ? "animate-pulse" : ""}`}
                  style={{ background: isAnnouncing ? "#ef4444" : "#475569" }} />
              </div>
              <button onClick={() => setMode("advanced")}
                title="고급 설정으로 전환"
                className="text-slate-400 hover:text-amber-400 p-1">
                <Settings size={16} />
              </button>
            </div>
          </div>

          {/* 경고 배너 — busId 충돌 또는 broadcast 실패 */}
          {(busIdConflict || broadcastStatus === "failing") && (
            <div className="px-3 py-2 text-[12px] flex flex-col gap-1"
              style={{ background: "rgba(239,68,68,0.18)", borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54",
                color: "#fca5a5", fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
              {busIdConflict && (
                <div className="flex items-center justify-between gap-2">
                  <span>⚠ 같은 버스 번호({busId}) 다른 기기 송신 중 — 송신 자동 중지</span>
                  <button onClick={() => setBusIdConflict(false)} className="px-2 py-0.5 rounded text-[10px]"
                    style={{ background: "rgba(239,68,68,0.35)", color: "#fff", border: "1px solid rgba(239,68,68,0.5)" }}>
                    확인
                  </button>
                </div>
              )}
              {broadcastStatus === "failing" && (
                <div className="flex flex-col gap-1">
                  <div className="flex items-center justify-between gap-2">
                    <span>⚠ 위치 송신 실패{lastBroadcastStatus ? ` (${/^\d{3}$/.test(lastBroadcastStatus) ? "HTTP " + lastBroadcastStatus : lastBroadcastStatus})` : ""}</span>
                    <div className="flex items-center gap-2">
                      {lastBroadcastStatus === "401" || lastBroadcastStatus === "403" ? (
                        <button onClick={() => { authTokenRef.current = ""; authRetryAtRef.current = 0; firebaseSignIn().then((d) => { if (d && d.idToken) authTokenRef.current = d.idToken; broadcastFailRef.current = 0; setBroadcastStatus("ok"); setLastBroadcastStatus(null); }).catch(() => {}); }}
                          className="px-2 py-0.5 rounded text-[10px]"
                          style={{ background: "rgba(96,165,250,0.35)", color: "#fff", border: "1px solid rgba(96,165,250,0.5)" }}>
                          재로그인
                        </button>
                      ) : null}
                      <button onClick={() => { broadcastFailRef.current = 0; setBroadcastStatus("ok"); }}
                        className="px-2 py-0.5 rounded text-[10px]"
                        style={{ background: "rgba(239,68,68,0.35)", color: "#fff", border: "1px solid rgba(239,68,68,0.5)" }}>
                        확인
                      </button>
                    </div>
                  </div>
                  {(lastBroadcastStatus === "401" || lastBroadcastStatus === "403") && (
                    <div className="text-[10px] opacity-80">고급 설정 → 기사 로그인(이메일/비번)이 정확한지 확인하세요.</div>
                  )}
                  {(lastBroadcastStatus === "네트워크" || lastBroadcastStatus === "오프라인") && (
                    <div className="text-[10px] opacity-80">{lastBroadcastStatus === "오프라인" ? "오프라인 상태입니다. " : ""}네트워크(와이파이/모바일 데이터) 연결을 확인하세요.</div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* Big glanceable status bar — 우선순위: 송신실패>충돌>안내중>대기>송신중>GPS자동>수동 */}
          {(() => {
            const st = broadcastStatus === "failing" ? { c: "#ef4444", bg: "rgba(239,68,68,0.18)", t: "⚠ 위치 송신 실패", pulse: true }
              : busIdConflict ? { c: "#fb923c", bg: "rgba(251,146,60,0.18)", t: "⚠ 버스 번호 충돌", pulse: true }
              : isAnnouncing ? { c: "#fca5a5", bg: "rgba(239,68,68,0.18)", t: "📢 안내 방송 중", pulse: true }
              : manualWaiting ? { c: "#60a5fa", bg: "rgba(96,165,250,0.18)", t: "🅿️ 출발 대기 중", pulse: true }
              // 위치 공유 ON — locShare/GPS 상태에 따라 분기
              : sharing && !locShare ? { c: "#22d65f", bg: "rgba(34,214,95,0.18)", t: "📡 송신 · 운행만 (GPS 미사용)", pulse: false }
              : sharing && locShare && userPos ? { c: "#22d65f", bg: "rgba(34,214,95,0.18)", t: "📡 송신 · 위치+운행", pulse: false }
              : sharing && locShare && !userPos ? { c: "#fbbf24", bg: "rgba(251,191,36,0.18)", t: "📡 송신 · GPS 신호 대기", pulse: true }
              // GPS 자동만 켜진 경우(공유 OFF) — 자체 진행만
              : autoMode && userPos ? { c: "#22d65f", bg: "rgba(34,214,95,0.15)", t: "GPS 자동 · 위치 정상", pulse: false }
              : autoMode ? { c: "#fbbf24", bg: "rgba(251,191,36,0.12)", t: "GPS 자동 · 신호 대기", pulse: true }
              : timetableMode ? (() => {
                  // A6: 지연 표시 — 예정 vs 실제 분
                  const planned = trip[currentIdx];
                  const _now = new Date();
                  const _nowMin = _now.getHours() * 60 + _now.getMinutes();
                  const pMin = planned ? toMin(planned) : null;
                  const delay = pMin != null ? (_nowMin - pMin) : null;
                  let txt = `🕒 시간표 자동 · ${planned || "—"}`;
                  if (delay != null && delay !== 0) txt += ` · ${delay > 0 ? `${delay}분 지연` : `${-delay}분 빠름`}`;
                  const col = (delay != null && delay >= 3) ? "#ef4444" : "#fbbf24";
                  const bg = (delay != null && delay >= 3) ? "rgba(239,68,68,0.15)" : "rgba(251,191,36,0.15)";
                  return { c: col, bg, t: txt, pulse: false };
                })()
              : { c: "#94a3b8", bg: "rgba(100,116,139,0.12)", t: "수동 대기 중", pulse: false };
            return (
              <div className="px-3 py-2 flex items-center justify-between gap-2"
                style={{ background: st.bg, borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54" }}>
                <div className="flex items-center gap-2 min-w-0 flex-1">
                  <div className={`w-3 h-3 rounded-full flex-shrink-0 ${st.pulse ? "animate-pulse" : ""}`}
                    style={{ background: st.c }} />
                  <span className="text-base font-bold truncate" style={{ fontFamily: "'Jua', sans-serif", color: st.c }}>
                    {st.t}
                  </span>
                </div>
                {/* 송신 통계 — sharing 중일 때만 우측에 작게 */}
                {sharing && (
                  <div className="flex-shrink-0 text-[10px] text-right" style={{ color: st.c, opacity: 0.85, fontFamily: "'IBM Plex Mono', monospace", lineHeight: 1.25 }}>
                    {broadcastStats.lastAt ? (
                      <div>송신 {Math.max(0, Math.floor((Date.now() - broadcastStats.lastAt) / 1000))}s 전</div>
                    ) : <div>송신 대기</div>}
                    <div>누적 {broadcastStats.count} · 실패 {broadcastStats.failCount}</div>
                  </div>
                )}
                {!sharing && autoMode && autoLegSwitch && !isAnnouncing && (
                  <span className="flex-shrink-0 text-[10px] font-bold px-2 py-1 rounded"
                    style={{ background: "rgba(34,214,95,0.2)", color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                    자동 전환 ON
                  </span>
                )}
              </div>
            );
          })()}

          {/* 대기 표시 — 크게 가운데 배너(탭하여 해제) */}
          {manualWaiting && (
            <button onClick={() => setManualWaiting(false)}
              className="w-full flex flex-col items-center justify-center py-8"
              style={{ background: "linear-gradient(180deg, rgba(96,165,250,0.22) 0%, rgba(96,165,250,0.12) 100%)",
                borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54", cursor: "pointer" }}>
              <div style={{ fontSize: "clamp(2.2rem, 11vw, 3.2rem)", fontFamily: "'Black Han Sans', sans-serif", color: "#60a5fa",
                textShadow: "0 0 24px rgba(96,165,250,0.7), 0 0 48px rgba(96,165,250,0.3)", lineHeight: 1, letterSpacing: "-0.02em" }}>
                🅿️ 출발 대기 중
              </div>
              <div style={{ fontSize: 12, color: "#94a3b8", fontFamily: "'Jua', sans-serif", marginTop: 8, letterSpacing: 1 }}>
                탭하여 출발 · 대기 해제
              </div>
            </button>
          )}

          {/* Current stop — BIG (고정 min-height로 하단 버튼 위치 안정화) */}
          <div className="px-5 py-8 flex flex-col justify-center"
            style={{ background: "#0a0b0f", borderColor: "#3a3f54", minHeight: 380,
              backgroundImage: "repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px)" }}>
            <div className="text-center mb-3">
              <span className="text-[11px] tracking-[0.3em] px-3 py-1 rounded-full"
                style={{ color: "#fbbf24", background: "rgba(251, 191, 36, 0.1)",
                  fontFamily: "'IBM Plex Mono', monospace" }}>
                이번 정류장 · {trip[currentIdx]}
              </span>
            </div>
            {curSchedDiffSec != null && (
              <div className="text-center -mt-1 mb-2 text-[11px]"
                style={{ fontFamily: "'Jua', sans-serif",
                  color: curSchedDiffSec < -5 ? "#fb923c" : curSchedDiffSec > 5 ? "#22d65f" : "#94a3b8" }}>
                {curSchedDiffSec < -5 ? `시간표보다 ${fmtMS(curSchedDiffSec)} 지연`
                  : curSchedDiffSec > 5 ? `시간표보다 ${fmtMS(curSchedDiffSec)} 빠름`
                  : "정시 운행"}
              </div>
            )}
            <div className="text-center">
              <div style={{
                color: "#fbbf24",
                fontFamily: "'Black Han Sans', sans-serif",
                fontSize: "clamp(2.5rem, 14vw, 4.5rem)",
                lineHeight: 1,
                textShadow: "0 0 24px rgba(251, 191, 36, 0.7), 0 0 48px rgba(251, 191, 36, 0.3)",
                letterSpacing: "-0.02em",
                wordBreak: "keep-all",
              }}>
                {curStop?.name || "—"}
              </div>
              {curStop?.sub && (
                <div className="text-sm text-amber-500/70 mt-2">{curStop.sub}</div>
              )}
              {curStop?.terminus && (
                <div className="mt-3 inline-block px-2 py-0.5 rounded text-[10px]"
                  style={{ background: "rgba(239, 68, 68, 0.15)", color: "#fca5a5",
                    border: "1px solid rgba(239, 68, 68, 0.3)" }}>
                  종점
                </div>
              )}
            </div>
            {/* 승하차 카운트 — 현재 정류장 ± 입력 + 현재 탑승 + 종점 전원 하차 */}
            {countsEnabled && curStop && (() => {
              const key = `${direction}|${tripIdx + 1}|${curStop.name}`;
              const cur = counts[key] || { board: 0, alight: 0 };
              const Cell = ({ label, kind, color }) => (
                <div className="flex flex-col items-center" style={{ flex: 1 }}>
                  <div className="text-[10px]" style={{ color: color + "cc", fontFamily: "'Jua', sans-serif", letterSpacing: 1 }}>{label}</div>
                  <div className="flex items-center gap-2 mt-1">
                    <button onClick={() => updateCount(kind, -1)}
                      style={{ width: 44, height: 44, borderRadius: 12, background: color + "26", color: color, border: "1.5px solid " + color, fontSize: 22, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>−</button>
                    <div style={{ minWidth: 48, textAlign: "center", color: color, fontFamily: "'Black Han Sans', sans-serif", fontSize: 28, lineHeight: 1 }}>{cur[kind] || 0}</div>
                    <button onClick={() => updateCount(kind, +1)}
                      style={{ width: 44, height: 44, borderRadius: 12, background: color, color: "#0a0b0f", border: "1.5px solid " + color, fontSize: 24, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>+</button>
                  </div>
                </div>
              );
              const pulseClass = arrivedPulse && (Date.now() - arrivedPulse < 6000) ? " arrived-alert" : "";
              const atTerminus = !!curStop.terminus;
              return (
                <div className={"mt-4 pt-3 rounded-lg" + pulseClass} style={{ borderTop: "1px solid #3a3f54", padding: "8px 4px" }}>
                  <div className="flex items-stretch gap-3">
                    {atTerminus ? (
                      <div className="flex flex-col items-center justify-center" style={{ flex: 1, color: "#64748b", fontFamily: "'Jua', sans-serif" }}>
                        <div className="text-[10px]" style={{ letterSpacing: 1 }}>탑승</div>
                        <div className="text-[11px] mt-1" style={{ color: "#94a3b8" }}>종점 — 승차 불가</div>
                      </div>
                    ) : (
                      <Cell label="탑승" kind="board" color="#22d65f" />
                    )}
                    <div style={{ width: 1, background: "#3a3f54" }} />
                    <Cell label="하차" kind="alight" color="#fb923c" />
                  </div>
                  <div className="flex items-center justify-between mt-3 px-1">
                    {(() => {
                      const ratio = busCapacity > 0 ? onboardCount / busCapacity : 0;
                      const c = ratio > 1 ? "#ef4444" : ratio > 0.8 ? "#fb923c" : ratio > 0.5 ? "#fbbf24" : onboardCount > 0 ? "#22d65f" : "#64748b";
                      const lbl = ratio > 1 ? "만석" : ratio > 0.8 ? "혼잡" : ratio > 0.5 ? "보통" : onboardCount > 0 ? "여유" : null;
                      return (
                        <span className="text-[10px] text-slate-400" style={{ fontFamily: "'Jua', sans-serif" }}>
                          현재 탑승 <span style={{ color: c, fontWeight: 700, fontSize: 13, marginLeft: 4 }}>{onboardCount}명</span>
                          {lbl && <span style={{ color: c, marginLeft: 6, fontSize: 10 }}>· {lbl} ({busCapacity}석)</span>}
                        </span>
                      );
                    })()}
                    <div className="flex items-center gap-2">
                      {curStop.terminus && onboardCount > 0 && (
                        <button onClick={alightAll}
                          className="px-3 py-1.5 rounded-lg text-[11px] font-bold"
                          style={{ background: "#fb923c", color: "#0a0b0f", fontFamily: "'Jua', sans-serif", border: "1px solid #fb923c" }}>
                          전원 하차 ({onboardCount}명)
                        </button>
                      )}
                      <button onClick={resetCountsCurrentTrip}
                        className="px-2 py-1 rounded text-[10px]"
                        style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)", fontFamily: "'Jua', sans-serif" }}>
                        이 회차 초기화
                      </button>
                    </div>
                  </div>
                </div>
              );
            })()}
          </div>

          {/* Next stop — 더 큰 시각 위계로 운전 중 빠른 인식(B+H) */}
          <div className="px-5 py-5 flex items-center justify-between gap-3"
            style={{ background: "#13151c", borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54" }}>
            <div className="flex-shrink-0 flex flex-col items-center px-3 py-1.5 rounded"
              style={{ background: "rgba(34, 214, 95, 0.12)", minWidth: 68 }}>
              <span className="text-[10px] tracking-widest text-emerald-400/80"
                style={{ fontFamily: "'IBM Plex Mono', monospace" }}>NEXT</span>
              <span className="text-base font-black text-emerald-400"
                style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                {nextStop ? trip[currentIdx + 1] : "종점"}
              </span>
            </div>
            <div className="flex-1 min-w-0 text-right">
              <div className="text-3xl font-bold leading-tight break-keep"
                style={{ color: nextStop ? "#e2e8f0" : "#64748b", fontFamily: "'Jua', sans-serif" }}>
                {nextStop?.name || "운행 종료"}
              </div>
              {nextStop && nextSchedDiffSec != null && (
                <div className="text-[13px] mt-1"
                  style={{ color: nextSchedDiffSec < 0 ? "#fb923c" : "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                  {nextSchedDiffSec >= 0 ? `예정까지 ${fmtMS(nextSchedDiffSec)}` : `${fmtMS(nextSchedDiffSec)} 지연`}
                </div>
              )}
              {arrivalDistText && nextStop && (
                <div className="text-[12px] mt-0.5"
                  style={{ color: distToNext < triggerRadius ? "#ef4444" : "#22d65f",
                    fontFamily: "'IBM Plex Mono', monospace" }}>
                  ↓ {arrivalDistText}
                </div>
              )}
            </div>
          </div>

          {/* Next leg connection (only at terminus or end) */}
          {nextLegInfo ? (
            isAtTerminus && (
              <div className="px-5 py-3 flex items-center justify-between gap-3"
                style={{ background: "rgba(34, 214, 95, 0.15)", borderColor: "#3a3f54",
                  borderBottom: "1px solid #3a3f54" }}>
                <div className="flex items-center gap-2 min-w-0">
                  <div className="flex flex-col items-center px-2 py-1 rounded"
                    style={{ background: "#22d65f" }}>
                    <span className="text-[8px] tracking-widest"
                      style={{ color: "#0a0b0f", fontFamily: "'IBM Plex Mono', monospace" }}>NEXT</span>
                    <span className="text-xs font-black"
                      style={{ color: "#0a0b0f", fontFamily: "'IBM Plex Mono', monospace" }}>
                      {nextLegInfo.departTime}
                    </span>
                  </div>
                  <div className="text-sm font-bold truncate"
                    style={{ color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                    {nextLegInfo.label} {nextLegInfo.tripNum}회차
                  </div>
                </div>
                <button onClick={goToNextLeg}
                  className="flex-shrink-0 px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap"
                  style={{ background: "#22d65f", color: "#0a0b0f",
                    fontFamily: "'Jua', sans-serif",
                    boxShadow: "0 0 16px rgba(34, 214, 95, 0.4)" }}>
                  전환 →
                </button>
              </div>
            )
          ) : isAtTerminus && (
            <div className="px-5 py-3"
              style={{ background: "rgba(100, 116, 139, 0.1)", borderColor: "#3a3f54",
                borderBottom: "1px solid #3a3f54" }}>
              <div className="text-xs text-center text-slate-400" style={{ fontFamily: "'Jua', sans-serif" }}>
                🏁 오늘 운행 종료
              </div>
            </div>
          )}

          {/* GPS error banner (compact) — 운전 화면에서 바로 재시도 */}
          {(gpsError || permissionState === "denied") && (
            <div className="px-5 py-2 flex items-center gap-2 text-xs"
              style={{ background: "rgba(239,68,68,0.08)", borderColor: "#3a3f54",
                borderBottom: "1px solid #3a3f54", color: "#fca5a5" }}>
              <AlertCircle size={12} />
              <span className="flex-1">{permissionState === "denied" ? "위치 권한 차단됨" : gpsError}</span>
              <button onClick={retryPermission} className="text-emerald-400 underline">다시</button>
              <button onClick={() => setMode("advanced")}
                className="text-amber-400 underline">설정</button>
            </div>
          )}

          {/* Controls — big announce/replay (prev/next spaced apart to avoid mis-taps) */}
          <div className="px-5 py-6 flex flex-col items-center gap-3"
            style={{ background: "linear-gradient(180deg, #1c1f2b 0%, #13151c 100%)", borderColor: "#3a3f54" }}>
            <div className="flex items-center justify-between w-full">
              <button onClick={prev} disabled={currentIdx === 0}
                className="w-14 h-14 rounded-full flex items-center justify-center disabled:opacity-30"
                style={{ background: "rgba(251, 191, 36, 0.1)",
                  border: "1px solid rgba(251, 191, 36, 0.3)", color: "#fbbf24" }}>
                <SkipBack size={22} />
              </button>
              <button onClick={announce}
                className="w-24 h-24 rounded-full flex flex-col items-center justify-center relative"
                style={{
                  background: "linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%)",
                  boxShadow: isAnnouncing ? "0 0 36px rgba(239, 68, 68, 0.6)" : "0 0 36px rgba(251, 191, 36, 0.5)",
                  color: "#0a0b0f" }}>
                <Volume2 size={34} />
                <span className="text-[10px] font-bold mt-0.5" style={{ fontFamily: "'Jua', sans-serif" }}>
                  {isAnnouncing ? "다시" : "안내"}

                  style={{ boxShadow: "0 0 0 3px rgba(239, 68, 68, 0.6), 0 0 24px rgba(239, 68, 68, 0.4)" }} />)}

              <button onClick={next} disabled={currentIdx >= stops.length - 1}
