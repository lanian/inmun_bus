<style>

  body { font-family: 'Gowun Dodum', system-ui, sans-serif; }
  /* 무등생각 인트로(로딩) */
  .boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;

  .boot img { width: 92px; height: auto;

    transform-style: preserve-3d; backface-visibility: visible; will-change: transform; }

    0%, 28% { transform: perspective(800px) rotateX(0deg); }    /* OFF 유지 — '생각을 끄고' */

  .boot .who { font-size: 14px; color: #101113; font-weight: 700; margin-top: 6px; }
  .boot .accent { font-size: 22px; color: #EE6B2E; font-weight: 700; margin-top: 6px; line-height: 1.2; }
  .boot .dots { margin-top: 26px; display: inline-flex; gap: 6px; }
  .boot .dot { width: 8px; height: 8px; border-radius: 50%; background: #EE6B2E; animation: bootDot 1.4s ease-in-out infinite; }
  .boot .dot:nth-child(2) { background: #16A89E; animation-delay: 0.18s; }
  .boot .dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bootPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(0.93); opacity: 0.9; } }
  @keyframes bootDot { 0%,100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
  /* Leaflet vs Tailwind preflight fix — keep map tiles/markers from being shrunk */
  .leaflet-container .leaflet-tile,

  .leaflet-container .leaflet-marker-shadow,
  .leaflet-pane img { max-width: none !important; }

  @keyframes waitMarker { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .fest-wait-marker > div { animation: waitMarker 1.4s ease-in-out infinite; }
  /* 행사 구역 마커 — 둥근 사각형, 번호 + 짧은 라벨 */
  .fest-zone-marker > div { display: inline-flex; align-items: center; gap: 4px;
    background: #fff; color: #101113; border: 2px solid #101113; border-radius: 10px;
    padding: 2px 6px 2px 4px; font-family: 'Jua', sans-serif; font-weight: 700; font-size: 11px;
    white-space: nowrap; box-shadow: 2px 2px 0 #101113; }
  .fest-zone-marker .num { display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 5px; color: #fff; font-size: 11px; }
  /* 세부 장소 마커 — 작은 점+이름 */
  .fest-sub-marker > div { display: inline-flex; align-items: center; gap: 4px;
    background: #fff; color: #101113; border: 1.5px solid #101113; border-radius: 999px;
    padding: 1px 6px 1px 4px; font-family: 'Jua', sans-serif; font-weight: 700; font-size: 10px;
    white-space: nowrap; box-shadow: 1px 1px 0 #101113; }
  .fest-sub-marker .dot { width: 7px; height: 7px; border-radius: 50%; }
  /* 도착 알람 — 카운트 영역에 부드러운 노란 글로우 */
  @keyframes arrivedAlert {
    0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55); }

  .mds-input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 8px;

  /* 모바일 viewport 높이 — Android Chrome 주소창 토글로 인한 layout 튀임 방지.
     1) 기본 100vh (모든 브라우저), 2) svh 지원하는 모던 브라우저는 100svh(가장 작은 viewport)로 항상 내용이 화면에 들어옴. */
  .mds-app-height { height: 100vh; height: 100svh; }
  /* 디자인 토큰 — 신규 코드는 var(--mds-*) 우선 사용 권장. 기존 코드는 점진적으로 마이그레이션.
     spacing: 4 / 8 / 12 / 16 / 24 / 32 (5단계 — gap, padding, margin 일관)
     radius: 6 / 10 / 14 / 999 (작은 칩 / 카드 / 큰 카드 / pill)
     touch target 최소 44px (Apple HIG / Material) */

    --mds-s-1: 4px;
    --mds-s-2: 8px;
    --mds-s-3: 12px;
    --mds-s-4: 16px;
    --mds-s-5: 24px;
    --mds-s-6: 32px;
    --mds-r-chip: 6px;
    --mds-r-card: 10px;
    --mds-r-hero: 14px;
    --mds-r-pill: 999px;
    --mds-touch-min: 44px;
    --mds-c-ink: #101113;
    --mds-c-ink-soft: #4A4E55;
    --mds-c-mute: #64748b;
    --mds-c-paper: #F6F1E4;
    --mds-c-teal: #16A89E;
    --mds-c-teal-dark: #0F7C73;
    --mds-c-orange: #EE6B2E;
    --mds-c-orange-dark: #C2521D;
  }
  /* prefers-reduced-motion — 모션 민감 사용자 대응. 인트로 flip 즉시 종료 + 모든 transition 단축. */
  @media (prefers-reduced-motion: reduce) {
    .boot img { animation-duration: 0.001s !important; }
    *, *::before, *::after { animation-duration: 0.01s !important; transition-duration: 0.01s !important; }
  }

/* Geo helper */
function distanceMeters(a, b) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const lat1 = toRad(a.lat); const lat2 = toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* Time helper: HH:MM → minutes since midnight */
const toMin = (hm) => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };
const fromMin = (m) => { const x = ((m % (24 * 60)) + 24 * 60) % (24 * 60); return `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`; };

/* Phase 0.5: 가짜 시각/가속 — 행사 전 시연·테스트용. 영구 저장(localStorage) + URL 우선.
   ?fake=2026-06-13T13:30 — 기준 시각, ?fakeSpeed=10 — 가속 배율(기본 1).
   실제 시각 기록(broadcast ts, dateKey 등 데이터 무결성)은 Date.now() 그대로 사용. */
const FAKE = (() => {
  try {
    const params = new URLSearchParams(window.location.search || "");
    const fromUrl = params.get("fake") || null;
    const fromLs = (typeof localStorage !== "undefined") ? (localStorage.getItem("shuttle:fakeNow") || null) : null;
    const base = fromUrl || fromLs;
    const speedRaw = params.get("fakeSpeed") || (typeof localStorage !== "undefined" ? localStorage.getItem("shuttle:fakeSpeed") : null) || "1";
    const speed = parseFloat(speedRaw) || 1;
    if (!base) return null;
    const baseDate = new Date(base);
    if (isNaN(baseDate.getTime())) return null;
    return { baseMs: baseDate.getTime(), wallStart: Date.now(), speed };
  } catch (_) { return null; }
})();
const getNow = () => {
  if (!FAKE) return new Date();
  const elapsed = Date.now() - FAKE.wallStart;
  return new Date(FAKE.baseMs + elapsed * FAKE.speed);
};
const getNowMin = () => { const d = getNow(); return d.getHours() * 60 + d.getMinutes(); };

/* Spoken-name helper — TTS reads "5·18" oddly(오십팔/오백십팔/오점일팔 등 엔진별 상이),
   '오일팔 '(뒤 공백) 으로 정규화해 자연 발화. 가운뎃점만 있는 변형도 함께 처리.
   '학동증심사역' 처럼 합성 지명도 단어 경계를 띄어 자연 발화. */
const spokenName = (name) => (name || "")
  .replace(/5·18/g, "오일팔 ")
  .replace(/5\.18/g, "오일팔 ")
  .replace(/오일팔  +/g, "오일팔 ") // 중복 공백 제거
  .replace(/학동증심사역/g, "학동 증심사역") // 합성 지명 — 단어 경계 명시
  .replace(/  +/g, " "); // 누적 공백 정리

/* Spoken-time helper — "09:45" → "9시 45분" so TTS doesn't read the colon */
const spokenTime = (hm) => {
  const [h, m] = hm.split(":").map(Number);
  return m === 0 ? `${h}시` : `${h}시 ${m}분`;
};

/* 승객 안내용 시각 표현 — "13:00" → "오후 1시", "10:20" → "오전 10시 20분" */
const spokenClock = (hm) => {
  let [h, m] = hm.split(":").map(Number);
  const ampm = h < 12 ? "오전" : "오후";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return m === 0 ? `${ampm} ${h12}시` : `${ampm} ${h12}시 ${m}분`;
};

  const d = new Date();

  const intro = "잠시 후, 무등생각 축제장에 도착합니다. ";
  const upcoming = list.filter(p => toMin(p.t) >= nowMin);
  if (upcoming.length === 0) {

/* UA 카테고리화 — fingerprint 위험 없는 OS·브라우저·폼팩터 조합만 추출.
   결과 예: 'ios.safari.mobile', 'android.chrome.mobile', 'windows.chrome.desktop'. */
const parseUaCategory = (ua) => {
  if (!ua) return "unknown";
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isMobile = isAndroid || isIOS || /Mobile/i.test(ua);
  let os = "other";
  if (isIOS) os = "ios";
  else if (isAndroid) os = "android";
  else if (/Windows/i.test(ua)) os = "windows";
  else if (/Macintosh|Mac OS/i.test(ua)) os = "mac";
  else if (/Linux/i.test(ua)) os = "linux";
  let br = "other";
  if (/SamsungBrowser/i.test(ua)) br = "samsung";
  else if (/EdgiOS|Edge|Edg\//i.test(ua)) br = "edge";
  else if (/CriOS|Chrome/i.test(ua)) br = "chrome";
  else if (/FxiOS|Firefox/i.test(ua)) br = "firefox";
  else if (/Safari/i.test(ua) && !/Chrome|CriOS/i.test(ua)) br = "safari";
  return `${os}.${br}.${isMobile ? "mobile" : "desktop"}`;
};

/* 익명 사용 통계 트래커 — 사후 분석용. 개인정보·좌표·풀 UA 비수집.
   - 세션: sessionStorage 기반 (탭 닫으면 종료) — sid 12자 랜덤
   - 이벤트: { [key]: count } in-memory + sessionStorage backup. key 는 카테고리.동작 형태만 허용 (DB 규칙도 동일 화이트리스트)
   - 디바이스 정보: parseUaCategory 결과(os.br.formfactor) 만 저장. navigator.language 등 fingerprint 위험 필드 비저장.
   - flush: 60초 주기 + visibility hidden + pagehide → /stats/{date}/sessions/{sid} PUT (실패 시 exponential backoff)
   - 운영자만 읽기, 익명 PUT 만 허용 (DB 규칙). */
const createStatsTracker = (dbUrl) => {
  const noop = { track: () => {}, flush: () => {}, destroy: () => {} };
  if (!dbUrl || typeof sessionStorage === "undefined") return noop;
  let sid = "";
  try {
    sid = sessionStorage.getItem("mds:sid") || "";
    if (!sid) { sid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); sessionStorage.setItem("mds:sid", sid); }
  } catch (_) { return noop; }
  const startedAt = Date.now();
  const cat = parseUaCategory(navigator && navigator.userAgent || "");
  // 버전 마이그레이션 — v3: 샤드 패턴(flush 마다 새 sub-record). 이전 누적 데이터는 의미 다르므로 클리어
  const STATS_VERSION = 3;
  let eventsDelta = {}; // 마지막 성공 flush 이후 발생한 신규 이벤트만 보관 (서버에는 델타로 PUT)
  try {
    if (sessionStorage.getItem("mds:statsVer") === String(STATS_VERSION)) {
      eventsDelta = JSON.parse(sessionStorage.getItem("mds:statsDelta") || "{}") || {};
    } else {
      sessionStorage.removeItem("mds:stats");
      sessionStorage.removeItem("mds:statsDelta");
      sessionStorage.setItem("mds:statsVer", String(STATS_VERSION));
    }
  } catch (_) {}
  let dirty = Object.keys(eventsDelta).length > 0;
  let flushing = false;
  let backoffMs = 0; // 다음 flush 까지 추가 대기. 실패 시 증가, 성공 시 0.
  let lastTryAt = 0;
  let firstFlushTimer = null; // 첫 track 후 3초 내 빠른 첫 flush — 운영자가 즉시 확인 가능하도록
  const base = dbUrl.replace(/\/+$/, "");
  // 허용 이벤트 키 패턴 — Firebase RTDB 가 . 를 키에 허용하지 않으므로 _ 로 카테고리·세부 구분
  // 예: 'session_start', 'view_list', 'transition_list_to_venue', 'stop_popup_hakdong'
  const KEY_RE = /^(session|view|click|toggle|open|notice|transition|stop|sticker|error)_[a-zA-Z0-9_]+$/;
  // 키 수 cap — 키 종류가 200 초과면 새로운 키 무시 (PUT body 크기 방어)
  const KEY_CAP = 200;
  const dateKey = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  };
  const flush = async () => {
    if (!dirty || flushing) return;
    const now = Date.now();
    if (backoffMs > 0 && now - lastTryAt < backoffMs) return; // backoff 대기 중
    flushing = true;
    lastTryAt = now;
    // 델타 snapshot 을 잡아두고 PUT — 송신 중에 신규 track 이 들어오면 다음 flush 에서 처리
    const deltaSnap = { ...eventsDelta };
    try {
      const body = { ts: now, startedAt, durMs: now - startedAt, ev: deltaSnap, cat };
      // 샤드 패턴: 매 flush 가 새 sub-record. 서버에서 누적 덮어쓰기 없음 → 삭제 시 진짜 사라짐
      const r = await fetch(`${base}/stats/${dateKey()}/sessions/${encodeURIComponent(sid)}/flushes/${now}.json`,
        { method: "PUT", body: JSON.stringify(body), keepalive: true });
      if (r.ok) {
        // 보낸 만큼 차감 — 동시에 들어온 신규 track 의 값은 보존
        Object.keys(deltaSnap).forEach((k) => {
          const sent = deltaSnap[k];
          if ((eventsDelta[k] || 0) > sent) eventsDelta[k] = eventsDelta[k] - sent;
          else delete eventsDelta[k];
        });
        dirty = Object.keys(eventsDelta).length > 0;
        try { sessionStorage.setItem("mds:statsDelta", JSON.stringify(eventsDelta)); } catch (_) {}
        backoffMs = 0;
      } else {
        let detail = ""; try { detail = await r.text(); } catch (_) {}
        try { console.warn("[mds:stats] flush failed", r.status, detail.slice(0, 200)); } catch (_) {}
        backoffMs = (r.status >= 400 && r.status < 500) ? 10 * 60 * 1000 : Math.min((backoffMs || 60000) * 2, 10 * 60 * 1000);
      }
    } catch (e) {
      try { console.warn("[mds:stats] flush network error", e && e.message); } catch (_) {}
      backoffMs = Math.min((backoffMs || 60000) * 2, 10 * 60 * 1000);
    }
    flushing = false;
  };
  const track = (key, count = 1) => {
    if (!key) return;
    const k = String(key).slice(0, 48);
    if (!KEY_RE.test(k)) return; // 화이트리스트 외 무시
    if (!(k in eventsDelta) && Object.keys(eventsDelta).length >= KEY_CAP) return;
    eventsDelta[k] = (eventsDelta[k] || 0) + (count || 1);
    dirty = true;
    try { sessionStorage.setItem("mds:statsDelta", JSON.stringify(eventsDelta)); } catch (_) {}
    if (!firstFlushTimer) { firstFlushTimer = setTimeout(() => { firstFlushTimer = null; flush(); }, 3000); }
  };
  const intervalId = setInterval(flush, 60000);
  const onVis = () => { if (document.hidden) flush(); };
  const onHide = () => flush();
  document.addEventListener("visibilitychange", onVis);
  window.addEventListener("pagehide", onHide);
  return {
    track, flush,
    destroy: () => {
      if (firstFlushTimer) { clearTimeout(firstFlushTimer); firstFlushTimer = null; }
      flush();
      clearInterval(intervalId);
      document.removeEventListener("visibilitychange", onVis);
      window.removeEventListener("pagehide", onHide);
    },
  };
};

/* Leaflet map picker — click or drag pin to choose a coordinate.
   radius(m): 자동 안내 시작 반경을 원으로 표시 */
function MapPicker({ lat, lng, radius, onPick }) {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);
  const circleRef = useRef(null);

  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const map = window.L.map(elRef.current).setView([lat, lng], 16);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap",
    }).addTo(map);
    const icon = window.L.icon({
      iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
      iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
      shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
      iconSize: [25, 41], iconAnchor: [12, 41],
    });
    const circle = window.L.circle([lat, lng], {
      radius: radius || 150, color: "#22d65f", weight: 1.5,
      fillColor: "#22d65f", fillOpacity: 0.12,
    }).addTo(map);
    const marker = window.L.marker([lat, lng], { draggable: true, icon }).addTo(map);
    const move = (la, ln) => { circle.setLatLng([la, ln]); onPick(la, ln); };
    marker.on("dragend", () => { const p = marker.getLatLng(); move(p.lat, p.lng); });
    map.on("click", (e) => { marker.setLatLng(e.latlng); move(e.latlng.lat, e.latlng.lng); });
    mapRef.current = map; markerRef.current = marker; circleRef.current = circle;
    setTimeout(() => map.invalidateSize(), 80);
    return () => { map.remove(); mapRef.current = null; markerRef.current = null; circleRef.current = null; };
  }, []);

  // Sync external (manual-input) coordinate changes onto the map
  useEffect(() => {
    if (!markerRef.current || !mapRef.current) return;
    const c = markerRef.current.getLatLng();
    if (Math.abs(c.lat - lat) > 1e-7 || Math.abs(c.lng - lng) > 1e-7) {
      markerRef.current.setLatLng([lat, lng]);
      circleRef.current?.setLatLng([lat, lng]);
      mapRef.current.panTo([lat, lng]);
    }
  }, [lat, lng]);

  // 반경 변경 시 원 갱신
  useEffect(() => {
    if (circleRef.current && radius) circleRef.current.setRadius(radius);
  }, [radius]);

  if (!window.L) {
    return (
      <div className="text-xs text-center py-6 rounded-lg"
        style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#fca5a5" }}>
        지도를 불러올 수 없습니다 (네트워크 확인). 아래 좌표 입력은 사용할 수 있어요.
      </div>
    );
  }
  return <div ref={elRef} style={{ width: "100%", height: "260px", borderRadius: "12px", overflow: "hidden" }} />;
}

/* 운행 시간표 모달 — 양방향 전체 회차×정류장 시각 표. 현재 시각 기준 운행 회차 강조 (focusTrip 지정 시 해당 회차 우선) */
function TimetableModal({ tripsToday, onClose, focusTrip = null }) {
  const now = getNow();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  // 하루 전체에서 현재 운행 중(또는 다음) 회차 1개 계산
  const all = [];
  ["outbound", "inbound"].forEach((dir) => ROUTES[dir].trips.forEach((t, i) => {
    if (i < tripsToday) all.push({ dir, idx: i, dep: toMin(t[0]), arr: toMin(t[t.length - 1]) });
  }));
  all.sort((a, b) => a.dep - b.dep);
  const running = all.find((l) => nowMin >= l.dep && nowMin <= l.arr + 40);
  const autoActive = running || all.find((l) => l.dep > nowMin) || null;
  // focusTrip 우선 — 카드 탭으로 진입했을 때 해당 회차 강조 + 자동 스크롤
  const focusActive = focusTrip && typeof focusTrip.ti === "number" && focusTrip.dir
    ? { dir: focusTrip.dir, idx: focusTrip.ti } : null;
  const active = focusActive || autoActive;
  const activeState = focusActive ? "선택" : (running ? "운행 중" : "다음");
  const focusRowRef = useRef(null);
  useEffect(() => {
    if (focusRowRef.current && typeof focusRowRef.current.scrollIntoView === "function") {
      try { focusRowRef.current.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (_) {}
    }
  }, []);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(15,15,18,0.72)" }} onClick={onClose}>
      <div className="w-full max-w-md p-4 space-y-3 max-h-[85vh] overflow-y-auto"
        style={{ background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 16, boxShadow: "4px 4px 0 " + FT.ink }}
        onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div style={{ color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 15 }}>
            운행 시간표 <span style={{ color: FT.orange }}>· {tripsToday}회차</span>
          </div>
          <button onClick={onClose} aria-label="닫기"
            style={{ width: 28, height: 28, lineHeight: 1, borderRadius: 8, border: "2px solid " + FT.ink,
              background: "#fff", color: FT.ink, fontWeight: 700, fontFamily: "'Jua', sans-serif" }}>×</button>
        </div>
        {active && (
          <div style={{ display: "inline-flex", alignItems: "center", gap: 6,
              background: running ? FT.tealSoft : FT.orangeSoft,
              border: "1.5px solid " + (running ? FT.tealDark : FT.orangeDark),
              color: running ? FT.tealDark : FT.orangeDark,
              padding: "4px 10px", borderRadius: 999, fontSize: 11, fontFamily: "'Jua', sans-serif" }}>
            지금 {activeState}: {ROUTES[active.dir].label} {active.idx + 1}회차 ({ROUTES[active.dir].trips[active.idx][0]} 출발)
          </div>
        )}
        {["outbound", "inbound"].map((dir) => (
          <div key={dir} className="space-y-2">
            <div className="flex items-center gap-2">
              <span style={{ background: dir === "outbound" ? FT.orange : FT.teal, color: "#fff",
                border: "1.5px solid " + FT.ink, padding: "2px 10px", borderRadius: 999,
                fontSize: 11, fontFamily: "'Jua', sans-serif", fontWeight: 700,
                display: "inline-flex", alignItems: "center", gap: 4 }}
                aria-label={ROUTES[dir].label}>
                <span aria-hidden style={{ fontSize: 9 }}>{dir === "outbound" ? "▶" : "◀"}</span>
                {ROUTES[dir].label}
              </span>
              <span style={{ fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>{ROUTES[dir].full}</span>
            </div>
            <div className="overflow-x-auto" style={{ border: "2px solid " + FT.ink, borderRadius: 10, background: "#fff" }}>
              <table className="text-[10px]" style={{ borderCollapse: "collapse", fontFamily: "'IBM Plex Mono', monospace" }}>
                <thead>
                  <tr style={{ background: FT.paper, borderBottom: "2px solid " + FT.ink }}>
                    <th className="px-2 py-1.5 whitespace-nowrap"
                      style={{ position: "sticky", left: 0, background: FT.paper, color: FT.ink, fontFamily: "'Jua', sans-serif" }}>회차</th>
                    {ROUTES[dir].stops.map((s, i) => (
                      <th key={i} className="px-2 py-1.5 whitespace-nowrap text-center"
                        style={{ color: FT.ink, fontFamily: "'Jua', sans-serif" }}>{s.name}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {ROUTES[dir].trips.slice(0, tripsToday).map((t, ti) => {
                    const isActive = active && active.dir === dir && active.idx === ti;
                    const rowBg = isActive ? FT.orangeSoft : (ti % 2 ? FT.paper : "#fff");
                    return (
                    <tr key={ti} ref={isActive ? focusRowRef : null} style={{ borderTop: "1px solid #E5E0CE", background: rowBg }}>
                      <td className="px-2 py-1.5 whitespace-nowrap"
                        style={{ color: isActive ? FT.orangeDark : FT.ink, fontWeight: 700,
                          position: "sticky", left: 0, background: rowBg, fontFamily: "'Jua', sans-serif" }}>
                        {isActive ? "▶ " : ""}{ti + 1}회
                      </td>
                      {t.map((time, si) => (
                        <td key={si} className="px-2 py-1.5 text-center whitespace-nowrap"
                          style={{ color: isActive ? FT.orangeDark : (si === 0 || si === t.length - 1 ? FT.ink : FT.inkSoft),
                            fontWeight: isActive || si === 0 || si === t.length - 1 ? 700 : 400 }}>{time}</td>
                      ))}
                    </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        ))}
        <div style={{ fontSize: 10, color: FT.inkSoft, lineHeight: 1.6, fontFamily: "'Jua', sans-serif" }}>
          ※ 6.13.(토) 1~6회차 · 6.14.(일) 1~5회차 운영 · 축제장에서 약 15분 휴식 후 회차 전환
        </div>
      </div>
    </div>
  );
}

/* 전체 수정사항 백업·복원 모달 — localStorage(shuttle:*) 키를 JSON으로 내보내고 다시 적용 */
function BackupModal({ onClose, counts, dateKey }) {
  const SENSITIVE = new Set(["driveremail", "driverpass", "apikey"]);
  const [includeSensitive, setIncludeSensitive] = useState(false);
  const [text, setText] = useState("");
  const [msg, setMsg] = useState("");
  const snapshot = (incl) => {
    const out = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith("shuttle:")) continue;
        const short = k.slice(8);
        if (!incl && SENSITIVE.has(short)) continue;
        out[short] = localStorage.getItem(k);
      }
    } catch (_) {}
    const snap = { version: 1, savedAt: new Date().toISOString(), data: out };
    if (counts && Object.keys(counts).length) snap.counts = { date: dateKey, entries: counts };
    return snap;
  };
  useEffect(() => { setText(JSON.stringify(snapshot(includeSensitive), null, 2)); }, [includeSensitive, counts, dateKey]);
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); setMsg("✅ 클립보드에 복사했어요"); }
    catch (_) { setMsg("복사 실패 — 직접 선택해 복사하세요"); }
  };
  const saveFile = () => {
    try {
      const blob = new Blob([text], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `inmun-bus-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      setMsg("✅ 파일로 저장했어요");
    } catch (_) { setMsg("파일 저장 실패"); }
  };
  const loadFile = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { setText(String(reader.result)); setMsg("파일을 불러왔어요. '복원' 버튼을 누르면 적용됩니다."); };
    reader.readAsText(f);
    e.target.value = "";
  };
  const restore = () => {
    let parsed;
    try { parsed = JSON.parse(text); } catch (_) { setMsg("❌ JSON 형식이 올바르지 않습니다"); return; }
    const obj = parsed && typeof parsed === "object" && parsed.data ? parsed.data : parsed;
    if (!obj || typeof obj !== "object") { setMsg("❌ 데이터가 없습니다"); return; }
    if (!window.confirm("현재 수정사항을 이 백업으로 덮어씁니다. 계속할까요?")) return;
    try {
      Object.entries(obj).forEach(([k, v]) => {
        if (typeof v !== "string") return;
        try { localStorage.setItem("shuttle:" + k, v); } catch (_) {}
      });
      setMsg("✅ 복원했어요. 잠시 후 새로고침됩니다…");
      setTimeout(() => window.location.reload(), 800);
    } catch (_) { setMsg("❌ 복원 실패"); }
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(15,15,18,0.72)" }} onClick={onClose}>
      <div className="w-full max-w-md p-4 space-y-3 max-h-[88vh] overflow-y-auto"
        style={{ background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 16, boxShadow: "4px 4px 0 " + FT.ink }}
        onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div style={{ color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 15 }}>
            수정사항 백업·복원
          </div>
          <button onClick={onClose} aria-label="닫기"
            style={{ width: 28, height: 28, lineHeight: 1, borderRadius: 8, border: "2px solid " + FT.ink,
              background: "#fff", color: FT.ink, fontWeight: 700, fontFamily: "'Jua', sans-serif" }}>×</button>
        </div>
        <div style={{ fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif", lineHeight: 1.6 }}>
          정류장 좌표·안내 멘트·경유점·설정값을 한 번에 저장/복원합니다. 앱 업데이트, 새 기기 이전, 사고 대비용으로 쓰세요.
        </div>
        <label className="flex items-center gap-2" style={{ fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>
          <input type="checkbox" checked={includeSensitive} onChange={(e) => setIncludeSensitive(e.target.checked)} />
          기사 로그인(이메일·비밀번호·API 키)도 포함 <span style={{ color: FT.orange }}>⚠️ 공유 주의</span>
        </label>
        <textarea value={text} onChange={(e) => setText(e.target.value)}
          className="w-full p-2"
          style={{ background: FT.paper, border: "2px solid " + FT.ink, borderRadius: 8, color: FT.ink,
            fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, minHeight: 180, resize: "vertical" }} />
        <div className="grid grid-cols-2 gap-2">
          <button onClick={copy}
            style={{ background: "#fff", color: FT.ink, padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12 }}>복사</button>
          <button onClick={saveFile}
            style={{ background: "#fff", color: FT.ink, padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12 }}>파일로 저장</button>
          <label style={{ background: "#fff", color: FT.ink, padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12, textAlign: "center", cursor: "pointer" }}>
            파일 불러오기
            <input type="file" accept="application/json,.json" onChange={loadFile} style={{ display: "none" }} />
          </label>
          <button onClick={restore}
            style={{ background: FT.orange, color: "#fff", padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12 }}>복원하기</button>
        </div>
        {msg && <div style={{ fontSize: 11, fontFamily: "'Jua', sans-serif",
          color: msg.startsWith("✅") ? FT.tealDark : msg.startsWith("❌") ? "#dc2626" : FT.inkSoft }}>{msg}</div>}
      </div>
    </div>
  );
}

/* 타원 → 폴리곤 좌표 배열로 근사 (n=48개 점) */
function ellipsePolygon(centerLat, centerLng, semiAm, semiBm, rotationDeg, n = 48) {
  const cosLat = Math.cos(centerLat * Math.PI / 180);
  const aDeg = (semiAm || 0) / 111000; // 1 lat 도 ≈ 111km
  const bDeg = (semiBm || 0) / 111000;
  const rot = (rotationDeg || 0) * Math.PI / 180;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * 2 * Math.PI;
    const x = aDeg * Math.cos(t);
    const y = bDeg * Math.sin(t);
    const xr = x * Math.cos(rot) - y * Math.sin(rot);
    const yr = x * Math.sin(rot) + y * Math.cos(rot);
    pts.push([centerLat + yr, centerLng + xr / Math.max(cosLat, 1e-6)]);
  }
  return pts;
}

/* Catmull-Rom 곡선 보간 (닫힌 폴리곤). 다각형 꼭짓점들 사이를 부드러운 곡선으로 채움.
   - points: [[lat, lng], ...] (3개 이상)
   - tension: 0.5 표준 (0=중복없는 직선에 가까움, 1=과한 곡률)
   - steps: 각 segment 사이 보간 점 개수 (12 권장) */
function catmullRomClosed(points, tension = 0.5, steps = 14) {
  if (!Array.isArray(points) || points.length < 3) return points || [];
  const n = points.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    const p0 = points[(i - 1 + n) % n];
    const p1 = points[i];
    const p2 = points[(i + 1) % n];
    const p3 = points[(i + 2) % n];
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      const t2 = t * t, t3 = t2 * t;
      const f0 = -tension * t + 2 * tension * t2 - tension * t3;
      const f1 = 1 + (tension - 3) * t2 + (2 - tension) * t3;
      const f2 = tension * t + (3 - 2 * tension) * t2 + (tension - 2) * t3;
      const f3 = -tension * t2 + tension * t3;
      const lat = f0 * p0[0] + f1 * p1[0] + f2 * p2[0] + f3 * p3[0];
      const lng = f0 * p0[1] + f1 * p1[1] + f2 * p2[1] + f3 * p3[1];
      out.push([lat, lng]);
    }
  }
  return out;
}

/* zone 폴리곤 계산 — 좌표(points) 우선, 없으면 ellipse 폴백.
   points 길이 >= 3 면 다각형으로 사용 · smooth=true 면 곡선 보간 적용. */
function zoneRingLatLngs(zoneData) {
  const pts = Array.isArray(zoneData && zoneData.points) ? zoneData.points.filter(p => Array.isArray(p) && typeof p[0] === "number" && typeof p[1] === "number") : [];
  if (pts.length >= 3) {
    return zoneData.smooth ? catmullRomClosed(pts) : pts;
  }
  // ellipse 폴백
  if (zoneData && typeof zoneData.lat === "number" && typeof zoneData.lng === "number") {
    return ellipsePolygon(zoneData.lat, zoneData.lng,
      typeof zoneData.rA === "number" ? zoneData.rA : 80,
      typeof zoneData.rB === "number" ? zoneData.rB : 80,
      typeof zoneData.rot === "number" ? zoneData.rot : 0);
  }
  return [];
}

/* 운영자 전용 — 오늘 일자 승하차 카운트 통계 모달 (회차별·정류장별 합계 + CSV 추출) */
function StatsModal({ counts, dateKey, onClose, onReset, busCapacity, setBusCapacity, countsEnabled, setCountsEnabled }) {
  const rows = Object.entries(counts).map(([k, v]) => {
    const [dir, trip, stop] = k.split("|");
    return { dir, trip: Number(trip), stop, board: v.board || 0, alight: v.alight || 0 };
  });
  const byTrip = {};
  const byStop = {};
  let totalBoard = 0, totalAlight = 0;
  rows.forEach((r) => {
    const tk = `${r.dir}|${r.trip}`;
    byTrip[tk] = byTrip[tk] || { board: 0, alight: 0 };
    byTrip[tk].board += r.board; byTrip[tk].alight += r.alight;
    const sk = `${r.dir}|${r.stop}`;
    byStop[sk] = byStop[sk] || { board: 0, alight: 0 };
    byStop[sk].board += r.board; byStop[sk].alight += r.alight;
    totalBoard += r.board; totalAlight += r.alight;
  });
  const dirLabel = (d) => d === "outbound" ? "축제장행" : "광장행";
  const tripEntries = Object.entries(byTrip).sort((a, b) => a[0].localeCompare(b[0]));
  const stopEntries = Object.entries(byStop).sort((a, b) => a[0].localeCompare(b[0]));
  const exportCsv = () => {
    const header = "date,direction,trip,stop,board,alight";
    const lines = rows.slice().sort((a, b) =>
      a.dir.localeCompare(b.dir) || a.trip - b.trip || a.stop.localeCompare(b.stop)
    ).map((r) => `${dateKey},${r.dir},${r.trip},"${r.stop}",${r.board},${r.alight}`);
    const csv = [header, ...lines].join("\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `counts-${dateKey}.csv`; a.click();
    URL.revokeObjectURL(url);
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3 max-h-[88vh] overflow-y-auto"
        style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div className="text-sm font-bold" style={{ color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
            오늘 승하차 통계 · {dateKey}
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-amber-400 text-lg leading-none px-1" aria-label="닫기">×</button>
        </div>
        <div className="grid grid-cols-2 gap-2 text-center">
          <div className="rounded-lg p-2" style={{ background: "rgba(34,214,95,0.12)", border: "1px solid rgba(34,214,95,0.3)" }}>
            <div className="text-[10px] text-emerald-400/70" style={{ fontFamily: "'Jua', sans-serif" }}>총 탑승</div>
            <div className="text-2xl font-bold" style={{ color: "#22d65f", fontFamily: "'Black Han Sans', sans-serif" }}>{totalBoard}</div>
          </div>
          <div className="rounded-lg p-2" style={{ background: "rgba(251,146,60,0.12)", border: "1px solid rgba(251,146,60,0.3)" }}>
            <div className="text-[10px]" style={{ color: "#fb923c", opacity: 0.7, fontFamily: "'Jua', sans-serif" }}>총 하차</div>
            <div className="text-2xl font-bold" style={{ color: "#fb923c", fontFamily: "'Black Han Sans', sans-serif" }}>{totalAlight}</div>
          </div>
        </div>
        <div>
          <div className="text-[11px] text-slate-400 mb-1" style={{ fontFamily: "'Jua', sans-serif" }}>회차별 합계</div>
          {tripEntries.length === 0 ? (
            <div className="text-[11px] text-slate-600 text-center py-2">기록 없음</div>
          ) : tripEntries.map(([k, v]) => {
            const [d, t] = k.split("|");
            return (
              <div key={k} className="flex items-center text-xs py-1 border-b border-slate-700">
                <span style={{ color: d === "outbound" ? "#fb923c" : "#22d65f", minWidth: 80 }}>{dirLabel(d)} {t}회차</span>
                <span className="ml-auto text-emerald-400">탑 {v.board}</span>
                <span className="ml-3 text-orange-400">하 {v.alight}</span>
              </div>
            );
          })}
        </div>
        <div>
          <div className="text-[11px] text-slate-400 mb-1" style={{ fontFamily: "'Jua', sans-serif" }}>정류장별 합계</div>
          {stopEntries.length === 0 ? (
            <div className="text-[11px] text-slate-600 text-center py-2">기록 없음</div>
          ) : stopEntries.map(([k, v]) => {
            const [d, stop] = k.split("|");
            return (
              <div key={k} className="flex items-center text-xs py-1 border-b border-slate-700">
                <span style={{ color: d === "outbound" ? "#fb923c" : "#22d65f", minWidth: 80 }}>{dirLabel(d)}</span>
                <span className="text-slate-300 truncate" style={{ flex: 1 }}>{stop}</span>
                <span className="ml-2 text-emerald-400">탑 {v.board}</span>
                <span className="ml-2 text-orange-400">하 {v.alight}</span>
              </div>
            );
          })}
        </div>
        {typeof busCapacity === "number" && setBusCapacity && (
          <div className="flex items-center justify-between gap-2 pt-2 border-t border-slate-700">
            <span className="text-[11px] text-slate-400" style={{ fontFamily: "'Jua', sans-serif" }}>버스 정원 (혼잡도 색 기준)</span>
            <input type="number" min="1" value={busCapacity}
              onChange={(e) => setBusCapacity(Math.max(1, parseInt(e.target.value, 10) || 25))}
              className="w-20 px-2 py-1 rounded text-sm text-right"
              style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1" }} />
          </div>
        )}
        {typeof countsEnabled === "boolean" && setCountsEnabled && (
          <div className="flex items-center justify-between gap-2">
            <span className="text-[11px] text-slate-400" style={{ fontFamily: "'Jua', sans-serif" }}>
              운행 화면 승하차 입력 {countsEnabled ? "" : "(숨김)"}
            </span>
            <button onClick={() => setCountsEnabled(!countsEnabled)}
              className="relative w-12 h-7 rounded-full"
              style={{ background: countsEnabled ? "#22d65f" : "#3a3f54" }}>
              <div className="absolute top-0.5 w-6 h-6 rounded-full bg-white shadow"
                style={{ transform: countsEnabled ? "translateX(22px)" : "translateX(2px)", transition: "transform 0.2s" }} />
            </button>
          </div>
        )}
        <button onClick={exportCsv}
          className="w-full px-3 py-2 rounded-lg text-xs font-bold"
          style={{ background: "#22d65f", color: "#0a0b0f", fontFamily: "'Jua', sans-serif" }}>
          CSV 내려받기
        </button>
        <button onClick={() => {
            if (!window.confirm(`${dateKey} 의 모든 승하차 기록을 초기화합니다. 되돌릴 수 없어요. 계속할까요?`)) return;
            onReset && onReset();
          }}
          className="w-full px-3 py-2 rounded-lg text-[11px] font-bold"
          style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)", fontFamily: "'Jua', sans-serif" }}>
          오늘 기록 초기화
        </button>
      </div>
    </div>
  );
}

  const allZones = (() => {
    const builtinNums = new Set(FESTIVAL_ZONES.map((z) => z.num));
    const ls = LS.getJSON("zones", {});
    const out = FESTIVAL_ZONES.map((z) => {
      const o = ls[z.num] || {};
      return {
        num: z.num,
        title: (typeof o.title === "string" && o.title) ? o.title : z.title,
        sub: (typeof o.sub === "string") ? o.sub : (z.sub || ""),
      };
    });
    Object.entries(ls).forEach(([k, v]) => {
      const n = Number(k);
      if (!Number.isFinite(n) || builtinNums.has(n)) return;
      if (!v || typeof v.lat !== "number") return;
      out.push({ num: n, title: v.title || `구역 ${n}`, sub: v.sub || "" });
    });
    return out.sort((a, b) => a.num - b.num);
  })();

    if (d.getDate() === 14) return "day2";
    return null;
  })();

      return toMin(mm[1]) <= nowMin && nowMin < toMin(mm[2]);

/* 폴리라인 투영 — 정류장 시퀀스를 직선 세그먼트 폴리라인으로 보고 GPS를 수직 투영.
   반환: { ci: 다음 도착 정류장 인덱스, perpDist: 수직 거리(m), routePos: 시작점부터 거리(m) } 또는 null. */
function projectOnRoute(pos, stops) {
  if (!pos || pos.lat == null) return null;
  const cum = [0];
  for (let i = 1; i < stops.length; i++) {
    if (stops[i - 1].lat == null || stops[i].lat == null) { cum.push(cum[i - 1]); continue; }
    cum.push(cum[i - 1] + distanceMeters(stops[i - 1], stops[i]));
  }
  let bestI = -1, bestDist = Infinity, bestT = 0;
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (a.lat == null || b.lat == null) continue;
    const dx = b.lat - a.lat, dy = b.lng - a.lng;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1e-12) continue;
    const t = Math.max(0, Math.min(1, ((pos.lat - a.lat) * dx + (pos.lng - a.lng) * dy) / len2));
    const proj = { lat: a.lat + t * dx, lng: a.lng + t * dy };
    const d = distanceMeters(pos, proj);
    if (d < bestDist) { bestDist = d; bestI = i; bestT = t; }
  }
  if (bestI < 0) return null;
  const segLen = distanceMeters(stops[bestI], stops[bestI + 1]);
  const routePos = cum[bestI] + bestT * segLen;
  // ci = routePos보다 같거나 큰 cum을 가진 첫 정류장(=다음 도착)
  // grace를 50m로 — 정류장 막 지났을 때 ci가 즉시 점프하는 것 방지(운영자 화면과 일관 유지)
  let ci = stops.length - 1;
  for (let i = 0; i < stops.length; i++) {
    if (cum[i] + 50 >= routePos) { ci = i; break; }
  }
  return { ci, perpDist: bestDist, routePos };
}

/* 노선 폴리라인에서 사용자 위치 → 목표 정류장까지의 진행 거리(노선 따라가는 거리).
   직선 거리 대신 도로/노선 곡선을 따라간 실제 주행 거리 근사. approachVia 경유점 반영.
   userPos 가 노선에서 벗어나 있어도 가장 가까운 세그먼트로 투영해 거리 산출. */
function routeDistanceToStop(userPos, dir, stops, targetIdx) {
  if (!userPos || userPos.lat == null) return null;
  if (targetIdx < 0 || targetIdx >= stops.length) return null;
  const target = stops[targetIdx];
  if (target.lat == null) return null;
  const poly = buildRoutePolyline(dir, stops);
  if (poly.length < 2) return null;
  // 폴리라인 각 점까지의 누적 호 길이
  const cum = [0];
  for (let i = 1; i < poly.length; i++) cum.push(cum[i - 1] + distanceMeters(poly[i - 1], poly[i]));
  // userPos 를 가장 가까운 세그먼트에 투영 — 거기까지의 호 길이
  let userArc = -1, userPerp = Infinity;
  for (let i = 0; i < poly.length - 1; i++) {
    const a = poly[i], b = poly[i + 1];
    const dx = b.lat - a.lat, dy = b.lng - a.lng;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1e-12) continue;
    const t = Math.max(0, Math.min(1, ((userPos.lat - a.lat) * dx + (userPos.lng - a.lng) * dy) / len2));
    const proj = { lat: a.lat + t * dx, lng: a.lng + t * dy };
    const d = distanceMeters(userPos, proj);
    if (d < userPerp) {
      userPerp = d;
      userArc = cum[i] + t * (cum[i + 1] - cum[i]);
    }
  }
  if (userArc < 0) return null;
  // 목표 정류장의 폴리라인 위치(가장 가까운 폴리라인 점) 호 길이
  let targetArc = -1, targetBest = Infinity;
  for (let i = 0; i < poly.length; i++) {
    const d = distanceMeters(poly[i], target);
    if (d < targetBest) { targetBest = d; targetArc = cum[i]; }
  }
  if (targetArc < 0) return null;
  return Math.max(0, targetArc - userArc); // 음수(이미 지난 경우) 는 0 으로
}

/* 전체 노선 폴리라인 — 정류장 + approachVia 경유점을 순서대로 합쳐 한 줄로 구성 */
function buildRoutePolyline(dir, stops) {
  const points = [];
  for (let i = 0; i < stops.length; i++) {
    if (i > 0) {
      try {
        const via = effectiveVia(dir, stops[i].name) || [];
        via.forEach((v) => points.push({ lat: v[0], lng: v[1] }));
      } catch (_) {}
    }
    if (stops[i].lat != null) points.push({ lat: stops[i].lat, lng: stops[i].lng });
  }
  return points;
}
/* GPS 좌표를 노선 폴리라인에 수직 투영(가장 가까운 세그먼트). 반환: { snapped, perpDist } 또는 null.
   polyOverride([[lat,lng],...]) 주어지면 그것 사용(OSRM 도로 곡선) — 없으면 정류장+via 직선 폴리라인 fallback */
function snapToRoute(pos, dir, stops, polyOverride) {
  if (!pos || pos.lat == null) return null;
  let poly;
  if (Array.isArray(polyOverride) && polyOverride.length >= 2) {
    poly = polyOverride.map((p) => Array.isArray(p) ? { lat: p[0], lng: p[1] } : p);
  } else {
    poly = buildRoutePolyline(dir, stops);
  }
  if (poly.length < 2) return null;
  let bestDist = Infinity, bestProj = null;
  for (let i = 0; i < poly.length - 1; i++) {
    const a = poly[i], b = poly[i + 1];
    const dx = b.lat - a.lat, dy = b.lng - a.lng;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1e-12) continue;
    const t = Math.max(0, Math.min(1, ((pos.lat - a.lat) * dx + (pos.lng - a.lng) * dy) / len2));
    const proj = { lat: a.lat + t * dx, lng: a.lng + t * dy };
    const d = distanceMeters(pos, proj);
    if (d < bestDist) { bestDist = d; bestProj = proj; }
  }
  return bestProj ? { snapped: bestProj, perpDist: bestDist } : null;
}

/* 두 정류장 사이의 폴리라인(앞 정류장→approachVia 경유점→뒤 정류장) 구성 */
function buildSegmentPolyline(dir, prevStop, curStop) {
  const points = [{ lat: prevStop.lat, lng: prevStop.lng }];
  try {
    const via = effectiveVia(dir, curStop.name) || [];
    via.forEach((v) => points.push({ lat: v[0], lng: v[1] }));
  } catch (_) {}
  points.push({ lat: curStop.lat, lng: curStop.lng });
  return points;
}
/* 도로 폴리라인(osrmPoly: [[lat,lng], ...]) 에서 두 정류장 사이의 arc 추출.
   각 정류장에 가장 가까운 poly 점 인덱스를 찾고, 그 사이 slice 반환. 방향 보정 포함. */
function arcBetweenOnPoly(poly, a, b) {
  if (!Array.isArray(poly) || poly.length < 2 || !a || !b) return null;
  let aIdx = -1, aDist = Infinity, bIdx = -1, bDist = Infinity;
  for (let i = 0; i < poly.length; i++) {
    const p = { lat: poly[i][0], lng: poly[i][1] };
    const da = distanceMeters(p, a); if (da < aDist) { aDist = da; aIdx = i; }
    const db = distanceMeters(p, b); if (db < bDist) { bDist = db; bIdx = i; }
  }
  if (aIdx < 0 || bIdx < 0 || aIdx === bIdx) return null;
  // 너무 멀면(노선이 그 정류장 근처를 통과하지 않으면) 의미 없음
  if (aDist > 200 || bDist > 200) return null;
  const [lo, hi] = aIdx < bIdx ? [aIdx, bIdx] : [bIdx, aIdx];
  const slice = poly.slice(lo, hi + 1);
  if (aIdx > bIdx) slice.reverse();
  return slice;
}

/* 폴리라인의 누적 거리 비율 t(0~1)에 해당하는 좌표를 직선 구간 따라 보간 */
function interpolateAlongPolyline(points, t) {
  if (!points || points.length === 0) return null;
  if (points.length === 1) return points[0];
  const segLens = [];
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    const d = distanceMeters(points[i - 1], points[i]);
    segLens.push(d); total += d;
  }
  if (total < 1e-6) return points[0];
  let target = Math.max(0, Math.min(1, t)) * total;
  for (let i = 0; i < segLens.length; i++) {
    if (target <= segLens[i]) {
      const f = segLens[i] > 0 ? target / segLens[i] : 0;
      return {
        lat: points[i].lat + (points[i + 1].lat - points[i].lat) * f,
        lng: points[i].lng + (points[i + 1].lng - points[i].lng) * f,
      };
    }
    target -= segLens[i];
  }
  return points[points.length - 1];
}

/* 운행 정보(dir/trip/현재 정류장) + 시간 + 대기 플래그 → 보간 위치 + 상태(phase)
   phase: waiting/before/approaching/at/passed/end */
function operationBasedPos(dir, tripIdx, curStopName, nowMin, waiting) {
  const route = ROUTES[dir];
  const sched = route.trips[tripIdx];
  if (!sched) return null;
  const stops = route.stops;
  const i = stops.findIndex((s) => s.name === curStopName);
  if (i < 0) return null;
  const at = (idx, phase) => stops[idx] && stops[idx].lat != null ? { lat: stops[idx].lat, lng: stops[idx].lng, fromName: stops[idx].name, toName: stops[idx].name, phase } : null;
  if (waiting) return at(i, "waiting");
  const tCur = sched[i] ? toMin(sched[i]) : null;
  const tPrev = i > 0 && sched[i - 1] ? toMin(sched[i - 1]) : null;
  const tNext = i < stops.length - 1 && sched[i + 1] ? toMin(sched[i + 1]) : null;
  // 진입 구간(prev → cur) — approachVia 포함 폴리라인 따라 보간
  if (i > 0 && tPrev != null && tCur != null && nowMin < tCur) {
    const prev = stops[i - 1], cur = stops[i];
    if (prev.lat == null || cur.lat == null) return at(i, "approaching");
    const t = Math.max(0, Math.min(1, (nowMin - tPrev) / Math.max(1, tCur - tPrev)));
    const phase = (tCur - nowMin) <= 1 ? "approaching" : "between";
    const p = interpolateAlongPolyline(buildSegmentPolyline(dir, prev, cur), t);
    return { ...p, fromName: prev.name, toName: cur.name, phase };
  }
  // 시발지 출발 시각 전 — 정류장에서 대기
  if (i === 0 && tCur != null && nowMin < tCur) return at(0, "before");
  // 통과 구간(cur → next) — 동일하게 폴리라인 보간
  if (tCur != null && tNext != null && nowMin >= tCur && nowMin <= tNext) {
    const cur = stops[i], nxt = stops[i + 1];
    if (cur.lat == null || nxt.lat == null) return at(i, "passed");
    const t = Math.max(0, Math.min(1, (nowMin - tCur) / Math.max(1, tNext - tCur)));
    const phase = (nowMin - tCur) <= 1 ? "at" : "passed";
    const p = interpolateAlongPolyline(buildSegmentPolyline(dir, cur, nxt), t);
    return { ...p, fromName: cur.name, toName: nxt.name, phase };
  }
  // 종점 또는 다음 정류장도 지나간 경우 — 가장 근접한 정류장에 고정
  if (i === stops.length - 1) return at(i, "end");
  return at(i, "at");
}

/* 시간표 기반 버스 추정 위치 — 운행 중 회차의 두 정류장 사이를 시간 비율로 보간.
   osrmPoly 가 주어지면 OSRM 도로 곡선 arc 를 따라 보간 → 라이브 버스(snapToRoute) 와 동일하게 곡선 이동. */
function scheduledBusPos(dir, tripIdx, nowMin, osrmPoly) {
  const route = ROUTES[dir];
  const sched = route.trips[tripIdx];
  if (!sched) return null;
  const startMin = toMin(sched[0]);
  const endMin = toMin(sched[sched.length - 1]);
  if (nowMin < startMin || nowMin > endMin) return null;
  for (let i = 0; i < sched.length - 1; i++) {
    const a = toMin(sched[i]), b = toMin(sched[i + 1]);
    if (nowMin >= a && nowMin <= b) {
      const sa = route.stops[i], sb = route.stops[i + 1];
      if (sa.lat == null || sb.lat == null) return null;
      const t = b > a ? (nowMin - a) / (b - a) : 0;
      let p = null;
      // 1) OSRM 도로 곡선 arc 기반 보간 (가장 정확 — 도로 따라 이동)
      if (osrmPoly) {
        try {
          const arc = arcBetweenOnPoly(osrmPoly, sa, sb);
          if (arc && arc.length >= 2) {
            p = interpolateAlongPolyline(arc.map((q) => ({ lat: q[0], lng: q[1] })), t);
          }
        } catch (_) {}
      }
      // 2) approachVia 폴리라인 보간 (수동 경유점)
      if (!p) {
        try {
          const poly = buildSegmentPolyline(dir, sa, sb);
          p = interpolateAlongPolyline(poly, t);
        } catch (_) {}
      }
      // 3) 정류장 직선 보간 폴백
      if (!p || typeof p.lat !== "number") {
        p = { lat: sa.lat + (sb.lat - sa.lat) * t, lng: sa.lng + (sb.lng - sa.lng) * t };
      }
      return {
        lat: p.lat, lng: p.lng,
        fromName: sa.name, toName: sb.name,
        nearIdx: t < 0.5 ? i : i + 1,
      };
    }
  }
  return null;
}

/* 두 점 사이의 거리(평면 근사). 짧은 거리에선 충분 */
const distLL = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
/* 점 P가 선분 AB에 떨어진 거리 — 가장 가까운 구간 찾기 */
const pointSegDist = (p, a, b) => {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  if (dx === 0 && dy === 0) return distLL(p, a);
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy)));
  return distLL(p, [a[0] + t * dx, a[1] + t * dy]);
};
/* 정류장의 approachVia 효과값 — localStorage 오버라이드 우선, 없으면 코드 기본값 */
const effectiveVia = (dir, stopName) => {
  const userVia = LS.getJSON("viapoints", {});
  const key = `${dir}|${stopName}`;
  if (key in userVia) return userVia[key];
  const s = ROUTES[dir].stops.find((x) => x.name === stopName);
  return s && Array.isArray(s.approachVia) ? s.approachVia : [];
};

/* P1-2: 운영자 공지/재난 안내 편집기 — /notice 노드에 PUT, 승객 페이지 상단에 빨간/노란 띠로 표시 */
function NoticeEditor({ onClose, dbUrl, getAuth, refreshAuth }) {
  const [cur, setCur] = useState(null);
  const [msg, setMsg] = useState("");
  const [level, setLevel] = useState("warn"); // info|warn|danger
  const [text, setText] = useState("");
  const [active, setActive] = useState(true);
  const [status, setStatus] = useState("");
  useEffect(() => {
    if (!dbUrl) return;
    const base = dbUrl.replace(/\/+$/, "");
    fetch(`${base}/notice.json`).then((r) => r.json()).then((d) => {
      if (d && typeof d === "object") {
        setCur(d);
        setText(d.message || "");
        setLevel(d.level || "warn");
        setActive(d.active !== false);
      }
    }).catch(() => {});
  }, [dbUrl]);
  const put = async (tok, body) => {
    const base = dbUrl.replace(/\/+$/, "");
    const auth = tok ? `?auth=${encodeURIComponent(tok)}` : "";
    return fetch(`${base}/notice.json${auth}`, { method: "PUT", body: JSON.stringify(body) });
  };
  const save = async (publish) => {
    const body = { message: text.trim(), level, active: !!publish, ts: Date.now() };
    if (publish && !body.message) { setStatus("⚠ 공지 내용을 입력하세요"); return; }
    if (!dbUrl) { setStatus("⚠ DB 주소 없음 — 고급 설정에서 Firebase DB 주소를 먼저 입력하세요"); return; }
    const initialTok = getAuth && getAuth();
    if (!initialTok && !refreshAuth) {
      setStatus("⚠ 쓰기 로그인 미설정 — 고급 설정에서 기사 이메일·비밀번호 입력 후 위치 공유를 한 번 켜 토큰을 받아오세요");
      return;
    }
    setStatus("저장 중…");
    try {
      let r = await put(initialTok, body);
      if ((r.status === 401 || r.status === 403) && refreshAuth) {
        setStatus("인증 갱신 중…");
        const tok = await refreshAuth();
        if (tok) r = await put(tok, body);
        else { setStatus("⚠ 쓰기 로그인 실패 — 기사 이메일·비밀번호 확인 후 다시 시도하세요"); return; }
      }
      if (r.ok) { setStatus(publish ? "✅ 공지 발송 — 전 승객 화면 상단에 표시됨" : "✅ 공지 해제됨"); setCur(body); setActive(!!publish); }
      else if (r.status === 401 || r.status === 403) {
        let detail = "";
        try { const j = await r.json(); detail = j && j.error ? " · " + j.error : ""; } catch (_) {}
        setStatus(`⚠ 권한 없음 (HTTP ${r.status})${detail} — RTDB rules 에 /notice 쓰기 권한이 있는 UID(/admins 또는 driver) 인지 확인하세요`);
      }
      else {
        let body2 = "";
        try { body2 = await r.text(); } catch (_) {}
        setStatus(`⚠ Firebase 응답 ${r.status}${body2 ? " · " + body2.slice(0, 80) : ""}`);
      }
    } catch (e) { setStatus(`⚠ 네트워크 오류 · ${e && e.message ? e.message : ""}`); }
  };
  const presets = [
    { label: "🌧 우천 지연", lv: "warn", t: "우천으로 셔틀 운행이 지연되고 있습니다. 잠시만 기다려 주세요." },
    { label: "🚧 노선 변경", lv: "warn", t: "교통 통제로 일부 노선이 변경되었습니다. 안내방송을 확인해 주세요." },
    { label: "⛔ 운행 중단", lv: "danger", t: "안전상의 이유로 셔틀 운행이 일시 중단되었습니다. 추후 안내 드리겠습니다." },
    { label: "ⓘ 정상 운행", lv: "info", t: "셔틀이 정상 운행 중입니다." },
  ];
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3 max-h-[92vh] overflow-y-auto"
        style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div className="text-sm font-bold" style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
            📢 공지·재난 안내
          </div>
          <button onClick={onClose} className="text-slate-400 text-lg leading-none px-1" aria-label="닫기">×</button>
        </div>
        <div className="text-[10px] text-slate-500">
          모든 승객 화면 상단에 빨간/노란 띠로 표시됩니다. 새 공지는 ts 가 갱신돼 이전에 닫은 사용자에게도 다시 나타납니다.
        </div>
        {cur && cur.active && (
          <div className="text-[10px]" style={{ color: "#22d65f" }}>
            ● 현재 표시 중: <span style={{ color: "#cbd5e1" }}>{cur.message}</span>
          </div>
        )}
        <div className="grid grid-cols-4 gap-1">
          {presets.map((p) => (
            <button key={p.label} onClick={() => { setText(p.t); setLevel(p.lv); }}
              className="px-1.5 py-1 rounded text-[10px]"
              style={{ background: "#1c2030", color: "#cbd5e1", border: "1px solid #3a3f54", fontFamily: "'Jua', sans-serif" }}>
              {p.label}
            </button>
          ))}
        </div>
        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={4}
          placeholder="공지 내용을 입력하세요"
          className="w-full px-2 py-1.5 rounded text-[12px]"
          style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }} />
        <div className="flex items-center gap-2 text-[11px]" style={{ fontFamily: "'Jua', sans-serif" }}>
          <span style={{ color: "#94a3b8" }}>중요도</span>
          {[{ v: "info", t: "정보", c: "#fb923c" }, { v: "warn", t: "경고", c: "#f59e0b" }, { v: "danger", t: "위험", c: "#dc2626" }].map((o) => (
            <button key={o.v} onClick={() => setLevel(o.v)}
              className="px-2 py-0.5 rounded font-bold"
              style={{ background: level === o.v ? o.c : "rgba(255,255,255,0.04)", color: level === o.v ? "#fff" : "#cbd5e1",
                border: "1px solid " + (level === o.v ? o.c : "#3a3f54") }}>
              {o.t}
            </button>
          ))}
        </div>
        {status && <div className="text-[11px]" style={{ color: status.startsWith("✅") ? "#22d65f" : status.startsWith("⚠") ? "#fca5a5" : "#fbbf24" }}>{status}</div>}
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => save(false)}
            className="px-3 py-2 rounded-lg text-xs font-bold"
            style={{ background: "rgba(100,116,139,0.18)", color: "#cbd5e1", border: "1px solid #3a3f54", fontFamily: "'Jua', sans-serif" }}>
            공지 해제
          </button>
          <button onClick={() => save(true)}
            className="px-3 py-2 rounded-lg text-xs font-bold"
            style={{ background: "#dc2626", color: "#fff", fontFamily: "'Jua', sans-serif" }}>
            발송
          </button>
        </div>
      </div>
    </div>
  );
}

    "error_sticker_save": "오류: 스티커 저장 실패",
  };
  const labelEv = (k) => EVENT_LABELS[k] || k;
  /* 디바이스 카테고리 (parseUaCategory) → 사용자 친화 라벨 */
  const DEVICE_LABELS = {
    "ios.safari.mobile": "iPhone · Safari",
    "ios.chrome.mobile": "iPhone · Chrome",
    "ios.firefox.mobile": "iPhone · Firefox",
    "ios.edge.mobile": "iPhone · Edge",
    "android.chrome.mobile": "Android · Chrome",
    "android.samsung.mobile": "Samsung Browser",
    "android.firefox.mobile": "Android · Firefox",
    "android.edge.mobile": "Android · Edge",
    "android.other.mobile": "Android · 기타",
    "windows.chrome.desktop": "Windows · Chrome (PC)",
    "windows.edge.desktop": "Windows · Edge (PC)",
    "windows.firefox.desktop": "Windows · Firefox (PC)",
    "mac.safari.desktop": "Mac · Safari",
    "mac.chrome.desktop": "Mac · Chrome",
    "mac.firefox.desktop": "Mac · Firefox",
    "linux.chrome.desktop": "Linux · Chrome",
    "linux.firefox.desktop": "Linux · Firefox",
    "unknown": "알 수 없음",
  };
  const labelDevice = (k) => DEVICE_LABELS[k] || k;
  const fetchDate = async (d) => {
    if (!d) return null;
    const base = dbUrl.replace(/\/+$/, "");
    const tryFetch = async (tok) => {
      const auth = tok ? `?auth=${encodeURIComponent(tok)}` : "";
      return fetch(`${base}/stats/${encodeURIComponent(d)}/sessions.json${auth}`, { cache: "no-store" });
    };
    const t0 = getAuth && getAuth();
    let r = await tryFetch(t0);
    if ((r.status === 401 || r.status === 403) && refreshAuth) {
      setStatus("인증 갱신 중…");
      const t1 = await refreshAuth();
      if (t1) r = await tryFetch(t1);
    }
    if (!r.ok) {
      throw new Error(r.status === 401 || r.status === 403
        ? `권한 없음 (HTTP ${r.status}) — admin/driver 계정 필요`
        : `응답 ${r.status}`);
    }
    const j = await r.json();
    return j && typeof j === "object" ? j : {};
  };
  const load = async () => {
    if (!dbUrl) { setStatus("⚠ DB 주소 없음"); return; }
    setLoading(true); setStatus("로드 중…"); setSessionsA(null); setSessionsB(null);
    try {
      const a = await fetchDate(dateA);
      setSessionsA(a);
      if (dateB) { const b = await fetchDate(dateB); setSessionsB(b); }
      setStatus("");
    } catch (e) { setStatus(`⚠ ${e && e.message ? e.message : "네트워크 오류"}`); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [dateA, dateB, dbUrl]);
  /* 단일 일자 집계 — 새 샤드 스키마(sessions/{sid}/flushes/{flushTs}) 와 기존 직접 스키마(sessions/{sid}=ev) 모두 처리 */
  const aggregate = (sessions) => {
    if (!sessions) return null;
    const evSum = {};
    const hourly = Array(24).fill(0);
    const byCat = {};
    let durSum = 0;
    let total = 0;
    Object.values(sessions).forEach((s) => {
      if (!s || typeof s !== "object") return;
      // 새 스키마: flushes 안에 여러 sub-record. 합산.
      if (s.flushes && typeof s.flushes === "object") {
        const flushes = Object.values(s.flushes).filter(Boolean);
        if (flushes.length === 0) return;
        total++;
        let minStart = Infinity, maxTs = 0, cat = null;
        flushes.forEach((f) => {
          if (typeof f.startedAt === "number") minStart = Math.min(minStart, f.startedAt);
          if (typeof f.ts === "number") maxTs = Math.max(maxTs, f.ts);
          if (!cat && typeof f.cat === "string") cat = f.cat;
          Object.entries(f.ev || {}).forEach(([k, v]) => { evSum[k] = (evSum[k] || 0) + (Number(v) || 0); });
        });
        if (minStart < Infinity && maxTs > 0) durSum += Math.max(0, maxTs - minStart);
        if (minStart < Infinity) {
          const h = new Date(minStart).getHours();
          if (h >= 0 && h < 24) hourly[h]++;
        }
        byCat[cat || "unknown"] = (byCat[cat || "unknown"] || 0) + 1;
      } else if (s.ev && typeof s.ev === "object") {
        // 기존 스키마(레거시 데이터) — 직접 ev 사용
        total++;
        if (typeof s.durMs === "number") durSum += s.durMs;
        if (typeof s.startedAt === "number") {
          const h = new Date(s.startedAt).getHours();
          if (h >= 0 && h < 24) hourly[h]++;
        }
        const c = typeof s.cat === "string" ? s.cat : "unknown";
        byCat[c] = (byCat[c] || 0) + 1;
        Object.entries(s.ev).forEach(([k, v]) => { evSum[k] = (evSum[k] || 0) + (Number(v) || 0); });
      }
    });
    const avgDurMin = total > 0 ? Math.round(durSum / total / 60000 * 10) / 10 : 0;
    // 이벤트 prefix 별 그룹화
    const byEvCat = {};
    Object.entries(evSum).forEach(([k, v]) => {
      const cat = k.split("_")[0] || "etc";
      if (!byEvCat[cat]) byEvCat[cat] = [];
      byEvCat[cat].push([k, v]);
    });
    Object.values(byEvCat).forEach((arr) => arr.sort((a, b) => b[1] - a[1]));
    return { total, avgDurMin, byEvCat, evSum, hourly, byDevice: byCat };
  };
  const aggA = aggregate(sessionsA);
  const aggB = aggregate(sessionsB);
  const csv = () => {
    if (!aggA) return "";
    const meta = [
      `# 사용 통계 export`,
      `# 날짜 A: ${dateA} · 총세션: ${aggA.total} · 평균: ${aggA.avgDurMin}분`,
      aggB ? `# 날짜 B: ${dateB} · 총세션: ${aggB.total} · 평균: ${aggB.avgDurMin}분` : null,
      `# 생성: ${new Date().toISOString()}`,
      "category,label,key,count_A,count_B",
    ].filter(Boolean);
    const allKeys = new Set([...Object.keys(aggA.evSum), ...(aggB ? Object.keys(aggB.evSum) : [])]);
    const csvSafe = (s) => `"${String(s).replace(/"/g, '""')}"`;
    const rows = [...allKeys].sort().map((k) => {
      const cat = k.split("_")[0] || "etc";
      const a = aggA.evSum[k] || 0;
      const b = aggB ? (aggB.evSum[k] || 0) : "";
      return `${cat},${csvSafe(labelEv(k))},${k},${a},${b}`;
    });
    return [...meta, ...rows].join("\n");
  };
  const downloadCsv = () => {
    const blob = new Blob([csv()], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `usage-${dateA}${dateB ? "-vs-" + dateB : ""}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const deleteDate = async () => {
    if (!window.confirm(`${dateA} 의 모든 세션 데이터를 삭제할까요? 되돌릴 수 없어요.`)) return;
    setStatus("삭제 중…");
    const base = dbUrl.replace(/\/+$/, "");
    const tryDel = async (tok) => {
      const auth = tok ? `?auth=${encodeURIComponent(tok)}` : "";
      return fetch(`${base}/stats/${encodeURIComponent(dateA)}.json${auth}`, { method: "DELETE" });
    };
    try {
      const t0 = getAuth && getAuth();
      if (!t0 && !refreshAuth) { setStatus("⚠ 쓰기 인증 토큰 없음 — 연결 탭에서 기사 로그인 후 다시 시도"); return; }
      let r = await tryDel(t0);
      if ((r.status === 401 || r.status === 403) && refreshAuth) {
        setStatus("인증 갱신 중…");
        const t = await refreshAuth();
        if (t) r = await tryDel(t);
      }
      if (r.ok) { setStatus("✅ 삭제 완료"); load(); }
      else if (r.status === 401 || r.status === 403) {
        let detail = "";
        try { const j = await r.json(); detail = j && j.error ? " · " + j.error : ""; } catch (_) {}
        setStatus(`⚠ 권한 없음 (HTTP ${r.status})${detail} — Firebase 콘솔에 database.rules.json 게시했는지 확인 + admin/driver UID 등록 확인`);
      }
      else setStatus(`⚠ 실패 (HTTP ${r.status})`);
    } catch (e) { setStatus(`⚠ ${e && e.message ? e.message : "네트워크 오류"}`); }
  };
  const HourBar = ({ hourly, color }) => {
    const max = Math.max(1, ...hourly);
    return (
      <div className="grid grid-cols-12 gap-x-1 gap-y-2 text-[9px]" style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#94a3b8" }}>
        {hourly.map((v, h) => {
          const pct = max > 0 ? Math.round((v / max) * 100) : 0;
          return (
            <div key={h} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }} title={`${h}시 · ${v}세션`}>
              <div style={{ width: "100%", height: 36, background: "#0a0b0f", border: "1px solid #2c3142", borderRadius: 3, position: "relative", overflow: "hidden" }}>
                <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: `${pct}%`, background: color, opacity: 0.85 }} />
              </div>
              <div>{String(h).padStart(2, "0")}</div>
            </div>
          );
        })}
      </div>
    );
  };
  const Block = ({ agg, label, color }) => {
    if (!agg) return null;
    return (
      <div className="space-y-3">
        <div className="grid grid-cols-3 gap-2">
          <div className="p-2 rounded-lg text-center" style={{ background: `${color}1a`, border: `1px solid ${color}55` }}>
            <div className="text-[10px]" style={{ color: color, fontFamily: "'Jua', sans-serif" }}>세션</div>
            <div className="text-lg font-bold" style={{ color: color, fontFamily: "'Jua', sans-serif" }}>{agg.total}</div>
          </div>
          <div className="p-2 rounded-lg text-center" style={{ background: `${color}14`, border: `1px solid ${color}55` }}>
            <div className="text-[10px]" style={{ color: color, fontFamily: "'Jua', sans-serif" }}>평균</div>
            <div className="text-lg font-bold" style={{ color: color, fontFamily: "'Jua', sans-serif" }}>{agg.avgDurMin}분</div>
          </div>
          <div className="p-2 rounded-lg text-center" style={{ background: `${color}14`, border: `1px solid ${color}55` }}>
            <div className="text-[10px]" style={{ color: color, fontFamily: "'Jua', sans-serif" }}>이벤트</div>
            <div className="text-lg font-bold" style={{ color: color, fontFamily: "'Jua', sans-serif" }}>{Object.values(agg.evSum).reduce((a, b) => a + b, 0)}</div>
          </div>
        </div>
        {/* 시간대 분포 */}
        {agg.total > 0 && (
          <div className="rounded-lg" style={{ background: "rgba(255,255,255,0.04)", border: "1px solid #2c3142", padding: "8px 10px" }}>
            <div className="text-[11px] mb-2" style={{ color: color, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
              시간대 분포 · {label}
            </div>
            <HourBar hourly={agg.hourly} color={color} />
          </div>
        )}
        {/* 디바이스 카테고리 */}
        {agg.total > 0 && Object.keys(agg.byDevice).length > 0 && (
          <div className="rounded-lg" style={{ background: "rgba(255,255,255,0.04)", border: "1px solid #2c3142", padding: "8px 10px" }}>
            <div className="text-[11px] mb-1.5" style={{ color: color, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
              디바이스
            </div>
            <div className="space-y-0.5">
              {Object.entries(agg.byDevice).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) => (
                <div key={k} className="flex items-center justify-between text-[11px]">
                  <span style={{ color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }} title={k}>{labelDevice(k)}</span>
                  <span style={{ color: color, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{v}</span>
                </div>
              ))}
            </div>
          </div>
        )}
        {/* 이벤트 카테고리 */}
        {Object.keys(agg.byEvCat).sort().map((cat) => (
          <div key={cat} className="rounded-lg" style={{ background: "rgba(255,255,255,0.04)", border: "1px solid #2c3142", padding: "8px 10px" }}>
            <div className="text-[11px] mb-1.5" style={{ color: color, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
              {catLabels[cat] || cat} <span style={{ color: "#94a3b8", fontWeight: 400 }}>({agg.byEvCat[cat].length})</span>
            </div>
            <div className="space-y-0.5">
              {agg.byEvCat[cat].slice(0, 12).map(([k, v]) => (
                <div key={k} className="flex items-center justify-between text-[11px]">
                  <span className="truncate" style={{ color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }} title={k}>{labelEv(k)}</span>
                  <span style={{ color: color, fontFamily: "'Jua', sans-serif", fontWeight: 700, marginLeft: 8 }}>{v}</span>
                </div>
              ))}
              {agg.byEvCat[cat].length > 12 && (
                <div className="text-[10px] text-slate-500 text-center">… 외 {agg.byEvCat[cat].length - 12}건</div>
              )}
            </div>
          </div>
        ))}
        {agg.total === 0 && (
          <div className="text-[11px] text-slate-500 text-center py-4">데이터 없음</div>
        )}
      </div>
    );
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div className={"w-full rounded-2xl border-2 p-4 space-y-3 max-h-[92vh] overflow-y-auto " + (dateB ? "max-w-2xl" : "max-w-md")}
        style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div className="text-sm font-bold" style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
            사용 통계 {dateB ? `· ${dateA} vs ${dateB}` : `· ${dateA}`}
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-amber-400 text-lg leading-none px-1" aria-label="닫기">×</button>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <div className="flex items-center gap-1">
            <span className="text-[10px]" style={{ color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>A</span>
            <input type="date" value={dateA} onChange={(e) => setDateA(e.target.value)}
              className="px-2 py-1.5 rounded text-xs"
              style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
          </div>
          <div className="flex items-center gap-1">
            <span className="text-[10px]" style={{ color: "#fb923c", fontFamily: "'Jua', sans-serif" }}>B</span>
            <input type="date" value={dateB} onChange={(e) => setDateB(e.target.value)}
              placeholder="비교(선택)"
              className="px-2 py-1.5 rounded text-xs"
              style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
            {dateB && (
              <button onClick={() => setDateB("")} className="text-[10px] px-1.5" style={{ color: "#94a3b8" }} title="비교 해제">×</button>
            )}
          </div>
          <button onClick={load} disabled={loading}
            className="px-3 py-1.5 rounded text-xs font-bold"
            style={{ background: "rgba(96,165,250,0.15)", color: "#60a5fa", border: "1px solid rgba(96,165,250,0.4)", fontFamily: "'Jua', sans-serif" }}>
            새로고침
          </button>
          {aggA && aggA.total > 0 && (
            <button onClick={downloadCsv}
              className="px-3 py-1.5 rounded text-xs font-bold"
              style={{ background: "rgba(34,214,95,0.15)", color: "#22d65f", border: "1px solid rgba(34,214,95,0.4)", fontFamily: "'Jua', sans-serif" }}>
              CSV
            </button>
          )}
          {aggA && (
            <button onClick={deleteDate}
              className="px-3 py-1.5 rounded text-xs font-bold ml-auto"
              style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)", fontFamily: "'Jua', sans-serif" }}
              title={`${dateA} 데이터 삭제 (보관 정책 — 30일 권장)`}>
              {dateA} 삭제
            </button>
          )}
        </div>
        <div className="text-[10px] text-slate-500 leading-relaxed">
          익명 카운트만 (좌표·풀 UA·언어 비수집). 세션 = 브라우저 탭 한 번 열림 단위.
          세션 1건 = 최소 '진입 화면 view' + '종료 직전 화면' 2 이벤트 (탭 이동·기능 사용마다 추가). 권장 보관 30일.
          <br/>v3 샤드 패턴 — 클라이언트가 신규 이벤트만 송신. 일자 삭제 시 활성 세션이 재기록 안 함.
        </div>
        {status && <div className="text-[11px]" style={{ color: status.startsWith("⚠") ? "#fca5a5" : status.startsWith("✅") ? "#22d65f" : "#fbbf24" }}>{status}</div>}
        {dateB ? (
          <div className="grid grid-cols-2 gap-3">
            <Block agg={aggA} label={dateA} color="#22d65f" />
            <Block agg={aggB} label={dateB} color="#fb923c" />
          </div>
        ) : (
          <Block agg={aggA} label={dateA} color="#22d65f" />
        )}
      </div>
    </div>
  );
}

/* 라이브 지도 스티커 편집기 — 운영자 전용. 부적절 콘텐츠 개별 삭제 + 만료 일괄 정리. */
/* 시연·테스트 모드 (FAKE) 운영자 진입 UI — URL 파라미터 대신 모달에서 날짜/시간/가속배율 입력
   적용 시 LS 저장 + 페이지 리로드 → 모든 화면이 가짜 시각으로 동작
   행사 당일 실수 방지 — 적용 전 큰 경고 + 상단 칩(b340)으로 시각 표시 강제 */
/* 정류장별 안내 타이밍 설정 — 방향×정류장 매트릭스에서 enter/arrive/pass/기본 선택.
   기본 타이밍과 다른 값으로 설정한 정류장만 LS 에 저장(공간 절약 + 명시적). */
function StopTimingEditor({ onClose, stopTimings, setStopTimings, defaultTiming }) {
  const opts = [
    { v: "", lbl: "기본", color: "#64748b" },
    { v: "enter", lbl: "진입", color: "#22d65f" },
    { v: "arrive", lbl: "도착", color: "#60a5fa" },
    { v: "pass", lbl: "통과", color: "#fbbf24" },
  ];
  const setTiming = (dir, name, v) => {
    const key = `${dir}|${name}`;
    setStopTimings((prev) => {
      const next = { ...prev };
      if (!v) delete next[key]; else next[key] = v;
      return next;
    });
  };
  const resetAll = () => {
    if (!window.confirm("정류장별 타이밍 오버라이드를 모두 초기화할까요? (기본 타이밍으로 복귀)")) return;
    setStopTimings({});
  };
  const DirBlock = ({ dir, label }) => (
    <div>
      <div className="text-[12px] font-bold mb-1.5" style={{ color: dir === "outbound" ? "#fb923c" : "#5eead4", fontFamily: "'Jua', sans-serif" }}>
        {label}
      </div>
      <div className="space-y-1.5">
        {ROUTES[dir].stops.map((s) => {
          const k = `${dir}|${s.name}`;
          const cur = stopTimings[k] || "";
          return (
            <div key={k} className="flex items-center gap-2">
              <div className="text-[11px] flex-1 truncate" style={{ color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }}>
                {s.name}
              </div>
              <div className="flex gap-0.5 flex-shrink-0">
                {opts.map((o) => (
                  <button key={o.v} onClick={() => setTiming(dir, s.name, o.v)}
                    className="px-1.5 py-0.5 rounded text-[10px] font-bold"
                    style={{ background: cur === o.v ? o.color : "rgba(100,116,139,0.08)",
                      color: cur === o.v ? "#0a0b0f" : o.color,
                      border: `1px solid ${cur === o.v ? o.color : "rgba(100,116,139,0.2)"}`,
                      fontFamily: "'Jua', sans-serif" }}>
                    {o.lbl}
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div className="w-full max-w-lg rounded-2xl border-2 p-4 space-y-3 max-h-[92vh] overflow-y-auto"
        style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div className="text-sm font-bold" style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
            📋 정류장별 안내 타이밍
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-amber-400 text-lg leading-none px-1" aria-label="닫기">×</button>
        </div>
        <div className="text-[10px] leading-relaxed" style={{ color: "#94a3b8" }}>
          정류장 도착마다 어느 시점에 안내가 발화될지 개별 지정. <b style={{ color: "#fbbf24" }}>기본</b> = 자동 탭 기본 타이밍(<b>{defaultTiming === "enter" ? "진입" : defaultTiming === "arrive" ? "도착" : "통과"}</b>) 사용.
          <br />
          <b style={{ color: "#22d65f" }}>진입</b> 반경 진입 즉시 · <b style={{ color: "#60a5fa" }}>도착</b> 30m 안+저속 · <b style={{ color: "#fbbf24" }}>통과</b> 반경 벗어난 직후
        </div>
        <DirBlock dir="outbound" label="🟧 축제장 방향" />
        <DirBlock dir="inbound" label="🟦 민주광장 방향" />
        <div className="grid grid-cols-2 gap-2 pt-2">
          <button onClick={resetAll}
            className="px-3 py-2 rounded-lg text-xs font-bold"
            style={{ background: "rgba(100,116,139,0.18)", color: "#cbd5e1", border: "1px solid #3a3f54", fontFamily: "'Jua', sans-serif" }}>
            전체 초기화

          <button onClick={onClose}
            className="px-3 py-2 rounded-lg text-xs font-bold"
            style={{ background: "#fbbf24", color: "#0a0b0f", fontFamily: "'Jua', sans-serif" }}>
            닫기

        </div>
      </div>

  );
}

function StickerEditor({ onClose, dbUrl, getAuth, refreshAuth }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [status, setStatus] = useState("");
  const STICKER_TTL_MS = 2 * 60 * 60 * 1000;
  const reload = async () => {
    if (!dbUrl) { setStatus("⚠ DB 주소 없음"); setLoading(false); return; }
    setLoading(true);
    try {
      const base = dbUrl.replace(/\/+$/, "");
      const r = await fetch(`${base}/stickers.json`, { cache: "no-store" });
      const d = await r.json();
      const arr = Object.entries(d || {})
        .filter(([, s]) => s && typeof s.lat === "number" && typeof s.lng === "number" && typeof s.ts === "number")
        .map(([id, s]) => ({ id, ...s }))
        .sort((a, b) => b.ts - a.ts);
      setItems(arr);
      setStatus("");
    } catch (e) { setStatus(`⚠ 로드 실패 · ${e && e.message ? e.message : ""}`); }
    setLoading(false);
  };
  useEffect(() => { reload(); }, [dbUrl]);
  const callDelete = async (path) => {
    const base = dbUrl.replace(/\/+$/, "");
    const tok0 = getAuth && getAuth();
    const tryOnce = (tok) => {
      const auth = tok ? `?auth=${encodeURIComponent(tok)}` : "";
      return fetch(`${base}${path}.json${auth}`, { method: "DELETE" });
    };
    if (!tok0 && !refreshAuth) return { ok: false, status: 401, body: "인증 토큰 없음" };
    let r = await tryOnce(tok0);
    if ((r.status === 401 || r.status === 403) && refreshAuth) {
      const tok2 = await refreshAuth();
      if (tok2) r = await tryOnce(tok2);
    }
    return r;
  };
  const removeOne = async (id) => {
    if (!window.confirm("이 스티커를 삭제할까요?")) return;
    setStatus("삭제 중…");
    try {
      const r = await callDelete(`/stickers/${encodeURIComponent(id)}`);
      if (r.ok) { setStatus("✅ 삭제 완료"); reload(); }
      else { setStatus(`⚠ 삭제 실패 (HTTP ${r.status})`); }
    } catch (e) { setStatus(`⚠ ${e && e.message ? e.message : "네트워크 오류"}`); }
  };
  const sweepExpired = async () => {
    const cutoff = Date.now() - STICKER_TTL_MS;
    const dead = items.filter((it) => it.ts < cutoff);
    if (dead.length === 0) { setStatus("✅ 만료된 스티커가 없어요"); return; }
    if (!window.confirm(`만료된 스티커 ${dead.length}개를 정리할까요?`)) return;
    setStatus("정리 중…");
    let ok = 0, fail = 0;
    for (const it of dead) {
      try { const r = await callDelete(`/stickers/${encodeURIComponent(it.id)}`); if (r.ok) ok++; else fail++; }
      catch (_) { fail++; }
    }
    setStatus(`✅ 정리 완료 — 성공 ${ok}건${fail ? ` · 실패 ${fail}건` : ""}`);
    reload();
  };
  const wipeAll = async () => {
    if (items.length === 0) { setStatus("스티커가 없어요"); return; }
    if (!window.confirm(`전체 스티커 ${items.length}개를 삭제할까요? 되돌릴 수 없어요.`)) return;
    setStatus("전체 삭제 중…");
    try {
      const r = await callDelete(`/stickers`);
      if (r.ok) { setStatus("✅ 전체 삭제 완료"); reload(); }
      else { setStatus(`⚠ 실패 (HTTP ${r.status})`); }
    } catch (e) { setStatus(`⚠ ${e && e.message ? e.message : "네트워크 오류"}`); }
  };
  const now = Date.now();
  const expiredCount = items.filter((it) => it.ts < now - STICKER_TTL_MS).length;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3 max-h-[92vh] overflow-y-auto"
        style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div className="text-sm font-bold" style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
            지도 스티커 관리 · {items.length}건 {expiredCount > 0 && <span style={{ color: "#94a3b8", fontWeight: 400 }}>(만료 {expiredCount})</span>}
          </div>
          <button onClick={onClose} className="text-slate-400 text-lg leading-none px-1" aria-label="닫기">×</button>
        </div>
        <div className="text-[10px] text-slate-500 leading-relaxed">
          누구나 라이브 지도에 남긴 이모지 스티커 목록입니다. 부적절 콘텐츠는 즉시 삭제하고, 행사 후 일괄 정리하세요. 클라이언트는 2시간 초과 항목을 자동 숨김.
        </div>
        <div className="grid grid-cols-2 gap-2">
          <button onClick={sweepExpired} disabled={loading}
            style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
