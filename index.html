                <span className="text-xs" style={{
                  color: ttsStatus === "ready" ? "#22d65f" : ttsStatus === "no-korean" ? "#fbbf24"
                    : (ttsStatus === "unsupported" || ttsStatus === "error") ? "#fca5a5" : "#94a3b8",
                  fontFamily: "'Jua', sans-serif" }}>
                  {ttsStatus === "ready" ? "음성 사용 가능"
                    : ttsStatus === "no-korean" ? "한국어 음성 없음"
                    : ttsStatus === "unsupported" ? "음성 미지원"
                    : ttsStatus === "error" ? "음성 오류" : "음성 확인 중…"}
                </span>
              </div>
              <button onClick={testVoice} disabled={ttsStatus === "unsupported"}
                className="text-xs px-2 py-1 rounded-md disabled:opacity-30"
                style={{ background: "rgba(34, 214, 95, 0.15)", color: "#22d65f",
                  border: "1px solid rgba(34, 214, 95, 0.3)", fontFamily: "'Jua', sans-serif" }}>
                🔊 테스트
              </button>
            </div>
            {voices.filter(v => v.lang.startsWith("ko")).length > 1 && (
              <select value={selectedVoiceURI || ""} onChange={(e) => setSelectedVoiceURI(e.target.value)}
                className="w-full px-2 py-1.5 rounded text-xs"
                style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1" }}>
                {voices.filter(v => v.lang.startsWith("ko")).map(v => (
                  <option key={v.voiceURI} value={v.voiceURI}>
                    {v.name} {v.localService ? "· 기기 내장" : "· 온라인"}
                  </option>
                ))}
              </select>
            )}
            <button onClick={openMentBackup}
              className="mt-2 w-full py-1.5 rounded text-[11px] flex items-center justify-center gap-1"
              style={{ background: "rgba(34,214,95,0.12)", color: "#22d65f", border: "1px solid rgba(34,214,95,0.3)",
                fontFamily: "'Jua', sans-serif" }}>
              안내 멘트 편집·백업·복원
            </button>
          </div>

          {/* 실시간 위치 공유 */}
          <div className="pt-2 border-t space-y-2" style={{ borderColor: "#3a3f54" }}>
            <div className="text-xs font-bold" style={{ color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }}>실시간 위치 공유</div>
            <input type="text" value={shareUrl} onChange={(e) => setShareUrl(e.target.value)}
              placeholder="Firebase DB 주소 (https://...firebasedatabase.app)"
              className="w-full px-2 py-1.5 rounded text-[11px]"
              style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
            <div className="flex items-center gap-2">
              <label className="text-[11px] text-slate-400">버스 번호</label>
              <input type="text" value={busId} onChange={(e) => setBusId(e.target.value)}
                className="w-16 px-2 py-1 rounded text-[11px]"
                style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
              <button onClick={() => { if (!shareUrl) { setGpsError("먼저 DB 주소를 입력하세요"); return; } if (!sharing && !autoMode) primeTTS(); setSharing(!sharing); }}
                disabled={!shareUrl}
                className="flex-1 py-1.5 rounded text-[11px] font-bold disabled:opacity-40"
                style={{ background: sharing ? "#22d65f" : "rgba(34,214,95,0.12)", color: sharing ? "#0a0b0f" : "#22d65f",
                  border: "1px solid rgba(34,214,95,0.3)", fontFamily: "'Jua', sans-serif" }}>
                {sharing ? "● 위치 공유 중 (끄기)" : "내 위치 공유 시작"}
              </button>
            </div>
            <button onClick={() => setManualWaiting((v) => !v)} disabled={!sharing}
              className="w-full py-1.5 rounded text-[11px] font-bold disabled:opacity-40"
              style={{ background: manualWaiting ? "#60a5fa" : "rgba(96,165,250,0.12)", color: manualWaiting ? "#0a0b0f" : "#60a5fa",
                border: "1px solid rgba(96,165,250,0.3)", fontFamily: "'Jua', sans-serif" }}>
              {manualWaiting ? "🅿️ 출발 대기 표시 중 (해제)" : "🅿️ 출발 대기 표시"}
            </button>
            <input type="email" value={driverEmail} onChange={(e) => setDriverEmail(e.target.value)}
              placeholder="(선택) 기사 로그인 이메일 — 비워두면 테스트 모드"
              autoComplete="off"
              className="w-full px-2 py-1.5 rounded text-[11px]"
              style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
            <input type="password" value={driverPass} onChange={(e) => setDriverPass(e.target.value)}
              placeholder="(선택) 기사 로그인 비밀번호"
              autoComplete="off"
              className="w-full px-2 py-1.5 rounded text-[11px]"
              style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
            <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)}
              placeholder="(선택) 웹 API 키 — 콘솔 프로젝트 설정에서 복사"
              autoComplete="off"
              className="w-full px-2 py-1.5 rounded text-[11px]"
              style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
            <button onClick={testLogin}
              className="w-full py-1.5 rounded text-[11px] font-bold"
              style={{ background: "rgba(96,165,250,0.15)", color: "#60a5fa", border: "1px solid rgba(96,165,250,0.3)", fontFamily: "'Jua', sans-serif" }}>
              쓰기 로그인 테스트 · UID 확인
            </button>
            {authStatus && <div className="text-[10px] break-all" style={{ color: authStatus.startsWith("✅") ? "#22d65f" : authStatus.startsWith("❌") ? "#f87171" : "#94a3b8" }}>{authStatus}</div>}
            <div className="text-[10px] text-slate-600">GPS 자동이 켜져 있어야 위치가 올라갑니다. 로그인을 채우면 승객은 읽기만 가능(쓰기 차단). 비우면 테스트 모드로 동작합니다.</div>
            <div className="text-[10px] text-slate-600">기사 화면 재진입: 주소 끝에 <span style={{ color: "#fbbf24", fontFamily: "'IBM Plex Mono', monospace" }}>?admin=1</span> 붙여 북마크하거나, 승객 화면 제목을 7번 탭하세요.</div>
            {shareUrl && (() => {
              const norm = (s) => s.replace(/\/+$/, "");
              const baked = SHARE_DB && norm(shareUrl) === norm(SHARE_DB);
              const purl = baked
                ? `${location.origin}${location.pathname}`
                : `${location.origin}${location.pathname}?db=${encodeURIComponent(shareUrl)}`;
              return (
                <div className="flex items-center gap-2 pt-1">
                  <img alt="QR" width="72" height="72" style={{ borderRadius: 6, background: "#fff", padding: 2 }}
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(purl)}`} />
                  <div className="flex-1 min-w-0">
                    <div className="text-[10px] text-slate-500 mb-1">{baked ? "승객용 안내 링크 (기본 화면)" : "승객용 링크 (DB 주소 포함)"}</div>
                    {!baked && <div className="text-[10px] text-amber-500/70 mb-1 leading-tight">코드의 SHARE_DB에 같은 주소를 넣고 배포하면 링크가 깔끔해집니다.</div>}
                    <button onClick={() => { try { navigator.clipboard.writeText(purl); setGpsError(""); } catch (_) {} }}
                      className="w-full py-1.5 rounded text-[11px] font-bold"
                      style={{ background: "rgba(251,191,36,0.15)", color: "#fbbf24", border: "1px solid rgba(251,191,36,0.3)", fontFamily: "'Jua', sans-serif" }}>
                      📋 승객 링크 복사
                    </button>
                    <a href={purl} target="_blank" rel="noopener noreferrer"
                      className="block text-center mt-1 text-[10px] underline" style={{ color: "#22d65f" }}>지도 미리보기</a>
                  </div>
                </div>
              );
            })()}
          </div>
        </div>

        {/* Controls */}
        <div className="rounded-b-3xl px-5 py-5 border-2 border-t-0 flex items-center justify-center gap-3"
          style={{ background: "linear-gradient(180deg, #1c1f2b 0%, #13151c 100%)", borderColor: "#3a3f54" }}>
          <button onClick={prev} disabled={currentIdx === 0}
            className="w-12 h-12 rounded-full flex items-center justify-center disabled:opacity-30"
            style={{ background: "rgba(251, 191, 36, 0.1)", border: "1px solid rgba(251, 191, 36, 0.3)", color: "#fbbf24" }}>
            <SkipBack size={18} />
          </button>
          <button onClick={isAnnouncing ? stopAnnounce : announce}
            className="w-20 h-20 rounded-full flex items-center justify-center relative"
            style={{
              background: isAnnouncing ? "linear-gradient(135deg, #ef4444 0%, #dc2626 100%)"
                : "linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%)",
              boxShadow: isAnnouncing ? "0 0 30px rgba(239, 68, 68, 0.6)" : "0 0 30px rgba(251, 191, 36, 0.5)",
              color: "#0a0b0f" }}>
            {isAnnouncing ? <Pause size={28} /> : <Volume2 size={28} />}
            {isAnnouncing && (<div className="absolute inset-0 rounded-full animate-ping"
              style={{ background: "rgba(239, 68, 68, 0.4)" }} />)}
          </button>
          <button onClick={next} disabled={currentIdx >= stops.length - 1}
            className="w-12 h-12 rounded-full flex items-center justify-center disabled:opacity-30"
            style={{ background: "rgba(251, 191, 36, 0.1)", border: "1px solid rgba(251, 191, 36, 0.3)", color: "#fbbf24" }}>
            <SkipForward size={18} />
          </button>
        </div>

        <div className="text-center mt-4 text-[10px] text-slate-600 tracking-wider leading-relaxed"
          style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
          {currentIdx + 1} / {stops.length} STOPS · TRIP {tripIdx + 1}/{tripsToday} · {autoMode ? "GPS AUTO" : "MANUAL"}
          <div className="text-slate-500 mt-1">※ 6.13.(토) 1~6회차 · 6.14.(일) 1~5회차 운영</div>
        </div>
      </div>

      {showTimetable && <TimetableModal tripsToday={tripsToday} onClose={() => setShowTimetable(false)} />}

      {/* 멘트 편집·백업·복원 모달 */}
      {mentBackup !== null && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
          style={{ background: "rgba(0,0,0,0.7)" }} onClick={() => setMentBackup(null)}>
          <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3"
            style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <div className="text-sm font-bold" style={{ color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                안내 멘트 편집·백업·복원
              </div>
              <button onClick={() => setMentBackup(null)} className="text-slate-400 hover:text-amber-400 text-lg leading-none px-1">×</button>
            </div>
            <div className="text-[11px] text-slate-500">
              환영·홍보·하차·프로그램(일정 포함) 멘트입니다. 문구를 직접 고친 뒤 <b>불러오기</b>를 누르면 적용·저장됩니다. 복사·파일로 다른 기기와 공유할 수 있어요.
            </div>
            <textarea value={mentBackup} onChange={(e) => setMentBackup(e.target.value)}
              spellCheck={false} rows={10}
              className="w-full px-2 py-2 rounded text-[11px]"
              style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1",
                fontFamily: "'IBM Plex Mono', monospace", resize: "vertical" }} />
            {mentMsg && <div className="text-[11px]" style={{ color: "#fbbf24" }}>{mentMsg}</div>}
            <div className="grid grid-cols-2 gap-2">
              <button onClick={copyMent}
                className="px-3 py-2 rounded-lg text-xs font-bold"
                style={{ background: "rgba(251,191,36,0.15)", color: "#fbbf24", border: "1px solid rgba(251,191,36,0.3)" }}>
                📋 복사
              </button>
              <button onClick={downloadMent}
                className="px-3 py-2 rounded-lg text-xs font-bold"
                style={{ background: "rgba(251,191,36,0.15)", color: "#fbbf24", border: "1px solid rgba(251,191,36,0.3)" }}>
                💾 파일 저장
              </button>
              <label className="px-3 py-2 rounded-lg text-xs font-bold text-center cursor-pointer"
                style={{ background: "rgba(100,116,139,0.15)", color: "#94a3b8", border: "1px solid #3a3f54" }}>
                📂 파일 열기
                <input type="file" accept="application/json,.json" className="hidden"
                  onChange={(e) => uploadMent(e.target.files && e.target.files[0])} />
              </label>
              <button onClick={applyMent}
                className="px-3 py-2 rounded-lg text-xs font-bold"
                style={{ background: "#22d65f", color: "#0a0b0f", fontFamily: "'Jua', sans-serif" }}>
                ⬇ 불러오기
              </button>
            </div>
            <button onClick={resetMent}
              className="w-full py-1.5 rounded-lg text-[11px]"
              style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)" }}>
              기본 멘트로 되돌리기
            </button>
          </div>
        </div>
      )}

      {/* 좌표 백업·복원 모달 */}
      {backup !== null && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
          style={{ background: "rgba(0,0,0,0.7)" }} onClick={() => setBackup(null)}>
          <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3"
            style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <div className="text-sm font-bold" style={{ color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                정류장 좌표 백업·복원
              </div>
              <button onClick={() => setBackup(null)} className="text-slate-400 hover:text-amber-400 text-lg leading-none px-1">×</button>
            </div>
            <div className="text-[11px] text-slate-500">
              아래 좌표를 복사해 다른 기기에 붙여넣거나, 파일로 저장·불러올 수 있습니다. 붙여넣은 뒤 <b>불러오기</b>를 누르면 적용됩니다.
            </div>
            <textarea value={backup} onChange={(e) => setBackup(e.target.value)}
              spellCheck={false} rows={8}
              className="w-full px-2 py-2 rounded text-[11px]"
              style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1",
                fontFamily: "'IBM Plex Mono', monospace", resize: "vertical" }} />
            {backupMsg && <div className="text-[11px]" style={{ color: "#fbbf24" }}>{backupMsg}</div>}
            <div className="grid grid-cols-2 gap-2">
              <button onClick={copyBackup}
                className="px-3 py-2 rounded-lg text-xs font-bold"
                style={{ background: "rgba(251,191,36,0.15)", color: "#fbbf24", border: "1px solid rgba(251,191,36,0.3)" }}>
                📋 복사
              </button>
              <button onClick={downloadBackup}
                className="px-3 py-2 rounded-lg text-xs font-bold"
                style={{ background: "rgba(251,191,36,0.15)", color: "#fbbf24", border: "1px solid rgba(251,191,36,0.3)" }}>
                💾 파일 저장
              </button>
              <label className="px-3 py-2 rounded-lg text-xs font-bold text-center cursor-pointer"
                style={{ background: "rgba(100,116,139,0.15)", color: "#94a3b8", border: "1px solid #3a3f54" }}>
                📂 파일 열기
                <input type="file" accept="application/json,.json" className="hidden"
                  onChange={(e) => uploadBackup(e.target.files && e.target.files[0])} />
              </label>
              <button onClick={applyBackup}
                className="px-3 py-2 rounded-lg text-xs font-bold"
                style={{ background: "#22d65f", color: "#0a0b0f", fontFamily: "'Jua', sans-serif" }}>
                ⬇ 불러오기
              </button>
            </div>
            <button onClick={resetCoords}
              className="w-full py-1.5 rounded-lg text-[11px]"
              style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)" }}>
              기본 좌표로 초기화
            </button>
          </div>
        </div>
      )}

      {/* Coordinate editor modal — map + manual input */}
      {editing && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
          style={{ background: "rgba(0,0,0,0.7)" }} onClick={() => setEditing(null)}>
          <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3"
            style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <div className="text-sm font-bold" style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
                {stops[editing.idx]?.name} 위치 설정
                <span className="text-[10px] text-slate-500 ml-2">{route.label}</span>
              </div>
              <button onClick={() => setEditing(null)} className="text-slate-400 hover:text-amber-400 text-lg leading-none px-1">×</button>
            </div>
            <div className="text-[11px] text-slate-500">지도를 탭하거나 핀을 끌어 위치를 지정하세요. <span style={{ color: "#22d65f" }}>초록 원</span>은 자동 안내가 시작되는 반경({triggerRadius}m)입니다.</div>
            <MapPicker lat={parseFloat(editing.lat) || 35.130} lng={parseFloat(editing.lng) || 126.940}
              radius={triggerRadius}
              onPick={(la, ln) => setEditing(e => ({ ...e, lat: la, lng: ln }))} />
            <div className="flex gap-2">
              <div className="flex-1">
                <label className="text-[10px] text-slate-400">위도(lat)</label>
                <input type="number" step="0.0001" value={editing.lat}
                  onChange={(e) => setEditing(p => ({ ...p, lat: e.target.value }))}
                  className="w-full px-2 py-1.5 rounded text-xs"
                  style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
              </div>
              <div className="flex-1">
                <label className="text-[10px] text-slate-400">경도(lng)</label>
                <input type="number" step="0.0001" value={editing.lng}
                  onChange={(e) => setEditing(p => ({ ...p, lng: e.target.value }))}
                  className="w-full px-2 py-1.5 rounded text-xs"
                  style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
              </div>
            </div>
            <div className="flex gap-2 pt-1">
              {userPos && (
                <button onClick={() => setEditing(p => ({ ...p, lat: userPos.lat, lng: userPos.lng }))}
                  className="px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1"
                  style={{ background: "rgba(34, 214, 95, 0.15)", color: "#22d65f", border: "1px solid rgba(34, 214, 95, 0.3)" }}>
                  <Crosshair size={12} /> 현재 GPS
                </button>
              )}
              <button onClick={() => setEditing(null)}
                className="flex-1 px-3 py-2 rounded-lg text-xs"
                style={{ background: "rgba(100, 116, 139, 0.15)", color: "#94a3b8", border: "1px solid #3a3f54" }}>
                취소
              </button>
              <button onClick={saveCoordEditor}
                className="flex-1 px-3 py-2 rounded-lg text-xs font-bold"
                style={{ background: "#fbbf24", color: "#0a0b0f", fontFamily: "'Jua', sans-serif" }}>
                저장
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Root() {
  const params = new URLSearchParams(window.location.search);
  const [admin, setAdmin] = useState(params.get("admin") === "1");
  if (admin) return <App />;                                            // 운영자(히든) — ?admin=1 또는 제목 7번 탭
  if (params.get("view") === "map") return <LiveMapView dbUrl={params.get("db") || SHARE_DB} />; // 지도 직접 링크(호환)
  return <PassengerView dbUrl={params.get("db") || SHARE_DB} onAdmin={() => setAdmin(true)} />;  // 기본: 승객 뷰
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
<script>
  /* 서비스워커 미등록(캐시 문제로 제거). 기존에 설치된 옛 서비스워커가 있으면
     업데이트를 강제해 자폭 sw.js로 교체 → 캐시 비우고 등록 해제되도록 한다. */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then((regs) => regs.forEach((r) => r.update()))
      .catch(() => {});
  }
</script>
</body>
</html>
