  return (
    <div className="w-full p-3 sm:p-5 flex flex-col items-center"
      style={{ height: "100dvh", overflow: "hidden", background: FT.paper,
        backgroundImage: "radial-gradient(circle at 15% -10%, rgba(22,168,158,0.18), transparent 45%), radial-gradient(circle at 85% 110%, rgba(238,107,46,0.14), transparent 45%)" }}>
      <div className="w-full max-w-md flex flex-col" style={{ flex: 1, minHeight: 0 }}>
        <div className="flex flex-col" style={{ flex: 1, minHeight: 0, background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 18, boxShadow: "4px 4px 0 " + FT.ink, overflow: "hidden" }}>
          {/* header — 상태 칩만 우상단 절대 위치로 압축, 슬로건/부제는 기존 그대로 */}
          <div style={{ padding: "16px 18px 14px 18px", borderBottom: "2.5px solid " + FT.ink, background: "#fff", display: "flex", gap: 14, alignItems: "flex-start", position: "relative" }}>
            <button onClick={() => { setVenueZone(0); setTab("venue"); }}
              aria-label="행사장 안내로 — 스위치 켜기"
              title="스위치 켜기 → 행사장 안내"
              style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", flexShrink: 0, lineHeight: 0 }}>
              <FestivalLogo size={44} />
            </button>
            <div style={{ flex: 1, minWidth: 0, paddingRight: 20 }}>
              <div style={{ fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>생각을 끄고, 생각을 켜다</div>
              <div style={{ fontSize: 14, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, marginTop: 2 }}>제4회 동구 무등산 인문축제</div>
              <div onClick={onTitleTap} className="select-none"
                style={{ fontSize: 22, color: FT.orange, fontFamily: "'Jua', sans-serif", fontWeight: 700, lineHeight: 1.15, marginTop: 4 }}>
                &lt;무등생각&gt; 셔틀버스 안내
              </div>
            </div>
            <div title={statusText} role="status" aria-live="polite" aria-label={statusText}
              className={live.length > 0 ? "animate-pulse" : ""}
              style={{ position: "absolute", top: 12, right: 12, width: 12, height: 12, borderRadius: "50%",
                background: conn === "error" ? "#B91C1C" : live.length > 0 ? FT.teal : FT.mute,
                border: "1.5px solid " + FT.ink, boxShadow: "1px 1px 0 " + FT.ink }} />
          </div>


          {/* body */}
          <div className="space-y-3" style={{ background: FT.paper, padding: 12, flex: 1, minHeight: 0, overflowY: "auto" }}>
            {/* P1-2: 운영자 공지/재난 띠 — 새 공지가 오면 상단에 빨간/노란 배너 */}
            {showNotice && (() => {
              const lv = notice.level || "info";
              const bg = lv === "danger" ? "#dc2626" : lv === "warn" ? "#f59e0b" : FT.orange;
              const ic = lv === "danger" ? "⛔" : lv === "warn" ? "⚠" : "ⓘ";
              return (
                <div role="alert" aria-live="assertive"
                  style={{ background: bg, color: "#fff", border: "2px solid " + FT.ink, borderRadius: 10,
                    padding: "9px 12px", display: "flex", alignItems: "flex-start", gap: 8,
                    boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif" }}>
                  <span style={{ fontSize: 18, lineHeight: "20px", flexShrink: 0 }}>{ic}</span>
                  <div style={{ fontSize: 13, fontWeight: 700, flex: 1, lineHeight: 1.35, whiteSpace: "pre-wrap" }}>{notice.message}</div>
                  <button onClick={dismissNotice} aria-label="공지 닫기"
                    style={{ background: "rgba(255,255,255,0.25)", border: "1.5px solid #fff", color: "#fff",
                      width: 28, height: 28, borderRadius: 6, fontSize: 14, fontWeight: 700, flexShrink: 0, cursor: "pointer" }}>×</button>
                </div>
              );
            })()}
            {live.length === 0 ? (
              <div className="py-2 space-y-2">
                <div style={{ textAlign: "center", color: FT.inkSoft, fontFamily: "'Jua', sans-serif", fontSize: 13, lineHeight: 1.5, marginBottom: 6 }}>
                  {conn === "error" ? "연결을 확인하는 중입니다…"
                    : schedActive ? "📡 라이브 신호 없음 · 아래 시간표 기준 운행 중"
                    : "지금은 운행 중인 셔틀이 없어요."}
                </div>
                <div style={{ fontSize: 11, color: FT.inkSoft, paddingLeft: 4, fontFamily: "'Jua', sans-serif" }}>다음 출발 예정</div>
                {["outbound", "inbound"].map((dir) => {
                  const nd = nextDep(dir);
                  const c = dir === "outbound" ? FT.orange : FT.teal;
                  const mins = nd ? toMin(nd.time) - nowMin : null;
                  const clickable = !!nd;
                  return (
                    <button key={dir} type="button" disabled={!clickable}
                      onClick={clickable ? () => openTableAt(dir, nd.idx) : undefined}
                      aria-label={clickable ? `${ROUTES[dir].label} ${nd.idx + 1}회차 시간표 보기` : `${ROUTES[dir].label} 운행 종료`}
                      style={{ display: "block", width: "100%", textAlign: "left", font: "inherit",
                        background: "#fff", border: "2px solid " + FT.ink, borderRadius: 12,
                        padding: "10px 12px 10px 14px", boxShadow: "2px 2px 0 " + FT.ink,
                        borderLeft: `8px solid ${c}`, cursor: clickable ? "pointer" : "default" }}>
                      <div className="flex items-center gap-2" style={{ marginBottom: 4 }}>
                        <span style={{ fontSize: 11, color: c, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{ROUTES[dir].label}</span>
                        {nd && <span style={{ marginLeft: "auto", fontSize: 10, color: FT.mute, fontFamily: "'Jua', sans-serif" }}>{nd.idx + 1}회차 →</span>}
                      </div>
                      <div className="flex items-baseline" style={{ gap: 10 }}>
                        <span style={{ fontSize: 24, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, lineHeight: 1, fontFamily: "'IBM Plex Mono', monospace" }}>
                          {nd ? nd.time : "—"}
                        </span>
                        <span style={{ fontSize: 13, color: c, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
                          {nd ? (mins > 0 ? `약 ${mins}분 후` : "잠시 후") : "운행 종료"}
                        </span>
                      </div>
                      <div style={{ fontSize: 10, color: FT.mute, marginTop: 4, fontFamily: "'Jua', sans-serif" }}>
                        {ROUTES[dir].full}
                      </div>
                    </button>
                  );
                })}
              </div>
            ) : (
              <React.Fragment>
                {/* 컴팩트 다음 출발 안내 — 항상 한 줄로 노출 */}
                {(() => {
                  const ndOut = nextDep("outbound");
                  const ndIn = nextDep("inbound");
                  if (!ndOut && !ndIn) {
                    return (
                      <div style={{ padding: "6px 10px", background: FT.paper, border: "1.5px solid " + FT.mute + "66", borderRadius: 8,
                        fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif", fontWeight: 700, textAlign: "center" }}>
                        마지막 회차 운행 중
                      </div>
                    );
                  }
                  const part = (nd, dir, c, arrow) => nd ? (
                    <button type="button" onClick={() => openTableAt(dir, nd.idx)}
                      aria-label={`${ROUTES[dir].label} ${nd.idx + 1}회차 시간표`}
                      style={{ display: "inline-flex", alignItems: "center", gap: 4, fontFamily: "'Jua', sans-serif",
                        background: "transparent", border: "none", padding: "2px 4px", borderRadius: 6, cursor: "pointer" }}>
                      <span style={{ color: c, fontWeight: 700, fontSize: 11 }}>{arrow}</span>
                      <span style={{ color: FT.ink, fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 12 }}>{nd.time}</span>
                      <span style={{ color: c, fontSize: 11 }}>({Math.max(0, toMin(nd.time) - nowMin)}분)</span>
                    </button>
                  ) : (
                    <span style={{ color: FT.mute, fontSize: 11, fontFamily: "'Jua', sans-serif" }}>{arrow} 종료</span>
                  );
                  return (
                    <div className="flex items-center gap-3" style={{ padding: "6px 10px", background: FT.paper, border: "1.5px solid " + FT.mute + "66", borderRadius: 8, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 10, color: FT.inkSoft, fontFamily: "'Jua', sans-serif", fontWeight: 700, flexShrink: 0 }}>다음 출발</span>
                      {part(ndOut, "outbound", FT.orange, "↗")}
                      {part(ndIn, "inbound", FT.teal, "↙")}
                    </div>
                  );
                })()}
                {live.map(([id, b]) => <BusCard key={id} id={id} bus={b} agoText={agoText} nowMin={nowMin} tripsToday={tripsToday} departedInfo={getDepartedInfo(id, b)} />)}
              </React.Fragment>
            )}

            {/* 시간표상 운행 중인 셔틀 — 라이브 데이터 없어도 시각표에 따라 진행 추정
                A8: 회차 사이 휴식(15분) / 점심휴식(1시간 40분) 갭 동안 "휴식 중" 카드 표시 */}
            {(() => {
              const liveSet = new Set(live.map(([, b]) => `${b.dir === "inbound" ? "inbound" : "outbound"}|${b.trip || 1}`));
              const items = [];
              const seen = new Set(); // dir|trip# — 중복 표시 방지
              // 1) 운행 중 카드
              ["outbound", "inbound"].forEach((dir) => {
                for (let ti = 0; ti < tripsToday; ti++) {
                  const key = `${dir}|${ti + 1}`;
                  if (liveSet.has(key)) continue;
                  const pos = scheduledBusPos(dir, ti, nowMin);
                  if (!pos) continue;
                  const sched = ROUTES[dir].trips[ti];
                  const startMin = toMin(sched[0]);
                  const endMin = toMin(sched[sched.length - 1]);
                  const dur = endMin - startMin;
                  const progress = dur > 0 ? Math.max(0, Math.min(1, (nowMin - startMin) / dur)) : 0;
                  let nextIdx = -1;
                  for (let i = 0; i < sched.length; i++) { if (toMin(sched[i]) > nowMin) { nextIdx = i; break; } }
                  const nextStopName = nextIdx >= 0 ? ROUTES[dir].stops[nextIdx]?.name : null;
                  const nextSchedAt = nextIdx >= 0 ? sched[nextIdx] : null;
                  const mins = nextSchedAt ? (toMin(nextSchedAt) - nowMin) : null;
                  items.push({ kind: "running", dir, ti, pos, sched, progress, route: ROUTES[dir], nextStopName, nextSchedAt, mins });
                  seen.add(key);
                }
              });
              // 2) 휴식 카드 — outbound n 종착 → inbound n 출발 (축제장 휴식)
              for (let ti = 0; ti < tripsToday; ti++) {
                const ob = ROUTES.outbound.trips[ti], ib = ROUTES.inbound.trips[ti];
                if (!ob || !ib) continue;
                const obEnd = toMin(ob[ob.length - 1]);
                const ibStart = toMin(ib[0]);
                if (obEnd >= ibStart) continue;
                if (nowMin >= obEnd && nowMin < ibStart) {
                  const key = `inbound|${ti + 1}`;
                  if (liveSet.has(key) || seen.has(key)) continue;
                  items.push({ kind: "resting", dir: "inbound", ti, route: ROUTES.inbound,
                    terminus: "축제장", startTime: ib[0], minsLeft: ibStart - nowMin, sched: ib });
                  seen.add(key);
                }
              }
              // 3) 휴식 카드 — inbound n 종착 → outbound n+1 출발 (즉시 환승 또는 점심휴식 1시간 40분)
              for (let ti = 0; ti < tripsToday; ti++) {
                const ib = ROUTES.inbound.trips[ti], nob = ROUTES.outbound.trips[ti + 1];
                if (!ib || !nob) continue;
                const ibEnd = toMin(ib[ib.length - 1]);
                const nobStart = toMin(nob[0]);
                if (ibEnd >= nobStart) continue;
                if (nowMin >= ibEnd && nowMin < nobStart) {
                  const key = `outbound|${ti + 2}`;
                  if (liveSet.has(key) || seen.has(key)) continue;
                  const minsLeft = nobStart - nowMin;
                  items.push({ kind: "resting", dir: "outbound", ti: ti + 1, route: ROUTES.outbound,
                    terminus: "5·18민주광장", startTime: nob[0], minsLeft,
                    long: minsLeft >= 60, sched: nob });
                  seen.add(key);
                }
              }
              if (items.length === 0) return null;
              return (
                <div style={{ marginTop: live.length > 0 ? 8 : 12 }}>
                  <div className="flex items-center justify-between mb-2">
                    <div style={{ fontSize: 12, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
                      🕒 시간표상 운행 중 <span style={{ color: FT.orange }}>· {items.length}대</span>
                    </div>
                    <div style={{ fontSize: 10, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>
                      {live.length === 0 ? "라이브 신호 없음 — 시각표 기준" : "라이브에 없는 회차"}
                    </div>
                  </div>
                  <div className="space-y-2">
                    {items.map((it) => {
                      const c = it.dir === "outbound" ? FT.orange : FT.teal;
                      if (it.kind === "resting") {
                        return (
                          <div key={`rest|${it.dir}|${it.ti}`}
                            style={{ background: "#fff", border: "2px dashed " + FT.ink, borderRadius: 12,
                              padding: "9px 11px 9px 13px", borderLeft: "8px solid " + FT.mute,
                              boxShadow: "1.5px 1.5px 0 " + FT.ink, opacity: 0.95 }}>
                            <div className="flex items-center gap-2" style={{ marginBottom: 4 }}>
                              <span style={{ fontSize: 10, padding: "1px 6px", borderRadius: 4, background: FT.mute, color: "#fff",
                                fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>🅿 휴식</span>
                              <span style={{ fontSize: 11, color: c, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{it.route.label}</span>
                              <span style={{ fontSize: 10, color: FT.mute, fontFamily: "'Jua', sans-serif" }}>{it.ti + 1}회차 출발 대기</span>
                              <span style={{ marginLeft: "auto", fontSize: 10, color: FT.mute, fontFamily: "'IBM Plex Mono', monospace" }}>
                                {it.startTime} 출발
                              </span>
                            </div>
                            <div style={{ fontSize: 13, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
                              {it.terminus}에서 {it.long ? "점심휴식 중" : "휴식 중"}
                            </div>
                            <div style={{ fontSize: 11, color: FT.inkSoft, marginTop: 2, fontFamily: "'Jua', sans-serif" }}>
                              다음 출발 <b style={{ color: c }}>{it.startTime}</b>
                              <span style={{ color: c, marginLeft: 4 }}>({it.minsLeft > 0 ? `약 ${it.minsLeft}분 후` : "잠시 후"})</span>
                            </div>
                          </div>
                        );
                      }
                      return (
                        <div key={`${it.dir}|${it.ti}`}
                          style={{ background: "#fff", border: "2px dashed " + FT.ink, borderRadius: 12,
                            padding: "9px 11px 9px 13px", borderLeft: "8px solid " + c,
                            boxShadow: "1.5px 1.5px 0 " + FT.ink }}>
                          <div className="flex items-center gap-2" style={{ marginBottom: 4 }}>
                            <span style={{ fontSize: 10, padding: "1px 6px", borderRadius: 4, background: c, color: "#fff",
                              fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>예정</span>
                            <span style={{ fontSize: 11, color: c, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{it.route.label}</span>
                            <span style={{ fontSize: 10, color: FT.mute, fontFamily: "'Jua', sans-serif" }}>{it.ti + 1}회차</span>
                            <span style={{ marginLeft: "auto", fontSize: 10, color: FT.mute, fontFamily: "'IBM Plex Mono', monospace" }}>
                              {it.sched[0]}~{it.sched[it.sched.length - 1]}
                            </span>
                          </div>
                          <div style={{ fontSize: 13, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
                            {it.pos.fromName} → {it.pos.toName}
                          </div>
                          {it.nextStopName && it.mins != null && (
                            <div style={{ fontSize: 11, color: FT.inkSoft, marginTop: 2, fontFamily: "'Jua', sans-serif" }}>
                              다음 <b style={{ color: c }}>{it.nextStopName}</b> · {it.nextSchedAt}
                              <span style={{ color: c, marginLeft: 4 }}>({it.mins > 0 ? `약 ${it.mins}분 후` : "잠시 후"})</span>
                            </div>
                          )}
                          <div style={{ marginTop: 5, height: 5, background: FT.mute + "33", borderRadius: 3, overflow: "hidden" }}>
                            <div style={{ width: `${Math.round(it.progress * 100)}%`, height: "100%", background: c, transition: "width 0.4s" }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })()}

            {/* 행사 안내 — 풀폭 그라데이션 배너 (옵션 B) */}
            <div style={{ marginTop: 28, paddingTop: 14, borderTop: "1.5px dashed " + FT.mute + "66" }}>
              {(() => {
                const d = getNow();
                const todayDay = d.getMonth() === 5 && d.getDate() === 13 ? "day1"
                  : d.getMonth() === 5 && d.getDate() === 14 ? "day2" : null;
                const liveProgs = todayDay ? (FESTIVAL_PROGRAM[todayDay]?.items || []).filter((it) => {
                  if (!it.time) return false;
                  const mm = it.time.match(/^(\d\d:\d\d)~(\d\d:\d\d)$/);
                  if (!mm) return false;
                  const nm = d.getHours() * 60 + d.getMinutes();
                  return toMin(mm[1]) <= nm && nm < toMin(mm[2]);
                }) : [];
                const dayMs = 86400000;
                const today0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
                const day1Ts = new Date(2026, 5, 13).getTime();
                const day2Ts = new Date(2026, 5, 14).getTime();
                let badgeText = "D-?", subText = "6.13.(토) ~ 6.14.(일)", urgent = false, ended = false;
                if (today0 < day1Ts) {
                  const dn = Math.round((day1Ts - today0) / dayMs);
                  badgeText = `D-${dn}`;
                  urgent = dn <= 7;
                } else if (today0 === day1Ts) { badgeText = "D-DAY"; subText = "오늘 6.13.(토) · 1일차"; urgent = true; }
                else if (today0 === day2Ts) { badgeText = "D-DAY"; subText = "오늘 6.14.(일) · 2일차"; urgent = true; }
                else if (today0 > day2Ts) { badgeText = "종료"; subText = "다음 회 안내 예정"; ended = true; }
                const bgGradient = ended
                  ? "linear-gradient(135deg, #94a3b8 0%, #64748b 100%)"
                  : urgent
                    ? "linear-gradient(135deg, #ef4444 0%, #EE6B2E 60%, #f59e0b 100%)"
                    : "linear-gradient(135deg, " + FT.orange + " 0%, #f59e0b 100%)";
                return (
                  <>
                    {/* 진행 중 핀 — 행사 당일에만 배너 위에 별도 노출 */}
                    {liveProgs.length > 0 && (
                      <button onClick={() => { setVenueZone(0); setTab("venue"); }}
                        style={{ width: "100%", display: "flex", alignItems: "center", gap: 8, marginBottom: 10,
                          background: FT.orangeSoft, border: "2px solid " + FT.orangeDark, borderRadius: 10,
                          padding: "8px 11px", cursor: "pointer", textAlign: "left",
                          boxShadow: "1.5px 1.5px 0 " + FT.orangeDark }}>
                        <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: "#dc2626", flexShrink: 0 }}
                          className="animate-pulse" />
                        <span style={{ fontSize: 12, color: FT.orangeDark, fontFamily: "'Jua', sans-serif", fontWeight: 700, flexShrink: 0 }}>
                          지금 진행 중 {liveProgs.length}건
                        </span>
                        <span style={{ fontSize: 11, color: FT.ink, fontFamily: "'Jua', sans-serif", flex: 1, minWidth: 0,
                          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {liveProgs.slice(0, 2).map((it) => it.title).join(" · ")}
                          {liveProgs.length > 2 && ` 외 ${liveProgs.length - 2}건`}
                        </span>
                        <span style={{ fontSize: 12, color: FT.orangeDark, fontFamily: "'Jua', sans-serif", fontWeight: 700, flexShrink: 0 }}>→</span>
                      </button>
                    )}

                    {/* 풀폭 그라데이션 배너 — 좌 D-day 큰 배지 + 중앙 텍스트 + 우 → */}
                    <button onClick={() => { setVenueZone(0); setTab("venue"); }}
                      style={{ width: "100%", display: "flex", alignItems: "center", gap: 12,
                        background: bgGradient, color: "#fff",
                        border: "2.5px solid " + FT.ink, borderRadius: 12,
                        padding: "12px 14px", boxShadow: "3px 3px 0 " + FT.ink,
                        fontFamily: "'Jua', sans-serif", fontWeight: 700, cursor: "pointer", textAlign: "left" }}>
                      {/* 좌측 D-day 배지 */}
                      <span style={{ flexShrink: 0, display: "inline-flex", alignItems: "center", justifyContent: "center",
                        minWidth: 58, height: 44, padding: "0 10px", borderRadius: 10,
                        background: "#fff", color: urgent ? "#dc2626" : ended ? "#64748b" : FT.orangeDark,
                        border: "2px solid " + FT.ink, fontSize: badgeText.length > 4 ? 13 : 16,
                        fontWeight: 700, lineHeight: 1, boxShadow: "1.5px 1.5px 0 " + FT.ink + "55" }}>
                        {badgeText}
                      </span>
                      {/* 중앙 텍스트 */}
                      <span style={{ flex: 1, minWidth: 0, lineHeight: 1.2 }}>
                        <div style={{ fontSize: 14, marginBottom: 2 }}>🎪 무등생각 행사 안내</div>
                        <div style={{ fontSize: 11, opacity: 0.92, fontWeight: 400 }}>{subText}</div>
                      </span>
                      {/* 우측 화살표 */}
                      <span style={{ fontSize: 22, flexShrink: 0, fontWeight: 700 }}>→</span>
                    </button>
                  </>
                );
              })()}
            </div>
          </div>

          {/* 하단 고정 액션 바 — 어디서나 동일 3-버튼 (list 페이지에선 모두 비활성) */}
          {renderFooter("list")}
        </div>
      </div>
      {showTimetable && <TimetableModal tripsToday={tripsToday} onClose={closeTable} focusTrip={tableFocus} />}
      {/* showVenue 모달은 더 이상 사용 안 함 — tab === 'venue' 일 때 pageMode 로 전환됨 */}
    </div>
  );
}

/* P2-3: 운영자 본부 대시보드 — ?view=ops 로 진입. 다중 셔틀 한 화면 모니터링.
   읽기 전용 — 송신/제어 없음. /buses(5초 폴) + /counts/{date} 만 읽어 표시. */
function OpsDashboard({ dbUrl }) {
  const [buses, setBuses] = useState({});
  const [counts, setCounts] = useState({});
  const [conn, setConn] = useState("loading");
  const [refreshAt, setRefreshAt] = useState(0);
  const [autoRefresh, setAutoRefresh] = useState(true);
  const [journalStatus, setJournalStatus] = useState(""); // CSV 내려받기 진행 표시

  // P2-5: 운행 일지 CSV 내려받기
  const downloadJournalCsv = async () => {
    if (!dbUrl) { setJournalStatus("⚠ DB 주소가 없습니다"); return; }
    const base = dbUrl.replace(/\/+$/, "");
    const fmtDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const dateKey = fmtDate(getNow());
    setJournalStatus("불러오는 중…");
    try {
      const r = await fetch(`${base}/journal/${dateKey}.json`, { cache: "no-store" });
      const data = await r.json();
      if (!data || typeof data !== "object") { setJournalStatus("📭 오늘 운행 일지 없음"); return; }
      const rows = [["date", "busId", "dir", "trip", "startAt", "endAt", "durationMin", "board", "alight", "onboard", "broadcastFails", "stopArrivals"]];
      Object.entries(data).forEach(([busId, trips]) => {
        if (!trips || typeof trips !== "object") return;
        Object.values(trips).forEach((e) => {
          if (!e || typeof e !== "object") return;
          const dur = (e.startAt && e.endAt) ? Math.round((e.endAt - e.startAt) / 60000) : "";
          const arrivals = e.stopArrivals && typeof e.stopArrivals === "object"
            ? Object.entries(e.stopArrivals).map(([nm, ts]) => `${nm}=${new Date(ts).toISOString().slice(11, 19)}`).join(" | ")
            : "";
          rows.push([
            dateKey, busId, e.dir || "", e.trip ?? "",
            e.startAt || "", e.endAt || "", dur,
            e.counts?.board ?? "", e.counts?.alight ?? "", e.counts?.onboard ?? "",
            e.broadcastFails ?? "",
            arrivals.replace(/"/g, "''")
          ]);
        });
      });
      if (rows.length === 1) { setJournalStatus("📭 오늘 운행 일지 없음"); return; }
      const csv = rows.map((r) => r.map((c) => /[,"\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : String(c)).join(",")).join("\n");
      const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `journal-${dateKey}.csv`; a.click();
      URL.revokeObjectURL(url);
      setJournalStatus(`✅ ${rows.length - 1}건 내려받음`);
    } catch (_) { setJournalStatus("⚠ 네트워크 오류"); }
  };

  useEffect(() => {
    if (!dbUrl) { setConn("error"); return; }
    const base = dbUrl.replace(/\/+$/, "");
    let stopped = false;
    const fmtDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const poll = async () => {
      try {
        const dateKey = fmtDate(getNow());
        const [r1, r2] = await Promise.all([
          fetch(`${base}/buses.json`, { cache: "no-store" }),
          fetch(`${base}/counts/${dateKey}.json`, { cache: "no-store" }),
        ]);
        const d1 = await r1.json();
        const d2 = await r2.json();
        if (stopped) return;
        setBuses(d1 || {});
        setCounts(d2 || {});
        setConn("ok");
        setRefreshAt(Date.now());
      } catch (_) { if (!stopped) setConn("error"); }
    };
    poll();
    if (!autoRefresh) return () => { stopped = true; };
    const id = setInterval(() => { if (!stopped) poll(); }, 5000);
    return () => { stopped = true; clearInterval(id); };
  }, [dbUrl, autoRefresh]);

  const onboardOf = (b) => {
    if (!b.trip || !b.dir) return null;
    const dirKey = b.dir === "inbound" ? "inbound" : "outbound";
    const tripData = counts[dirKey]?.[String(b.trip)];
    if (!tripData || typeof tripData !== "object") return null;
    let board = 0, alight = 0;
    Object.values(tripData).forEach((v) => {
      if (!v || typeof v !== "object") return;
      board += Number(v.board) || 0;
      alight += Number(v.alight) || 0;
    });
    return Math.max(0, board - alight);
  };

  const now = Date.now();
  const list = Object.entries(buses || {})
    .map(([id, b]) => {
      if (!b) return null;
      const ts = b.ts || 0;
      const ago = ts ? Math.round((now - ts) / 1000) : null;
      const stale = ago == null || ago > 60;
      return { id, b, ago, stale, onboard: onboardOf(b) };
    })
    .filter(Boolean)
    .sort((a, b) => {
      const da = a.b.dir === "inbound" ? 1 : 0;
      const db = b.b.dir === "inbound" ? 1 : 0;
      if (da !== db) return da - db;
      return ((a.b.trip || 0) - (b.b.trip || 0)) || a.id.localeCompare(b.id);
    });

  const totals = {
    n: list.length,
    normal: list.filter((x) => !x.stale && !x.b.waiting).length,
    waiting: list.filter((x) => x.b.waiting).length,
    stale: list.filter((x) => x.stale).length,
    onboard: list.reduce((s, x) => s + (x.onboard || 0), 0),
  };

  const th = { padding: "8px 10px", textAlign: "left", fontSize: 11, color: "#94a3b8", fontWeight: 700, fontFamily: "'Jua', sans-serif", whiteSpace: "nowrap" };
  const td = { padding: "8px 10px", fontSize: 12, fontFamily: "'Jua', sans-serif" };
  const tdMono = { ...td, fontFamily: "'IBM Plex Mono', monospace", color: "#cbd5e1" };

  return (
    <div style={{ minHeight: "100vh", background: "radial-gradient(ellipse at top, #1a1d29 0%, #0a0b10 60%, #050608 100%)", padding: "16px", color: "#cbd5e1" }}>
      <div style={{ maxWidth: 1080, margin: "0 auto" }}>
        <div className="flex items-center justify-between" style={{ marginBottom: 12, gap: 8, flexWrap: "wrap" }}>
          <div>
            <div style={{ fontSize: 10, color: "#94a3b8", letterSpacing: 2, fontFamily: "'Jua', sans-serif" }}>OPERATIONS DASHBOARD · ?view=ops</div>
            <div style={{ fontSize: 22, fontWeight: 700, color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>🚌 본부 운영자 대시보드</div>
            <div style={{ fontSize: 10, color: "#64748b", fontFamily: "'IBM Plex Mono', monospace", marginTop: 2 }}>
              {autoRefresh ? "5초 폴링" : "수동 갱신"} · 마지막 {refreshAt ? new Date(refreshAt).toLocaleTimeString() : "—"}
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <span style={{ fontSize: 11, color: conn === "ok" ? "#22d65f" : conn === "error" ? "#fca5a5" : "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
              ● {conn === "ok" ? "연결됨" : conn === "error" ? "연결 오류" : "연결 중…"}
            </span>
            <button onClick={() => setAutoRefresh((v) => !v)}
              style={{ padding: "5px 10px", borderRadius: 8, fontSize: 11, fontFamily: "'Jua', sans-serif", fontWeight: 700,
                background: autoRefresh ? "rgba(34,214,95,0.15)" : "rgba(100,116,139,0.15)",
                color: autoRefresh ? "#22d65f" : "#94a3b8",
                border: "1px solid " + (autoRefresh ? "rgba(34,214,95,0.3)" : "#3a3f54"), cursor: "pointer" }}>
              {autoRefresh ? "자동 ON" : "자동 OFF"}
            </button>
            <button onClick={downloadJournalCsv}
              title="오늘 /journal 전체를 CSV 로 내려받기"
              style={{ padding: "5px 10px", borderRadius: 8, fontSize: 11, fontFamily: "'Jua', sans-serif", fontWeight: 700,
                background: "rgba(251,191,36,0.15)", color: "#fbbf24",
                border: "1px solid rgba(251,191,36,0.3)", cursor: "pointer" }}>
              📋 운행 일지 CSV
            </button>
            {journalStatus && (
              <span style={{ fontSize: 10, color: journalStatus.startsWith("✅") ? "#22d65f"
                : journalStatus.startsWith("⚠") ? "#fca5a5" : "#94a3b8",
                fontFamily: "'Jua', sans-serif" }}>{journalStatus}</span>
            )}
          </div>
        </div>

        {list.length === 0 ? (
          <div style={{ background: "#13151c", border: "1px solid #2c3142", borderRadius: 10, padding: 32, textAlign: "center", color: "#64748b", fontFamily: "'Jua', sans-serif" }}>
            {conn === "error" ? "Firebase 연결 실패 — 잠시 후 다시 시도합니다."
              : conn === "loading" ? "데이터 불러오는 중…"
              : "현재 송신 중인 셔틀이 없습니다."}
          </div>
        ) : (
          <div style={{ background: "#13151c", border: "1px solid #2c3142", borderRadius: 10, overflow: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ background: "#1c2030", borderBottom: "1px solid #2c3142" }}>
                  <th style={th}>버스</th>
                  <th style={th}>방향</th>
                  <th style={th}>회차</th>
                  <th style={th}>정류장</th>
                  <th style={th}>탑승</th>
                  <th style={th}>대기</th>
                  <th style={th}>마지막 송신</th>
                  <th style={th}>GPS</th>
                  <th style={th}>상태</th>
                </tr>
              </thead>
              <tbody>
                {list.map(({ id, b, ago, stale, onboard }) => {
                  const dirColor = b.dir === "inbound" ? "#22d3ee" : "#fb923c";
                  const rowBg = stale ? "rgba(239,68,68,0.10)" : (b.waiting ? "rgba(96,165,250,0.06)" : "transparent");
                  return (
                    <tr key={id} style={{ borderBottom: "1px solid #1c2030", background: rowBg }}>
                      <td style={{ ...tdMono, color: "#fbbf24", fontWeight: 700 }}>{id}</td>
                      <td style={{ ...td, color: dirColor, fontWeight: 700 }}>
                        {b.dir === "inbound" ? "← 광장" : "축제장 →"}
                      </td>
                      <td style={tdMono}>{b.trip != null ? `${b.trip}회` : "-"}</td>
                      <td style={td}>
                        {b.stop || "-"}
                        {b.arrived && <span style={{ color: "#22d65f", marginLeft: 4 }}>●도착</span>}
                        {b.departedFrom && <span style={{ color: "#94a3b8", marginLeft: 4 }}>← {b.departedFrom}</span>}
                      </td>
                      <td style={tdMono}>{onboard != null ? `${onboard}명` : "-"}</td>
                      <td style={{ ...td, color: b.waiting ? "#60a5fa" : "#475569" }}>{b.waiting ? "🅿 대기" : "—"}</td>
                      <td style={{ ...tdMono, color: stale ? "#fca5a5" : "#94a3b8" }}>
                        {ago == null ? "?" : ago < 60 ? `${ago}초 전` : `${Math.floor(ago / 60)}분 전`}
                      </td>
                      <td style={{ ...tdMono, color: b.lat != null ? "#22d65f" : "#64748b" }}>{b.lat != null ? "✓" : "—"}</td>
                      <td style={{ ...td, color: stale ? "#ef4444" : b.waiting ? "#60a5fa" : "#22d65f", fontWeight: 700 }}>
                        {stale ? "⚠ STALE" : b.waiting ? "대기" : "정상"}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        <div style={{ marginTop: 12, fontSize: 11, color: "#64748b", display: "flex", justifyContent: "space-between", fontFamily: "'Jua', sans-serif", flexWrap: "wrap", gap: 6 }}>
          <div>
            총 <span style={{ color: "#cbd5e1", fontWeight: 700 }}>{totals.n}</span>대 ·
            정상 <span style={{ color: "#22d65f", fontWeight: 700 }}>{totals.normal}</span> ·
            대기 <span style={{ color: "#60a5fa", fontWeight: 700 }}>{totals.waiting}</span> ·
            stale <span style={{ color: "#ef4444", fontWeight: 700 }}>{totals.stale}</span> ·
            총 탑승 <span style={{ color: "#fbbf24", fontWeight: 700 }}>{totals.onboard}</span>명
          </div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace" }}>BUILD {BUILD}</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [mode, setMode] = useState(() => LS.get("mode", "simple"));
  const [direction, setDirection] = useState("outbound");
  const [tripIdx, setTripIdx] = useState(0);
  const [currentIdx, setCurrentIdx] = useState(0);
  const [isAnnouncing, setIsAnnouncing] = useState(false);
  const [rate, setRate] = useState(() => parseFloat(LS.get("rate", "0.95")));

  // Coordinates keyed by 방향|정류장이름 (방향별 분리) — defaults from ROUTES, overridden by localStorage
  const [coords, setCoords] = useState(() => {
    const base = {};
    ["outbound", "inbound"].forEach(dir => {
      ROUTES[dir].stops.forEach(s => {
        if (s.lat != null && s.lng != null) base[coordKey(dir, s.name)] = { lat: s.lat, lng: s.lng };
      });
    });
    const stored = LS.getJSON("coords", {});
    const migrated = {};
    Object.entries(stored).forEach(([k, v]) => {
      if (k.includes("|")) migrated[k] = v;               // 이미 방향별 키
      else if (SHARED_STOPS.has(k)) migrated[k] = v;      // 단일 승강장: 이름 키 그대로 공유
      // 그 외(건너편 있는) 레거시 이름 키는 양방향으로 베이킹하지 않고 무시 → ROUTES 기본값 사용
    });
    return { ...base, ...migrated };
  });

  // 안내 멘트 설정 (기본 FESTIVAL + localStorage 사용자 수정본)
  const [ments, setMents] = useState(() => {
    const stored = LS.getJSON("ments", null);
    return stored ? { ...FESTIVAL, ...stored } : FESTIVAL;
  });
  useEffect(() => LS.setJSON("ments", ments), [ments]);

  // GPS / auto
  const [autoMode, setAutoMode] = useState(false);
  // 시간표 자동 — 시각에 따라 currentIdx 진행 + 안내. autoMode와 상호 배타.
  const [timetableMode, setTimetableMode] = useState(() => LS.get("ttmode", "0") === "1");
  useEffect(() => LS.set("ttmode", timetableMode ? "1" : "0"), [timetableMode]);
  // currentIdx 미러 ref — 시간표 tick 이 currentIdx 변경마다 effect 재실행하지 않도록
  const currentIdxRef = useRef(currentIdx);
  useEffect(() => { currentIdxRef.current = currentIdx; }, [currentIdx]);
  // 시간표 모드에서 마지막으로 안내한 인덱스 — direction/tripIdx 변경 시 -1 로 리셋
  const ttLastAnnouncedRef = useRef(-1);
  useEffect(() => { ttLastAnnouncedRef.current = -1; }, [direction, tripIdx]);
  const [userPos, setUserPos] = useState(null);
  const [gpsError, setGpsError] = useState(null);
  const [triggerRadius, setTriggerRadius] = useState(() => parseInt(LS.get("radius", "150")));
  const [permissionState, setPermissionState] = useState("unknown");
  const [showHelp, setShowHelp] = useState(false);
  const [autoLegSwitch, setAutoLegSwitch] = useState(() => LS.get("autoleg", "0") === "1");
  const [festivalDay, setFestivalDay] = useState(() => LS.get("festday", "auto")); // auto|day1|day2
  // 실시간 위치 공유 (Firebase RTDB REST)
  const [shareUrl, setShareUrl] = useState(() => LS.get("shareurl", SHARE_DB));
  const [busId, setBusId] = useState(() => {
    let id = LS.get("busid", "");
    if (!id) { id = "B" + Math.random().toString(36).slice(2, 5).toUpperCase(); LS.set("busid", id); }
    return id;
  });
  const sessionRef = useRef(Math.random().toString(36).slice(2, 8));
  const [busIdConflict, setBusIdConflict] = useState(false);
  // 버스 정원(혼잡도 색 기준) — 운영자가 설정
  const [busCapacity, setBusCapacity] = useState(() => parseInt(LS.get("capacity", "25"), 10) || 25);
  useEffect(() => LS.set("capacity", String(busCapacity)), [busCapacity]);
  // broadcast 실패 추적 (UI 표시용)
  const broadcastFailRef = useRef(0);
  const authRetryAtRef = useRef(0); // 인증 재시도 중복 호출 방지(1분 쿨다운)
  const [broadcastStatus, setBroadcastStatus] = useState("ok"); // ok | failing
  const [lastBroadcastStatus, setLastBroadcastStatus] = useState(null); // 마지막 실패 코드/메시지
  const [broadcastStats, setBroadcastStats] = useState({ lastAt: 0, count: 0, failCount: 0 });
  const [_statsTick, _setStatsTick] = useState(0); // "N초 전" 갱신용 1초 tick — sharing 선언 이후에 effect 등록
  const [driverEmail, setDriverEmail] = useState(() => LS.get("driveremail", "")); // 기사 쓰기 로그인(이 기기에만 저장)
  const [driverPass, setDriverPass] = useState(() => LS.get("driverpass", ""));
  const [apiKey, setApiKey] = useState(() => LS.get("apikey", SHARE_API_KEY)); // 웹 API 키(이 기기에만 저장)
  const [authStatus, setAuthStatus] = useState("");
  const [sharing, setSharing] = useState(false);
  useEffect(() => { if (!sharing) return; const id = setInterval(() => _setStatsTick((t) => t + 1), 1000); return () => clearInterval(id); }, [sharing]);
  const [manualWaiting, setManualWaiting] = useState(false);
  // 승하차 카운트 — { "dir|trip|stop": { board: N, alight: N } }. Firebase /counts/{date}/dir/trip/stopName 에 저장.
  const [counts, setCounts] = useState({});

  const [showStats, setShowStats] = useState(false);

  const [bottomPanelOpen, setBottomPanelOpen] = useState(() => LS.get("opbottompanel", "1") === "1");
  useEffect(() => LS.set("opbottompanel", bottomPanelOpen ? "1" : "0"), [bottomPanelOpen]);
  const [arrivedPulse, setArrivedPulse] = useState(0); // arrived 트리거 시점(ms)
  const [countsEnabled, setCountsEnabled] = useState(() => LS.get("countsenabled", "1") === "1");
  useEffect(() => LS.set("countsenabled", countsEnabled ? "1" : "0"), [countsEnabled]);
  const fmtDateKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const [dateKey, setDateKey] = useState(() => fmtDateKey(new Date()));
  // 자정 경계 대응: 매 30초 dateKey 재계산. 변경 직전 디바운스 큐 flush(P0-6)는 flushCountsWritesRef 로 처리.
  const flushCountsWritesRef = useRef(() => {});
  useEffect(() => {
    const id = setInterval(() => {
      const nk = fmtDateKey(new Date());

      });

  }, []);
  const [locShare, setLocShare] = useState(() => LS.get("locshare", "1") === "1"); // 위치 좌표 공유(끄면 운행 정보만 송신)
  useEffect(() => LS.set("locshare", locShare ? "1" : "0"), [locShare]);
  const lastShareRef = useRef(0);
  // P1-a: arrived 히스테리시스 (진입<30m, 해제>50m, 속도 느릴 때만 진입 확정)
  const arrivedStateRef = useRef(false);
