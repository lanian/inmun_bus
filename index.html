      const html = `<div><span class="num" style="background:${c}">${z.num}</span><span>${z.title}</span>${badge}</div>`;
      const icon = L.divIcon({ className: "fest-zone-marker", html, iconSize: [180, 24], iconAnchor: [90, 12] });
      const programLines = zoneItems.length > 0
        ? zoneItems.slice(0, 10).map((it) => {
            const live = isLive(it);
            const bg = live ? `background:${c}22;` : "";
            const mark = live ? `<span style="color:${c};font-weight:700">● </span>` : "";
            return `<div style="font-size:11px;color:#101113;margin:2px 0;padding:1px 4px;border-radius:4px;${bg}">${mark}<b>${it.time}</b> ${it.title}</div>`;
          }).join("") + (zoneItems.length > 10 ? `<div style="font-size:10px;color:#888;margin-top:2px">외 ${zoneItems.length - 10}개</div>` : "")
        : `<div style="font-size:11px;color:#888;margin-top:4px">등록된 프로그램 없음</div>`;
      const heading = isToday
        ? (liveItems.length > 0 ? `● 오늘 ${dayLabel} · 진행 ${liveItems.length}건` : `오늘 ${dayLabel} 일정`)
        : `${dayLabel} 일정 (미리보기)`;
      const popupHtml = `<div style="font-family:'Jua',sans-serif;max-width:260px"><b>${z.num}. ${z.title}</b><br><span style="color:#4A4E55;font-size:11px">${z.sub}</span>`
        + `<div style="margin-top:8px;padding-top:6px;border-top:1px solid #ddd"><div style="font-size:11px;color:${c};font-weight:700;margin-bottom:3px">${heading}</div>`
        + programLines
        + `</div></div>`;
      const m = L.marker([lat, lng], { icon }).addTo(map).bindPopup(popupHtml);
      zoneLayersRef.current.push(m);
      // 세부 장소 핀 — subs가 있는 구역만(override → 코드 기본값 순)
      const subs = (o && Array.isArray(o.subs) && o.subs.length ? o.subs : z.subs) || [];
      subs.forEach((s) => {
        if (s.lat == null || s.lng == null) return;
        const subHtml = `<div><span class="dot" style="background:${c}"></span><span>${s.name}</span></div>`;
        const subIcon = L.divIcon({ className: "fest-sub-marker", html: subHtml, iconSize: [120, 20], iconAnchor: [60, 10] });
        // 해당 세부 장소 프로그램(cat에 이름 포함)
        const subItems = zoneItems.filter((it) => it.cat && it.cat.includes(s.name));
        const subLines = subItems.length > 0
          ? subItems.slice(0, 8).map((it) => {
              const live = isLive(it);
              const bg = live ? `background:${c}22;` : "";
              const mark = live ? `<span style="color:${c};font-weight:700">● </span>` : "";
              return `<div style="font-size:11px;color:#101113;margin:2px 0;padding:1px 4px;border-radius:4px;${bg}">${mark}<b>${it.time}</b> ${it.title}</div>`;
            }).join("") + (subItems.length > 8 ? `<div style="font-size:10px;color:#888;margin-top:2px">외 ${subItems.length - 8}개</div>` : "")
          : `<div style="font-size:11px;color:#888;margin-top:4px">이 장소 프로그램 없음</div>`;
        const subPopup = `<div style="font-family:'Jua',sans-serif;max-width:240px">`
          + `<div style="font-size:10px;color:${c};font-weight:700">${z.num}. ${z.title}</div>`
          + `<b style="font-size:13px">${s.name}</b>`
          + `<div style="margin-top:6px;padding-top:4px;border-top:1px solid #ddd">${subLines}</div>`
          + `</div>`;
        const sm = L.marker([s.lat, s.lng], { icon: subIcon }).addTo(map).bindPopup(subPopup);
        zoneLayersRef.current.push(sm);
      });
    });
  }, [zoneOverride, _zoneTick]);

  useEffect(() => {
    if (!dbUrl) { setStatus("공유 주소(db)가 없습니다"); return; }
    let stopped = false;
    const base = dbUrl.replace(/\/+$/, "");
    const L = window.L;
    const makeIcon = (id, b, noGps) => {
      const dir = b.dir === "inbound" ? "inbound" : "outbound";
      const bg = dir === "inbound" ? FT.teal : FT.orange;
      const wait = b.waiting === true;
      // 대기 중: 주황소프트 배경 + 펄스 애니메이션 + "대기" 텍스트로 시각 강조
      if (wait) {
        const html = `<div style="display:inline-flex;align-items:center;gap:4px;background:${FT.orangeSoft};color:${FT.orangeDark};border:2.5px solid ${FT.ink};border-radius:999px;padding:3px 10px;box-shadow:2px 2px 0 ${FT.ink};font-family:'Jua',sans-serif;font-weight:700;font-size:12px;white-space:nowrap;">🅿️ ${id} 대기 중</div>`;
        return L.divIcon({ className: "fest-wait-marker", html, iconSize: [160, 28], iconAnchor: [80, 14] });
      }
      const borderStyle = noGps ? "dashed" : "solid";
      const shadow = noGps ? "" : `box-shadow:2px 2px 0 ${FT.ink};`;
      const trailing = noGps ? " 예상" : "";
      const html = `<div style="display:inline-flex;align-items:center;gap:3px;background:${bg};color:#fff;border:2.5px ${borderStyle} ${FT.ink};border-radius:999px;padding:3px 9px;${shadow}font-family:'Jua',sans-serif;font-weight:700;font-size:12px;white-space:nowrap;">🚌 ${id}${trailing}</div>`;
      return L.divIcon({ className: "", html, iconSize: [140, 28], iconAnchor: [70, 14] });
    };
    const schedIcon = (dir, tripNum) => {
      const c = dir === "inbound" ? FT.teal : FT.orange;
      const html = `<div style="display:inline-flex;align-items:center;gap:3px;background:#fff;color:${FT.ink};border:2px dashed ${c};border-radius:999px;padding:3px 9px;font-family:'Jua',sans-serif;font-weight:700;font-size:11px;white-space:nowrap;opacity:0.92;">${tripNum}회차 예상</div>`;
      return L.divIcon({ className: "", html, iconSize: [130, 26], iconAnchor: [65, 13] });
    };
    // A8: 휴식(대기) 마커 — 종착지에서 다음 leg 출발까지의 휴식
    const restIcon = (mins, terminus) => {
      const html = `<div style="display:inline-flex;align-items:center;gap:3px;background:#f1f5f9;color:#475569;border:2px dashed #94a3b8;border-radius:999px;padding:3px 9px;font-family:'Jua',sans-serif;font-weight:700;font-size:11px;white-space:nowrap;">🅿 ${terminus} 휴식 · ${mins}분 후 출발</div>`;
      return L.divIcon({ className: "", html, iconSize: [200, 26], iconAnchor: [100, 13] });
    };
    const poll = async () => {
      try {
        const r = await fetch(`${base}/buses.json`, { cache: "no-store" });
        const data = await r.json();
        const map = mapRef.current; if (!map) return;
        const now = Date.now(); let n = 0;
        const liveTripSet = new Set();
        const validIds = new Set();
        const nowDate = new Date();
        const nowMinTick = nowDate.getHours() * 60 + nowDate.getMinutes() + nowDate.getSeconds() / 60;
        // P1-7: 다중 셔틀 같은 좌표 겹침 방지 — 1차에 (id, basePos, b) 모아 클러스터, 2차에서 원형 offset 후 마커 배치
        const items = [];
        Object.entries(data || {}).forEach(([id, b]) => {
          if (!b || (b.ts && now - b.ts > 60000)) return;
          let pos = null, noGps = false;
          if (b.lat != null && b.lng != null) {
            const dirKey0 = b.dir === "inbound" ? "inbound" : "outbound";
            // OSRM 도로 폴리라인(곡선)이 로드돼 있으면 그것에 스냅 — 없으면 정류장 직선 fallback
            const osrmPoly = osrmPolyRef.current[dirKey0];
            const snap = snapToRoute({ lat: b.lat, lng: b.lng }, dirKey0, ROUTES[dirKey0].stops, osrmPoly);
            if (snap && snap.perpDist < 100) pos = [snap.snapped.lat, snap.snapped.lng];
            else pos = [b.lat, b.lng];
          } else if (b.stop && b.dir) {
            const dirKey = b.dir === "inbound" ? "inbound" : "outbound";
            const op = b.trip ? operationBasedPos(dirKey, b.trip - 1, b.stop, nowMinTick, b.waiting === true) : null;
            if (op) { pos = [op.lat, op.lng]; noGps = true; b._op = op; }
            else {
              const route = ROUTES[dirKey];
              const s = route && route.stops.find((x) => x.name === b.stop);
              if (s && s.lat != null) { pos = [s.lat, s.lng]; noGps = true; }
            }
          }
          if (!pos) return;
          n++;
          validIds.add(id);
          const dir = b.dir === "inbound" ? "inbound" : "outbound";
          if (b.trip) liveTripSet.add(`${dir}|${b.trip}`);
          let phaseText = "";
          if (b._op) {
            const op = b._op;
            phaseText = op.phase === "waiting" ? "출발 대기"
              : op.phase === "before" ? `${op.fromName} 출발 시각 전`
              : op.phase === "approaching" ? `${op.toName} 진입 중`
              : op.phase === "between" ? `${op.fromName} → ${op.toName} 이동 중`
              : op.phase === "at" ? `${op.fromName} 도착`
              : op.phase === "passed" ? `${op.fromName} 통과 · ${op.toName}로`
              : op.phase === "end" ? "종점 도착" : "";
          }
          const label = `${id} · ${ROUTES[dir].label}${b.trip ? ` ${b.trip}회차` : ""}${phaseText ? ` · ${phaseText}` : (b.stop ? ` · ${b.stop}` : "")}${b.waiting === true ? " · 출발 대기" : ""}${noGps ? " · 예상" : ""}`;
          items.push({ id, b, pos, noGps, label });
        });
        // 클러스터 — 좌표 20m 이내면 같은 그룹
        const PROX_M = 20;
        const clusters = [];
        items.forEach((it) => {
          let g = null;
          for (const c of clusters) {
            if (distanceMeters({ lat: c.center[0], lng: c.center[1] }, { lat: it.pos[0], lng: it.pos[1] }) < PROX_M) { g = c; break; }
          }
          if (g) {
            g.items.push(it);
            // 그룹 중심을 평균으로 갱신
            const n = g.items.length;
            g.center = [g.items.reduce((s, x) => s + x.pos[0], 0) / n, g.items.reduce((s, x) => s + x.pos[1], 0) / n];
          } else {
            clusters.push({ center: [it.pos[0], it.pos[1]], items: [it] });
          }
        });
        // 그룹 ≥ 2 면 원형 28m 반경으로 분산. 단일은 원래 좌표 그대로
        const OFFSET_M = 28;
        const finalPos = new Map();
        clusters.forEach((c) => {
          if (c.items.length === 1) {
            finalPos.set(c.items[0].id, c.items[0].pos);
          } else {
            const cosLat = Math.cos(c.center[0] * Math.PI / 180);
            const dLat = OFFSET_M / 111320;
            const dLng = OFFSET_M / (111320 * Math.max(cosLat, 0.1));
            const sorted = c.items.slice().sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
            sorted.forEach((it, i) => {
              const ang = (2 * Math.PI * i) / sorted.length;
              finalPos.set(it.id, [c.center[0] + Math.sin(ang) * dLat, c.center[1] + Math.cos(ang) * dLng]);
            });
          }
        });
        // 마커 배치
        items.forEach((it) => {
          const pos = finalPos.get(it.id) || it.pos;
          let m = markersRef.current[it.id];
          if (!m) {
            m = L.marker(pos, { icon: makeIcon(it.id, it.b, it.noGps) }).addTo(map);
            markersRef.current[it.id] = m;
          } else {
            m.setLatLng(pos);
            m.setIcon(makeIcon(it.id, it.b, it.noGps));
          }
          m.bindTooltip(it.label, { direction: "top", offset: [0, -16] });
        });
        Object.keys(markersRef.current).forEach((id) => {
          if (!validIds.has(id)) { map.removeLayer(markersRef.current[id]); delete markersRef.current[id]; }
        });

        // 시간표 기반 추정 위치 — 라이브 신호가 없어도 항상 표시(라이브로 같은 회차 송신 시만 해당 회차 skip)
        const schedKeys = new Set();
        let nSched = 0;
        let nResting = 0;
        {
          const today = getNow();
          const tripsToday = today.getMonth() === 5 && today.getDate() === 14 ? 5 : ROUTES.outbound.trips.length;
          const nowMin = today.getHours() * 60 + today.getMinutes();
          const obFirstStop = ROUTES.outbound.stops[0];
          const ibFirstStop = ROUTES.inbound.stops[0];
          ["outbound", "inbound"].forEach((dir) => {
            for (let ti = 0; ti < tripsToday; ti++) {
              const tripNum = ti + 1;
              if (liveTripSet.has(`${dir}|${tripNum}`)) continue;
              const pos = scheduledBusPos(dir, ti, nowMin);
              if (!pos) continue;
              const key = `${dir}|${tripNum}`;
              schedKeys.add(key); nSched++;
              const lbl = `예정 · ${ROUTES[dir].label} ${tripNum}회차 · ${pos.fromName} → ${pos.toName}`;
              let m = schedMarkersRef.current[key];
              if (!m) {
                m = L.marker([pos.lat, pos.lng], { icon: schedIcon(dir, tripNum) }).addTo(map);
                schedMarkersRef.current[key] = m;
              } else {
                m.setLatLng([pos.lat, pos.lng]);
                m.setIcon(schedIcon(dir, tripNum));
              }
              m.bindTooltip(lbl, { direction: "top", offset: [0, -16] });
            }
          });
          // A8: 휴식 갭 — 종착지(축제장 또는 5·18광장)에서 다음 leg 까지 대기 마커
          const pushRest = (dir, ti, terminusStop, minsLeft, key) => {
            if (!terminusStop || terminusStop.lat == null || liveTripSet.has(key) || schedKeys.has(key)) return;
            schedKeys.add(key); nResting++;
            const lbl = `🅿 ${terminusStop.name} 휴식 · ${ROUTES[dir].label} ${ti + 1}회차 · ${minsLeft}분 후 출발`;
            let m = schedMarkersRef.current[key];
            if (!m) {
              m = L.marker([terminusStop.lat, terminusStop.lng], { icon: restIcon(minsLeft, terminusStop.name) }).addTo(map);
              schedMarkersRef.current[key] = m;
            } else {
              m.setLatLng([terminusStop.lat, terminusStop.lng]);
              m.setIcon(restIcon(minsLeft, terminusStop.name));
            }
            m.bindTooltip(lbl, { direction: "top", offset: [0, -16] });
          };
          // outbound n 종착(축제장) → inbound n 출발
          for (let ti = 0; ti < tripsToday; ti++) {
            const ob = ROUTES.outbound.trips[ti], ib = ROUTES.inbound.trips[ti];
            if (!ob || !ib) continue;
            const obEnd = toMin(ob[ob.length - 1]);
            const ibStart = toMin(ib[0]);
            if (obEnd < ibStart && nowMin >= obEnd && nowMin < ibStart) {
              pushRest("inbound", ti, ibFirstStop, ibStart - nowMin, `inbound|${ti + 1}`);
            }
          }
          // inbound n 종착(5·18광장) → outbound n+1 출발 (점심휴식 포함)
          for (let ti = 0; ti < tripsToday; ti++) {
            const ib = ROUTES.inbound.trips[ti], nob = ROUTES.outbound.trips[ti + 1];
            if (!ib || !nob) continue;
            const ibEnd = toMin(ib[ib.length - 1]);
            const nobStart = toMin(nob[0]);
            if (ibEnd < nobStart && nowMin >= ibEnd && nowMin < nobStart) {
              pushRest("outbound", ti + 1, obFirstStop, nobStart - nowMin, `outbound|${ti + 2}`);
            }
          }
        }
        Object.keys(schedMarkersRef.current).forEach((k) => {
          if (!schedKeys.has(k)) { map.removeLayer(schedMarkersRef.current[k]); delete schedMarkersRef.current[k]; }
        });

        setCount(n);
        const totalShown = n + nSched + nResting;
        setStatus(n > 0 && nSched > 0 ? `실시간 ${n}대 · 예정 ${nSched}대${nResting > 0 ? ` · 휴식 ${nResting}대` : ""}`
          : n > 0 ? "실시간"
          : nSched > 0 ? `시간표 기준 ${nSched}대${nResting > 0 ? ` · 휴식 ${nResting}대` : ""}`
          : nResting > 0 ? `🅿 ${nResting}대 휴식 중`
          : "운행 중인 셔틀이 없습니다");
      } catch (_) { setCount(0); setStatus("연결 오류 — 잠시 후 다시 시도"); }
    };
    poll();
    const id = setInterval(() => { if (!stopped) poll(); }, 3000);
    return () => { stopped = true; clearInterval(id); };
  }, [dbUrl]);

  return (
    <div style={{ position: "relative" }}>
      <div ref={elRef} style={{ height: "100vh", width: "100%" }} />

      {/* 제목 + 운행 대수 칩 — 뷰포트 기준 고정(스크롤·줌에도 항상 노출) */}
      <div style={{ position: "fixed", top: "calc(10px + env(safe-area-inset-top, 0px))", left: 10, right: 10, zIndex: 1100,
        display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, pointerEvents: "none" }}>
        {onHome ? (
          <button onClick={onHome} aria-label="홈으로 — 스위치 다시 끄기"
            title="홈으로"
            style={{ background: "#fff", color: FT.ink, padding: "6px 12px 6px 8px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 13,
              boxShadow: "3px 3px 0 " + FT.ink, fontWeight: 700, cursor: "pointer", pointerEvents: "auto",
              display: "inline-flex", alignItems: "center", gap: 6 }}>
            <img src="logo.png" alt="" aria-hidden="true"
              style={{ height: 24, width: "auto", transform: "scaleY(-1)" }} />
            <span style={{ color: FT.orange }}>무등생각</span> 지도
          </button>
        ) : (
          <div style={{ background: "#fff", color: FT.ink, padding: "6px 12px 6px 8px", borderRadius: 10,
            border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 13,
            boxShadow: "3px 3px 0 " + FT.ink, fontWeight: 700,
            display: "inline-flex", alignItems: "center", gap: 6 }}>
            <img src="logo.png" alt="" aria-hidden="true"
              style={{ height: 24, width: "auto", transform: "scaleY(-1)" }} />
            <span style={{ color: FT.orange }}>무등생각</span> 지도
          </div>
        )}
        <div style={{ display: "inline-flex", alignItems: "center", gap: 6,
          background: count > 0 ? FT.tealSoft : "#EEEFF1",
          border: "2px solid " + FT.ink, color: count > 0 ? FT.tealDark : FT.inkSoft,
          padding: "6px 10px", borderRadius: 10, fontFamily: "'Jua', sans-serif", fontSize: 12,
          boxShadow: "3px 3px 0 " + FT.ink, fontWeight: 700 }}>
          <span className={count > 0 ? "animate-pulse" : ""}
            style={{ width: 8, height: 8, borderRadius: "50%", background: count > 0 ? FT.teal : FT.mute }} />
          {count > 0 ? `운행 중 ${count}대` : status}
        </div>
      </div>

      {/* 범례 (좌하단) */}
      <div style={{ position: "absolute", bottom: 96, left: 10, zIndex: 1000,
        background: "#fff", border: "2px solid " + FT.ink, borderRadius: 10, boxShadow: "3px 3px 0 " + FT.ink,
        padding: "8px 10px", fontFamily: "'Jua', sans-serif", fontSize: 11, color: FT.ink, lineHeight: 1.6 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ display: "inline-block", width: 22, height: 3, background: FT.orange, borderRadius: 2 }} />
          축제장 방향
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ display: "inline-block", width: 22, height: 3,
            background: `repeating-linear-gradient(90deg, ${FT.teal} 0 5px, transparent 5px 9px)` }} />
          민주광장 방향
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4 }}>
          <span style={{ display: "inline-block", width: 12, height: 12, borderRadius: "50%", background: "#fff", border: `2px solid ${FT.orange}` }} />
          축제장행 정류장
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ display: "inline-block", width: 12, height: 12, borderRadius: "50%", background: "#fff", border: `2px solid ${FT.teal}` }} />
          민주광장행 정류장
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ display: "inline-block", width: 12, height: 12, borderRadius: "50%", background: "#fff", border: `2px solid ${FT.ink}` }} />
          공용 정류장
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 2 }}>
          <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 16, height: 16, borderRadius: 4,
            background: FT.orange, color: "#fff", fontSize: 10, fontFamily: "'Jua', sans-serif", fontWeight: 700, border: "1.5px solid " + FT.ink }}>1</span>
          행사 주요 구역
        </div>
      </div>
    </div>
  );
}

/* 버스가 시발지 출발 전이거나 종점 도착 후 다음 출발 대기 중인지 자동 추론 */
function inferWaiting(bus, nowMin, tripsToday) {
  const dir = bus.dir === "inbound" ? "inbound" : "outbound";
  const route = ROUTES[dir];
  const stops = route.stops;
  const trip = (bus.trip || 1) - 1;
  const sched = route.trips[trip];
  if (!sched) return null;
  // 시발지에서 이번 회차 출발 시각 전
  if (bus.stop === stops[0].name && nowMin < toMin(sched[0])) {
    return { place: stops[0].name, time: sched[0], tripIdx: trip + 1, dir };
  }
  // 종점 도착 후 반대 방향 다음 회차 대기
  if (bus.stop === stops[stops.length - 1].name) {
    const opp = dir === "outbound" ? "inbound" : "outbound";
    const oppTrips = ROUTES[opp].trips.slice(0, tripsToday);
    for (let i = 0; i < oppTrips.length; i++) {
      if (toMin(oppTrips[i][0]) >= nowMin) {
        return { place: stops[stops.length - 1].name, time: oppTrips[i][0], tripIdx: i + 1, dir: opp };
      }
    }
  }
  return null;
}

/* 승객 화면 버스 카드 — 진행바를 현재 정류장으로 자동 스크롤, 다음 정류장·도착예정 표시 */
function BusCard({ id, bus, agoText, nowMin, tripsToday, departedInfo }) {
  const stripRef = useRef(null), activeRef = useRef(null);
  const dir = bus.dir === "inbound" ? "inbound" : "outbound";
  const route = ROUTES[dir];
  const stops = route.stops;
  // ci 보정 — 폴리라인 투영으로 노선 진행 위치에서 다음 도착 정류장 산출. 뒤로 안 감 + 최대 2단계 forward + perpDist 200m 가드.
  let ci = stops.findIndex((s) => s.name === bus.stop);
  const ciFromStop = ci;
  const sched = route.trips[(bus.trip || 1) - 1];
  if (bus.lat != null && bus.lng != null) {
    const proj = projectOnRoute({ lat: bus.lat, lng: bus.lng }, stops);
    if (proj && proj.perpDist < 200 && proj.ci > ci) {
      const maxAdvance = ciFromStop >= 0 ? Math.min(proj.ci, ciFromStop + 2) : proj.ci;
      ci = Math.max(ci, maxAdvance);
    }
  }
  // phase: 운영자의 arrived/waiting만 신뢰 (GPS 거리 기반 자동 판정 제거)
  let phase = "approaching";
  if (bus.waiting) phase = "waiting";
  else if (bus.arrived) phase = "arrived";
  else if (departedInfo && departedInfo.stopName && Date.now() - departedInfo.at < 90000) phase = "departed";
  else phase = "approaching";
  const nextStop = ci >= 0 && ci < stops.length - 1 ? stops[ci + 1] : null;
  const nextEta = nextStop && sched ? sched[ci + 1] : null;
  const finalName = stops[stops.length - 1].name;
  const finalEta = sched ? sched[sched.length - 1] : null;
  const autoWait = inferWaiting(bus, nowMin, tripsToday);
  const waitInfo = bus.waiting === true ? (autoWait || { place: bus.stop || "—", time: null, tripIdx: null, dir }) : autoWait;
  useEffect(() => {
    if (waitInfo) return;
    const el = activeRef.current, c = stripRef.current;
    if (el && c) c.scrollTo({ left: el.offsetLeft - c.clientWidth / 2 + el.clientWidth / 2, behavior: "smooth" });
  }, [ci, waitInfo]);
  return (
    <div style={{ background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 12, boxShadow: "3px 3px 0 " + FT.ink, padding: 10 }}>
      <div className="flex items-center justify-between" style={{ marginBottom: 6 }}>
        <div className="flex items-center gap-2 min-w-0">
          <span style={{ fontSize: 20 }}>🚌</span>
          <span className="flex-shrink-0" style={{ color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{id}</span>
          <span className="truncate" style={{ background: dir === "outbound" ? FT.orange : FT.teal, color: "#fff",
            border: "1.5px solid " + FT.ink, padding: "2px 8px", borderRadius: 999,
            fontSize: 11, fontFamily: "'Jua', sans-serif" }}>
            {route.label} · {bus.trip || "-"}회차
          </span>
        </div>
        <span className="flex-shrink-0 ml-2 flex items-center gap-1" style={{ color: FT.mute, fontSize: 10 }}>
          <span className="animate-pulse" style={{ width: 7, height: 7, borderRadius: "50%", background: FT.teal }} />{agoText(bus.ts)}
        </span>
      </div>

      {waitInfo ? (
        <div style={{ background: FT.orangeSoft, border: "2px solid " + FT.ink, borderRadius: 10, padding: "16px 14px", textAlign: "center" }}>
          <div style={{ fontSize: 11, letterSpacing: 2, marginBottom: 4, color: FT.orangeDark, fontFamily: "'Jua', sans-serif" }}>
            🅿️ 출발 대기 중
          </div>
          <div style={{ fontSize: 18, fontWeight: 700, color: FT.ink, fontFamily: "'Jua', sans-serif" }}>{waitInfo.place}</div>
          <div style={{ fontSize: 14, marginTop: 8, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>
            다음 출발 <b style={{ color: FT.orangeDark }}>{waitInfo.time || "미정"}</b>
            {waitInfo.tripIdx ? <span style={{ fontSize: 11, color: FT.mute, marginLeft: 4 }}>({waitInfo.tripIdx}회차 · {ROUTES[waitInfo.dir].label})</span> : null}
          </div>
        </div>
      ) : (
      <React.Fragment>
      <div ref={stripRef} className="flex items-start gap-0 overflow-x-auto" style={{ scrollbarWidth: "none", paddingTop: 5, paddingBottom: 2 }}>
        {stops.map((s, i) => {
          // 정류장 점 색: 지나온 곳=청록, 곧 도착(ci)=주황(도착 시 청록), 미래=흰
          const isCur = i === ci;
          const isPast = i < ci;
          const dotBg = isCur ? (phase === "arrived" ? FT.teal : "#fff") : isPast ? FT.teal : "#fff";
          const dotBorder = isCur ? (phase === "arrived" ? FT.tealDark : FT.orangeDark) : isPast ? FT.tealDark : FT.mute;
          // 연결 막대 색: (i, i+1) 구간. (ci-1, ci) 구간은 주황 강조(곧 도착 막대)
          let segColor = "#D1D5DB", segH = 2;
          if (i < ci - 1) { segColor = FT.teal; }
          else if (i === ci - 1) { segColor = phase === "arrived" ? FT.teal : FT.orange; segH = 4; }
          return (
            <React.Fragment key={s.name}>
              <div ref={isCur ? activeRef : null} className="flex flex-col items-center flex-shrink-0">
                <div style={{
                  width: isCur ? 14 : 11, height: isCur ? 14 : 11, borderRadius: "50%",
                  background: dotBg, border: "2px solid " + dotBorder,
                  boxShadow: isCur && phase !== "arrived" ? `0 0 0 3px ${FT.orangeSoft}` : "none" }} />
                <span style={{ fontSize: 10, marginTop: 2, whiteSpace: "nowrap", padding: "0 4px",
                  color: isCur ? (phase === "arrived" ? FT.tealDark : FT.orangeDark) : isPast ? FT.tealDark : FT.mute,
                  fontWeight: isCur ? 700 : 400 }}>{s.name}</span>
              </div>
              {i < stops.length - 1 && <div className="flex-shrink-0 self-start" style={{ width: 16, height: segH, marginTop: 6 + (segH > 2 ? -1 : 0), background: segColor, borderRadius: 1 }} />}
            </React.Fragment>
          );
        })}
      </div>

      {/* 곧 도착 / 정차 중 / 진입 / 이탈 정보 — 진행바 아래 */}
      {(() => {
        const schedAt = sched && ci >= 0 ? sched[ci] : null;
        const mins = schedAt ? toMin(schedAt) - nowMin : null;
        const delayed = phase !== "arrived" && mins != null && mins < 0;
        const etaLabel = phase === "arrived" ? null
          : phase === "departed" ? null
          : mins == null ? null
          : mins > 0 ? `약 ${mins}분 후`
          : mins === 0 ? "잠시 후"
          : `지연 ${-mins}분`;
        // phase 별 색·라벨·표시 정류장
        const phaseLabel = phase === "arrived" ? "● 정차 중"
          : phase === "entering" ? "정류장 진입 중"
          : phase === "departed" ? "방금 출발"
          : phase === "waiting" ? "🅿️ 출발 대기"
          : "곧 도착";
        const isArrivedish = phase === "arrived";
        const accent = isArrivedish ? FT.tealDark : FT.orangeDark;
        const bgFill = isArrivedish ? FT.tealSoft : delayed ? "#FEE2E2" : FT.orangeSoft;
        const borderC = delayed ? "#dc2626" : accent;
        const etaColor = delayed ? "#dc2626" : accent;
        const displayStop = phase === "departed" && departedInfo?.stopName ? departedInfo.stopName : ((ci >= 0 && stops[ci]?.name) || bus.stop || "운행 중");
        return (
          <div style={{ marginTop: 6, padding: "7px 10px", borderRadius: 8,
            background: bgFill, border: "1.5px solid " + borderC,
            display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 11, color: borderC, fontFamily: "'Jua', sans-serif", fontWeight: 700, flexShrink: 0 }}>
              {phaseLabel}
            </span>
            <span className="truncate" style={{ fontSize: 13, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, flex: 1 }}>
              {displayStop}
            </span>
            <span style={{ flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "flex-end", lineHeight: 1.15 }}>
              {etaLabel && (
                <span style={{ fontSize: 12, color: etaColor, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{etaLabel}</span>
              )}
              {schedAt && (
                <span style={{ fontSize: 10, color: etaColor, fontFamily: "'IBM Plex Mono', monospace", opacity: 0.85 }}>
                  {delayed ? `${fromMin(toMin(schedAt) + (-mins))} 예상` : `${schedAt} 예정`}
                </span>
              )}
            </span>
          </div>
        );
      })()}

      {/* 남은 정류장 — 각 도착 예정 시각 (지연 누적 반영) */}
      {(() => {
        const ciSched = sched && ci >= 0 ? sched[ci] : null;
        if (!ciSched) return null;
        const ciSchedMin = toMin(ciSched);
        const delay = Math.max(0, nowMin - ciSchedMin); // 지연(분)
        const remaining = [];
        for (let i = ci + 1; i < stops.length; i++) {
          const t = sched && sched[i] ? sched[i] : null;
          if (!t) continue;
          const adj = (toMin(t) - ciSchedMin) + Math.max(0, ciSchedMin - nowMin);
          remaining.push({ name: stops[i].name, time: t, mins: adj, isFinal: i === stops.length - 1 });
        }
        if (remaining.length === 0) return null;
        return (
          <div style={{ marginTop: 6, padding: "7px 10px", background: FT.paper, border: "1.5px solid " + FT.mute + "55", borderRadius: 8 }}>
            <div className="flex items-center justify-between mb-1">
              <span style={{ fontSize: 10, color: FT.inkSoft, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>남은 정류장</span>
              {delay > 0 && <span style={{ fontSize: 10, color: "#dc2626", fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>+{delay}분 지연</span>}
            </div>
            <div className="space-y-1">
              {remaining.map((r) => (
                <div key={r.name} className="flex items-center gap-2" style={{ fontSize: 11, fontFamily: "'Jua', sans-serif" }}>
                  <span style={{ flex: 1, color: FT.ink, fontWeight: r.isFinal ? 700 : 400 }}>
                    {r.name}{r.isFinal ? " (종점)" : ""}
                  </span>
                  <span style={{ color: delay > 0 ? "#dc2626" : FT.inkSoft, fontWeight: 700, minWidth: 56, textAlign: "right" }}>
                    {r.mins === 0 ? "곧" : `${r.mins}분 후`}
                  </span>
                  <span style={{ color: FT.mute, fontFamily: "'IBM Plex Mono', monospace", minWidth: 44, textAlign: "right" }}>
                    {delay > 0 ? fromMin(toMin(r.time) + delay) : r.time}
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}
      </React.Fragment>
      )}
    </div>
  );
}

/* 승객 기본 화면 — 실시간 버스 목록(버스안내판 스타일) + 지도 탭. 제목 7번 탭하면 운영자(히든) 진입 */
function PassengerView({ dbUrl, onAdmin, initialTab = "list" }) {
  const [buses, setBuses] = useState({});
  const [tab, setTab] = useState(initialTab);
  const [conn, setConn] = useState("loading"); // loading | ok | error
  const [showTimetable, setShowTimetable] = useState(false);
  const [tableFocus, setTableFocus] = useState(null); // { dir, ti } — 다음 출발 카드 탭 시 해당 회차 강조
  const openTableAt = (dir, ti) => { setTableFocus({ dir, ti }); setShowTimetable(true); };
  const closeTable = () => { setShowTimetable(false); setTableFocus(null); };
  const [venueZone, setVenueZone] = useState(0);
  const [notice, setNotice] = useState(null); // P1-2: 운영자 공지/재난 안내
  const [noticeDismissedAt, setNoticeDismissedAt] = useState(() => parseInt(LS.get("noticeDismissedAt", "0"), 10) || 0);
  const tapRef = useRef(0), tapTimeRef = useRef(0);

  useEffect(() => {
    if (!dbUrl) { setConn("error"); return; }
    const base = dbUrl.replace(/\/+$/, "");
    let stopped = false;
    const poll = async () => {
      try {
        const r = await fetch(`${base}/buses.json`, { cache: "no-store" });
        const d = await r.json();
        setBuses(d || {});
        setConn("ok");
      } catch (_) { setConn("error"); }
    };
    poll();
    const id = setInterval(() => { if (!stopped) poll(); }, 3000);
    return () => { stopped = true; clearInterval(id); };
  }, [dbUrl]);

  // P1-2: 공지(notice) 폴링 — 30초 간격
  useEffect(() => {
    if (!dbUrl) return;
    const base = dbUrl.replace(/\/+$/, "");
    let stopped = false;
    const fetchNotice = async () => {
      try {
        const r = await fetch(`${base}/notice.json`, { cache: "no-store" });
        const d = await r.json();
        if (d && d.active && d.message) setNotice(d); else setNotice(null);
      } catch (_) {}
    };
    fetchNotice();
    const id = setInterval(() => { if (!stopped) fetchNotice(); }, 30000);
    return () => { stopped = true; clearInterval(id); };
  }, [dbUrl]);

  const dismissNotice = () => {
    if (!notice) return;
    LS.set("noticeDismissedAt", String(notice.ts || Date.now()));
    setNoticeDismissedAt(notice.ts || Date.now());
  };
  const showNotice = notice && (notice.ts || 0) > noticeDismissedAt;

  const onTitleTap = () => {
    const t = Date.now();
    if (t - tapTimeRef.current > 1500) tapRef.current = 0;
    tapTimeRef.current = t;
    if (++tapRef.current >= 7) { tapRef.current = 0; onAdmin(); }
  };

  const now = Date.now();
  const agoText = (ts) => { if (!ts) return ""; const s = Math.round((now - ts) / 1000); return s < 5 ? "방금" : s < 60 ? `${s}초 전` : `${Math.floor(s / 60)}분 전`; };
  const live = Object.entries(buses)
    .filter(([, b]) => b && (b.lat != null || b.stop) && (!b.ts || now - b.ts < 60000))
    .sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));

  // 이탈 정보 — 운영자가 departedFrom/departedAt을 직접 송신하면 우선 사용, 없으면 폴백 추적
  const prevArrivedRef = useRef({});
  const departedFallbackRef = useRef({});
  useEffect(() => {
    Object.entries(buses).forEach(([id, b]) => {
      if (!b) return;
      const prev = prevArrivedRef.current[id];
      if (prev && prev.arrived && !b.arrived) {
        departedFallbackRef.current[id] = { stopName: prev.stop || b.stop, at: Date.now() };
      }
      if (prev && prev.stop && b.stop && prev.stop !== b.stop) {
        delete departedFallbackRef.current[id];
      }
      prevArrivedRef.current[id] = { arrived: !!b.arrived, stop: b.stop };
    });
  }, [buses]);
  const getDepartedInfo = (id, b) => {
    if (b && b.departedFrom && b.departedAt && Date.now() - b.departedAt < 90000) {
      return { stopName: b.departedFrom, at: b.departedAt };
    }
    return departedFallbackRef.current[id] || null;
  };

  // 시간표(승객용) — 일요일(6.14)은 5회차, 그 외 6회차
  const d = getNow();
  const tripsToday = d.getMonth() === 5 && d.getDate() === 14 ? 5 : ROUTES.outbound.trips.length;
  const nowMin = d.getHours() * 60 + d.getMinutes();

  /* 정류장 기준 도착 안내 — 버스별 카드만 사용하므로 미사용
  const _stopArrivals = (() => {
    const items = [];
    const liveTripSet = new Set(); // dir|trip — 라이브로 커버되는 회차는 시간표 항목 제외
    for (const [busId, b] of live) {
      const dir = b.dir === "inbound" ? "inbound" : "outbound";
      const route = ROUTES[dir];
      const stops = route.stops;
      let ci = stops.findIndex((s) => s.name === b.stop);
      if (ci < 0) continue;
      // GPS 좌표 기반으로 실제 진행 위치 보정: 버스가 b.stop을 이미 지나갔다면 가장 가까운 노선 정류장으로 ci 전진
      if (b.lat != null && b.lng != null) {
        let bestI = -1, bestD = Infinity;
        for (let i = 0; i < stops.length; i++) {
          const s = stops[i]; if (s.lat == null) continue;
          const d = distanceMeters({ lat: b.lat, lng: b.lng }, s);
          if (d < bestD) { bestD = d; bestI = i; }
        }
        if (bestI > ci) ci = bestI; // 뒤로는 가지 않음(차량이 막 지난 정류장 잠깐 표시 유지)
      }
      if (b.trip) liveTripSet.add(`${dir}|${b.trip}`);
      const sched = route.trips[(b.trip || 1) - 1];
      if (!sched || !sched[ci]) continue;
      const ciSchedMin = toMin(sched[ci]);
      // 곧 도착 정류장의 지연(분). 시간표보다 늦으면 양수, 빠르면 0.
      const delay = Math.max(0, nowMin - ciSchedMin);
      // 보정된 도착 판정(30m 이내)
      const ciStop = stops[ci];
      const distToCi = ciStop.lat != null ? distanceMeters({ lat: b.lat, lng: b.lng }, ciStop) : null;
      const arrivedAtCi = distToCi != null && distToCi < 30;
      const start = arrivedAtCi ? ci + 1 : ci;
      for (let i = start; i < stops.length; i++) {
        const t = sched[i]; if (!t) continue;
        const adjMins = (toMin(t) - ciSchedMin) + Math.max(0, ciSchedMin - nowMin);
        items.push({
          kind: "live", busId, dir, dirLabel: route.label,
          name: stops[i].name, schedAt: t,
          mins: adjMins, delay, tripNum: b.trip || null,
          isFinal: i === stops.length - 1,
        });
      }
    }
    // 시간표 기반 — 라이브에 없는 회차의 미래 도착만
    ["outbound", "inbound"].forEach((dir) => {
      const route = ROUTES[dir];
      const trips = route.trips.slice(0, tripsToday);
      trips.forEach((tripSched, tIdx) => {
        const tripNum = tIdx + 1;
        if (liveTripSet.has(`${dir}|${tripNum}`)) return;
        route.stops.forEach((stop, i) => {
          const t = tripSched[i]; if (!t) return;
          const mins = toMin(t) - nowMin;
          if (mins < 0) return; // 지나간 시각 무시
          items.push({
            kind: "scheduled", busId: null, dir, dirLabel: route.label,
            name: stop.name, schedAt: t, mins, delay: 0, tripNum,
            isFinal: i === route.stops.length - 1,
          });
        });
      });
    });
    // 정류장(이름+방향)별로 그룹핑
    const map = new Map();
    items.forEach((it) => {
      const key = SHARED_STOPS.has(it.name) ? it.name : `${it.name} (${it.dirLabel})`;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(it);
    });
    // 노선 순 루프 위치 인덱스 — 광장→축제장(outbound) → 축제장→광장(inbound) 순서로 키를 정렬
    const routePos = {};
    let p = 0;
    const outLabel = ROUTES.outbound.label, inLabel = ROUTES.inbound.label;
    ROUTES.outbound.stops.forEach((s) => {
      const k = SHARED_STOPS.has(s.name) ? s.name : `${s.name} (${outLabel})`;
      if (!(k in routePos)) routePos[k] = p++;
    });
    ROUTES.inbound.stops.forEach((s) => {
      const k = SHARED_STOPS.has(s.name) ? s.name : `${s.name} (${inLabel})`;
      if (!(k in routePos)) routePos[k] = p++;
    });
    const out = [];
    map.forEach((arr, key) => {
      arr.sort((a, b) => a.mins - b.mins);
      out.push({ key, name: arr[0].name, dirLabel: arr[0].dirLabel, isShared: SHARED_STOPS.has(arr[0].name), arrivals: arr });
    });
    out.sort((a, b) => (routePos[a.key] ?? 999) - (routePos[b.key] ?? 999));
    return out;
  })();
  */
  const nextDep = (dir) => {
    const ts = ROUTES[dir].trips.slice(0, tripsToday);
    for (let i = 0; i < ts.length; i++) { if (toMin(ts[i][0]) >= nowMin) return { idx: i, time: ts[i][0] }; }
    return null;
  };
  // 시간표상 운행 중(이동/휴식 포함) 셔틀 유무 — "라이브 없음" 메시지와 상충 방지용
  const schedActive = (() => {
    const liveSet = new Set(live.map(([, b]) => `${b.dir === "inbound" ? "inbound" : "outbound"}|${b.trip || 1}`));
    for (const dir of ["outbound", "inbound"]) {
      for (let ti = 0; ti < tripsToday; ti++) {
        if (liveSet.has(`${dir}|${ti + 1}`)) continue;
        if (scheduledBusPos(dir, ti, nowMin)) return true;
      }
    }
    // 휴식 갭(outbound→inbound, inbound→outbound)
    for (let ti = 0; ti < tripsToday; ti++) {
      const ob = ROUTES.outbound.trips[ti], ib = ROUTES.inbound.trips[ti];
      if (ob && ib) {
        const a = toMin(ob[ob.length - 1]), b = toMin(ib[0]);
        if (a < b && nowMin >= a && nowMin < b && !liveSet.has(`inbound|${ti + 1}`)) return true;
      }
      const ib2 = ROUTES.inbound.trips[ti], nob = ROUTES.outbound.trips[ti + 1];
      if (ib2 && nob) {
        const a = toMin(ib2[ib2.length - 1]), b = toMin(nob[0]);
        if (a < b && nowMin >= a && nowMin < b && !liveSet.has(`outbound|${ti + 2}`)) return true;
      }
    }
    return false;
  })();
  const statusText = conn === "error" ? "연결 오류 — 잠시 후 다시 시도합니다"
    : conn === "loading" ? "연결 중…"
    : live.length > 0 ? `실시간 운행 중 · ${live.length}대`
    : schedActive ? "라이브 송신 없음 · 시간표 기준 진행 중"
    : "현재 운행 중인 셔틀이 없습니다";

  // 풋터 공통 — 어디서나 동일 3-버튼. 현재 화면(active)은 검정 강조, 활성 버튼 재클릭 시 홈(list) 복귀
  const renderFooter = (currentKey) => {
    const items = [
      { key: "map", label: "🗺️ 무등생각 지도" },
      { key: "venue", label: "🎪 행사장" },
      { key: "timetable", label: "🕒 시간표" },
    ];
    const handle = (key) => {
      if (key === "timetable") { setShowTimetable(true); return; }
      if (key === currentKey) { setTab("list"); return; } // 활성 탭 재클릭 → 홈
      if (key === "venue") setVenueZone(0);
      setTab(key);
    };
    return (
      <div className="grid grid-cols-3 gap-2"
        style={{ background: "#fff", borderTop: "2.5px solid " + FT.ink, padding: 10, flexShrink: 0 }}>
        {items.map((b) => {
          const active = b.key === currentKey;
          return (
            <button key={b.key} onClick={() => handle(b.key)} className="py-2.5 text-[12px]"
              title={active ? "다시 누르면 홈으로 돌아갑니다" : undefined}
              style={{ background: active ? FT.ink : "#fff",
                color: active ? "#fff" : FT.ink,
                border: "2px solid " + FT.ink, borderRadius: 10,
                boxShadow: active ? "none" : "2px 2px 0 " + FT.ink,
                transform: active ? "translate(2px, 2px)" : "none",
                fontFamily: "'Jua', sans-serif", fontWeight: 700, cursor: "pointer" }}>
              {b.label}
            </button>
          );
        })}
      </div>
    );
  };

  if (tab === "map") {
    return (
      <div style={{ height: "100dvh", display: "flex", flexDirection: "column", overflow: "hidden", background: "#000" }}>
        <div style={{ flex: 1, minHeight: 0, position: "relative" }}>
          <LiveMapView dbUrl={dbUrl} onHome={() => setTab("list")} />
        </div>
        {renderFooter("map")}
        {showTimetable && <TimetableModal tripsToday={tripsToday} onClose={closeTable} focusTrip={tableFocus} />}
      </div>
    );
  }
  if (tab === "venue") {
    return (
      <div className="w-full p-3 sm:p-5 flex flex-col items-center"
        style={{ height: "100dvh", overflow: "hidden", background: FT.paper,
          backgroundImage: "radial-gradient(circle at 15% -10%, rgba(22,168,158,0.18), transparent 45%), radial-gradient(circle at 85% 110%, rgba(238,107,46,0.14), transparent 45%)" }}>
        <div className="w-full max-w-md flex flex-col" style={{ flex: 1, minHeight: 0 }}>
          <div className="flex flex-col" style={{ flex: 1, minHeight: 0, background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 18, boxShadow: "4px 4px 0 " + FT.ink, overflow: "hidden" }}>
            {/* header — A·B: 로고+제목 영역 자체가 홈 버튼(좌측), 우상단 '← 목록' 버튼 키움(38px 높이, 13px) */}
            <div style={{ padding: "16px 18px 14px 18px", borderBottom: "2.5px solid " + FT.ink, background: "#fff", display: "flex", gap: 14, alignItems: "flex-start", position: "relative" }}>
              <button onClick={() => setTab("list")} aria-label="홈으로 — 로고/제목 영역 전체 탭 가능"
                title="탭하면 홈으로 돌아갑니다"
                style={{ display: "flex", alignItems: "flex-start", gap: 14, flex: 1, minWidth: 0, paddingRight: 12,
                  background: "transparent", border: "none", textAlign: "left", cursor: "pointer", font: "inherit", padding: 0 }}>
                <FestivalLogo size={44} on />
                <div style={{ minWidth: 0, flex: 1 }}>

                  <div style={{ fontSize: 22, color: FT.orange, fontFamily: "'Jua', sans-serif", fontWeight: 700, lineHeight: 1.15, marginTop: 4 }}>

                  </div>

              {/* 우측 버튼 제거 — 좌측 로고+제목 영역 자체가 홈 버튼(b236)으로 동작 */}
            </div>
            {/* body — VenueModal pageMode 콘텐츠 스크롤 */}
            <div style={{ background: FT.paper, padding: 12, flex: 1, minHeight: 0, overflowY: "auto" }}>

                onOpenLiveMap={() => setTab("map")} />

        {showTimetable && <TimetableModal tripsToday={tripsToday} onClose={closeTable} focusTrip={tableFocus} />}
