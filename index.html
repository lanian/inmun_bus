          authTokenRef.current = d.idToken;
          tokenIssuedAtRef.current = Date.now();
          setGpsError("");
        }
        else { authTokenRef.current = ""; setGpsError("쓰기 로그인 실패: " + ((d.error && d.error.message) || "정보 확인")); }
      } catch (_) { setGpsError("쓰기 로그인 네트워크 오류"); }
    };
    signIn();
    timer = setInterval(() => { if (!stopped) signIn(); }, 30 * 60 * 1000);
    // P0-1: 포커스 복귀 시 토큰 잔여 시간 짧으면 사전 재발급 + GPS 재요청
    const onVis = () => {
      if (document.visibilityState !== "visible" || stopped) return;
      const ageMin = (Date.now() - tokenIssuedAtRef.current) / 60000;
      if (!authTokenRef.current || ageMin > 25) signIn();
      // GPS 60초 이상 stale이면 한 번 강제 refresh (시뮬레이션은 자체 tick 이 fresh 유지)
      if (!FAKE_GPS && gpsLastUpdateRef.current && Date.now() - gpsLastUpdateRef.current > 60000 && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            gpsLastUpdateRef.current = Date.now();
            setUserPos({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, speed: pos.coords.speed });
          },
          () => {},
          { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
        );
      }
    };
    document.addEventListener("visibilitychange", onVis);
    return () => { stopped = true; clearInterval(timer); document.removeEventListener("visibilitychange", onVis); };
  }, [sharing, driverEmail, driverPass, apiKey]);

  /* --- 실시간 위치 공유: 켜져 있을 때 3초마다 broadcast (GPS 없어도 운행 정보 송신 가능) --- */
  const [_shareTick, _setShareTick] = useState(0);
  useEffect(() => {
    if (!sharing) return;
    const id = setInterval(() => _setShareTick((t) => t + 1), 5000);
    return () => clearInterval(id);
  }, [sharing]);
  useEffect(() => {
    if (!sharing || !shareUrl) return;
    const now = Date.now();
    // 송신 주기: 기본 5초. 실패 누적 시 지수 백오프(최대 60초)
    const fails = broadcastFailRef.current;
    const minGap = Math.min(60000, 5000 * Math.pow(1.5, Math.min(fails, 6)));
    if (now - lastShareRef.current < minGap) return;
    lastShareRef.current = now;
    const base = shareUrl.replace(/\/+$/, "");
    const auth = authTokenRef.current ? `?auth=${encodeURIComponent(authTokenRef.current)}` : "";
    // 좌표는 locShare ON 이고 GPS userPos가 있을 때만 첨부. 운행 정보는 항상 송신.
    const hasGps = locShare && userPos;
    // arrived/이탈 히스테리시스 — distanceMode 설정 따라 노선/직선 선택
    const distToCur = hasGps && curCoord
      ? (distanceMode === "straight"
          ? distanceMeters(userPos, curCoord)
          : routeDistanceToStop(userPos, direction, stops, currentIdx))
      : null;
    // P1: arrived 히스테리시스 + 속도 기반 — 진입 & 저속이면 arrived 확정, 해제>50m
    const speed = userPos && typeof userPos.speed === "number" ? userPos.speed : null;
    // 속도 정보가 보고되면 1.5 m/s(=5.4km/h) 미만일 때만 정차로 간주, 보고 안되면 더 엄격한 거리(<15m)로 폴백
    const speedSlow = speed != null && speed < 1.5;
    const arrivedDist = speed != null ? 30 : 15; // 속도 없을 땐 15m 안일 때만 도착 인정
    const canEnterArrived = (speed != null ? speedSlow : true);
    const prevArrived = arrivedStateRef.current;
    let arrivedNow = prevArrived;
    // P1-1: 일시정지(대기) 중에는 도착 히스테리시스/자동 출발 TTS 잠금
    if (manualWaiting) {
      arrivedNow = false;
    } else if (distToCur != null) {
      if (!prevArrived && distToCur < arrivedDist && canEnterArrived) arrivedNow = true;
      if (prevArrived && distToCur > 50) arrivedNow = false;
    } else if (prevArrived && (!hasGps)) {
      // GPS 끊기면 잠시 도착 유지하다가 다음 cycle에서 자연 해제
    }
    // P2: 이탈 전환 시 정류장명 기록 (90초 유지) + 출발 음성 cue (60초 쿨다운으로 노이즈 반복 방지)
    if (prevArrived && !arrivedNow && curStop?.name) {
      departedFromRef.current = { stop: curStop.name, at: now };
      if (autoMode && now - departureSpokenRef.current > 60000) {
        chimeThenSpeak("출발합니다. 안전하게 손잡이를 잡아주세요.");
        departureSpokenRef.current = now;
      }
      // 운행 모드: 이탈 즉시 다음 정류장으로 currentIdx advance
      // (반경 도달 전 화면에 N이 그대로 남아 있는 문제 해결)
      if (autoMode && currentIdx < stops.length - 1) {
        announcedRef.current.add(currentIdx);
        setCurrentIdx(currentIdx + 1);
      }
    }
    // 도착 진입 시 카운트 영역에 펄스 알람 + P2-5 운행 일지에 정류장별 도착 시각 기록
    if (!prevArrived && arrivedNow) {
      setArrivedPulse(Date.now());
      if (!tripStopArrivalRef.current[currentIdx]) {
        tripStopArrivalRef.current[currentIdx] = Date.now();
      }
    }
    arrivedStateRef.current = arrivedNow;
    const dep = departedFromRef.current;
    const departedInfo = dep && (now - dep.at < 90000) ? dep : null;
    const body = JSON.stringify({
      ...(hasGps ? { lat: userPos.lat, lng: userPos.lng } : {}),
      dir: direction, trip: tripIdx + 1,
      stop: curStop?.name || "", ts: now,
      session: sessionRef.current,
      waiting: manualWaiting || undefined,
      ...(arrivedNow ? { arrived: true } : {}),
      ...(departedInfo ? { departedFrom: departedInfo.stop, departedAt: departedInfo.at } : {}),
    });
    fetch(`${base}/buses/${encodeURIComponent(busId || "1")}.json${auth}`, { method: "PUT", body })
      .then((r) => {
        if ((r.status === 401 || r.status === 403) && driverEmail && driverPass) {
          // 인증 토큰 만료/거부 — 1분에 1회로 제한해 재로그인 시도(중복 호출 방지)
          const now2 = Date.now();
          if (!authRetryAtRef.current || now2 - authRetryAtRef.current > 60000) {
            authRetryAtRef.current = now2;
            authTokenRef.current = "";
            firebaseSignIn().then((d) => { if (d && d.idToken) { authTokenRef.current = d.idToken; tokenIssuedAtRef.current = Date.now(); } }).catch(() => {});
          }
        }
        if (!r.ok) throw new Error(String(r.status));
        if (broadcastFailRef.current !== 0) { broadcastFailRef.current = 0; setBroadcastStatus("ok"); setLastBroadcastStatus(null); }
        setBroadcastStats((p) => ({ lastAt: Date.now(), count: p.count + 1, failCount: 0 }));
      })
      .catch((err) => {
        const msg = String(err && err.message || err || "");
        // P0-1: 401/403(인증)은 broadcast 백오프에 포함하지 않음 — 토큰 재발급 경로(별도)에서 처리
        const isAuthErr = msg === "401" || msg === "403";
        if (!isAuthErr) broadcastFailRef.current += 1;
        // HTTP 숫자 코드인지, 네트워크 오류인지 구분
        const code = /^\d{3}$/.test(msg) ? msg : (typeof navigator !== "undefined" && navigator.onLine === false ? "오프라인" : "네트워크");
        setLastBroadcastStatus(code);
        setBroadcastStats((p) => ({ ...p, failCount: p.failCount + 1 }));
        if (broadcastFailRef.current >= 8) setBroadcastStatus("failing");
      });
  }, [_shareTick, userPos, sharing, shareUrl, busId, direction, tripIdx, curStop, curCoord, manualWaiting, locShare, distanceMode]);

  // 공유를 끄면(켰다가 끈 경우만) 내 위치 노드 삭제 — 지도에서 사라지게
  const wasSharingRef = useRef(false);
  useEffect(() => {
    if (sharing) { wasSharingRef.current = true; return; }
    if (!wasSharingRef.current || !shareUrl) return;
    wasSharingRef.current = false;
    const base = shareUrl.replace(/\/+$/, "");
    const auth = authTokenRef.current ? `?auth=${encodeURIComponent(authTokenRef.current)}` : "";
    fetch(`${base}/buses/${encodeURIComponent(busId || "1")}.json${auth}`, { method: "DELETE" }).catch(() => {});
  }, [sharing]);

  /* --- Trip status (출발 전/운행 중/지연/종료) — 지연 운행을 '종료'로 오표시하지 않음 --- */
  const tripStatus = useMemo(() => {
    const now = getNow(); const nowMin = now.getHours() * 60 + now.getMinutes();
    const start = toMin(trip[0]); const end = toMin(trip[trip.length - 1]);
    if (nowMin < start) return { state: "upcoming", label: `${start - nowMin}분 후 출발`, color: "#22d65f" };
    if (nowMin <= end + 5) return { state: "active", label: "운행 중", color: "#fbbf24" };
    if (nowMin <= end + 40) return { state: "active", label: "운행 중(지연)", color: "#fb923c" };
    return { state: "done", label: "운행 종료", color: "#64748b" };
  }, [trip, nowTick]);

  /* ===== SIMPLE MODE — operator/driver view ===== */
  // R3: 재설정 토스트 노드 — simple/advanced 양쪽 return 에서 재사용
  const resetToastNode = resetToast ? (
    <div role="status" aria-live="polite"
      style={{ position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)",
        background: "#0a0b0f", color: "#fbbf24", padding: "10px 16px",
        border: "2px solid #fbbf24", borderRadius: 12,
        fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 13,
        boxShadow: "3px 3px 0 #fbbf2466",
        zIndex: 100, maxWidth: "92vw", textAlign: "center" }}>
      {resetToast.text}
      {!resetToast.gps && (
        <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 3, fontWeight: 400 }}>GPS OFF — 정류장은 출발지로 설정됨</div>
      )}
    </div>
  ) : null;
  if (mode === "simple") {
    const arrivalDistText = distToNext != null ? fmtDist(distToNext) : null;
    // 시간표상 다음 정류장 예정 시각까지 남은 시간(초). +면 여유, -면 지연. FAKE 모드도 따라감.
    const _now = getNow();
    const nowSecNow = _now.getHours() * 3600 + _now.getMinutes() * 60 + _now.getSeconds();
    const nextSchedDiffSec = nextStop ? toMin(trip[currentIdx + 1]) * 60 - nowSecNow : null;
    // 이번 정류장 예정 시각 대비 (음수=지연, 양수=빠름)
    const curSchedDiffSec = curStop ? toMin(trip[currentIdx]) * 60 - nowSecNow : null;
    const fmtMS = (sec) => { const a = Math.abs(sec); const m = Math.floor(a / 60), s = a % 60; return m > 0 ? `${m}분 ${s}초` : `${s}초`; };
    return (
      <div className="mds-app-height w-full flex flex-col items-stretch"
        style={{ overflow: "hidden",
          paddingBottom: "calc(44px + env(safe-area-inset-bottom, 0px))",
          background: "#0a0b0f",
          backgroundImage: "repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px)" }}>
        {resetToastNode}
        <div className="w-full max-w-2xl mx-auto flex flex-col" style={{ flex: 1, minHeight: 0 }}>

          {/* Compact header — flex shrink 0 */}
          <div className="px-5 py-3 flex items-center justify-between flex-shrink-0"
            style={{ background: "linear-gradient(180deg, #2d3142 0%, #1c1f2b 100%)", borderBottom: "1px solid #3a3f54" }}>
            <div>
              <div className="text-[10px] text-amber-400/80 tracking-widest">제4회 무등산 인문축제</div>
              <div className="text-base font-bold leading-tight"
                style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
                {route.label} · {tripIdx + 1}회차
              </div>
              <div className="text-[10px] text-slate-400 mt-0.5"
                style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                {trip[0]} 출발 · {trip[trip.length - 1]} 도착 · <span style={{ color: tripStatus.color }}>{tripStatus.label}</span>
              </div>
            </div>
            <div className="flex flex-col items-end gap-1">
              <div className="flex items-center gap-1.5">
                {autoMode && <Navigation2 size={11} className={userPos ? "" : "animate-pulse"}
                  style={{ color: userPos ? "#22d65f" : "#fbbf24" }} />}
                <div className={`w-2 h-2 rounded-full ${isAnnouncing ? "animate-pulse" : ""}`}
                  style={{ background: isAnnouncing ? "#ef4444" : "#475569" }} />
              </div>
              <button onClick={() => setMode("advanced")}
                title="고급 설정으로 전환"
                className="text-slate-400 hover:text-amber-400 p-1">
                <Settings size={16} />
              </button>
            </div>
          </div>

          {/* 경고 배너 — busId 충돌 또는 broadcast 실패 */}
          {(busIdConflict || broadcastStatus === "failing") && (
            <div className="px-3 py-2 text-[12px] flex flex-col gap-1"
              style={{ background: "rgba(239,68,68,0.18)", borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54",
                color: "#fca5a5", fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
              {busIdConflict && (
                <div className="flex items-center justify-between gap-2">
                  <span>⚠ 같은 버스 번호({busId}) 다른 기기 송신 중 — 송신 자동 중지</span>
                  <button onClick={() => setBusIdConflict(false)} className="px-2 py-0.5 rounded text-[10px]"
                    style={{ background: "rgba(239,68,68,0.35)", color: "#fff", border: "1px solid rgba(239,68,68,0.5)" }}>
                    확인
                  </button>
                </div>
              )}
              {broadcastStatus === "failing" && (
                <div className="flex flex-col gap-1">
                  <div className="flex items-center justify-between gap-2">
                    <span>⚠ 위치 송신 실패{lastBroadcastStatus ? ` (${/^\d{3}$/.test(lastBroadcastStatus) ? "HTTP " + lastBroadcastStatus : lastBroadcastStatus})` : ""}</span>
                    <div className="flex items-center gap-2">
                      {lastBroadcastStatus === "401" || lastBroadcastStatus === "403" ? (
                        <button onClick={() => { authTokenRef.current = ""; authRetryAtRef.current = 0; firebaseSignIn().then((d) => { if (d && d.idToken) authTokenRef.current = d.idToken; broadcastFailRef.current = 0; setBroadcastStatus("ok"); setLastBroadcastStatus(null); }).catch(() => {}); }}
                          className="px-2 py-0.5 rounded text-[10px]"
                          style={{ background: "rgba(96,165,250,0.35)", color: "#fff", border: "1px solid rgba(96,165,250,0.5)" }}>
                          재로그인
                        </button>
                      ) : null}
                      <button onClick={() => { broadcastFailRef.current = 0; setBroadcastStatus("ok"); }}
                        className="px-2 py-0.5 rounded text-[10px]"
                        style={{ background: "rgba(239,68,68,0.35)", color: "#fff", border: "1px solid rgba(239,68,68,0.5)" }}>
                        확인
                      </button>
                    </div>
                  </div>
                  {(lastBroadcastStatus === "401" || lastBroadcastStatus === "403") && (
                    <div className="text-[10px] opacity-80">고급 설정 → 기사 로그인(이메일/비번)이 정확한지 확인하세요.</div>
                  )}
                  {(lastBroadcastStatus === "네트워크" || lastBroadcastStatus === "오프라인") && (
                    <div className="text-[10px] opacity-80">{lastBroadcastStatus === "오프라인" ? "오프라인 상태입니다. " : ""}네트워크(와이파이/모바일 데이터) 연결을 확인하세요.</div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* Big glanceable status bar — 우선순위: 송신실패>충돌>안내중>대기>송신중>GPS자동>수동 */}
          {(() => {
            const st = broadcastStatus === "failing" ? { c: "#ef4444", bg: "rgba(239,68,68,0.18)", t: "위치 송신 실패", pulse: true }
              : busIdConflict ? { c: "#fb923c", bg: "rgba(251,146,60,0.18)", t: "버스 번호 충돌", pulse: true }
              : isAnnouncing ? { c: "#fca5a5", bg: "rgba(239,68,68,0.18)", t: "안내 방송 중", pulse: true }
              : manualWaiting ? { c: "#60a5fa", bg: "rgba(96,165,250,0.18)", t: "출발 대기 중", pulse: true }
              // 위치 공유 ON — locShare/GPS 상태에 따라 분기
              : sharing && !locShare ? { c: "#22d65f", bg: "rgba(34,214,95,0.18)", t: "송신 중 · 운행만", pulse: false }
              : sharing && locShare && userPos ? { c: "#22d65f", bg: "rgba(34,214,95,0.18)", t: "송신 중 · 위치+운행", pulse: false }
              : sharing && locShare && !userPos ? { c: "#fbbf24", bg: "rgba(251,191,36,0.18)", t: "송신 중 · GPS 대기", pulse: true }
              // GPS 자동만 켜진 경우(공유 OFF) — 자체 진행만
              : autoMode && userPos ? { c: "#22d65f", bg: "rgba(34,214,95,0.15)", t: "GPS 자동 · 위치 정상", pulse: false }
              : autoMode ? { c: "#fbbf24", bg: "rgba(251,191,36,0.12)", t: "GPS 자동 · 신호 대기", pulse: true }
              : timetableMode ? (() => {
                  // A6: 지연 표시 — 예정 vs 실제 분 (FAKE 모드도 따라감)
                  const planned = trip[currentIdx];
                  const _now = getNow();
                  const _nowMin = _now.getHours() * 60 + _now.getMinutes();
                  const pMin = planned ? toMin(planned) : null;
                  const delay = pMin != null ? (_nowMin - pMin) : null;
                  let txt = `시간표 자동 · ${planned || "—"}`;
                  if (delay != null && delay !== 0) txt += ` · ${delay > 0 ? `${delay}분 지연` : `${-delay}분 빠름`}`;
                  const col = (delay != null && delay >= 3) ? "#ef4444" : "#fbbf24";
                  const bg = (delay != null && delay >= 3) ? "rgba(239,68,68,0.15)" : "rgba(251,191,36,0.15)";
                  return { c: col, bg, t: txt, pulse: false };
                })()
              : { c: "#94a3b8", bg: "rgba(100,116,139,0.12)", t: "수동 대기 중", pulse: false };
            return (
              <div className="px-3 py-2 flex items-center justify-between gap-2"
                style={{ background: st.bg, borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54" }}>
                <div className="flex items-center gap-2 min-w-0 flex-1">
                  <div className={`w-3 h-3 rounded-full flex-shrink-0 ${st.pulse ? "animate-pulse" : ""}`}
                    style={{ background: st.c }} />
                  <span className="text-base font-bold truncate" style={{ fontFamily: "'Jua', sans-serif", color: st.c }}>
                    {st.t}
                  </span>
                </div>
                {/* 송신 통계 — sharing 중일 때만 우측에 작게 */}
                {sharing && (
                  <div className="flex-shrink-0 text-[10px] text-right" style={{ color: st.c, opacity: 0.85, fontFamily: "'IBM Plex Mono', monospace", lineHeight: 1.25 }}>
                    {broadcastStats.lastAt ? (
                      <div>송신 {Math.max(0, Math.floor((Date.now() - broadcastStats.lastAt) / 1000))}s 전</div>
                    ) : <div>송신 대기</div>}
                    <div>누적 {broadcastStats.count} · 실패 {broadcastStats.failCount}</div>
                  </div>
                )}
                {!sharing && autoMode && autoLegSwitch && !isAnnouncing && (
                  <span className="flex-shrink-0 text-[10px] font-bold px-2 py-1 rounded"
                    style={{ background: "rgba(34,214,95,0.2)", color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                    자동 전환 ON
                  </span>
                )}
              </div>
            );
          })()}

          {/* 대기 표시 — 크게 가운데 배너(탭하여 해제) */}
          {manualWaiting && (
            <button onClick={() => setManualWaiting(false)}
              className="w-full flex flex-col items-center justify-center py-8"
              style={{ background: "linear-gradient(180deg, rgba(96,165,250,0.22) 0%, rgba(96,165,250,0.12) 100%)",
                borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54", cursor: "pointer" }}>
              <div style={{ fontSize: "clamp(2.2rem, 11vw, 3.2rem)", fontFamily: "'Black Han Sans', sans-serif", color: "#60a5fa",
                textShadow: "0 0 24px rgba(96,165,250,0.7), 0 0 48px rgba(96,165,250,0.3)", lineHeight: 1, letterSpacing: "-0.02em" }}>
                🅿️ 출발 대기 중
              </div>
              <div style={{ fontSize: 12, color: "#94a3b8", fontFamily: "'Jua', sans-serif", marginTop: 8, letterSpacing: 1 }}>
                탭하여 출발 · 대기 해제
              </div>
            </button>
          )}

          {/* 중앙 가변 영역 — Current (배경은 외곽 inherit) */}
          <div className="flex flex-col" style={{ flex: 1, minHeight: 0, overflowY: "auto" }}>
          {/* Current stop — BIG (배경 외곽 inherit, 줄 패턴은 외곽에 있음) */}
          <div className="px-5 py-6 flex flex-col justify-center flex-shrink-0"
            style={{ borderColor: "#3a3f54" }}>
            <div className="text-center mb-3 flex items-center justify-center gap-2 flex-wrap">
              <span className="text-[11px] tracking-[0.3em] px-3 py-1 rounded-full"
                style={{ color: "#fbbf24", background: "rgba(251, 191, 36, 0.1)",
                  fontFamily: "'IBM Plex Mono', monospace" }}>
                이번 정류장 · {trip[currentIdx]}
              </span>
              {curStop && autoMode && (() => {
                const t = getStopTiming(direction, curStop.name);
                const announced = announcedRef.current.has(currentIdx);
                const pending = pendingPassRef.current.has(currentIdx);
                const inRadius = distToCur != null && distToCur <= (curStop.radius || triggerRadius);
                let lbl, c;
                if (t === "pass") {
                  if (announced) { lbl = "통과 ✓"; c = "#22c55e"; }
                  else if (pending) { lbl = "통과 대기"; c = "#fbbf24"; }
                  else if (inRadius) { lbl = "진입"; c = "#60a5fa"; }
                  else { lbl = "접근 중"; c = "#64748b"; }
                } else if (t === "arrive") {
                  if (announced) { lbl = "도착 ✓"; c = "#22c55e"; }
                  else if (inRadius) { lbl = "도착 대기"; c = "#60a5fa"; }
                  else { lbl = "접근 중"; c = "#64748b"; }
                } else {
                  if (announced) { lbl = "진입 ✓"; c = "#22c55e"; }
                  else if (inRadius) { lbl = "진입 중"; c = "#60a5fa"; }
                  else { lbl = "접근 중"; c = "#64748b"; }
                }
                return (
                  <span className="text-[10px] px-2 py-0.5 rounded"
                    style={{ background: c + "26", color: c, border: `1px solid ${c}66`,
                      fontFamily: "'Jua', sans-serif", fontWeight: 700 }}
                    title={`타이밍: ${t === "pass" ? "통과" : t === "arrive" ? "도착" : "진입"} · 안내 ${announced ? "완료" : pending ? "통과 큐" : "대기"}`}>
                    {lbl}
                  </span>
                );
              })()}
              {distToCur != null && (
                <span className="text-[10px] px-2 py-0.5 rounded"
                  style={{ background: distToCur < triggerRadius ? "rgba(239,68,68,0.2)" : "rgba(251,191,36,0.12)",
                    color: distToCur < triggerRadius ? "#ef4444" : "#fbbf24",
                    fontFamily: "'IBM Plex Mono', monospace" }}
                  title="이번 정류장까지 남은 거리">
                  {distToCur < 10 ? `✓ ${fmtDist(distToCur)}` : `↓ ${fmtDist(distToCur)}`}
                </span>
              )}
            </div>
            {curSchedDiffSec != null && (
              <div className="text-center -mt-1 mb-2 text-[11px]"
                style={{ fontFamily: "'Jua', sans-serif",
                  color: curSchedDiffSec < -5 ? "#fb923c" : curSchedDiffSec > 5 ? "#22d65f" : "#94a3b8" }}>
                {curSchedDiffSec < -5 ? `시간표보다 ${fmtMS(curSchedDiffSec)} 지연`
                  : curSchedDiffSec > 5 ? `시간표보다 ${fmtMS(curSchedDiffSec)} 빠름`
                  : "정시 운행"}
              </div>
            )}
            <div className="text-center">
              <div style={{
                color: "#fbbf24",
                fontFamily: "'Black Han Sans', sans-serif",
                fontSize: "clamp(2.5rem, 14vw, 4.5rem)",
                lineHeight: 1,
                textShadow: "0 0 24px rgba(251, 191, 36, 0.7), 0 0 48px rgba(251, 191, 36, 0.3)",
                letterSpacing: "-0.02em",
                wordBreak: "keep-all",
              }}>
                {curStop?.name || "—"}
              </div>
              {curStop?.sub && (
                <div className="text-sm text-amber-500/70 mt-2">{curStop.sub}</div>
              )}
              {curStop?.terminus && (
                <div className="mt-3 inline-block px-2 py-0.5 rounded text-[10px]"
                  style={{ background: "rgba(239, 68, 68, 0.15)", color: "#fca5a5",
                    border: "1px solid rgba(239, 68, 68, 0.3)" }}>
                  종점
                </div>
              )}
            </div>
          </div>
          </div>{/* 중앙 가변 영역 끝 — 이후 운행 종료 / next stop / 승하차 / leg / gps / controls 는 하단 고정 */}

          {/* 오늘 운행 종료 표식 — 종일 끝(다음 leg 없음) 시 next stop 위에 노출 */}
          {!nextLegInfo && isAtTerminus && (
            <div className="px-5 py-2 flex-shrink-0"
              style={{ background: "rgba(100, 116, 139, 0.08)", borderTop: "1px solid #2c3142" }}>
              <div className="text-xs text-center text-slate-400" style={{ fontFamily: "'Jua', sans-serif", letterSpacing: 1 }}>
                🏁 오늘 운행 종료
              </div>
            </div>
          )}

          {/* Next leg connection — 다음 회차 전환(있을 때만), next stop 위로 이동 */}
          {nextLegInfo && isAtTerminus && (
            <div className="px-5 py-3 flex items-center justify-between gap-3 flex-shrink-0"
              style={{ background: "rgba(34, 214, 95, 0.15)", borderTop: "1px solid #3a3f54" }}>
              <div className="flex items-center gap-2 min-w-0">
                  <div className="flex flex-col items-center px-2 py-1 rounded"
                    style={{ background: "#22d65f" }}>
                    <span className="text-[8px] tracking-widest"
                      style={{ color: "#0a0b0f", fontFamily: "'IBM Plex Mono', monospace" }}>NEXT</span>
                    <span className="text-xs font-black"
                      style={{ color: "#0a0b0f", fontFamily: "'IBM Plex Mono', monospace" }}>
                      {nextLegInfo.departTime}
                    </span>
                  </div>
                  <div className="text-sm font-bold truncate"
                    style={{ color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                    {nextLegInfo.label} {nextLegInfo.tripNum}회차
                  </div>
                </div>
                <button onClick={goToNextLeg}
                  className="flex-shrink-0 px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap"
                  style={{ background: "#22d65f", color: "#0a0b0f",
                    fontFamily: "'Jua', sans-serif",
                    boxShadow: "0 0 16px rgba(34, 214, 95, 0.4)" }}>
                  전환 →
                </button>
            </div>
          )}

          {/* Next stop — 하단 고정, 배경 투명(외곽 inherit) */}
          <div className="px-5 py-4 flex items-center justify-between gap-3 flex-shrink-0"
            style={{ borderTop: "1px solid #2c3142" }}>
            <div className="flex-shrink-0 flex flex-col items-center px-3 py-1.5 rounded"
              style={{ background: "rgba(34, 214, 95, 0.12)", minWidth: 68 }}>
              <span className="text-[10px] tracking-widest text-emerald-400/80"
                style={{ fontFamily: "'IBM Plex Mono', monospace" }}>NEXT</span>
              <span className="text-base font-black text-emerald-400"
                style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                {nextStop ? trip[currentIdx + 1] : "종점"}
              </span>
            </div>
            <div className="flex-1 min-w-0 text-right">
              <div className="text-3xl font-bold leading-tight break-keep"
                style={{ color: nextStop ? "#e2e8f0" : "#64748b", fontFamily: "'Jua', sans-serif" }}>
                {nextStop?.name || "운행 종료"}
              </div>
              {nextStop && nextSchedDiffSec != null && (
                <div className="text-[13px] mt-1"
                  style={{ color: nextSchedDiffSec < 0 ? "#fb923c" : "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                  {nextSchedDiffSec >= 0 ? `예정까지 ${fmtMS(nextSchedDiffSec)}` : `${fmtMS(nextSchedDiffSec)} 지연`}
                </div>
              )}
              {arrivalDistText && nextStop && (
                <div className="text-[12px] mt-0.5"
                  style={{ color: distToNext < triggerRadius ? "#ef4444" : "#22d65f",
                    fontFamily: "'IBM Plex Mono', monospace" }}>
                  ↓ {arrivalDistText}
                </div>
              )}
            </div>
          </div>

          {/* 승하차 카운트 — 하단 고정, 현재 정류장 ± 입력 + 현재 탑승 + 종점 전원 하차 */}
          {countsEnabled && curStop && (() => {
            const key = `${direction}|${tripIdx + 1}|${curStop.name}`;
            const cur = counts[key] || { board: 0, alight: 0 };
            const Cell = ({ label, kind, color }) => (
              <div className="flex flex-col items-center" style={{ flex: 1 }}>
                <div className="text-[10px]" style={{ color: color + "cc", fontFamily: "'Jua', sans-serif", letterSpacing: 1 }}>{label}</div>
                <div className="flex items-center gap-2 mt-1">
                  <button onClick={() => updateCount(kind, -1)}
                    style={{ width: 44, height: 44, borderRadius: 12, background: color + "26", color: color, border: "1.5px solid " + color, fontSize: 22, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>−</button>
                  <div style={{ minWidth: 48, textAlign: "center", color: color, fontFamily: "'Black Han Sans', sans-serif", fontSize: 28, lineHeight: 1 }}>{cur[kind] || 0}</div>
                  <button onClick={() => updateCount(kind, +1)}
                    style={{ width: 44, height: 44, borderRadius: 12, background: color, color: "#0a0b0f", border: "1.5px solid " + color, fontSize: 24, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>+</button>
                </div>
              </div>
            );
            const pulseClass = arrivedPulse && (Date.now() - arrivedPulse < 6000) ? " arrived-alert" : "";
            const atTerminus = !!curStop.terminus;
            return (
              <div className={"px-5 py-3 flex-shrink-0" + pulseClass}
                style={{ borderTop: "1px solid #2c3142" }}>
                <div className="flex items-stretch gap-3">
                  {atTerminus ? (
                    <div className="flex flex-col items-center justify-center" style={{ flex: 1, color: "#64748b", fontFamily: "'Jua', sans-serif" }}>
                      <div className="text-[10px]" style={{ letterSpacing: 1 }}>탑승</div>
                      <div className="text-[11px] mt-1" style={{ color: "#94a3b8" }}>종점 — 승차 불가</div>
                    </div>
                  ) : (
                    <Cell label="탑승" kind="board" color="#22d65f" />
                  )}
                  <div style={{ width: 1, background: "#3a3f54" }} />
                  <Cell label="하차" kind="alight" color="#fb923c" />
                </div>
                <div className="flex items-center justify-between mt-2 px-1">
                  {(() => {
                    const ratio = busCapacity > 0 ? onboardCount / busCapacity : 0;
                    const c = ratio > 1 ? "#ef4444" : ratio > 0.8 ? "#fb923c" : ratio > 0.5 ? "#fbbf24" : onboardCount > 0 ? "#22d65f" : "#64748b";
                    const lbl = ratio > 1 ? "만석" : ratio > 0.8 ? "혼잡" : ratio > 0.5 ? "보통" : onboardCount > 0 ? "여유" : null;
                    return (
                      <span className="text-[10px] text-slate-400" style={{ fontFamily: "'Jua', sans-serif" }}>
                        현재 탑승 <span style={{ color: c, fontWeight: 700, fontSize: 13, marginLeft: 4 }}>{onboardCount}명</span>
                        {lbl && <span style={{ color: c, marginLeft: 6, fontSize: 10 }}>· {lbl} ({busCapacity}석)</span>}
                      </span>
                    );
                  })()}
                  <div className="flex items-center gap-2">
                    {curStop.terminus && onboardCount > 0 && (
                      <button onClick={alightAll}
                        className="px-3 py-1.5 rounded-lg text-[11px] font-bold"
                        style={{ background: "#fb923c", color: "#0a0b0f", fontFamily: "'Jua', sans-serif", border: "1px solid #fb923c" }}>
                        전원 하차 ({onboardCount}명)
                      </button>
                    )}
                    <button onClick={resetCountsCurrentTrip}
                      className="px-2 py-1 rounded text-[10px]"
                      style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)", fontFamily: "'Jua', sans-serif" }}>
                      이 회차 초기화
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* GPS error banner — 하단 고정 */}
          {(gpsError || permissionState === "denied") && (
            <div className="px-5 py-2 flex items-center gap-2 text-xs flex-shrink-0"
              style={{ background: "rgba(239,68,68,0.08)", borderTop: "1px solid #3a3f54", color: "#fca5a5" }}>
              <AlertCircle size={12} />
              <span className="flex-1">{permissionState === "denied" ? "위치 권한 차단됨" : gpsError}</span>
              <button onClick={retryPermission} className="text-emerald-400 underline">다시</button>
              <button onClick={() => setMode("advanced")}
                className="text-amber-400 underline">설정</button>
            </div>
          )}

          {/* Controls — 안내 버튼 영역, 배경 투명(외곽 inherit) */}
          <div className="px-5 py-4 flex flex-col items-center gap-3 flex-shrink-0"
            style={{ borderTop: "1px solid #2c3142" }}>
            <div className="flex items-center justify-between w-full">
              <button onClick={prev} disabled={currentIdx === 0}
                className="w-14 h-14 rounded-full flex items-center justify-center disabled:opacity-30"
                style={{ background: "rgba(251, 191, 36, 0.1)",
                  border: "1px solid rgba(251, 191, 36, 0.3)", color: "#fbbf24" }}>
                <SkipBack size={22} />
              </button>
              <button onClick={announce}
                className="w-24 h-24 rounded-full flex flex-col items-center justify-center relative"
                style={{
                  background: "linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%)",
                  boxShadow: isAnnouncing ? "0 0 36px rgba(239, 68, 68, 0.6)" : "0 0 36px rgba(251, 191, 36, 0.5)",
                  color: "#0a0b0f" }}>
                <Volume2 size={34} />
                <span className="text-[10px] font-bold mt-0.5" style={{ fontFamily: "'Jua', sans-serif" }}>
                  {isAnnouncing ? "다시" : "안내"}
                </span>
                {isAnnouncing && (<div className="absolute inset-0 rounded-full pointer-events-none"
                  style={{ boxShadow: "0 0 0 3px rgba(239, 68, 68, 0.6), 0 0 24px rgba(239, 68, 68, 0.4)" }} />)}
              </button>
              <button onClick={next} disabled={currentIdx >= stops.length - 1}
                className="w-14 h-14 rounded-full flex items-center justify-center disabled:opacity-30"
                style={{ background: "rgba(251, 191, 36, 0.1)",
                  border: "1px solid rgba(251, 191, 36, 0.3)", color: "#fbbf24" }}>
                <SkipForward size={22} />
              </button>
            </div>
          </div>

          {/* 1차 액션 영역 — isAnnouncing 시 '안내 정지' 가로 바로 대체, 아니면 운행/대기 세그먼트 */}
          {isAnnouncing ? (
            <button onClick={stopAnnounce}
              className="mt-3 w-full flex items-center justify-center gap-2"
              style={{ background: "#ef4444", color: "#0a0b0f",
                fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 14,
                border: "1.5px solid #ef4444", height: 44, cursor: "pointer" }}>
              <Pause size={14} /> 안내 정지
            </button>
          ) : sharing && (
            <div className="mt-3 grid grid-cols-2"
              style={{ overflow: "hidden",
                border: `1.5px solid ${manualWaiting ? "rgba(96,165,250,0.45)" : "rgba(34, 214, 95, 0.4)"}`,
                height: 44, transition: "border-color 0.18s" }}>
              <button onClick={() => setManualWaiting(false)}
                style={{
                  background: !manualWaiting ? "#22d65f" : "transparent",
                  color: !manualWaiting ? "#0a0b0f" : "#64748b",
                  fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 14,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  cursor: "pointer", border: "none",
                  transition: "all 0.18s",
                }}>
                운행 중
              </button>
              <button onClick={() => setManualWaiting(true)}
                style={{
                  background: manualWaiting ? "#60a5fa" : "transparent",
                  color: manualWaiting ? "#0a0b0f" : "#64748b",
                  fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 14,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  cursor: "pointer", border: "none",
                  borderLeft: "1px solid rgba(100, 116, 139, 0.3)",
                  transition: "all 0.18s",
                }}>
                대기
              </button>
            </div>
          )}
          {/* spacer 제거 — outer paddingBottom 으로 핸들 공간 처리 */}

          {/* 펼침 시 본문 어둡게 — 탭하면 패널 닫기 */}
          {bottomPanelOpen && (
            <div onClick={() => setBottomPanelOpen(false)} aria-hidden="true"
              style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.35)",
                zIndex: 89, transition: "opacity 0.18s" }} />
          )}

          {/* 하단 오버레이 설정 패널 — 핸들은 항상 노출, 타일은 펼침 시만 슬라이드 업 */}
          <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 90,
            background: "linear-gradient(180deg, rgba(10,11,15,0.96) 0%, #0a0b0f 50%)",
            backdropFilter: "blur(8px)",
            borderTop: "1px solid #1c1f2b",
            paddingBottom: "env(safe-area-inset-bottom, 0px)",
            boxShadow: bottomPanelOpen ? "0 -8px 24px rgba(0,0,0,0.5)" : "none",
            transition: "box-shadow 0.18s",
          }}>
            <button onClick={() => setBottomPanelOpen((v) => !v)}
              aria-expanded={bottomPanelOpen}
              aria-label={bottomPanelOpen ? "설정 패널 숨기기" : "설정 패널 펼치기"}
              style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                padding: "10px 14px", background: "transparent", border: "none", cursor: "pointer",
                fontFamily: "'Jua', sans-serif", fontSize: 13, fontWeight: 700, color: "#94a3b8" }}>
              <span style={{ fontSize: 16, lineHeight: 1 }}>{bottomPanelOpen ? "▼" : "▲"}</span>
              <span>{bottomPanelOpen ? "설정 숨기기" : "설정 펼치기"}</span>
              <span style={{ fontSize: 10, color: "#475569", fontFamily: "'IBM Plex Mono', monospace", marginLeft: 8 }}>
                {currentIdx + 1}/{stops.length} · {tripsToday}회 · {BUILD}
              </span>
            </button>
            {bottomPanelOpen && (
            <div className="grid grid-cols-3 gap-3 px-3 pb-3 op-panel-grid">
            {(() => {
              const tileStyle = (active, color, off = "#94a3b8") => ({
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6,
                padding: "14px 10px 12px", borderRadius: 10, minHeight: 88,
                background: active ? color.bg : "rgba(100, 116, 139, 0.08)",
                color: active ? color.fg : off,
                border: `1.5px solid ${active ? color.border : "rgba(100,116,139,0.28)"}`,
                fontFamily: "'Jua', sans-serif", fontSize: 13, fontWeight: 700, lineHeight: 1.2, textAlign: "center",
                cursor: "pointer",
              });
              return (
                <>
                  <button onClick={() => {
                      if (permissionState === "denied") { setMode("advanced"); return; }
                      if (!autoMode) {
                        primeTTS();
                        if (timetableMode) setTimetableMode(false);
                        lastAnnounceRef.current = { idx: -1, at: 0 };
                      }
                      setAutoMode(!autoMode);
                    }}
                    className="op-tile"
                    style={tileStyle(autoMode, { bg: "rgba(34, 214, 95, 0.22)", bg2: "rgba(34, 214, 95, 0.08)", fg: "#22d65f", border: "rgba(34, 214, 95, 0.45)", shadow: "rgba(34,214,95,0.25)" })}>
                    <Navigation size={26} />
                    <span>GPS 자동</span>
                    <span style={{ fontSize: 10, opacity: 0.85, fontWeight: 400 }}>
                      {autoMode ? (userPos ? (gpsStale ? "신호 약함" : `${triggerRadius}m`) : "신호 대기") : "OFF"}
                    </span>
                  </button>
                  <button onClick={() => {
                      if (!timetableMode) {
                        primeTTS();
                        if (autoMode) setAutoMode(false);
                        lastAnnounceRef.current = { idx: -1, at: 0 };
                      }
                      setTimetableMode(!timetableMode);
                    }}
                    title="시간표 시각에 맞춰 자동으로 진행·안내"
                    className="op-tile"
                    style={tileStyle(timetableMode, { bg: "rgba(251,191,36,0.25)", bg2: "rgba(251,191,36,0.08)", fg: "#fbbf24", border: "rgba(251,191,36,0.5)", shadow: "rgba(251,191,36,0.25)" })}>
                    <Clock size={26} />
                    <span>시간표 자동</span>
                    <span style={{ fontSize: 10, opacity: 0.85, fontWeight: 400 }}>{timetableMode ? "ON" : "OFF"}</span>
                  </button>
                  <button onClick={toggleSharing}
                    className="op-tile"
                    style={tileStyle(sharing, { bg: "rgba(96,165,250,0.25)", bg2: "rgba(96,165,250,0.08)", fg: "#60a5fa", border: "rgba(96,165,250,0.45)", shadow: "rgba(96,165,250,0.25)" })}>
                    <span style={{ position: "relative", display: "inline-block", width: 26, height: 26 }}>
                      <span style={{ position: "absolute", inset: 0, borderRadius: "50%", border: "2.5px solid currentColor" }} />
                      <span className={sharing ? "absolute animate-pulse" : "absolute"}
                        style={{ width: 8, height: 8, borderRadius: "50%", background: sharing ? "#60a5fa" : "#64748b", top: "50%", left: "50%", transform: "translate(-50%, -50%)" }} />
                    </span>
                    <span>{sharing ? "공유" : "공유 OFF"}</span>
                    <span style={{ fontSize: 10, opacity: 0.85, fontWeight: 400 }}>
                      {sharing ? (locShare ? "위치+운행" : "운행만") : "—"}
                    </span>
                  </button>
                  <button onClick={() => sharing && setLocShare((v) => !v)}
                    disabled={!sharing}
                    title={!sharing ? "공유를 먼저 켜세요" : locShare ? "GPS 좌표 송신 중 — 끄면 운행 정보만" : "운행 정보만 송신 중 — 켜면 좌표도 송신"}
                    className="op-tile"
                    style={(() => {
                      const s = tileStyle(sharing && locShare, { bg: "rgba(96,165,250,0.25)", bg2: "rgba(96,165,250,0.08)", fg: "#60a5fa", border: "rgba(96,165,250,0.45)", shadow: "rgba(96,165,250,0.25)" });
                      if (!sharing) { s.opacity = 0.45; s.cursor = "not-allowed"; }
                      return s;
                    })()}>
                    <span style={{ fontSize: 28, lineHeight: 1 }}>📍</span>
                    <span>위치 송신</span>
                    <span style={{ fontSize: 10, opacity: 0.85, fontWeight: 400 }}>
                      {!sharing ? "공유 OFF" : locShare ? "ON" : "OFF"}
                    </span>
                  </button>
                  <button onClick={() => setShowTimetable(true)}
                    className="op-tile"
                    style={tileStyle(true, { bg: "rgba(251,191,36,0.10)", bg2: "rgba(251,191,36,0.03)", fg: "#fbbf24", border: "rgba(251,191,36,0.30)", shadow: "rgba(251,191,36,0.18)" })}>
                    <Clock size={26} />
                    <span>시간표</span>
                    <span style={{ fontSize: 10, opacity: 0.7, fontWeight: 400 }}>회차 표</span>
                  </button>
                  <button onClick={() => {
                      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
                      else document.exitFullscreen?.();
                    }}
                    className="op-tile"
                    style={tileStyle(true, { bg: "rgba(203,213,225,0.08)", bg2: "rgba(203,213,225,0.02)", fg: "#cbd5e1", border: "rgba(203,213,225,0.25)", shadow: "rgba(0,0,0,0.25)" })}>
                    <span style={{ fontSize: 28, lineHeight: 1 }}>⛶</span>
                    <span>전체화면</span>
                    <span style={{ fontSize: 10, opacity: 0.7, fontWeight: 400 }}>F</span>
                  </button>
                </>
              );
            })()}
            </div>
            )}
          </div>

          {showTimetable && <TimetableModal tripsToday={tripsToday} onClose={() => setShowTimetable(false)} />}
          {showStats && <StatsModal counts={counts} dateKey={dateKey} onClose={() => setShowStats(false)} onReset={resetCountsToday} busCapacity={busCapacity} setBusCapacity={setBusCapacity} countsEnabled={countsEnabled} setCountsEnabled={setCountsEnabled} />}
        </div>
      </div>
    );
  }

                <button onClick={() => setEditing(p => ({ ...p, lat: userPos.lat, lng: userPos.lng }))}
                  className="px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1"
                  style={{ background: "rgba(34, 214, 95, 0.15)", color: "#22d65f", border: "1px solid rgba(34, 214, 95, 0.3)" }}>
                  <Crosshair size={12} /> 현재 GPS
                </button>
              )}
              <button onClick={() => setEditing(null)}
                className="flex-1 px-3 py-2 rounded-lg text-xs"
                style={{ background: "rgba(100, 116, 139, 0.15)", color: "#94a3b8", border: "1px solid #3a3f54" }}>
                취소
              </button>
              <button onClick={saveCoordEditor}
                className="flex-1 px-3 py-2 rounded-lg text-xs font-bold"
                style={{ background: "#fbbf24", color: "#0a0b0f", fontFamily: "'Jua', sans-serif" }}>
                저장
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Intro() {
  return (
    <div className="boot">
      <img src="logo.png" alt="무등생각" />
      <div className="slogan">생각을 끄고, 생각을 켜다</div>
      <div className="who">제4회 동구 무등산 인문축제</div>
      <div className="accent">&lt;무등생각&gt; 셔틀버스 안내</div>
      <div className="dots"><span className="dot"></span><span className="dot"></span><span className="dot"></span></div>
    </div>
  );
}
function Root() {
  const params = new URLSearchParams(window.location.search);
  const [admin, setAdmin] = useState(params.get("admin") === "1");
  const [ready, setReady] = useState(false);
  useEffect(() => { const t = setTimeout(() => setReady(true), 2000); return () => clearTimeout(t); }, []);
  if (!ready) return <Intro />;
  // P2-3: ?view=ops — 운영자 본부 대시보드 (Intro 끝난 뒤 즉시 진입)
  if (params.get("view") === "ops") return (<><FakeTimeIndicator /><OpsDashboard dbUrl={params.get("db") || SHARE_DB} /></>);
  if (admin) return (<><FakeTimeIndicator /><App /></>);
  const initialTab = params.get("view") === "map" ? "map" : "list";
  return (<><FakeTimeIndicator /><PassengerView dbUrl={params.get("db") || SHARE_DB} onAdmin={() => setAdmin(true)} initialTab={initialTab} /></>);
}

/* 테스트 모드 인디케이터 — FAKE 활성 시 상단 중앙에 호박색 chip 으로 가짜 시각 + 해제 버튼 노출.
   1초마다 갱신, 가속 배율도 함께 표시. 모든 화면(승객/운영자/대시보드) 공통. */
function FakeTimeIndicator() {
  if (!FAKE) return null;
  const [, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, []);
  const d = getNow();
  const ymd = `${d.getMonth() + 1}/${d.getDate()}`;
  const hms = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}`;
  const dow = ["일","월","화","수","목","금","토"][d.getDay()];
  const clearFake = () => {
    if (!window.confirm("테스트 모드 해제 — 실시각으로 돌아갈까요?")) return;
    try {
      localStorage.removeItem("shuttle:fakeNow");
      localStorage.removeItem("shuttle:fakeSpeed");
      localStorage.removeItem("shuttle:fakeGps");
    } catch (_) {}
    try {
      const u = new URL(window.location.href);
      u.searchParams.delete("fake");
      u.searchParams.delete("fakeSpeed");
      window.location.href = u.toString();
    } catch (_) {
      window.location.reload();
    }
  };
  return (
    <div role="status" aria-label="테스트 모드 가짜 시각"
      style={{ position: "fixed", top: "calc(4px + env(safe-area-inset-top, 0px))", left: "50%",
        transform: "translateX(-50%)", zIndex: 5000, pointerEvents: "auto",
        display: "inline-flex", alignItems: "center", gap: 6,
        background: "#fbbf24", color: "#101113",
        border: "1.5px solid #101113", borderRadius: 999,
        padding: "3px 10px 3px 8px", fontSize: 11,
        fontFamily: "'Jua', sans-serif", fontWeight: 700,
        boxShadow: "1.5px 1.5px 0 #101113" }}>
      <span aria-hidden style={{ fontSize: 12 }}>🧪</span>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{ymd}({dow}) {hms}</span>
      {FAKE.speed !== 1 && (
        <span style={{ fontSize: 10, opacity: 0.85, fontFamily: "'IBM Plex Mono', monospace" }}>×{FAKE.speed}</span>
      )}
      {FAKE_GPS && (
        <span aria-label="GPS 시뮬레이션 활성"
          style={{ fontSize: 10, fontFamily: "'Jua', sans-serif", padding: "1px 5px", borderRadius: 999,
            background: "#101113", color: "#22c55e", border: "1px solid #22c55e", lineHeight: 1.3 }}>
          📍시뮬
        </span>
      )}
      <button onClick={clearFake} aria-label="테스트 모드 해제"
        style={{ background: "rgba(16,17,19,0.18)", border: "1px solid #101113", color: "#101113",
          padding: "0 8px", marginLeft: 2, borderRadius: 999, fontSize: 10, fontFamily: "'Jua', sans-serif",
          fontWeight: 700, cursor: "pointer", lineHeight: 1.6 }}>
        해제
      </button>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

<script>
  /* P1-3: 지도 타일 캐시 서비스워커 등록 + 행사장 영역 z14~16 prefetch.
     이전 자폭 SW 가 설치돼 있어도 update 시점에 새 sw.js 로 교체됨.
     SW 는 *.tile.openstreetmap.org 만 cache-first 로 가로채므로 index.html 등은 항상 네트워크. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js")
        .then((reg) => {
          // 행사장 영역 z14~16 타일 prefetch — 24h 안에 한 번만, LTE 약전계 대비
          try {
            const PREFETCH_KEY = "shuttle:tilesPrefetchAt";
            const last = parseInt(localStorage.getItem(PREFETCH_KEY) || "0", 10);
            if (Date.now() - last < 24 * 3600 * 1000) return;
            const subdomains = ["a", "b", "c"];
            const bounds = { latMin: 35.125, latMax: 35.150, lngMin: 126.915, lngMax: 126.970 };
            const tileXY = (lat, lng, z) => {
              const n = Math.pow(2, z);
              const x = Math.floor((lng + 180) / 360 * n);
              const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);
              return { x, y };
            };
            const urls = [];
            for (const z of [14, 15, 16]) {
              const min = tileXY(bounds.latMax, bounds.lngMin, z);
              const max = tileXY(bounds.latMin, bounds.lngMax, z);
              for (let x = min.x; x <= max.x; x++) {
                for (let y = min.y; y <= max.y; y++) {
                  const s = subdomains[(x + y) % subdomains.length];
                  urls.push(`https://${s}.tile.openstreetmap.org/${z}/${x}/${y}.png`);
                }
              }
            }
            const send = () => {
              if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: "PREFETCH_TILES", urls });
                localStorage.setItem(PREFETCH_KEY, String(Date.now()));
              }
            };
            if (navigator.serviceWorker.controller) send();
            else navigator.serviceWorker.addEventListener("controllerchange", send, { once: true });
          } catch (_) {}
        })
        .catch(() => {});
    });
  }
</script>
