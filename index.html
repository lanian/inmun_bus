              minHeight: 40, borderRadius: 8, padding: "0 10px",
              background: "rgba(96,165,250,0.15)", color: "#60a5fa",
              border: "1px solid rgba(96,165,250,0.4)",
              fontFamily: "'Jua', sans-serif", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
            만료 정리 ({expiredCount})
          </button>
          <button onClick={wipeAll} disabled={loading || items.length === 0}
            style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              minHeight: 40, borderRadius: 8, padding: "0 10px",
              background: "rgba(239,68,68,0.15)", color: "#fca5a5",
              border: "1px solid rgba(239,68,68,0.4)",
              fontFamily: "'Jua', sans-serif", fontSize: 12, fontWeight: 700,
              cursor: items.length === 0 ? "default" : "pointer",
              opacity: items.length === 0 ? 0.4 : 1 }}>
            전체 비우기
          </button>
        </div>
        {status && <div className="text-[11px]" style={{ color: status.startsWith("✅") ? "#22d65f" : status.startsWith("⚠") ? "#fca5a5" : "#fbbf24" }}>{status}</div>}
        <div className="space-y-1">
          {loading ? (
            <div className="text-[11px] text-slate-500 text-center py-4">불러오는 중…</div>
          ) : items.length === 0 ? (
            <div className="text-[11px] text-slate-500 text-center py-4">아직 스티커가 없어요.</div>
          ) : items.map((it) => {
            const ageMin = Math.floor((now - it.ts) / 60000);
            const expired = it.ts < now - STICKER_TTL_MS;
            return (
              <div key={it.id} className="flex items-center gap-2 p-2 rounded-lg"
                style={{ background: expired ? "rgba(100,116,139,0.10)" : "rgba(34,214,95,0.06)",
                  border: "1px solid " + (expired ? "#3a3f54" : "rgba(34,214,95,0.25)") }}>
                <span style={{ fontSize: 22, lineHeight: 1, width: 28, textAlign: "center" }}>{it.kind || "📍"}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="text-[11px]" style={{ color: "#cbd5e1", fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
                    {ageMin <= 0 ? "방금" : `${ageMin}분 전`} {expired && <span style={{ color: "#fb923c" }}>· 만료</span>}
                  </div>
                  <div className="text-[10px] text-slate-500" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                    {it.lat.toFixed(5)}, {it.lng.toFixed(5)}
                  </div>
                  {it.label && <div className="text-[10px] text-slate-400 mt-0.5 truncate">{it.label}</div>}
                </div>
                <button onClick={() => removeOne(it.id)}
                  style={{ padding: "5px 10px", borderRadius: 6,
                    background: "rgba(239,68,68,0.15)", color: "#fca5a5",
                    border: "1px solid rgba(239,68,68,0.4)",
                    fontFamily: "'Jua', sans-serif", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                  삭제
                </button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* 행사 구역 좌표 편집기 — 운영자 전용. 지도에서 드래그로 위치 설정 + Firebase /zones 동기화 */
function ZoneEditor({ onClose, dbUrl, getAuth, refreshAuth }) {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const markersRef = useRef({});
  const subMarkersRef = useRef({}); // { [zoneNum]: [marker, ...] }
  const zonesRef = useRef({});
  const cleanSubs = (arr) => Array.isArray(arr)
    ? arr.filter((s) => s && typeof s.lat === "number" && typeof s.lng === "number")
        .map((s) => ({ name: String(s.name || ""), lat: s.lat, lng: s.lng }))
    : [];
  const cleanPoints = (arr) => Array.isArray(arr)
    ? arr.filter((p) => Array.isArray(p) && typeof p[0] === "number" && typeof p[1] === "number").map((p) => [p[0], p[1]])
    : [];
  const BUILTIN_NUMS = FESTIVAL_ZONES.map((z) => z.num);
  const isBuiltinNum = (n) => BUILTIN_NUMS.includes(Number(n));
  const builtinMeta = (n) => FESTIVAL_ZONES.find((z) => z.num === Number(n));
  const [zones, setZones] = useState(() => {
    const ls = LS.getJSON("zones", {});
    const out = {};
    FESTIVAL_ZONES.forEach((z) => {
      const o = ls[z.num] || {};
      out[z.num] = {
        title: typeof o.title === "string" && o.title ? o.title : z.title,
        sub: typeof o.sub === "string" ? o.sub : (z.sub || ""),
        lat: typeof o.lat === "number" ? o.lat : z.lat,
        lng: typeof o.lng === "number" ? o.lng : z.lng,
        rA: typeof o.rA === "number" ? o.rA : (z.rA || 80),
        rB: typeof o.rB === "number" ? o.rB : (z.rB || 80),
        rot: typeof o.rot === "number" ? o.rot : (z.rot || 0),
        subs: Array.isArray(o.subs) ? cleanSubs(o.subs) : cleanSubs(z.subs),
        points: cleanPoints(o.points),
        smooth: !!o.smooth,
      };
    });
    // 사용자 추가 zone 도 함께 복원
    Object.entries(ls).forEach(([k, o]) => {
      if (out[k] || !o || typeof o.lat !== "number" || typeof o.lng !== "number") return;
      out[k] = {
        title: typeof o.title === "string" && o.title ? o.title : `새 구역 ${k}`,
        sub: typeof o.sub === "string" ? o.sub : "",
        lat: o.lat, lng: o.lng,
        rA: typeof o.rA === "number" ? o.rA : 80,
        rB: typeof o.rB === "number" ? o.rB : 80,
        rot: typeof o.rot === "number" ? o.rot : 0,
        subs: cleanSubs(o.subs),
        points: cleanPoints(o.points),
        smooth: !!o.smooth,
      };
    });
    return out;
  });
  useEffect(() => { zonesRef.current = zones; }, [zones]);
  const [msg, setMsg] = useState("");
  /* Firebase에서 초기 zones 불러오기 */
  useEffect(() => {
    if (!dbUrl) return;
    const base = dbUrl.replace(/\/+$/, "");
    fetch(`${base}/zones.json`).then((r) => r.json()).then((d) => {
      if (!d || typeof d !== "object") return;
      setZones((prev) => {
        const next = { ...prev };
        Object.entries(d).forEach(([k, v]) => {
          if (v && typeof v.lat === "number" && typeof v.lng === "number") {
            const bm = builtinMeta(k);
            next[k] = {
              title: typeof v.title === "string" && v.title ? v.title : (prev[k]?.title || (bm ? bm.title : `새 구역 ${k}`)),
              sub: typeof v.sub === "string" ? v.sub : (prev[k]?.sub || (bm ? (bm.sub || "") : "")),
              lat: v.lat, lng: v.lng,
              rA: typeof v.rA === "number" ? v.rA : (prev[k]?.rA || 80),
              rB: typeof v.rB === "number" ? v.rB : (prev[k]?.rB || 80),
              rot: typeof v.rot === "number" ? v.rot : (prev[k]?.rot || 0),
              subs: Array.isArray(v.subs) ? cleanSubs(v.subs) : (prev[k]?.subs || []),
              points: cleanPoints(v.points),
              smooth: !!v.smooth,
            };
          }
        });
        return next;
      });
    }).catch(() => {});
  }, [dbUrl]);
  /* 지도 초기화 + 5개 zone draggable 마커 추가(한 번만) */
  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const L = window.L;
    const init = zonesRef.current;
    const initLat = (Object.values(init)[0] || {}).lat || 35.133;
    const initLng = (Object.values(init)[0] || {}).lng || 126.96;
    const map = L.map(elRef.current).setView([initLat, initLng], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    mapRef.current = map;
    // 5개 모두 보이도록 fitBounds (마커는 별도 useEffect 에서 생성)
    const coords = Object.values(init).map((v) => [v.lat, v.lng]);
    if (coords.length) map.fitBounds(coords, { padding: [40, 40] });
    setTimeout(() => map.invalidateSize(), 80);
    return () => { map.remove(); mapRef.current = null; markersRef.current = {}; subMarkersRef.current = {}; };
  }, []);
  /* zones 변경 시 마커 lifecycle — 추가/제거/위치+폴리곤 동기화 */
  useEffect(() => {
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    const currentNums = new Set(Object.keys(zones));
    // 1) 제거된 zone 의 마커/폴리곤 삭제
    Object.keys(markersRef.current).forEach((n) => {
      if (!currentNums.has(n)) {
        const ref = markersRef.current[n];
        try { ref && ref.marker && map.removeLayer(ref.marker); } catch (_) {}
        try { ref && ref.poly && map.removeLayer(ref.poly); } catch (_) {}
        delete markersRef.current[n];
      }
    });
    // 2) 새/기존 zone 의 마커 생성 또는 위치/폴리곤 동기화
    Object.entries(zones).forEach(([num, v]) => {
      if (!v || typeof v.lat !== "number" || typeof v.lng !== "number") return;
      const c = Number(num) % 2 ? "#fb923c" : "#22d65f";
      let ref = markersRef.current[num];
      if (!ref) {
        const html = `<div style="display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 4px;border-radius:8px;background:${c};color:#0a0b0f;border:2px solid #101113;box-shadow:2px 2px 0 #101113;font-family:'Jua',sans-serif;font-weight:700;font-size:13px;">${num}</div>`;
        const icon = L.divIcon({ className: "", html, iconSize: [32, 32], iconAnchor: [16, 16] });
        const poly = L.polygon(zoneRingLatLngs(v), {
          color: c, weight: 2, opacity: 0.85, fillColor: c, fillOpacity: 0.2,
          lineCap: "round", lineJoin: "round",
        }).addTo(map);
        const marker = L.marker([v.lat, v.lng], { draggable: true, icon }).addTo(map).bindTooltip(v.title || `구역 ${num}`);
        marker.on("dragend", () => {
          const p = marker.getLatLng();
          setZones((prev) => ({ ...prev, [num]: { ...(prev[num] || {}), lat: p.lat, lng: p.lng } }));
        });
        markersRef.current[num] = { marker, poly };
      } else {
        const { marker, poly } = ref;
        if (marker) {
          const cur = marker.getLatLng();
          if (Math.abs(cur.lat - v.lat) > 1e-7 || Math.abs(cur.lng - v.lng) > 1e-7) marker.setLatLng([v.lat, v.lng]);
          try { marker.unbindTooltip(); marker.bindTooltip(v.title || `구역 ${num}`); } catch (_) {}
        }
        if (poly) poly.setLatLngs(zoneRingLatLngs(v));
      }
    });
  }, [zones]);

  /* 다각형 점 핸들 — 다각형 모드(points.length >= 3) 인 zone 에만 표시. 드래그로 점 이동. */
  const pointHandlesRef = useRef({}); // { [zoneNum]: [marker, ...] }
  useEffect(() => {
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    Object.values(pointHandlesRef.current).forEach((list) => list.forEach((m) => { try { map.removeLayer(m); } catch (_) {} }));
    pointHandlesRef.current = {};
    Object.entries(zones).forEach(([num, v]) => {
      const pts = Array.isArray(v.points) ? v.points : [];
      if (pts.length < 3) return;
      const c = (Number(num) % 2) ? "#fb923c" : "#22d65f";
      pointHandlesRef.current[num] = pts.map((p, idx) => {
        const html = `<div style="width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid ${c};box-shadow:0 0 0 1px #101113"></div>`;
        const icon = L.divIcon({ className: "", html, iconSize: [14, 14], iconAnchor: [7, 7] });
        const m = L.marker([p[0], p[1]], { draggable: true, icon }).addTo(map).bindTooltip(`${num}-${idx + 1} 점 · 더블탭 삭제`);
        m.on("dragend", () => {
          const q = m.getLatLng();
          setZones((prev) => {
            const cur = prev[num] || {};
            const arr = Array.isArray(cur.points) ? [...cur.points] : [];
            if (!arr[idx]) return prev;
            arr[idx] = [q.lat, q.lng];
            return { ...prev, [num]: { ...cur, points: arr } };
          });
        });
        m.on("dblclick", () => {
          setZones((prev) => {
            const cur = prev[num] || {};
            const arr = Array.isArray(cur.points) ? [...cur.points] : [];
            if (arr.length <= 3) return prev; // 최소 3개 유지
            arr.splice(idx, 1);
            return { ...prev, [num]: { ...cur, points: arr } };
          });
        });
        return m;
      });
    });
  }, [zones]);
  /* subs 변경 시 세부장소 마커 재구축(드래그/추가/삭제/이름 변경 반영) */
  useEffect(() => {
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    Object.values(subMarkersRef.current).forEach((list) => list.forEach((m) => map.removeLayer(m)));
    subMarkersRef.current = {};
    Object.entries(zones).forEach(([num, v]) => {
      const subs = Array.isArray(v.subs) ? v.subs : [];
      if (!subs.length) return;
      const c = (Number(num) % 2) ? "#fb923c" : "#22d65f";
      subMarkersRef.current[num] = subs.map((s, idx) => {
        if (typeof s.lat !== "number" || typeof s.lng !== "number") return null;
        const label = (s.name || "(이름 없음)").replace(/</g, "&lt;");
        const html = `<div><span class="dot" style="background:${c}"></span><span>${label}</span></div>`;
        const icon = L.divIcon({ className: "fest-sub-marker", html, iconSize: [140, 22], iconAnchor: [70, 11] });
        const m = L.marker([s.lat, s.lng], { draggable: true, icon }).addTo(map).bindTooltip(`${num}-${idx + 1} 세부장소`);
        m.on("dragend", () => {
          const p = m.getLatLng();
          setZones((prev) => {
            const cur = prev[num] || {};
            const arr = Array.isArray(cur.subs) ? [...cur.subs] : [];
            if (!arr[idx]) return prev;
            arr[idx] = { ...arr[idx], lat: p.lat, lng: p.lng };
            return { ...prev, [num]: { ...cur, subs: arr } };
          });
        });
        return m;
      }).filter(Boolean);
    });
  }, [zones]);
  const putZones = async (tok, payload) => {
    const base = dbUrl.replace(/\/+$/, "");
    const auth = tok ? `?auth=${encodeURIComponent(tok)}` : "";
    return fetch(`${base}/zones.json${auth}`, { method: "PUT", body: JSON.stringify(payload || zones) });
  };
  const cleaned = () => {
    const out = {};
    Object.entries(zones).forEach(([k, v]) => {
      const bm = builtinMeta(k);
      const body = {
        lat: v.lat, lng: v.lng,
        rA: typeof v.rA === "number" ? v.rA : 80,
        rB: typeof v.rB === "number" ? v.rB : 80,
        rot: typeof v.rot === "number" ? v.rot : 0,
        subs: cleanSubs(v.subs),
      };
      // title/sub — 기본값과 다르거나 사용자 추가 zone 이면 저장
      const baseTitle = bm ? bm.title : `새 구역 ${k}`;
      const baseSub = bm ? (bm.sub || "") : "";
      if (v.title && v.title !== baseTitle) body.title = v.title;
      else if (!bm) body.title = baseTitle;
      if (v.sub && v.sub !== baseSub) body.sub = v.sub;
      const pts = cleanPoints(v.points);
      if (pts.length >= 3) { body.points = pts; body.smooth = !!v.smooth; }
      out[k] = body;
    });
    return out;
  };
  /* zone 추가/삭제 + 텍스트(title/sub) 수정 헬퍼 */
  const addZone = () => {
    setZones((prev) => {
      const used = Object.keys(prev).map(Number).filter(Number.isFinite);
      const next = (used.length ? Math.max(...used) : 0) + 1;
      const c = mapRef.current ? mapRef.current.getCenter() : { lat: 35.133, lng: 126.96 };
      return {
        ...prev,
        [next]: {
          title: `새 구역 ${next}`, sub: "",
          lat: c.lat, lng: c.lng,
          rA: 80, rB: 80, rot: 0, subs: [], points: [], smooth: false,
        },
      };
    });
  };
  const deleteZone = (num) => {
    if (isBuiltinNum(num)) { setMsg("⚠ 기본 구역(1~5)은 삭제할 수 없어요"); return; }
    if (!window.confirm(`구역 ${num} 을(를) 삭제할까요?`)) return;
    setZones((prev) => {
      const next = { ...prev };
      delete next[num];
      return next;
    });
  };
  const updateZoneText = (num, key, val) => {
    setZones((prev) => ({ ...prev, [num]: { ...(prev[num] || {}), [key]: val } }));
  };
  /* 다각형 헬퍼 */
  const enablePolygon = (num) => {
    setZones((prev) => {
      const cur = prev[num] || {};
      if (Array.isArray(cur.points) && cur.points.length >= 3) return prev;
      // 현재 ellipse 를 4점 다이아몬드 모양으로 초기화 (사용자가 드래그/추가로 다듬음)
      const pts = ellipsePolygon(cur.lat, cur.lng, cur.rA || 80, cur.rB || 80, cur.rot || 0, 4);
      return { ...prev, [num]: { ...cur, points: pts, smooth: !!cur.smooth } };
    });
  };
  const disablePolygon = (num) => {
    if (!window.confirm("이 구역의 좌표 다각형을 지우고 타원으로 되돌릴까요?")) return;
    setZones((prev) => {
      const cur = prev[num] || {};
      return { ...prev, [num]: { ...cur, points: [], smooth: false } };
    });
  };
  const toggleSmooth = (num) => {
    setZones((prev) => {
      const cur = prev[num] || {};
      return { ...prev, [num]: { ...cur, smooth: !cur.smooth } };
    });
  };
  const addPoint = (num) => {
    setZones((prev) => {
      const cur = prev[num] || {};
      const arr = Array.isArray(cur.points) ? [...cur.points] : [];
      if (arr.length === 0) return prev;
      // 가장 긴 변의 중점에 새 점 추가
      let bestIdx = 0, bestDist = -1;
      for (let i = 0; i < arr.length; i++) {
        const a = arr[i], b = arr[(i + 1) % arr.length];
        const d = (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
        if (d > bestDist) { bestDist = d; bestIdx = i; }
      }
      const a = arr[bestIdx], b = arr[(bestIdx + 1) % arr.length];
      arr.splice(bestIdx + 1, 0, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
      return { ...prev, [num]: { ...cur, points: arr } };
    });
  };
  const save = async () => {
    const data = cleaned();
    LS.setJSON("zones", data);
    if (!dbUrl) { setMsg("✅ 로컬만 저장 (DB 주소 미설정)"); return; }
    setMsg("저장 중…");
    try {
      let r = await putZones(getAuth && getAuth(), data);
      if ((r.status === 401 || r.status === 403) && refreshAuth) {
        // 토큰 만료 — 재로그인 후 한 번 더 시도
        setMsg("인증 갱신 중…");
        const newTok = await refreshAuth();
        if (newTok) r = await putZones(newTok, data);
      }
      if (r.ok) setMsg("✅ 저장 완료 — 승객 지도 새로고침 시 반영");
      else if (r.status === 401 || r.status === 403) setMsg("⚠ 인증 실패 (HTTP " + r.status + ") — 고급 설정에서 기사 로그인 확인");
      else setMsg("⚠ Firebase 응답 " + r.status + " — 로컬만 저장됨");
    } catch (_) { setMsg("⚠ 네트워크 오류 — 로컬만 저장됨"); }
  };
  const resetToDefaults = () => {
    if (!window.confirm("기본 5개 구역만 기본값으로 되돌립니다. 사용자가 추가한 구역은 유지돼요. 계속할까요?")) return;
    setZones((prev) => {
      const out = { ...prev };
      FESTIVAL_ZONES.forEach((z) => {
        out[z.num] = {
          title: z.title, sub: z.sub || "",
          lat: z.lat, lng: z.lng, rA: z.rA || 80, rB: z.rB || 80, rot: z.rot || 0,
          subs: cleanSubs(z.subs), points: [], smooth: false,
        };
      });
      return out;
    });
    setMsg("기본값으로 되돌림 — 저장 버튼으로 적용");
  };
  /* 세부장소 헬퍼 — 추가/삭제/이름 수정 */
  const addSub = (num) => {
    setZones((prev) => {
      const cur = prev[num] || {};
      const arr = Array.isArray(cur.subs) ? [...cur.subs] : [];
      arr.push({ name: "", lat: cur.lat, lng: cur.lng });
      return { ...prev, [num]: { ...cur, subs: arr } };
    });
  };
  const removeSub = (num, idx) => {
    setZones((prev) => {
      const cur = prev[num] || {};
      const arr = Array.isArray(cur.subs) ? [...cur.subs] : [];
      arr.splice(idx, 1);
      return { ...prev, [num]: { ...cur, subs: arr } };
    });
  };
  const updateSubName = (num, idx, name) => {
    setZones((prev) => {
      const cur = prev[num] || {};
      const arr = Array.isArray(cur.subs) ? [...cur.subs] : [];
      if (!arr[idx]) return prev;
      arr[idx] = { ...arr[idx], name };
      return { ...prev, [num]: { ...cur, subs: arr } };
    });
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3 max-h-[92vh] overflow-y-auto"
        style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div className="text-sm font-bold" style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
            🎪 행사 주요 구역 좌표
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-amber-400 text-lg leading-none px-1" aria-label="닫기">×</button>
        </div>
        <div className="text-[10px] text-slate-500">
          번호(주황/녹) 마커는 구역 중심, 흰색 작은 마커는 세부장소입니다. 드래그로 이동, 아래 목록에서 추가/삭제·이름 편집. 저장 시 Firebase /zones에 업로드.
        </div>
        <div ref={elRef} style={{ width: "100%", height: 360, borderRadius: 10, overflow: "hidden", border: "1px solid #3a3f54" }} />
        <div className="flex items-center justify-between">
          <div className="text-[10px]" style={{ color: "#94a3b8" }}>구역 {Object.keys(zones).length}개</div>
          <button onClick={addZone}
            className="px-2 py-1 rounded text-[11px] font-bold"
            style={{ background: "rgba(96,165,250,0.18)", color: "#60a5fa",
              border: "1px solid rgba(96,165,250,0.45)", fontFamily: "'Jua', sans-serif" }}>
            + 새 구역 추가
          </button>
        </div>
        <div className="grid grid-cols-1 gap-1">
          {Object.keys(zones).map(Number).filter(Number.isFinite).sort((a, b) => a - b).map((zNum) => {
            const builtin = isBuiltinNum(zNum);
            const bm = builtinMeta(zNum);
            const c = zNum % 2 ? "#fb923c" : "#22d65f";
            const v = zones[zNum] || { lat: 0, lng: 0, rA: 80, rB: 80, rot: 0 };
            const z = { num: zNum, title: v.title || (bm ? bm.title : `새 구역 ${zNum}`), sub: v.sub != null ? v.sub : (bm ? (bm.sub || "") : "") };
            const update = (key, val) => {
              if (val === "") { setZones((prev) => ({ ...prev, [z.num]: { ...prev[z.num], [key]: "" } })); return; }
              const n = parseFloat(val); if (Number.isNaN(n)) return;
              setZones((prev) => ({ ...prev, [z.num]: { ...prev[z.num], [key]: n } }));
            };
            const commitDefault = (key, def) => {
              setZones((prev) => {
                const cur = prev[z.num] || {};
                if (cur[key] === "" || cur[key] == null) return { ...prev, [z.num]: { ...cur, [key]: def } };
                return prev;
              });
            };
            return (
              <div key={z.num} className="p-2 rounded-lg" style={{ background: "rgba(255,255,255,0.04)", border: "1px solid #2c3142" }}>
                <div className="flex items-center gap-2 mb-1">
                  <span style={{ width: 20, height: 20, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                    background: c, color: "#0a0b0f", borderRadius: 5, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 11 }}>{z.num}</span>
                  <input type="text" value={v.title || ""} onChange={(e) => updateZoneText(z.num, "title", e.target.value)}
                    placeholder={bm ? bm.title : `새 구역 ${z.num}`}
                    className="flex-1 min-w-0 px-1.5 py-0.5 rounded text-[11px]"
                    style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }} />
                  <span className="text-[9px]" style={{ color: "#94a3b8", fontFamily: "'IBM Plex Mono', monospace" }}>{typeof v.lat === "number" ? v.lat.toFixed(5) : "-"}, {typeof v.lng === "number" ? v.lng.toFixed(5) : "-"}</span>
                  {!builtin && (
                    <button onClick={() => deleteZone(z.num)}
                      className="text-[10px] px-1.5 py-0.5 rounded font-bold"
                      style={{ background: "rgba(239,68,68,0.15)", color: "#fca5a5",
                        border: "1px solid rgba(239,68,68,0.4)", fontFamily: "'Jua', sans-serif" }} title="구역 삭제">
                      ×
                    </button>
                  )}
                </div>
                <input type="text" value={v.sub || ""} onChange={(e) => updateZoneText(z.num, "sub", e.target.value)}
                  placeholder={bm ? (bm.sub || "부제(선택)") : "부제(선택)"}
                  className="w-full mb-1 px-1.5 py-0.5 rounded text-[10px]"
                  style={{ background: "#0a0b0f", border: "1px solid #2c3142", color: "#94a3b8", fontFamily: "'Jua', sans-serif" }} />
                {/* 타원 모드일 때만 가로/세로/회전 입력 노출. 다각형 모드에선 점 좌표가 모양을 결정. */}
                {!(Array.isArray(v.points) && v.points.length >= 3) && (
                  <div className="flex items-center gap-1 text-[10px]" style={{ color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }}>
                    <span style={{ width: 24, color: "#94a3b8" }}>가로</span>
                    <input type="number" min="10" step="10" value={v.rA ?? ""} onChange={(e) => update("rA", e.target.value)} onBlur={() => commitDefault("rA", 80)}
                      className="w-14 px-1 py-0.5 rounded" style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
                    <span style={{ color: "#64748b" }}>m</span>
                    <span style={{ width: 24, color: "#94a3b8", marginLeft: 6 }}>세로</span>
                    <input type="number" min="10" step="10" value={v.rB ?? ""} onChange={(e) => update("rB", e.target.value)} onBlur={() => commitDefault("rB", 80)}
                      className="w-14 px-1 py-0.5 rounded" style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
                    <span style={{ color: "#64748b" }}>m</span>
                    <span style={{ width: 24, color: "#94a3b8", marginLeft: 6 }}>회전</span>
                    <input type="number" min="0" max="180" step="5" value={v.rot ?? ""} onChange={(e) => update("rot", e.target.value)} onBlur={() => commitDefault("rot", 0)}
                      className="w-12 px-1 py-0.5 rounded" style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
                    <span style={{ color: "#64748b" }}>°</span>
                  </div>
                )}
                {/* 다각형 모드 컨트롤 — 좌표 기반 폴리곤 + 곡선 보간 */}
                <div className="mt-2 pt-1.5 flex items-center gap-1 flex-wrap text-[10px]"
                  style={{ borderTop: "1px dashed #2c3142", color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }}>
                  <span style={{ color: "#94a3b8" }}>모드</span>
                  {(() => {
                    const isPoly = Array.isArray(v.points) && v.points.length >= 3;
                    return (
                      <>
                        <button onClick={() => disablePolygon(z.num)} disabled={!isPoly}
                          className="px-2 py-0.5 rounded font-bold"
                          style={{ background: !isPoly ? c : "rgba(255,255,255,0.04)",
                            color: !isPoly ? "#0a0b0f" : "#94a3b8",
                            border: "1px solid " + (!isPoly ? c : "#3a3f54"),
                            opacity: !isPoly ? 1 : 0.7, cursor: !isPoly ? "default" : "pointer" }}>타원</button>
                        <button onClick={() => enablePolygon(z.num)}
                          className="px-2 py-0.5 rounded font-bold"
                          style={{ background: isPoly ? c : "rgba(255,255,255,0.04)",
                            color: isPoly ? "#0a0b0f" : "#cbd5e1",
                            border: "1px solid " + (isPoly ? c : "#3a3f54"),
                            cursor: "pointer" }}>다각형 ({(v.points || []).length})</button>
                        {isPoly && (
                          <>
                            <button onClick={() => addPoint(z.num)}
                              className="px-2 py-0.5 rounded font-bold ml-1"
                              style={{ background: "rgba(96,165,250,0.18)", color: "#60a5fa",
                                border: "1px solid rgba(96,165,250,0.4)", cursor: "pointer" }}
                              title="가장 긴 변의 중점에 새 점 추가">+ 점</button>
                            <span style={{ color: "#64748b", marginLeft: 2 }}>· 점은 지도에서 드래그/더블탭 삭제 (≥3 유지)</span>
                            <label className="flex items-center gap-1 ml-2" style={{ cursor: "pointer" }}>
                              <input type="checkbox" checked={!!v.smooth} onChange={() => toggleSmooth(z.num)} />
                              <span style={{ color: v.smooth ? c : "#94a3b8", fontWeight: 700 }}>곡선 부드럽게</span>
                            </label>
                          </>
                        )}
                      </>
                    );
                  })()}
                </div>
                <div className="mt-2 pt-1.5" style={{ borderTop: "1px dashed #2c3142" }}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[10px]" style={{ color: "#94a3b8", fontFamily: "'Jua', sans-serif" }}>세부장소 ({(v.subs || []).length})</span>
                    <button onClick={() => addSub(z.num)} className="text-[10px] px-2 py-0.5 rounded font-bold"
                      style={{ background: "rgba(251,191,36,0.15)", color: "#fbbf24", border: "1px solid rgba(251,191,36,0.4)", fontFamily: "'Jua', sans-serif" }}>
                      + 추가
                    </button>
                  </div>
                  {(v.subs || []).map((s, i) => (
                    <div key={i} className="flex items-center gap-1 mb-1">
                      <span className="text-[9px]" style={{ width: 14, textAlign: "center", color: c, fontFamily: "'Jua', sans-serif" }}>{i + 1}</span>
                      <input type="text" value={s.name || ""} onChange={(e) => updateSubName(z.num, i, e.target.value)} placeholder="장소명"
                        className="flex-1 px-1.5 py-0.5 rounded text-[10px]"
                        style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }} />
                      <span className="text-[9px]" style={{ color: "#64748b", fontFamily: "'IBM Plex Mono', monospace", whiteSpace: "nowrap" }}>
                        {typeof s.lat === "number" ? s.lat.toFixed(5) : "-"},{typeof s.lng === "number" ? s.lng.toFixed(5) : "-"}
                      </span>
                      <button onClick={() => removeSub(z.num, i)} className="text-[10px] leading-none px-1.5 py-0.5 rounded font-bold"
                        style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)", fontFamily: "'Jua', sans-serif" }} title="삭제">
                        ×
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
        {msg && <div className="text-[11px]" style={{ color: msg.startsWith("✅") ? "#22d65f" : msg.startsWith("⚠") ? "#fca5a5" : "#fbbf24" }}>{msg}</div>}
        <div className="grid grid-cols-2 gap-2">
          <button onClick={resetToDefaults}
            className="px-3 py-2 rounded-lg text-xs font-bold"
            style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)", fontFamily: "'Jua', sans-serif" }}>
            기본값 복원
          </button>
          <button onClick={save}
            className="px-3 py-2 rounded-lg text-xs font-bold"
            style={{ background: "#fbbf24", color: "#0a0b0f", fontFamily: "'Jua', sans-serif" }}>
            저장
          </button>
        </div>
      </div>
    </div>
  );
}

/* 경유점 편집기 — 운영자 전용. 클릭하면 가장 가까운 구간의 도착 정류장 approachVia 끝에 추가. via 마커 탭하여 제거. */
function ViaEditor({ onClose, dbUrl, getAuth }) {
  const elRef = useRef(null), mapRef = useRef(null);
  const [viaMap, setViaMap] = useState(() => LS.getJSON("viapoints", {}));
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | local | syncing | synced | error
  const layersRef = useRef({ lines: [], stops: [], vias: [] });
  const isFirstRef = useRef(true);
  // 클릭으로 경유점 추가 시 방향 선택. auto = 가장 가까운 방향 자동, both = 양방향 동시 추가
  const [dirMode, setDirMode] = useState("auto");
  const dirModeRef = useRef("auto");
  useEffect(() => { dirModeRef.current = dirMode; }, [dirMode]);

  /* 경유점 배열을 (이전 정류장 → 현재 정류장) 세그먼트 진행 순서로 정렬.
     OSRM 는 좌표 순서대로 경유하기 때문에 클릭/드래그 순서가 곧 경유 순서가 됨 —
     사용자가 도중 점을 새로 끼우면 정렬 안된 채 우회 발생. 투영 비율 t 기준 정렬. */
  const sortViaBySegment = (dir, stopName, viaList) => {
    const stops = ROUTES[dir].stops;
    const idx = stops.findIndex((s) => s.name === stopName);
    if (idx <= 0 || !Array.isArray(viaList) || viaList.length <= 1) return viaList;
    const prev = stops[idx - 1], cur = stops[idx];
    if (prev.lat == null || cur.lat == null) return viaList;
    const dx = cur.lat - prev.lat, dy = cur.lng - prev.lng;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1e-12) return viaList;
    return viaList
      .map((v) => ({ v, t: ((v[0] - prev.lat) * dx + (v[1] - prev.lng) * dy) / len2 }))
      .sort((a, b) => a.t - b.t)
      .map((x) => x.v);
  };

  // 열릴 때 Firebase 최신값 가져와서 화면에 반영 (운영자 동기화)
  useEffect(() => {
    if (!dbUrl) return;
    fetch(`${dbUrl.replace(/\/+$/, "")}/viapoints.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => { if (d && typeof d === "object" && !Array.isArray(d)) { isFirstRef.current = true; setViaMap(d); LS.setJSON("viapoints", d); } })
      .catch(() => {});
  }, [dbUrl]);

  /* 방향별 시퀀스: [{kind:'stop'|'via', dir, stopName?, stopKey?, coord, viaIdx?, viaCount?}] */
  const buildSeq = (dir) => {
    const stops = ROUTES[dir].stops.filter((s) => s.lat != null);
    const seq = [];
    stops.forEach((s, i) => {
      if (i > 0) {
        const key = `${dir}|${s.name}`;
        const via = key in viaMap ? viaMap[key] : (Array.isArray(s.approachVia) ? s.approachVia : []);
        via.forEach((v, vi) => seq.push({ kind: "via", dir, stopKey: key, coord: v, viaIdx: vi, viaCount: via.length }));
      }
      seq.push({ kind: "stop", dir, stopName: s.name, coord: [s.lat, s.lng] });
    });
    return seq;
  };

  // 최초 맵 초기화 (의존성 없음 — 한 번만)
  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const L = window.L;
    const map = L.map(elRef.current, { zoomControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    const allCoords = [];
    ["outbound", "inbound"].forEach((dir) => ROUTES[dir].stops.forEach((s) => { if (s.lat != null) allCoords.push([s.lat, s.lng]); }));
    if (allCoords.length) map.fitBounds(allCoords, { padding: [80, 30] });
    else map.setView([35.135, 126.94], 14);

    // 클릭으로 경유점 추가 — dirModeRef 에 따라 방향 결정 (auto/outbound/inbound/both)
    const bestInDir = (click, dir) => {
      const stops = ROUTES[dir].stops.filter((s) => s.lat != null);
      let best = null;
      for (let i = 0; i < stops.length - 1; i++) {
        const a = [stops[i].lat, stops[i].lng];
        const b = [stops[i + 1].lat, stops[i + 1].lng];
        const d = pointSegDist(click, a, b);
        if (!best || d < best.d) best = { d, toName: stops[i + 1].name };
      }
      return best;
    };
    map.on("click", (e) => {
      const click = [e.latlng.lat, e.latlng.lng];
      const mode = dirModeRef.current;
      const adds = []; // [{dir, toName}]
      if (mode === "outbound" || mode === "inbound") {
        const best = bestInDir(click, mode);
        if (best) adds.push({ dir: mode, toName: best.toName });
      } else if (mode === "both") {
        ["outbound", "inbound"].forEach((dir) => {
          const best = bestInDir(click, dir);
          if (best) adds.push({ dir, toName: best.toName });
        });
      } else { // auto — 기존 동작
        let best = null;
        ["outbound", "inbound"].forEach((dir) => {
          const b = bestInDir(click, dir);
          if (b && (!best || b.d < best.d)) best = { d: b.d, dir, toName: b.toName };
        });
        if (best) adds.push({ dir: best.dir, toName: best.toName });
      }
      if (!adds.length) return;
      setViaMap((prev) => {
        let next = prev;
        adds.forEach(({ dir, toName }) => {
          const key = `${dir}|${toName}`;
          const cur = key in next ? next[key] : (ROUTES[dir].stops.find((s) => s.name === toName)?.approachVia || []);
          // 끝에 append → 곧바로 세그먼트 진행 순서로 정렬(아래 OSRM 가 올바른 순서로 라우팅)
          const merged = sortViaBySegment(dir, toName, [...cur, click]);
          next = { ...next, [key]: merged };
        });
        return next;
      });
    });

    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // viaMap 변경 시 마커/선 재그리기 (직선 폴리라인 + 정류장/경유점 마커)
  useEffect(() => {
    const map = mapRef.current; if (!map) return;
    const L = window.L;
    layersRef.current.lines.forEach((l) => map.removeLayer(l)); layersRef.current.lines = [];
    if (layersRef.current.roads) Object.values(layersRef.current.roads).forEach((l) => l && map.removeLayer(l));
    layersRef.current.roads = {};
    layersRef.current.stops.forEach((l) => map.removeLayer(l)); layersRef.current.stops = [];
    layersRef.current.vias.forEach((l) => map.removeLayer(l)); layersRef.current.vias = [];

    ["outbound", "inbound"].forEach((dir) => {
      const color = dir === "outbound" ? FT.orange : FT.teal;
      const seq = buildSeq(dir);
      const lineCoords = seq.map((p) => p.coord);
      if (lineCoords.length >= 2) {
        // 직선 가이드(연하게) — OSRM 도착 전에도 시퀀스를 확인할 수 있게
        const line = L.polyline(lineCoords, { color, weight: 3, opacity: 0.35, dashArray: "4,6", lineCap: "round" }).addTo(map);
        layersRef.current.lines.push(line);
        // OSRM 도로 미리보기 — 승객 지도에 보일 실제 경로
        const path = lineCoords.map(([la, ln]) => `${ln},${la}`).join(";");
        fetch(`https://router.project-osrm.org/route/v1/driving/${path}?overview=full&geometries=geojson&continue_straight=false`)
          .then((r) => r.ok ? r.json() : null)
          .then((d) => {
            if (!d || d.code !== "Ok" || !d.routes || !d.routes[0]) return;
            const road = d.routes[0].geometry.coordinates.map(([ln, la]) => [la, ln]);
            if (layersRef.current.roads[dir]) map.removeLayer(layersRef.current.roads[dir]);
            layersRef.current.roads[dir] = L.polyline(road, { color, weight: 5, opacity: 0.9, dashArray: dir === "inbound" ? "10,8" : null, lineCap: "round", lineJoin: "round" }).addTo(map);
          })
          .catch(() => {});
      }
      seq.forEach((p) => {
        if (p.kind === "stop") {
          const shared = SHARED_STOPS.has(p.stopName);
          const m = L.circleMarker(p.coord, {
              radius: 6,
              color: shared ? FT.ink : color,
              fillColor: "#fff", fillOpacity: 1,
              weight: shared ? 2 : 2.5,
            })
            .addTo(map).bindTooltip(shared ? p.stopName : `${p.stopName} (${dir === "outbound" ? "축제장행" : "민주광장행"})`, { direction: "top" });
          layersRef.current.stops.push(m);
        } else {
          // 라우팅 순서가 보이도록 #N 표기 (N = 이 정류장 approachVia 안에서의 1-based 순번)
          const orderLbl = p.viaCount > 1 ? `#${p.viaIdx + 1}` : "";
          const icon = L.divIcon({
            className: "",
            html: `<div style="background:${color};color:#fff;border:2px solid ${FT.ink};border-radius:6px;padding:1px 7px;font-family:'Jua',sans-serif;font-size:11px;font-weight:700;cursor:move;box-shadow:1.5px 1.5px 0 ${FT.ink};white-space:nowrap;">⠿ via${orderLbl ? " " + orderLbl : ""} ×</div>`,
            iconSize: [orderLbl ? 70 : 56, 22], iconAnchor: [(orderLbl ? 70 : 56) / 2, 11],
          });
          const m = L.marker(p.coord, { icon, draggable: true, autoPan: true }).addTo(map);
          // 드래그 종료 시 해당 경유점 좌표 갱신
          m.on("dragend", (e) => {
            const ll = e.target.getLatLng();
            const newCoord = [ll.lat, ll.lng];
            setViaMap((prev) => {
              const cur = p.stopKey in prev ? prev[p.stopKey] : (ROUTES[p.dir].stops.find((s) => `${p.dir}|${s.name}` === p.stopKey)?.approachVia || []);
              const idx = cur.findIndex((c) => c[0] === p.coord[0] && c[1] === p.coord[1]);
              if (idx < 0) return prev;
              const list = cur.slice();
              list[idx] = newCoord;
              // 드래그 후 위치가 이전 점들 사이로 옮겨졌을 수 있으므로 재정렬
              const stopName = p.stopKey.split("|").slice(1).join("|");
              return { ...prev, [p.stopKey]: sortViaBySegment(p.dir, stopName, list) };
            });
          });
          // 단순 탭(드래그 없는 클릭)은 제거
          m.on("click", (e) => {
            if (e.originalEvent) { e.originalEvent.stopPropagation(); }
            setViaMap((prev) => {
              const cur = p.stopKey in prev ? prev[p.stopKey] : (ROUTES[p.dir].stops.find((s) => `${p.dir}|${s.name}` === p.stopKey)?.approachVia || []);
              const list = cur.filter((c) => !(c[0] === p.coord[0] && c[1] === p.coord[1]));
              return { ...prev, [p.stopKey]: list };
            });
          });
          layersRef.current.vias.push(m);
        }
      });
    });
  }, [viaMap]);

  // 자체 로그인(앱 토큰 없을 때 저장된 자격증명으로 시도)
  const editorTokenRef = useRef("");
  const ensureToken = async () => {
    const ext = getAuth ? getAuth() : "";
    if (ext) return ext;
    if (editorTokenRef.current) return editorTokenRef.current;
    const key = LS.get("apikey", SHARE_API_KEY);
    const email = LS.get("driveremail", "");
    const pass = LS.get("driverpass", "");
    if (!key || !email || !pass) return "";
    try {
      const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${key}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: pass, returnSecureToken: true }),
      });
      const d = await r.json();
      if (d.idToken) { editorTokenRef.current = d.idToken; return d.idToken; }
    } catch (_) {}
    return "";
  };

  const [syncDetail, setSyncDetail] = useState("");
  const pushNow = async () => {
    if (!dbUrl) { setSyncStatus("local"); setSyncDetail("DB 주소가 없음"); return; }
    setSyncStatus("syncing"); setSyncDetail("");
    const auth = await ensureToken();
    if (!auth) { setSyncStatus("local"); setSyncDetail("로그인 정보(이메일/비밀번호/API 키)가 없거나 로그인 실패"); return; }
    try {
      const r = await fetch(`${dbUrl.replace(/\/+$/, "")}/viapoints.json?auth=${encodeURIComponent(auth)}`, {
        method: "PUT", body: JSON.stringify(viaMap),
      });
      if (r.ok) { setSyncStatus("synced"); setSyncDetail(""); }
      else {
        const t = await r.text().catch(() => "");
        setSyncStatus("error");
        setSyncDetail(t && t.length < 200 ? t : `HTTP ${r.status} — Firebase 규칙에서 viapoints 쓰기 권한을 확인하세요`);
      }
    } catch (e) { setSyncStatus("error"); setSyncDetail("네트워크 오류"); }
  };

  // 변경 시 로컬 저장 + 자동 업로드
  useEffect(() => {
    LS.setJSON("viapoints", viaMap);
    if (isFirstRef.current) { isFirstRef.current = false; return; }
    pushNow();
  }, [viaMap]);

  const totalVia = Object.values(viaMap).reduce((n, v) => n + (Array.isArray(v) ? v.length : 0), 0);
  const syncLabel = { idle: "", local: "로컬만 저장됨 — 로그인 정보 확인 필요", syncing: "동기화 중…", synced: "✅ 모든 승객에게 반영됨", error: "❌ 업로드 실패" }[syncStatus];
  const syncColor = syncStatus === "synced" ? FT.teal : syncStatus === "error" ? "#dc2626" : syncStatus === "local" ? FT.orange : FT.inkSoft;

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 2000, background: "#000" }}>
      <div ref={elRef} style={{ width: "100%", height: "100%" }} />
      <div style={{ position: "absolute", top: 10, left: 10, right: 10, zIndex: 2100,
        display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
        <div style={{ background: "#fff", color: FT.ink, padding: "8px 12px", borderRadius: 10,
          border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, lineHeight: 1.4,
          boxShadow: "3px 3px 0 " + FT.ink, fontWeight: 700, maxWidth: "70%" }}>
          경유점 편집 · 빈 곳 클릭=추가 · via 드래그=이동 · via 탭=제거 <span style={{ color: FT.orange }}>(현재 {totalVia}개)</span>
          <div style={{ marginTop: 6, display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap" }}>
            <span style={{ fontSize: 10, color: FT.inkSoft, fontWeight: 400 }}>방향:</span>
            {[
              ["auto", "자동", FT.inkSoft],
              ["outbound", "축제장행", FT.orange],
              ["inbound", "민주광장행", FT.teal],
              ["both", "양방향", "#7c3aed"],
            ].map(([v, lbl, c]) => (
              <button key={v} onClick={() => setDirMode(v)}
                style={{ background: dirMode === v ? c : "#fff",
                  color: dirMode === v ? "#fff" : c,
                  border: `1.5px solid ${c}`, borderRadius: 8, padding: "2px 8px",
                  fontFamily: "'Jua', sans-serif", fontSize: 10, fontWeight: 700, cursor: "pointer" }}>
                {lbl}
              </button>
            ))}
          </div>
          {syncLabel ? <div style={{ marginTop: 4, fontSize: 11, color: syncColor, fontWeight: 700 }}>{syncLabel}</div> : null}
          {syncDetail ? <div style={{ marginTop: 2, fontSize: 10, color: FT.inkSoft, fontWeight: 400 }}>{syncDetail}</div> : null}
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={pushNow}
            style={{ background: FT.teal, color: "#fff", padding: "8px 12px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, boxShadow: "2px 2px 0 " + FT.ink, fontWeight: 700 }}>지금 반영</button>
          <button onClick={() => setViaMap((prev) => {
              const next = {};
              Object.entries(prev).forEach(([k, list]) => {
                if (!Array.isArray(list) || list.length <= 1) { next[k] = list; return; }
                const [dir, ...nameParts] = k.split("|");
                next[k] = sortViaBySegment(dir, nameParts.join("|"), list);
              });
              return next;
            })}
            title="모든 경유점을 (이전 정류장 → 도착 정류장) 진행 순서로 재정렬"
            style={{ background: "#fff", color: FT.ink, padding: "8px 12px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, boxShadow: "2px 2px 0 " + FT.ink, fontWeight: 700 }}>정렬</button>
          <button onClick={() => { if (window.confirm("저장된 모든 경유점을 초기화할까요? (코드 기본값으로 복귀)")) setViaMap({}); }}
            style={{ background: "#fff", color: FT.ink, padding: "8px 12px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, boxShadow: "2px 2px 0 " + FT.ink, fontWeight: 700 }}>초기화</button>
          <button onClick={onClose}
            style={{ background: FT.orange, color: "#fff", padding: "8px 14px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, boxShadow: "2px 2px 0 " + FT.ink, fontWeight: 700 }}>닫기</button>
        </div>
      </div>
    </div>
  );
}

/* 승객용 실시간 위치 지도 — ?view=map&db=<DB주소> 로 진입. Firebase RTDB REST 폴링 */
function LiveMapView({ dbUrl, onHome, onOpenVenue }) {
  const elRef = useRef(null), mapRef = useRef(null), markersRef = useRef({}), schedMarkersRef = useRef({});
  const [count, setCount] = useState(0);
  const [status, setStatus] = useState("연결 중…");
  // 마지막 sync 시각 (ms) — 신호 약함/stale 인디케이터 + tick state 로 매초 표시 갱신
  const [lastSync, setLastSync] = useState(0);
  const [, setSyncTick] = useState(0);
  useEffect(() => { const id = setInterval(() => setSyncTick((t) => t + 1), 1000); return () => clearInterval(id); }, []);
  const [viaOverride, setViaOverride] = useState(() => LS.getJSON("viapoints", {}));
  const [coordOverride, setCoordOverride] = useState(() => LS.getJSON("coords", {}));
  const [zoneOverride, setZoneOverride] = useState(() => LS.getJSON("zones", {}));
  /* 진행 중 프로그램 재계산 트리거 — 1분마다 tick */
  const [_zoneTick, _setZoneTick] = useState(0);
  useEffect(() => { const id = setInterval(() => _setZoneTick((t) => t + 1), 60000); return () => clearInterval(id); }, []);
  const lineRefsRef = useRef({});
  const osrmPolyRef = useRef({}); // { [dir]: [[lat,lng], ...] } — 마커 노선 스냅에 사용
  const stopLayersRef = useRef([]);
  const zoneLayersRef = useRef([]);
  const hasFitRef = useRef(false);

  /* ===== 스티커 (사용자/운영자 핀) =====
     5종 이모지: 👍 좋아요 / 📸 포토스팟 / 💤 쉬는 곳 / 🚻 화장실 / 🍱 음식
     2시간 자동 소멸 (클라이언트 필터) · 익명 create 허용, driver/admin 만 수정·삭제 */
  const STICKER_KINDS = [
    { k: "👍", t: "좋아요" },
    { k: "📸", t: "포토스팟" },
    { k: "💤", t: "쉬는 곳" },
    { k: "🚻", t: "화장실" },
    { k: "🍱", t: "음식" },
  ];
  const STICKER_TTL_MS = 2 * 60 * 60 * 1000; // 2시간
  // 본인이 등록 후 30분 이내라면 본인이 직접 삭제 가능 (DB 규칙도 동일 윈도우)
  const STICKER_OWNER_DELETE_WINDOW_MS = 30 * 60 * 1000;
  // 도배 방지 — 간격(2.5초) + 거리(15m) + 분당 개수(8개) 제한
  const STICKER_MIN_INTERVAL_MS = 2500;
  const STICKER_MIN_DIST_M = 15;
  const STICKER_QUOTA_LIMIT = 8;
  const STICKER_QUOTA_WINDOW_MS = 60000;
  const stickerHistoryRef = useRef([]); // [{ts, lat, lng}, ...]
  const [stickers, setStickers] = useState({});
  const [stickerKind, setStickerKind] = useState(null); // null = idle, 'X' = place mode
  const [stickerListOpen, setStickerListOpen] = useState(false); // 스티커 목록 시트
  const [stickerLabel, setStickerLabel] = useState(""); // 선택 메시지(<=60자) — place mode 동안 유지
  const stickerLabelRef = useRef("");
  useEffect(() => { stickerLabelRef.current = stickerLabel; }, [stickerLabel]);
  const [paletteOpen, setPaletteOpen] = useState(false);
  const [stickerMsg, setStickerMsg] = useState(""); // '잠시 후 사라져요' 같은 토스트
  const stickerKindRef = useRef(null);
  useEffect(() => { stickerKindRef.current = stickerKind; }, [stickerKind]);
  const stickerLayersRef = useRef({});

  // 좌표 lookup — override(공유 키) 우선, 없으면 ROUTES 기본값
  const getCoord = (dir, s) => {
    const k = SHARED_STOPS.has(s.name) ? s.name : `${dir}|${s.name}`;
    const o = coordOverride[k];
    if (o && typeof o.lat === "number") return [o.lat, o.lng];
    if (s.lat != null) return [s.lat, s.lng];
    return null;
  };

  // 지도 초기화 (한 번) + 행사장 지도 이미지 오버레이(토글 가능)
  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const L = window.L;
    // 줌 컨트롤을 우하단으로 이동 — 좌상단 '← 무등생각 지도' 버튼 / 우상단 운행 칩과 충돌 회피
    // 줌 컨트롤 제거 — 사용자 핀치/더블탭 줌만 사용
    const map = L.map(elRef.current, { zoomControl: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    // 명시적 pane 분리 — 아래에서 위로 sticker(350) → zone(390) → route(395) → stops(400 기본) → markers(600 기본)
    // 스티커는 최하위 우선순위 — 다른 마커/라벨 뒤로, 폴리곤·라우트보다도 아래(타일 위) 에 배치
    map.createPane("stickerPane"); map.getPane("stickerPane").style.zIndex = 350;
    map.createPane("zonePane"); map.getPane("zonePane").style.zIndex = 390;
    map.createPane("routePane"); map.getPane("routePane").style.zIndex = 395;
    map.setView([35.135, 126.94], 14);
    // 스티커 place mode: 지도 클릭 시 현재 선택한 이모지로 신규 스티커 생성. 연속 등록 가능.
    map.on("click", async (e) => {
      const kind = stickerKindRef.current; if (!kind) return;
      const url = dbUrl ? dbUrl.replace(/\/+$/, "") : "";
      if (!url) { setStickerMsg("서버 연결 정보가 없어 저장 못해요"); setTimeout(() => setStickerMsg(""), 2200); return; }
      // 도배 방지 가드 — 간격 / 거리 / 분당 개수 체크
      const now = Date.now();
      const hist = stickerHistoryRef.current;
      while (hist.length > 0 && now - hist[0].ts > STICKER_QUOTA_WINDOW_MS) hist.shift();
      if (hist.length > 0) {
        const last = hist[hist.length - 1];
        const sinceLast = now - last.ts;
        if (sinceLast < STICKER_MIN_INTERVAL_MS) {
          const remain = Math.ceil((STICKER_MIN_INTERVAL_MS - sinceLast) / 1000);
          setStickerMsg(`잠시만요 — 약 ${remain}초 뒤 다시 시도`);
          setTimeout(() => setStickerMsg(""), 1600);
          return;
        }
        const d = distanceMeters({ lat: e.latlng.lat, lng: e.latlng.lng }, last);
        if (d < STICKER_MIN_DIST_M) {
          setStickerMsg(`너무 가까워요 — 약 ${STICKER_MIN_DIST_M}m 이상 떨어뜨려 주세요`);
          setTimeout(() => setStickerMsg(""), 2000);
          return;
        }
      }
      if (hist.length >= STICKER_QUOTA_LIMIT) {
        const oldestAge = Math.max(0, Math.ceil((STICKER_QUOTA_WINDOW_MS - (now - hist[0].ts)) / 1000));
        setStickerMsg(`1분에 ${STICKER_QUOTA_LIMIT}개까지만 — ${oldestAge}초 뒤 다시 시도`);
        setTimeout(() => setStickerMsg(""), 2400);
        return;
      }
      const label = (stickerLabelRef.current || "").trim().slice(0, 60);
      const body = { lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6), kind, ts: now };
      if (label) body.label = label;
      try {
        const r = await fetch(`${url}/stickers.json`, { method: "POST", body: JSON.stringify(body) });
        if (!r.ok) throw new Error("HTTP " + r.status);
        // Firebase POST 응답에서 새 키 추출 → 본인 ID 저장 + 즉시 state 반영(다음 폴링 전에 마커 표시)
        let newId = null;
        try { const j = await r.json(); newId = j && j.name; } catch (_) {}
        if (newId) {
          addMyStickerId(newId);
          setStickers((prev) => ({ ...(prev || {}), [newId]: body }));
        }
        // 도배 가드용 히스토리 갱신 — 성공한 경우에만 카운트
        stickerHistoryRef.current.push({ ts: now, lat: body.lat, lng: body.lng });
        setStickerMsg("스티커 등록 완료");
        setTimeout(() => setStickerMsg(""), 1800);
        // 통계 — 이모지 종류별 카운트 (ASCII 슬러그)
        try {
          const STICKER_STAT_KEY = { "👍": "like", "📸": "photo", "💤": "rest", "🚻": "wc", "🍱": "food" };
          const k = STICKER_STAT_KEY[kind] || "other";
          window.__mdsStats && window.__mdsStats.track(`sticker_place_${k}`);
        } catch (__) {}
        // 1회 등록 후 place mode 자동 종료 — 의도치 않은 연속 등록 방지. 다시 남기려면 스티커 버튼 재시작.
        setStickerKind(null);
        setStickerLabel("");
      } catch (err) {
        setStickerMsg("저장 실패: " + (err && err.message ? err.message : "네트워크 오류"));
        setTimeout(() => setStickerMsg(""), 2400);
        try { window.__mdsStats && window.__mdsStats.track("error_sticker_save"); } catch (__) {}
      }
    });
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
    return () => { map.remove(); mapRef.current = null; };
  }, [dbUrl]);

  /* 스티커 폴링 — 8초 간격, 2시간 초과 항목은 클라이언트 필터에서 제외 */
  useEffect(() => {
    if (!dbUrl) return;
    const base = dbUrl.replace(/\/+$/, "");
    let stopped = false;
    const poll = async () => {
      try {
        const r = await fetch(`${base}/stickers.json`, { cache: "no-store" });
        if (!r.ok) return;
        const d = await r.json();
        if (!stopped) setStickers(d && typeof d === "object" ? d : {});
      } catch (_) { /* 무시 */ }
    };
    poll();
    const id = setInterval(() => { if (!stopped && !document.hidden) poll(); }, 8000);
    const onVis = () => { if (!stopped && !document.hidden) poll(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { stopped = true; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [dbUrl]);

  /* 본인이 남긴 스티커 ID set — LS 영속. 이 id 들은 시각적으로 강조(테두리 굵게). */
  const getMyStickerIds = () => {
    try { const a = JSON.parse(localStorage.getItem("shuttle:mySticker") || "[]"); return new Set(Array.isArray(a) ? a : []); }
    catch (_) { return new Set(); }
  };
  const addMyStickerId = (id) => {
    try {
      const a = JSON.parse(localStorage.getItem("shuttle:mySticker") || "[]");
      const arr = Array.isArray(a) ? a : [];
      arr.push(id);
      // 너무 길지 않게 200개로 cap
      while (arr.length > 200) arr.shift();
      localStorage.setItem("shuttle:mySticker", JSON.stringify(arr));
    } catch (_) {}
  };
  const removeMyStickerId = (id) => {
    try {
      const a = JSON.parse(localStorage.getItem("shuttle:mySticker") || "[]");
      const arr = (Array.isArray(a) ? a : []).filter((x) => x !== id);
      localStorage.setItem("shuttle:mySticker", JSON.stringify(arr));
    } catch (_) {}
  };

  /* 본인 스티커 삭제 핸들러 — popup 의 인라인 onclick 에서 호출. 30분 이내만 익명 DELETE 허용(DB 규칙도 동일). */
  useEffect(() => {
    window.__mdsDelSticker = async (id) => {
      const url = dbUrl ? dbUrl.replace(/\/+$/, "") : "";
      if (!url) { setStickerMsg("서버 연결 정보가 없어요"); setTimeout(() => setStickerMsg(""), 2200); return; }
      if (!window.confirm("내 스티커를 삭제할까요?")) return;
      try {
        const r = await fetch(`${url}/stickers/${encodeURIComponent(id)}.json`, { method: "DELETE" });
        if (r.ok) {
          removeMyStickerId(id);
          setStickers((prev) => { const n = { ...(prev || {}) }; delete n[id]; return n; });
          // 마커 즉시 제거
          try { const layer = stickerLayersRef.current[id]; if (layer && mapRef.current) mapRef.current.removeLayer(layer); delete stickerLayersRef.current[id]; } catch (_) {}
          setStickerMsg("스티커 삭제됨");
          setTimeout(() => setStickerMsg(""), 1600);
        } else if (r.status === 401 || r.status === 403) {
          setStickerMsg("삭제 권한 없음 — 등록 후 30분 지난 스티커는 운영자만 삭제 가능");
          setTimeout(() => setStickerMsg(""), 2800);
        } else {
          setStickerMsg(`삭제 실패 · HTTP ${r.status}`);
          setTimeout(() => setStickerMsg(""), 2400);
        }
      } catch (e) {
        setStickerMsg("네트워크 오류");
        setTimeout(() => setStickerMsg(""), 2200);
      }
    };
    return () => { try { delete window.__mdsDelSticker; } catch (_) {} };
  }, [dbUrl]);

  /* 스티커 마커 렌더 — stickers 변경 시 재계산. 본인 마커는 청록 테두리 강조. */
  useEffect(() => {
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    const cutoff = Date.now() - STICKER_TTL_MS;
    const mine = getMyStickerIds();
    const live = Object.entries(stickers || {}).filter(([, s]) =>
      s && typeof s.lat === "number" && typeof s.lng === "number" && typeof s.ts === "number" && s.ts >= cutoff);
    // 제거 대상: 더 이상 없거나 만료된 마커
    const aliveIds = new Set(live.map(([id]) => id));
    Object.entries(stickerLayersRef.current).forEach(([id, layer]) => {
      if (!aliveIds.has(id)) { try { map.removeLayer(layer); } catch (_) {} delete stickerLayersRef.current[id]; }
    });
    const buildIcon = (kind, isMine) => {
      // 흰 라운드 배지 + 검정 외곽선 + 그림자 → 도로 위에서도 또렷
      const borderColor = isMine ? FT.teal : FT.ink;
      const borderWidth = isMine ? 3 : 2;
      const shadowColor = isMine ? FT.teal : FT.ink;
      const size = isMine ? 36 : 32;
      const html = `<div style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:50%;background:#fff;border:${borderWidth}px solid ${borderColor};box-shadow:1.5px 1.5px 0 ${shadowColor};font-size:${isMine ? 19 : 17}px;line-height:1;">${kind || "📍"}</div>`;
      return L.divIcon({ className: "mds-sticker", html, iconSize: [size + 2, size + 2], iconAnchor: [(size + 2) / 2, (size + 2) / 2] });
    };
    // 추가/갱신
    live.forEach(([id, s]) => {
      const ageMin = Math.floor((Date.now() - s.ts) / 60000);
      const left = Math.max(0, 120 - ageMin);
      const isMine = mine.has(id);
      const canSelfDelete = isMine && (Date.now() - s.ts) < STICKER_OWNER_DELETE_WINDOW_MS;
      const myMark = isMine ? `<div style="font-size:9px;color:#0F786E;font-weight:700;margin-top:2px">● 내가 남긴 스티커</div>` : "";
      const delBtn = canSelfDelete
        ? `<button onclick="window.__mdsDelSticker && window.__mdsDelSticker('${id.replace(/'/g, "\\'")}')" style="margin-top:8px;background:#FBE0CF;border:1.5px solid #C2521D;color:#C2521D;border-radius:8px;padding:4px 10px;font-family:'Jua',sans-serif;font-size:11px;font-weight:700;cursor:pointer;box-shadow:1px 1px 0 #C2521D;">내 스티커 삭제</button>`
        : (isMine ? `<div style="font-size:9px;color:#94a3b8;margin-top:4px">등록 후 30분 경과 — 운영자에게 요청</div>` : "");
      const popup = `<div style="font-family:'Jua',sans-serif;min-width:140px;text-align:center">`
        + `<div style="font-size:24px;line-height:1">${s.kind || "📍"}</div>`
        + (s.label ? `<div style="font-size:12px;color:#101113;margin-top:4px;font-weight:700">${s.label.replace(/</g,"&lt;")}</div>` : "")
        + `<div style="font-size:10px;color:#4A4E55;margin-top:4px">${ageMin <= 0 ? "방금" : ageMin + "분 전"} · ${left}분 후 사라짐</div>`
        + myMark
        + delBtn
        + `</div>`;
      if (stickerLayersRef.current[id]) {
        // 위치/팝업 갱신 + 아이콘도 갱신 (본인 여부 변경 반영)
        stickerLayersRef.current[id].setLatLng([s.lat, s.lng]);
        stickerLayersRef.current[id].setPopupContent(popup);
        try { stickerLayersRef.current[id].setIcon(buildIcon(s.kind, isMine)); } catch (_) {}
        return;
      }
      const m = L.marker([s.lat, s.lng], { icon: buildIcon(s.kind, isMine), pane: "stickerPane", interactive: true, bubblingMouseEvents: false }).addTo(map).bindPopup(popup);
      m.on("popupopen", () => {
        try { window.__mdsStats && window.__mdsStats.track("sticker_popup_open"); } catch (_) {}
      });
      stickerLayersRef.current[id] = m;
    });
  }, [stickers]);

  // Firebase에서 viapoints + coords 가져오기 (운영자가 수정한 값)
  useEffect(() => {
    if (!dbUrl) return;
    const base = dbUrl.replace(/\/+$/, "");
    fetch(`${base}/viapoints.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => {
        if (d && typeof d === "object" && !Array.isArray(d)) { setViaOverride(d); LS.setJSON("viapoints", d); }
      })
      .catch(() => {});
    fetch(`${base}/coords.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => {
        if (!d || typeof d !== "object" || Array.isArray(d)) return;
        const clean = {};
        Object.entries(d).forEach(([k, v]) => {
          if (v && typeof v.lat === "number" && typeof v.lng === "number") clean[k] = { lat: v.lat, lng: v.lng };
        });
        if (Object.keys(clean).length) { setCoordOverride(clean); LS.setJSON("coords", { ...LS.getJSON("coords", {}), ...clean }); }
      })
      .catch(() => {});
    fetch(`${base}/zones.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => {
        if (!d || typeof d !== "object") return;
        const clean = {};
        Object.entries(d).forEach(([k, v]) => {
          if (v && typeof v.lat === "number" && typeof v.lng === "number") {
            const c = {
              lat: v.lat, lng: v.lng,
              rA: typeof v.rA === "number" ? v.rA : 80,
              rB: typeof v.rB === "number" ? v.rB : 80,
              rot: typeof v.rot === "number" ? v.rot : 0,
            };
            if (typeof v.title === "string" && v.title) c.title = v.title;
            if (typeof v.sub === "string") c.sub = v.sub;
            if (Array.isArray(v.subs)) {
              c.subs = v.subs
                .filter((s) => s && typeof s.lat === "number" && typeof s.lng === "number")
                .map((s) => ({ name: String(s.name || ""), lat: s.lat, lng: s.lng }));
            }
            if (Array.isArray(v.points)) {
              c.points = v.points
                .filter((p) => Array.isArray(p) && typeof p[0] === "number" && typeof p[1] === "number")
                .map((p) => [p[0], p[1]]);
              if (c.points.length < 3) delete c.points;
            }
            if (v.smooth) c.smooth = true;
            clean[k] = c;
          }
        });
        if (Object.keys(clean).length) { setZoneOverride(clean); LS.setJSON("zones", clean); }
      })
      .catch(() => {});
  }, [dbUrl]);

  // 정류장 마커 + 노선 폴리라인 그리기/다시 그리기 — 좌표/경유점 오버라이드 변경 시 재계산
  useEffect(() => {
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    stopLayersRef.current.forEach((l) => map.removeLayer(l)); stopLayersRef.current = [];
    Object.values(lineRefsRef.current).forEach((layer) => layer && map.removeLayer(layer));
    lineRefsRef.current = {};
    const getVia = (dir, name) => {
      const k = `${dir}|${name}`;
      if (k in viaOverride) return viaOverride[k] || [];
      const s = ROUTES[dir].stops.find((x) => x.name === name);
      return s && Array.isArray(s.approachVia) ? s.approachVia : [];
    };
    const seenShared = new Set();
    const allCoords = [];
    // 정류장 팝업 빌더 — 매 popupopen 마다 현재 시각 기준으로 새로 생성. 시간 의존 정보(다음 도착·과거 회차) 실시간 갱신.
    const buildStopPopup = (stopName, sub, dirs) => {
      // 현재 시각 매번 재계산 (popup 열 때마다 fresh)
      const t = getNow();
      const fDay = t.getMonth() === 5 ? t.getDate() : -1;
      const isFest = fDay === 13 || fDay === 14;
      const day1Ts = new Date(2026, 5, 13).getTime();
      const day2Ts = new Date(2026, 5, 14).getTime();
      const today0 = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
      const pre = today0 < day1Ts;
      const post = today0 > day2Ts;
      const tripsToday2 = t.getMonth() === 5 && t.getDate() === 14 ? 5 : ROUTES.outbound.trips.length;
      const nowMin = t.getHours() * 60 + t.getMinutes();
      const headerNotice = post
        ? `<div style="font-size:10px;color:#64748b;margin:3px 0 0 0">행사 종료 · 지난 회 시간표</div>`
        : pre
        ? `<div style="font-size:10px;color:#fb923c;margin:3px 0 0 0">행사 전 · 6.13~6.14 시간표 미리보기</div>`
        : "";
      const sections = dirs.map((d) => {
        const route = ROUTES[d];
        const idx = route.stops.findIndex((x) => x.name === stopName);
        if (idx < 0) return "";
        const times = route.trips.slice(0, tripsToday2).map((t, i) => ({ trip: i + 1, time: t[idx] })).filter((x) => x.time);
        // 행사일이 아니면 '다음 도착'·과거 표시 없이 모든 회차를 단순 안내
        const nextTime = isFest ? times.find((x) => toMin(x.time) >= nowMin - 1) : null;
        const rows = times.map(({ trip, time }) => {
          const m = toMin(time);
          const past = isFest && m < nowMin - 1;
          const isNext = nextTime && nextTime.trip === trip;
          const style = past
            ? "color:#94a3b8;text-decoration:line-through"
            : isNext ? "color:#dc2626;font-weight:700" : "color:#101113";
          return `<div style="font-size:11px;${style};margin:1px 0">${trip}회차 · ${time}${isNext ? " ← 다음 도착" : ""}</div>`;
        }).join("");
        const dColor = d === "outbound" ? FT.orange : FT.teal;
        const dLabel = route.label;
        return `<div style="margin-top:6px"><div style="font-size:11px;color:${dColor};font-weight:700;margin-bottom:2px">${d === "outbound" ? "▶" : "◀"} ${dLabel}</div>${rows}</div>`;
      }).join("");
      return `<div style="font-family:'Jua',sans-serif;max-width:240px"><b>${stopName}</b>`
        + (sub ? `<div style="color:#4A4E55;font-size:11px">${sub}</div>` : "")
        + headerNotice
        + sections
        + `</div>`;
    };
    ["outbound", "inbound"].forEach((dir) => {
      const dirColor = dir === "outbound" ? FT.orange : FT.teal;
      const dash = dir === "inbound" ? "10,8" : null;
      // 정류장명 → 통계 키(영문 슬러그). DB 화이트리스트가 ASCII 만 허용해 한글 키 안 됨.
      const STOP_STAT_KEY = {
        "5·18민주광장": "square518",
        "하늘마당": "haneul",
        "학동증심사역": "hakdong",
        "홍림교": "hongnim",
        "운림중학교": "unrim",
        "학운초등학교": "hakun",
        "축제장": "festival",
      };
      // 정류장 마커. 라벨(tooltip)도 interactive 로 만들어 텍스트만 눌러도 popup 이 열리도록.
      const wireLabelClick = (m, stopName, dirs) => {
        const tt = m.getTooltip(); if (!tt) return;
        tt.on("click", (ev) => {
          try { L.DomEvent.stopPropagation(ev); } catch (_) {}
          m.openPopup();
        });
        m.on("tooltipopen", (e) => {
          const el = e.tooltip && e.tooltip.getElement();
          if (el) el.style.cursor = "pointer";
        });
        m.on("popupopen", () => {
          // popup 열릴 때마다 현재 시각 기준으로 컨텐츠 재생성 (다음 도착 / 과거 표시 갱신)
          try {
            const sub = (ROUTES[dirs[0]].stops.find((x) => x.name === stopName) || {}).sub || "";
            m.setPopupContent(buildStopPopup(stopName, sub, dirs));
          } catch (_) {}
          try { const k = STOP_STAT_KEY[stopName]; if (k && window.__mdsStats) window.__mdsStats.track(`stop_popup_${k}`); } catch (_) {}
        });
      };
      ROUTES[dir].stops.forEach((s) => {
        const c = getCoord(dir, s); if (!c) return;
        allCoords.push(c);
        if (SHARED_STOPS.has(s.name)) {
          if (seenShared.has(s.name)) return; seenShared.add(s.name);
          const m = L.circleMarker(c, { radius: 7, color: FT.ink, fillColor: "#fff", fillOpacity: 1, weight: 2 })
            .addTo(map).bindTooltip(s.name, { permanent: true, direction: "top", offset: [0, -4], className: "fest-stop", interactive: true })
            .bindPopup(buildStopPopup(s.name, s.sub, ["outbound", "inbound"]));
          wireLabelClick(m, s.name, SHARED_STOPS.has(s.name) ? ["outbound", "inbound"] : [dir]);
          stopLayersRef.current.push(m);
        } else {
          // 축제장행(outbound) 라벨은 마커 아래, 민주광장행(inbound) 라벨은 마커 위 — 위치+색으로 방향 구분
          const m = L.circleMarker(c, { radius: 7, color: dirColor, fillColor: "#fff", fillOpacity: 1, weight: 2.5 })
            .addTo(map).bindTooltip(s.name, { permanent: true,
              direction: dir === "outbound" ? "bottom" : "top",
              offset: [0, dir === "outbound" ? 4 : -4],
              className: `fest-stop ${dir === "outbound" ? "dir-out" : "dir-in"}`, interactive: true })
            .bindPopup(buildStopPopup(s.name, s.sub, [dir]));
          wireLabelClick(m, s.name, SHARED_STOPS.has(s.name) ? ["outbound", "inbound"] : [dir]);
          stopLayersRef.current.push(m);
        }
      });
      // 폴리라인
      const stopsWithCoord = ROUTES[dir].stops.map((s) => ({ s, c: getCoord(dir, s) })).filter((x) => x.c);
      if (stopsWithCoord.length < 2) return;
      const stopCoords = stopsWithCoord.map((x) => x.c);
      const routePts = [];
      stopsWithCoord.forEach(({ s, c }, i) => {
        if (i > 0) getVia(dir, s.name).forEach((v) => routePts.push(v));
        routePts.push(c);
      });
      lineRefsRef.current[dir] = L.polyline(stopCoords, { pane: "routePane", color: dirColor, weight: 5, opacity: 0.45, dashArray: dash, lineCap: "round", lineJoin: "round" }).addTo(map);
      const path = routePts.map(([la, ln]) => `${ln},${la}`).join(";");
      // P0-4: OSRM 결과 localStorage 캐시(path 해시 기준) — OSRM 장애·rate-limit 시 즉시 노선 표시
      const cacheKey = `osrm:${dir}:${path}`;
      const drawRoad = (road) => {
        if (lineRefsRef.current[dir]) map.removeLayer(lineRefsRef.current[dir]);
        lineRefsRef.current[dir] = L.polyline(road, { pane: "routePane", color: dirColor, weight: 5, opacity: 0.85, dashArray: dash, lineCap: "round", lineJoin: "round" }).addTo(map);
        osrmPolyRef.current[dir] = road; // 마커 곡선 스냅용
      };
      const cached = LS.getJSON(cacheKey, null);
      if (Array.isArray(cached) && cached.length) drawRoad(cached); // 즉시 캐시로 그림
      fetch(`https://router.project-osrm.org/route/v1/driving/${path}?overview=full&geometries=geojson&continue_straight=false`)
        .then((r) => r.ok ? r.json() : null)
        .then((d) => {
          if (!d || d.code !== "Ok" || !d.routes || !d.routes[0]) return;
          const road = d.routes[0].geometry.coordinates.map(([ln, la]) => [la, ln]);
          LS.setJSON(cacheKey, road);
          drawRoad(road);
        })
        .catch(() => {});
    });
    if (!hasFitRef.current && allCoords.length) {
      map.fitBounds(allCoords, { padding: [80, 30] });
      hasFitRef.current = true;
    }
  }, [coordOverride, viaOverride]);

  /* 행사 주요 구역 마커 — 자체 effect (zoneOverride·_zoneTick 변경 시만 재계산, 노선 폴리라인은 건드리지 않음) */
  useEffect(() => {
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    zoneLayersRef.current.forEach((l) => map.removeLayer(l));
    zoneLayersRef.current = [];
    const today = getNow();
    const isToday = today.getMonth() === 5 && (today.getDate() === 13 || today.getDate() === 14);
    // 행사 기간이면 그날의 일정, 아니면 day1을 기본 미리보기로
    const dayKey = (today.getMonth() === 5 && today.getDate() === 14) ? "day2" : "day1";
    const dayLabel = FESTIVAL_PROGRAM[dayKey]?.label || "";
    const nowMinNow = today.getHours() * 60 + today.getMinutes();
    const isLive = (item) => {
      if (!isToday) return false; // 행사 기간 외엔 라이브 강조 없음
      if (item.time === "상시") return true;
      const mm = item.time.match(/^(\d\d:\d\d)~(\d\d:\d\d)$/);
      if (!mm) return false;
      return toMin(mm[1]) <= nowMinNow && nowMinNow < toMin(mm[2]);
    };
    // 모든 zone 순회 — 기본 5개 + 사용자가 운영자 화면에서 추가한 user zone
    const allZoneNums = new Set([...FESTIVAL_ZONES.map((z) => z.num)]);
    Object.keys(zoneOverride || {}).forEach((k) => { const n = Number(k); if (Number.isFinite(n)) allZoneNums.add(n); });
    [...allZoneNums].sort((a, b) => a - b).forEach((zNum) => {
      const builtin = FESTIVAL_ZONES.find((bb) => bb.num === zNum);
      const o = zoneOverride[zNum];
      const lat = o && typeof o.lat === "number" ? o.lat : (builtin ? builtin.lat : null);
      const lng = o && typeof o.lng === "number" ? o.lng : (builtin ? builtin.lng : null);
      const rA = o && typeof o.rA === "number" ? o.rA : (builtin ? (builtin.rA || 80) : 80);
      const rB = o && typeof o.rB === "number" ? o.rB : (builtin ? (builtin.rB || 80) : 80);
      const rot = o && typeof o.rot === "number" ? o.rot : (builtin ? (builtin.rot || 0) : 0);
      const points = o && Array.isArray(o.points) ? o.points : null;
      const smooth = !!(o && o.smooth);
      if (lat == null || lng == null) return;
      const z = {
        num: zNum,
        title: (o && o.title) || (builtin ? builtin.title : `구역 ${zNum}`),
        sub: (o && o.sub != null ? o.sub : (builtin ? (builtin.sub || "") : "")),
      };
      const c = z.num % 2 ? FT.orange : FT.teal;
      const zoneItems = (FESTIVAL_PROGRAM[dayKey]?.items || []).filter((it) => it.zone === z.num);
      const liveItems = isToday ? zoneItems.filter(isLive) : [];
      // 영역 폴리곤 — 좌표(points) 가 있으면 다각형(+ 선택적 곡선 보간), 없으면 타원
      const ring = points && points.length >= 3
        ? zoneRingLatLngs({ points, smooth })
        : (rA > 0 && rB > 0 ? ellipsePolygon(lat, lng, rA, rB, rot) : null);
      if (ring && ring.length) {
        const poly = L.polygon(ring, {
          pane: "zonePane",
          color: c, weight: 2, opacity: 0.85, fillColor: c, fillOpacity: 0.18, lineCap: "round", lineJoin: "round",
        }).addTo(map);
        zoneLayersRef.current.push(poly);
      }
      const badge = liveItems.length > 0 ? `<span style="display:inline-flex;align-items:center;justify-content:center;min-width:14px;height:14px;border-radius:7px;background:#dc2626;color:#fff;font-size:9px;padding:0 4px;margin-left:3px">${liveItems.length}</span>` : "";
      const html = `<div><span class="num" style="background:${c}">${z.num}</span><span>${z.title}</span>${badge}</div>`;
      const icon = L.divIcon({ className: "fest-zone-marker", html, iconSize: [180, 24], iconAnchor: [90, 12] });
      const programLines = zoneItems.length > 0
        ? zoneItems.slice(0, 10).map((it) => {
            const live = isLive(it);
            const bg = live ? `background:${c}22;` : "";
            const mark = live ? `<span style="color:${c};font-weight:700">● </span>` : "";
            return `<div style="font-size:11px;color:#101113;margin:2px 0;padding:1px 4px;border-radius:4px;${bg}">${mark}<b>${it.time}</b> ${it.title}</div>`;
          }).join("") + (zoneItems.length > 10 ? `<div style="font-size:10px;color:#888;margin-top:2px">외 ${zoneItems.length - 10}개</div>` : "")
        : `<div style="font-size:11px;color:#888;margin-top:4px">등록된 프로그램 없음</div>`;
      const heading = isToday
        ? (liveItems.length > 0 ? `● 오늘 ${dayLabel} · 진행 ${liveItems.length}건` : `오늘 ${dayLabel} 일정`)
        : `${dayLabel} 일정 (미리보기)`;
      const popupHtml = `<div style="font-family:'Jua',sans-serif;max-width:260px"><b>${z.num}. ${z.title}</b><br><span style="color:#4A4E55;font-size:11px">${z.sub}</span>`
        + `<div style="margin-top:8px;padding-top:6px;border-top:1px solid #ddd"><div style="font-size:11px;color:${c};font-weight:700;margin-bottom:3px">${heading}</div>`
        + programLines
        + `</div></div>`;
      const m = L.marker([lat, lng], { icon }).addTo(map).bindPopup(popupHtml);
      zoneLayersRef.current.push(m);
      // 세부 장소 핀 — subs가 있는 구역만(override → 코드 기본값 순)
      const subs = (o && Array.isArray(o.subs) && o.subs.length ? o.subs : z.subs) || [];
      subs.forEach((s) => {
        if (s.lat == null || s.lng == null) return;
        const subHtml = `<div><span class="dot" style="background:${c}"></span><span>${s.name}</span></div>`;
        const subIcon = L.divIcon({ className: "fest-sub-marker", html: subHtml, iconSize: [120, 20], iconAnchor: [60, 10] });
        // 해당 세부 장소 프로그램(cat에 이름 포함)
        const subItems = zoneItems.filter((it) => it.cat && it.cat.includes(s.name));
        const subLines = subItems.length > 0
          ? subItems.slice(0, 8).map((it) => {
              const live = isLive(it);
              const bg = live ? `background:${c}22;` : "";
              const mark = live ? `<span style="color:${c};font-weight:700">● </span>` : "";
              return `<div style="font-size:11px;color:#101113;margin:2px 0;padding:1px 4px;border-radius:4px;${bg}">${mark}<b>${it.time}</b> ${it.title}</div>`;
            }).join("") + (subItems.length > 8 ? `<div style="font-size:10px;color:#888;margin-top:2px">외 ${subItems.length - 8}개</div>` : "")
          : `<div style="font-size:11px;color:#888;margin-top:4px">이 장소 프로그램 없음</div>`;
        const subPopup = `<div style="font-family:'Jua',sans-serif;max-width:240px">`
          + `<div style="font-size:10px;color:${c};font-weight:700">${z.num}. ${z.title}</div>`
          + `<b style="font-size:13px">${s.name}</b>`
          + `<div style="margin-top:6px;padding-top:4px;border-top:1px solid #ddd">${subLines}</div>`
          + `</div>`;
        const sm = L.marker([s.lat, s.lng], { icon: subIcon }).addTo(map).bindPopup(subPopup);
        zoneLayersRef.current.push(sm);
      });
    });
  }, [zoneOverride, _zoneTick]);

  useEffect(() => {
    if (!dbUrl) { setStatus("공유 주소(db)가 없습니다"); return; }
    let stopped = false;
    const base = dbUrl.replace(/\/+$/, "");
    const L = window.L;
    const makeIcon = (id, b, noGps) => {
      const dir = b.dir === "inbound" ? "inbound" : "outbound";
      const bg = dir === "inbound" ? FT.teal : FT.orange;
      const wait = b.waiting === true;
      // 대기 중: 주황소프트 배경 + 펄스 애니메이션 + "대기" 텍스트로 시각 강조
      if (wait) {
        const html = `<div style="display:inline-flex;align-items:center;gap:4px;background:${FT.orangeSoft};color:${FT.orangeDark};border:2.5px solid ${FT.ink};border-radius:999px;padding:3px 10px;box-shadow:2px 2px 0 ${FT.ink};font-family:'Jua',sans-serif;font-weight:700;font-size:12px;white-space:nowrap;">🅿️ ${id} 대기 중</div>`;
        return L.divIcon({ className: "fest-wait-marker", html, iconSize: [160, 28], iconAnchor: [80, 14] });
      }
      const borderStyle = noGps ? "dashed" : "solid";
      const shadow = noGps ? "" : `box-shadow:2px 2px 0 ${FT.ink};`;
      const trailing = noGps ? " 예상" : "";
      const html = `<div style="display:inline-flex;align-items:center;gap:3px;background:${bg};color:#fff;border:2.5px ${borderStyle} ${FT.ink};border-radius:999px;padding:3px 9px;${shadow}font-family:'Jua',sans-serif;font-weight:700;font-size:12px;white-space:nowrap;">🚌 ${id}${trailing}</div>`;
      return L.divIcon({ className: "", html, iconSize: [140, 28], iconAnchor: [70, 14] });
    };
    const schedIcon = (dir, tripNum) => {
      const c = dir === "inbound" ? FT.teal : FT.orange;
      const html = `<div style="display:inline-flex;align-items:center;gap:3px;background:#fff;color:${c};border:2px dashed ${c};border-radius:999px;padding:3px 9px;font-family:'Jua',sans-serif;font-weight:700;font-size:11px;white-space:nowrap;opacity:0.95;">🚌 ${tripNum}회차 예상</div>`;
      return L.divIcon({ className: "", html, iconSize: [140, 26], iconAnchor: [70, 13] });
    };
    // A8: 휴식(대기) 마커 — 종착지에서 다음 leg 출발까지의 휴식
    const restIcon = (mins, terminus) => {
