      const html = `<div style="display:inline-flex;align-items:center;gap:3px;background:#f1f5f9;color:#475569;border:2px dashed #94a3b8;border-radius:999px;padding:3px 9px;font-family:'Jua',sans-serif;font-weight:700;font-size:11px;white-space:nowrap;">🅿 ${terminus} 휴식 · ${mins}분 후 출발</div>`;
      return L.divIcon({ className: "", html, iconSize: [200, 26], iconAnchor: [100, 13] });
    };
    const poll = async () => {
      try {
        const r = await fetch(`${base}/buses.json`, { cache: "no-store" });
        const data = await r.json();
        const map = mapRef.current; if (!map) return;
        const now = Date.now(); let n = 0;
        const liveTripSet = new Set();
        const validIds = new Set();
        // FAKE 모드 일관성 — 운영자가 시연 모드 켜면 라이브 지도의 스케줄 추정 마커도 가짜 시각 따라감
        const nowDate = getNow();
        const nowMinTick = nowDate.getHours() * 60 + nowDate.getMinutes() + nowDate.getSeconds() / 60;
        // P1-7: 다중 셔틀 같은 좌표 겹침 방지 — 1차에 (id, basePos, b) 모아 클러스터, 2차에서 원형 offset 후 마커 배치
        const items = [];
        Object.entries(data || {}).forEach(([id, b]) => {
          if (!b || (b.ts && now - b.ts > 60000)) return;
          let pos = null, noGps = false;
          if (b.lat != null && b.lng != null) {
            const dirKey0 = b.dir === "inbound" ? "inbound" : "outbound";
            // OSRM 도로 폴리라인(곡선)이 로드돼 있으면 그것에 스냅 — 없으면 정류장 직선 fallback
            const osrmPoly = osrmPolyRef.current[dirKey0];
            const snap = snapToRoute({ lat: b.lat, lng: b.lng }, dirKey0, ROUTES[dirKey0].stops, osrmPoly);
            if (snap && snap.perpDist < 100) pos = [snap.snapped.lat, snap.snapped.lng];
            else pos = [b.lat, b.lng];
          } else if (b.stop && b.dir) {
            const dirKey = b.dir === "inbound" ? "inbound" : "outbound";
            const op = b.trip ? operationBasedPos(dirKey, b.trip - 1, b.stop, nowMinTick, b.waiting === true) : null;
            if (op) { pos = [op.lat, op.lng]; noGps = true; b._op = op; }
            else {
              const route = ROUTES[dirKey];
              const s = route && route.stops.find((x) => x.name === b.stop);
              if (s && s.lat != null) { pos = [s.lat, s.lng]; noGps = true; }
            }
          }
          if (!pos) return;
          n++;
          validIds.add(id);
          const dir = b.dir === "inbound" ? "inbound" : "outbound";
          if (b.trip) liveTripSet.add(`${dir}|${b.trip}`);
          let phaseText = "";
          if (b._op) {
            const op = b._op;
            phaseText = op.phase === "waiting" ? "출발 대기"
              : op.phase === "before" ? `${op.fromName} 출발 시각 전`
              : op.phase === "approaching" ? `${op.toName} 진입 중`
              : op.phase === "between" ? `${op.fromName} → ${op.toName} 이동 중`
              : op.phase === "at" ? `${op.fromName} 도착`
              : op.phase === "passed" ? `${op.fromName} 통과 · ${op.toName}로`
              : op.phase === "end" ? "종점 도착" : "";
          }
          const label = `${id} · ${ROUTES[dir].label}${b.trip ? ` ${b.trip}회차` : ""}${phaseText ? ` · ${phaseText}` : (b.stop ? ` · ${b.stop}` : "")}${b.waiting === true ? " · 출발 대기" : ""}${noGps ? " · 예상" : ""}`;
          items.push({ id, b, pos, noGps, label });
        });
        // 클러스터 — 좌표 20m 이내면 같은 그룹
        const PROX_M = 20;
        const clusters = [];
        items.forEach((it) => {
          let g = null;
          for (const c of clusters) {
            if (distanceMeters({ lat: c.center[0], lng: c.center[1] }, { lat: it.pos[0], lng: it.pos[1] }) < PROX_M) { g = c; break; }
          }
          if (g) {
            g.items.push(it);
            // 그룹 중심을 평균으로 갱신
            const n = g.items.length;
            g.center = [g.items.reduce((s, x) => s + x.pos[0], 0) / n, g.items.reduce((s, x) => s + x.pos[1], 0) / n];
          } else {
            clusters.push({ center: [it.pos[0], it.pos[1]], items: [it] });
          }
        });
        // 그룹 ≥ 2 면 원형 28m 반경으로 분산. 단일은 원래 좌표 그대로
        const OFFSET_M = 28;
        const finalPos = new Map();
        clusters.forEach((c) => {
          if (c.items.length === 1) {
            finalPos.set(c.items[0].id, c.items[0].pos);
          } else {
            const cosLat = Math.cos(c.center[0] * Math.PI / 180);
            const dLat = OFFSET_M / 111320;
            const dLng = OFFSET_M / (111320 * Math.max(cosLat, 0.1));
            const sorted = c.items.slice().sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
            sorted.forEach((it, i) => {
              const ang = (2 * Math.PI * i) / sorted.length;
              finalPos.set(it.id, [c.center[0] + Math.sin(ang) * dLat, c.center[1] + Math.cos(ang) * dLng]);
            });
          }
        });
        // 마커 배치
        items.forEach((it) => {
          const pos = finalPos.get(it.id) || it.pos;
          let m = markersRef.current[it.id];
          if (!m) {
            m = L.marker(pos, { icon: makeIcon(it.id, it.b, it.noGps) }).addTo(map);
            markersRef.current[it.id] = m;
          } else {
            m.setLatLng(pos);
            m.setIcon(makeIcon(it.id, it.b, it.noGps));
          }
          m.bindTooltip(it.label, { direction: "top", offset: [0, -16] });
        });
        Object.keys(markersRef.current).forEach((id) => {
          if (!validIds.has(id)) { map.removeLayer(markersRef.current[id]); delete markersRef.current[id]; }
        });

        // 시간표 기반 추정 위치 — 라이브 신호가 없어도 항상 표시(라이브로 같은 회차 송신 시만 해당 회차 skip)
        // 행사일(6.13/6.14)이 아니면 시간표 추정·휴식 마커 전부 표시 안 함 (행사 전/후 가짜 운행 방지)
        const schedKeys = new Set();
        let nSched = 0;
        let nResting = 0;
        const today = getNow();
        const fDay = today.getMonth() === 5 ? today.getDate() : -1;
        const isFestivalDay = fDay === 13 || fDay === 14;
        const day1Ts = new Date(2026, 5, 13).getTime();
        const day2Ts = new Date(2026, 5, 14).getTime();
        const today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
        const preFestival = today0 < day1Ts;
        const postFestival = today0 > day2Ts;
        // FAKE 시각 활성이면 행사일 가드 우회 — 시연·테스트에서도 노선상에 가짜 버스 마커가 보이도록
        if (isFestivalDay || FAKE) {
          const tripsToday = today.getMonth() === 5 && today.getDate() === 14 ? 5 : ROUTES.outbound.trips.length;
          const nowMin = today.getHours() * 60 + today.getMinutes();
          const obFirstStop = ROUTES.outbound.stops[0];
          const ibFirstStop = ROUTES.inbound.stops[0];
          ["outbound", "inbound"].forEach((dir) => {
            const osrmPoly = osrmPolyRef.current[dir];
            for (let ti = 0; ti < tripsToday; ti++) {
              const tripNum = ti + 1;
              if (liveTripSet.has(`${dir}|${tripNum}`)) continue;
              const pos = scheduledBusPos(dir, ti, nowMin, osrmPoly);
              if (!pos) continue;
              const key = `${dir}|${tripNum}`;
              schedKeys.add(key); nSched++;
              const lbl = `예정 · ${ROUTES[dir].label} ${tripNum}회차 · ${pos.fromName} → ${pos.toName}`;
              let m = schedMarkersRef.current[key];
              if (!m) {
                m = L.marker([pos.lat, pos.lng], { icon: schedIcon(dir, tripNum) }).addTo(map);
                schedMarkersRef.current[key] = m;
              } else {
                m.setLatLng([pos.lat, pos.lng]);
                m.setIcon(schedIcon(dir, tripNum));
              }
              m.bindTooltip(lbl, { direction: "top", offset: [0, -16] });
            }
          });
          // A8: 휴식 갭 — 종착지(축제장 또는 5·18광장)에서 다음 leg 까지 대기 마커
          const pushRest = (dir, ti, terminusStop, minsLeft, key) => {
            if (!terminusStop || terminusStop.lat == null || liveTripSet.has(key) || schedKeys.has(key)) return;
            schedKeys.add(key); nResting++;
            const lbl = `🅿 ${terminusStop.name} 휴식 · ${ROUTES[dir].label} ${ti + 1}회차 · ${minsLeft}분 후 출발`;
            let m = schedMarkersRef.current[key];
            if (!m) {
              m = L.marker([terminusStop.lat, terminusStop.lng], { icon: restIcon(minsLeft, terminusStop.name) }).addTo(map);
              schedMarkersRef.current[key] = m;
            } else {
              m.setLatLng([terminusStop.lat, terminusStop.lng]);
              m.setIcon(restIcon(minsLeft, terminusStop.name));
            }
            m.bindTooltip(lbl, { direction: "top", offset: [0, -16] });
          };
          // outbound n 종착(축제장) → inbound n 출발
          for (let ti = 0; ti < tripsToday; ti++) {
            const ob = ROUTES.outbound.trips[ti], ib = ROUTES.inbound.trips[ti];
            if (!ob || !ib) continue;
            const obEnd = toMin(ob[ob.length - 1]);
            const ibStart = toMin(ib[0]);
            if (obEnd < ibStart && nowMin >= obEnd && nowMin < ibStart) {
              pushRest("inbound", ti, ibFirstStop, ibStart - nowMin, `inbound|${ti + 1}`);
            }
          }
          // inbound n 종착(5·18광장) → outbound n+1 출발 (점심휴식 포함)
          for (let ti = 0; ti < tripsToday; ti++) {
            const ib = ROUTES.inbound.trips[ti], nob = ROUTES.outbound.trips[ti + 1];
            if (!ib || !nob) continue;
            const ibEnd = toMin(ib[ib.length - 1]);
            const nobStart = toMin(nob[0]);
            if (ibEnd < nobStart && nowMin >= ibEnd && nowMin < nobStart) {
              pushRest("outbound", ti + 1, obFirstStop, nobStart - nowMin, `outbound|${ti + 2}`);
            }
          }
        }
        Object.keys(schedMarkersRef.current).forEach((k) => {
          if (!schedKeys.has(k)) { map.removeLayer(schedMarkersRef.current[k]); delete schedMarkersRef.current[k]; }
        });

        setCount(n);
        setLastSync(Date.now());
        const totalShown = n + nSched + nResting;
        setStatus(n > 0 && nSched > 0 ? `실시간 ${n}대 · 예정 ${nSched}대${nResting > 0 ? ` · 휴식 ${nResting}대` : ""}`
          : n > 0 ? "실시간"
          : nSched > 0 ? `시간표 기준 ${nSched}대${nResting > 0 ? ` · 휴식 ${nResting}대` : ""}`
          : nResting > 0 ? `🅿 ${nResting}대 휴식 중`
          : postFestival ? "행사 종료"
          : preFestival ? `행사 전 · D-${Math.max(1, Math.round((day1Ts - today0) / 86400000))}`
          : "운행 중인 셔틀이 없습니다");
      } catch (_) { setCount(0); setStatus("연결 오류 — 잠시 후 다시 시도"); try { window.__mdsStats && window.__mdsStats.track("error_conn_live"); } catch (__) {} }
    };
    poll();
    let id = setInterval(() => { if (!stopped && !document.hidden) poll(); }, 3000);
    const onVis = () => { if (!stopped && !document.hidden) poll(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { stopped = true; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [dbUrl]);

  return (
    <div style={{ position: "relative" }}>
      <div ref={elRef} style={{ height: "100vh", width: "100%" }} />

      {/* 제목 + 운행 대수 칩 — 뷰포트 기준 고정(스크롤·줌에도 항상 노출) */}
      <div style={{ position: "fixed", top: "calc(10px + env(safe-area-inset-top, 0px))", left: 10, right: 10, zIndex: 1100,
        display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, pointerEvents: "none" }}>
        {onHome ? (
          <button onClick={onHome} aria-label="홈으로 — 스위치 다시 끄기"
            title="홈으로"
            style={{ background: "#fff", color: FT.ink, padding: "6px 12px 6px 8px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 13,
              boxShadow: "3px 3px 0 " + FT.ink, fontWeight: 700, cursor: "pointer", pointerEvents: "auto",
              display: "inline-flex", alignItems: "center", gap: 6 }}>
            <img src="logo.png" alt="" aria-hidden="true"
              style={{ height: 24, width: "auto", transform: "scaleY(-1)" }} />
            <span style={{ color: FT.orange }}>무등생각</span> 지도
          </button>
        ) : (
          <div style={{ background: "#fff", color: FT.ink, padding: "6px 12px 6px 8px", borderRadius: 10,
            border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 13,
            boxShadow: "3px 3px 0 " + FT.ink, fontWeight: 700,
            display: "inline-flex", alignItems: "center", gap: 6 }}>
            <img src="logo.png" alt="" aria-hidden="true"
              style={{ height: 24, width: "auto", transform: "scaleY(-1)" }} />
            <span style={{ color: FT.orange }}>무등생각</span> 지도
          </div>
        )}
        {(() => {
          const ageSec = lastSync ? Math.floor((Date.now() - lastSync) / 1000) : -1;
          const stale = ageSec < 0 || ageSec > 15; // 15초 이상 갱신 안 됐으면 신호 약함
          const weak = ageSec >= 8 && ageSec <= 15;
          const dot = stale ? "#f59e0b" : weak ? "#fb923c" : count > 0 ? FT.teal : FT.mute;
          const bg = stale ? "#FEF3C7" : count > 0 ? FT.tealSoft : "#EEEFF1";
          const tx = stale ? "#92400e" : count > 0 ? FT.tealDark : FT.inkSoft;
          const ageStr = ageSec < 0 ? "" : ageSec < 5 ? "방금" : ageSec < 60 ? `${ageSec}s 전` : `${Math.floor(ageSec / 60)}분 전`;
          const text = stale ? `신호 약함 · ${ageStr}` : count > 0 ? `운행 중 ${count}대` : status;
          return (
            <div role="status" aria-live="polite"
              style={{ display: "inline-flex", alignItems: "center", gap: 6,
                background: bg, border: "2px solid " + FT.ink, color: tx,
                padding: "6px 10px", borderRadius: 10, fontFamily: "'Jua', sans-serif", fontSize: 12,
                boxShadow: "3px 3px 0 " + FT.ink, fontWeight: 700 }}
              title={ageStr ? `마지막 동기화 ${ageStr}` : "동기화 대기 중"}>
              <span className={count > 0 && !stale ? "animate-pulse" : ""}
                style={{ width: 8, height: 8, borderRadius: "50%", background: dot }} />
              {text}
            </div>
          );
        })()}
      </div>

      {/* 스티커 — place mode 시 viewport 안쪽 청록 outline 으로 모드 진입 시각 강조 */}
      {stickerKind && (
        <div aria-hidden style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 1050,
          boxShadow: `inset 0 0 0 3px ${FT.teal}`, borderRadius: 0 }} />
      )}
      {/* place mode 상단 바 — 이모지·메시지 미리보기·편집(팔레트 재오픈)·완료 */}
      {stickerKind && (
        <div style={{ position: "fixed", left: 10, right: 10, top: "calc(70px + env(safe-area-inset-top, 0px))",
          zIndex: 1200, pointerEvents: "none" }}>
          <div style={{ pointerEvents: "auto", display: "flex", alignItems: "center", gap: 8,
            background: FT.tealSoft, border: "2px solid " + FT.tealDark, borderRadius: 12,
            boxShadow: "3px 3px 0 " + FT.tealDark, padding: "8px 12px",
            fontFamily: "'Jua', sans-serif", fontSize: 12, color: FT.tealDark, fontWeight: 700 }}>
            <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center",
              width: 32, height: 32, borderRadius: "50%", background: "#fff",
              border: "2px solid " + FT.tealDark, fontSize: 18, flexShrink: 0 }}>{stickerKind}</span>
            <div style={{ flex: 1, minWidth: 0, lineHeight: 1.25 }}>
              <div style={{ fontSize: 12 }}>지도를 탭해서 남기기 (1회)</div>
              {stickerLabel && (
                <div style={{ fontSize: 11, color: FT.ink, fontWeight: 400, marginTop: 2,
                  overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}
                  title={stickerLabel}>
                  ✏ {stickerLabel}
                </div>
              )}
            </div>
            <button onClick={() => setPaletteOpen(true)}
              title="이모지 / 메시지 변경"
              style={{ background: "#fff", border: "1.5px solid " + FT.tealDark, borderRadius: 8,
                padding: "5px 10px", fontSize: 11, fontFamily: "'Jua', sans-serif", fontWeight: 700,
                color: FT.tealDark, cursor: "pointer", flexShrink: 0 }}>
              {stickerLabel ? "수정" : "메시지"}
            </button>
            <button onClick={() => { setStickerKind(null); setStickerLabel(""); }}
              style={{ background: FT.tealDark, border: "1.5px solid " + FT.tealDark, borderRadius: 8,
                padding: "5px 12px", fontSize: 11, fontFamily: "'Jua', sans-serif", fontWeight: 700,
                color: "#fff", cursor: "pointer", flexShrink: 0 }}>완료</button>
          </div>
        </div>
      )}
      {/* 플로팅 버튼 — idle 시 '스티커' 누르면 목록 시트 열림. place mode / palette open 시엔 숨김(상단 바로 제어). */}
      {!stickerKind && !paletteOpen && (
        <button onClick={() => {
            try { window.__mdsStats && window.__mdsStats.track("open_sticker_list"); } catch (_) {}
            setStickerListOpen(true);

      <div role="status" aria-live="polite" aria-atomic="true"

      {/* 범례 (좌하단) — 스티커 버튼과 같은 baseline */}

        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>

            background: FT.orange, color: "#fff", fontSize: 10, fontFamily: "'Jua', sans-serif", fontWeight: 700, border: "1.5px solid " + FT.ink }}>1</span>
          행사 주요 구역

}

/* 버스가 시발지 출발 전이거나 종점 도착 후 다음 출발 대기 중인지 자동 추론 */
function inferWaiting(bus, nowMin, tripsToday) {
  const dir = bus.dir === "inbound" ? "inbound" : "outbound";
  const route = ROUTES[dir];
  const stops = route.stops;
  const trip = (bus.trip || 1) - 1;
  const sched = route.trips[trip];
  if (!sched) return null;
  // 시발지에서 이번 회차 출발 시각 전
  if (bus.stop === stops[0].name && nowMin < toMin(sched[0])) {
    return { place: stops[0].name, time: sched[0], tripIdx: trip + 1, dir };
  }
  // 종점 도착 후 반대 방향 다음 회차 대기
  if (bus.stop === stops[stops.length - 1].name) {
    const opp = dir === "outbound" ? "inbound" : "outbound";
    const oppTrips = ROUTES[opp].trips.slice(0, tripsToday);
    for (let i = 0; i < oppTrips.length; i++) {
      if (toMin(oppTrips[i][0]) >= nowMin) {
        return { place: stops[stops.length - 1].name, time: oppTrips[i][0], tripIdx: i + 1, dir: opp };
      }
    }
  }
  return null;
}

/* 승객 화면 버스 카드 — 진행바를 현재 정류장으로 자동 스크롤, 다음 정류장·도착예정 표시 */
function BusCard({ id, bus, agoText, nowMin, tripsToday, departedInfo }) {
  const stripRef = useRef(null), activeRef = useRef(null);
  const dir = bus.dir === "inbound" ? "inbound" : "outbound";
  const route = ROUTES[dir];
  const stops = route.stops;
  // ci 보정 — 폴리라인 투영으로 노선 진행 위치에서 다음 도착 정류장 산출. 뒤로 안 감 + 최대 2단계 forward + perpDist 200m 가드.
  let ci = stops.findIndex((s) => s.name === bus.stop);
  const ciFromStop = ci;
  const sched = route.trips[(bus.trip || 1) - 1];
  if (bus.lat != null && bus.lng != null) {
    const proj = projectOnRoute({ lat: bus.lat, lng: bus.lng }, stops);
    if (proj && proj.perpDist < 200 && proj.ci > ci) {
      const maxAdvance = ciFromStop >= 0 ? Math.min(proj.ci, ciFromStop + 2) : proj.ci;
      ci = Math.max(ci, maxAdvance);
    }
  }
  // phase: 운영자의 arrived/waiting만 신뢰 (GPS 거리 기반 자동 판정 제거)
  let phase = "approaching";
  if (bus.waiting) phase = "waiting";
  else if (bus.arrived) phase = "arrived";
  else if (departedInfo && departedInfo.stopName && Date.now() - departedInfo.at < 90000) phase = "departed";
  else phase = "approaching";
  const nextStop = ci >= 0 && ci < stops.length - 1 ? stops[ci + 1] : null;
  const nextEta = nextStop && sched ? sched[ci + 1] : null;
  const finalName = stops[stops.length - 1].name;
  const finalEta = sched ? sched[sched.length - 1] : null;
  const autoWait = inferWaiting(bus, nowMin, tripsToday);
  const waitInfo = bus.waiting === true ? (autoWait || { place: bus.stop || "—", time: null, tripIdx: null, dir }) : autoWait;
  useEffect(() => {
    if (waitInfo) return;
    const el = activeRef.current, c = stripRef.current;
    if (el && c) c.scrollTo({ left: el.offsetLeft - c.clientWidth / 2 + el.clientWidth / 2, behavior: "smooth" });
  }, [ci, waitInfo]);
  return (
    <div style={{ background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 12, boxShadow: "3px 3px 0 " + FT.ink, padding: 10 }}>
      <div className="flex items-center justify-between" style={{ marginBottom: 6 }}>
        <div className="flex items-center gap-2 min-w-0">
          <span style={{ fontSize: 20 }}>🚌</span>
          <span className="flex-shrink-0" style={{ color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{id}</span>
          <span className="truncate" style={{ background: dir === "outbound" ? FT.orange : FT.teal, color: "#fff",
            border: "1.5px solid " + FT.ink, padding: "2px 8px", borderRadius: 999,
            fontSize: 11, fontFamily: "'Jua', sans-serif", display: "inline-flex", alignItems: "center", gap: 4 }}
            aria-label={`${route.label} ${bus.trip || "-"}회차`}>
            <span aria-hidden style={{ fontSize: 9 }}>{dir === "outbound" ? "▶" : "◀"}</span>
            {route.label} · {bus.trip || "-"}회차
          </span>
        </div>
        <span className="flex-shrink-0 ml-2 flex items-center gap-1" style={{ color: FT.mute, fontSize: 10 }}>
          <span className="animate-pulse" style={{ width: 7, height: 7, borderRadius: "50%", background: FT.teal }} />{agoText(bus.ts)}
        </span>
      </div>

      {waitInfo ? (
        <div style={{ background: FT.orangeSoft, border: "2px solid " + FT.ink, borderRadius: 10, padding: "16px 14px", textAlign: "center" }}>
          <div style={{ fontSize: 11, letterSpacing: 2, marginBottom: 4, color: FT.orangeDark, fontFamily: "'Jua', sans-serif" }}>
            🅿️ 출발 대기 중
          </div>
          <div style={{ fontSize: 18, fontWeight: 700, color: FT.ink, fontFamily: "'Jua', sans-serif" }}>{waitInfo.place}</div>
          <div style={{ fontSize: 14, marginTop: 8, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>
            다음 출발 <b style={{ color: FT.orangeDark }}>{waitInfo.time || "미정"}</b>
            {waitInfo.tripIdx ? <span style={{ fontSize: 11, color: FT.mute, marginLeft: 4 }}>({waitInfo.tripIdx}회차 · {ROUTES[waitInfo.dir].label})</span> : null}
          </div>
        </div>
      ) : (
      <React.Fragment>
      <div ref={stripRef} className="flex items-start gap-0 overflow-x-auto" style={{ scrollbarWidth: "none", paddingTop: 5, paddingBottom: 2 }}>
        {stops.map((s, i) => {
          // 정류장 점 색: 지나온 곳=청록, 곧 도착(ci)=주황(도착 시 청록), 미래=흰
          const isCur = i === ci;
          const isPast = i < ci;
          const dotBg = isCur ? (phase === "arrived" ? FT.teal : "#fff") : isPast ? FT.teal : "#fff";
          const dotBorder = isCur ? (phase === "arrived" ? FT.tealDark : FT.orangeDark) : isPast ? FT.tealDark : FT.mute;
          // 연결 막대 색: (i, i+1) 구간. (ci-1, ci) 구간은 주황 강조(곧 도착 막대)
          let segColor = "#D1D5DB", segH = 2;
          if (i < ci - 1) { segColor = FT.teal; }
          else if (i === ci - 1) { segColor = phase === "arrived" ? FT.teal : FT.orange; segH = 4; }
          return (
            <React.Fragment key={s.name}>
              <div ref={isCur ? activeRef : null} className="flex flex-col items-center flex-shrink-0">
                <div style={{
                  width: isCur ? 14 : 11, height: isCur ? 14 : 11, borderRadius: "50%",
                  background: dotBg, border: "2px solid " + dotBorder,
                  boxShadow: isCur && phase !== "arrived" ? `0 0 0 3px ${FT.orangeSoft}` : "none" }} />
                <span style={{ fontSize: 10, marginTop: 2, whiteSpace: "nowrap", padding: "0 4px",
                  color: isCur ? (phase === "arrived" ? FT.tealDark : FT.orangeDark) : isPast ? FT.tealDark : FT.mute,
                  fontWeight: isCur ? 700 : 400 }}>{s.name}</span>
              </div>
              {i < stops.length - 1 && <div className="flex-shrink-0 self-start" style={{ width: 16, height: segH, marginTop: 6 + (segH > 2 ? -1 : 0), background: segColor, borderRadius: 1 }} />}
            </React.Fragment>
          );
        })}
      </div>

      {/* 곧 도착 / 정차 중 / 진입 / 이탈 정보 — 진행바 아래 */}
      {(() => {
        const schedAt = sched && ci >= 0 ? sched[ci] : null;
        const mins = schedAt ? toMin(schedAt) - nowMin : null;
        const delayed = phase !== "arrived" && mins != null && mins < 0;
        const etaLabel = phase === "arrived" ? null
          : phase === "departed" ? null
          : mins == null ? null
          : mins > 0 ? `약 ${mins}분 후`
          : mins === 0 ? "잠시 후"
          : `지연 ${-mins}분`;
        // phase 별 색·라벨·표시 정류장
        const phaseLabel = phase === "arrived" ? "● 정차 중"
          : phase === "entering" ? "정류장 진입 중"
          : phase === "departed" ? "방금 출발"
          : phase === "waiting" ? "🅿️ 출발 대기"
          : "곧 도착";
        const isArrivedish = phase === "arrived";
        const accent = isArrivedish ? FT.tealDark : FT.orangeDark;
        const bgFill = isArrivedish ? FT.tealSoft : delayed ? "#FEE2E2" : FT.orangeSoft;
        const borderC = delayed ? "#dc2626" : accent;
        const etaColor = delayed ? "#dc2626" : accent;
        const displayStop = phase === "departed" && departedInfo?.stopName ? departedInfo.stopName : ((ci >= 0 && stops[ci]?.name) || bus.stop || "운행 중");
        return (
          <div style={{ marginTop: 6, padding: "7px 10px", borderRadius: 8,
            background: bgFill, border: "1.5px solid " + borderC,
            display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 11, color: borderC, fontFamily: "'Jua', sans-serif", fontWeight: 700, flexShrink: 0 }}>
              {phaseLabel}
            </span>
            <span className="truncate" style={{ fontSize: 13, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, flex: 1 }}>
              {displayStop}
            </span>
            <span style={{ flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "flex-end", lineHeight: 1.15 }}>
              {etaLabel && (
                <span style={{ fontSize: 12, color: etaColor, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{etaLabel}</span>
              )}
              {schedAt && (
                <span style={{ fontSize: 10, color: etaColor, fontFamily: "'IBM Plex Mono', monospace", opacity: 0.85 }}>
                  {delayed ? `${fromMin(toMin(schedAt) + (-mins))} 예상` : `${schedAt} 예정`}
                </span>
              )}
            </span>
          </div>
        );
      })()}

      {/* 남은 정류장 — 각 도착 예정 시각 (지연 누적 반영) */}
      {(() => {
        const ciSched = sched && ci >= 0 ? sched[ci] : null;
        if (!ciSched) return null;
        const ciSchedMin = toMin(ciSched);
        const delay = Math.max(0, nowMin - ciSchedMin); // 지연(분)
        const remaining = [];
        for (let i = ci + 1; i < stops.length; i++) {
          const t = sched && sched[i] ? sched[i] : null;
          if (!t) continue;
          const adj = (toMin(t) - ciSchedMin) + Math.max(0, ciSchedMin - nowMin);
          remaining.push({ name: stops[i].name, time: t, mins: adj, isFinal: i === stops.length - 1 });
        }
        if (remaining.length === 0) return null;
        return (
          <div style={{ marginTop: 6, padding: "7px 10px", background: FT.paper, border: "1.5px solid " + FT.mute + "55", borderRadius: 8 }}>
            <div className="flex items-center justify-between mb-1">
              <span style={{ fontSize: 10, color: FT.inkSoft, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>남은 정류장</span>
              {delay > 0 && <span style={{ fontSize: 10, color: "#dc2626", fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>+{delay}분 지연</span>}
            </div>
            <div className="space-y-1">
              {remaining.map((r) => (
                <div key={r.name} className="flex items-center gap-2" style={{ fontSize: 11, fontFamily: "'Jua', sans-serif" }}>
                  <span style={{ flex: 1, color: FT.ink, fontWeight: r.isFinal ? 700 : 400 }}>
                    {r.name}{r.isFinal ? " (종점)" : ""}
                  </span>
                  <span style={{ color: delay > 0 ? "#dc2626" : FT.inkSoft, fontWeight: 700, minWidth: 56, textAlign: "right" }}>
                    {r.mins === 0 ? "곧" : `${r.mins}분 후`}
                  </span>
                  <span style={{ color: FT.mute, fontFamily: "'IBM Plex Mono', monospace", minWidth: 44, textAlign: "right" }}>
                    {delay > 0 ? fromMin(toMin(r.time) + delay) : r.time}
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}
      </React.Fragment>
      )}
    </div>
  );
}

/* 다가올 프로그램 슬라이드 배너 — 행사 전·당일에만 노출 (종료 후엔 숨김).
   - 행사 전: '행사 미리보기' (day1·day2 통합 시간순 균등 5개)
   - 행사 당일: '곧 시작해요'(upcoming) → '지금 진행 중'(ongoing) → '오늘 진행 종료'(ended) 순
   carousel: 최대 5장 후보를 가로 슬라이드로 보여주고 5초마다 자동 진행 + dots 인디케이터 + 터치 스와이프. */
/* 최근 스티커 슬라이드 배너 — 라이브 지도 하단(스티커 플로팅 위) 에 노출.
   최근 1시간 이내 등록된 스티커 중 메시지가 있는 것 우선, 없으면 이모지+위치만. */
function RecentStickersBanner({ stickers, onTap }) {
  const STICKER_VIEW_WINDOW_MS = 60 * 60 * 1000; // 1시간 — 막 등록된 것만
  const cutoff = Date.now() - STICKER_VIEW_WINDOW_MS;
  const STICKER_LABEL = { "👍": "좋아요", "📸": "포토스팟", "💤": "쉬는 곳", "🚻": "화장실", "🍱": "음식" };
  const items = Object.entries(stickers || {})
    .map(([id, s]) => ({ id, ...(s || {}) }))
    .filter((s) => s && typeof s.lat === "number" && typeof s.lng === "number" && typeof s.ts === "number" && s.ts >= cutoff)
    .sort((a, b) => {
      // 메시지 있는 것 우선, 그 다음 최신순
      const aHas = a.label ? 1 : 0;
      const bHas = b.label ? 1 : 0;
      if (aHas !== bHas) return bHas - aHas;
      return b.ts - a.ts;
    })
    .slice(0, 8);

  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);
  useEffect(() => {
    if (paused || items.length <= 1) return;
    const id = setInterval(() => setIdx((i) => (i + 1) % items.length), 4500);
    return () => clearInterval(id);
  }, [paused, items.length]);

  if (items.length === 0) return null;
  const safeIdx = Math.min(idx, items.length - 1);
  const cur = items[safeIdx];
  const ageMin = Math.max(0, Math.floor((Date.now() - cur.ts) / 60000));
  const kindName = STICKER_LABEL[cur.kind] || "";
  const accent = FT.tealDark; // 스티커 배너 공통 액센트(커뮤니티 톤)
  return (
    <div role="region" aria-roledescription="carousel" aria-label="최근 스티커">
      {/* 카드 — UpcomingPromoCard compact 와 동일 프레임: bg paper-ish, mute55 보더, 4px 좌측 액센트, 6/9 패딩, 그림자 없음 */}
      <div style={{ background: "rgba(255,255,255,0.95)", color: FT.ink,
        border: "1.5px solid " + FT.mute + "55", borderRadius: 10,
        borderLeft: `4px solid ${accent}`, boxShadow: "none",
        padding: "6px 9px", fontFamily: "'Jua', sans-serif",
        display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}
        onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}
        onClick={() => { if (typeof onTap === "function") onTap(cur); }}>
        <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center",
          width: 26, height: 26, borderRadius: "50%", background: "#fff",
          border: "1.5px solid " + accent, fontSize: 16, flexShrink: 0 }}>{cur.kind || "📍"}</span>
        <div style={{ flex: 1, minWidth: 0, lineHeight: 1.25,
          display: "flex", flexDirection: "column", gap: 1 }}>
          <div style={{ fontSize: 12, color: FT.ink, fontWeight: 700,
            overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
            display: "-webkit-box", WebkitLineClamp: 1, WebkitBoxOrient: "vertical" }}>
            {cur.label ? cur.label : (kindName || "스티커")}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 10, color: accent, fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700 }}>
              {ageMin <= 0 ? "방금" : `${ageMin}분 전`}
              {kindName && cur.label ? <span style={{ fontSize: 9, color: accent, opacity: 0.8 }}> · {kindName}</span> : null}
            </span>
            <span style={{ fontSize: 10, color: accent, fontWeight: 700 }}>
              찾기
            </span>
          </div>
        </div>
      </div>
      {/* dots — UpcomingPromoCard compact 와 동일 (12/4) */}
      {items.length > 1 && (
        <div style={{ display: "flex", justifyContent: "center", gap: 4, marginTop: 4 }}>
          {items.map((_, i) => (
            <button key={i} onClick={(e) => { e.stopPropagation(); setIdx(i); setPaused(true); setTimeout(() => setPaused(false), 4000); }}
              aria-label={`스티커 ${i + 1}`}
              style={{ width: i === safeIdx ? 12 : 4, height: 4, borderRadius: 999,
                background: i === safeIdx ? FT.ink : FT.mute + "88",
                border: "none", padding: 0, cursor: "pointer",
                transition: "width 0.2s, background 0.2s" }} />
          ))}
        </div>
      )}
    </div>
  );
}

   같은 카드 프레임 (border/radius/padding 통일), 좌측 액센트 색상으로만 타입 구분
   · festival: zone 색(orange/teal) — 클릭 시 행사장 탭으로

   carousel 보다 한 화면에 더 많이 보고 싶을 때, 또는 특정 스티커 빨리 찾을 때. */
function StickerListSheet({ stickers, onClose, onTap, onAddNew }) {

          </div>
          {typeof onAddNew === "function" && (

                background: FT.tealDark, color: "#fff",
                border: "1.5px solid " + FT.ink, borderRadius: 8,

        </div>
        {/* kind filter chips */}

                    </div>
                  </div>
                  <span style={{ fontSize: 11, color: accent, fontWeight: 700, flexShrink: 0 }}>찾기</span>
                </button>

function UnifiedMapBanner({ stickers, onOpenVenue, onTapSticker }) {
  // 행사 슬라이드 후보 산출 (UpcomingPromoCard 와 동일 로직)
  const d = getNow();
  const todayDay = d.getMonth() === 5 && d.getDate() === 13 ? "day1"
    : d.getMonth() === 5 && d.getDate() === 14 ? "day2" : null;
  const today0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const day1Ts = new Date(2026, 5, 13).getTime();
  const day2Ts = new Date(2026, 5, 14).getTime();
  const preFestival = today0 < day1Ts;
  const postFestival = today0 > day2Ts;
  const nm = d.getHours() * 60 + d.getMinutes();
  let festivalSlides = [];
  let festivalMode = "preview";
  if (!postFestival) {
    if (preFestival) {
      const all = [
        ...(FESTIVAL_PROGRAM.day1?.items || []).filter((it) => it.time && /^(\d\d:\d\d)~(\d\d:\d\d)$/.test(it.time)).map((it) => ({ ...it, _day: "day1" })),
        ...(FESTIVAL_PROGRAM.day2?.items || []).filter((it) => it.time && /^(\d\d:\d\d)~(\d\d:\d\d)$/.test(it.time)).map((it) => ({ ...it, _day: "day2" })),
      ].sort((a, b) => {
        const dc = (a._day || "").localeCompare(b._day || "");
        if (dc !== 0) return dc;
        return (a.time || "").localeCompare(b.time || "");
      });
      const N = Math.min(5, all.length);
      if (all.length <= N) festivalSlides = all;
      else { const s = all.length / N; festivalSlides = Array.from({ length: N }, (_, i) => all[Math.floor(i * s)]); }
    } else if (todayDay) {
      const todayItems = (FESTIVAL_PROGRAM[todayDay]?.items || []).filter((it) => it.time && /^(\d\d:\d\d)~(\d\d:\d\d)$/.test(it.time)).map((it) => ({ ...it, _day: todayDay }));
      const upcoming = [], ongoing = [], past = [];
      todayItems.forEach((it) => {
        const [_, s, e] = it.time.match(/^(\d\d:\d\d)~(\d\d:\d\d)$/);
        const sMin = toMin(s), eMin = toMin(e);
        if (sMin > nm) upcoming.push(it);
        else if (eMin > nm) ongoing.push(it);
        else past.push(it);
      });
      const byStart = (a, b) => (a.time || "").localeCompare(b.time || "");
      upcoming.sort(byStart); ongoing.sort(byStart); past.sort(byStart);
      festivalSlides = [...upcoming, ...ongoing, ...past].slice(0, 5);
      festivalMode = upcoming.length > 0 ? "upcoming" : ongoing.length > 0 ? "ongoing" : "ended";
    }
  }

  // 스티커 후보 산출 (RecentStickersBanner 로직과 동일 — 1시간 이내)
  const STICKER_VIEW_WINDOW_MS = 60 * 60 * 1000;
  const stickerCutoff = Date.now() - STICKER_VIEW_WINDOW_MS;
  const STICKER_LABEL = { "👍": "좋아요", "📸": "포토스팟", "💤": "쉬는 곳", "🚻": "화장실", "🍱": "음식" };
  const stickerSlides = Object.entries(stickers || {})
    .map(([id, s]) => ({ id, ...(s || {}) }))
    .filter((s) => s && typeof s.lat === "number" && typeof s.lng === "number" && typeof s.ts === "number" && s.ts >= stickerCutoff)
    .sort((a, b) => {
      const aHas = a.label ? 1 : 0;
      const bHas = b.label ? 1 : 0;
      if (aHas !== bHas) return bHas - aHas;
      return b.ts - a.ts;
    })
    .slice(0, 6);

  // 통합 슬라이드 — 행사 먼저, 스티커 다음
  const slides = [
    ...festivalSlides.map((p) => ({ type: "festival", data: p, mode: festivalMode })),
    ...stickerSlides.map((p) => ({ type: "sticker", data: p })),
  ];
  if (slides.length === 0) return null;

  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);
  useEffect(() => {
    if (paused || slides.length <= 1) return;
    const id = setInterval(() => setIdx((i) => (i + 1) % slides.length), 5000);
    return () => clearInterval(id);
  }, [paused, slides.length]);
  const touchStartX = useRef(null);
  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; setPaused(true); };
  const onTouchEnd = (e) => {
    if (touchStartX.current == null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(dx) > 30) {
      if (dx < 0) setIdx((i) => (i + 1) % slides.length);
      else setIdx((i) => (i - 1 + slides.length) % slides.length);
    }
    touchStartX.current = null;
    setTimeout(() => setPaused(false), 4000);
  };
  const safeIdx = Math.min(idx, slides.length - 1);

  // 각 슬라이드 렌더 (festival vs sticker)
  const renderSlide = (slide, i) => {
    if (slide.type === "festival") {
      const pick = slide.data;
      const accent = pick.zone % 2 ? FT.orangeDark : FT.tealDark;
      const cSoft = pick.zone % 2 ? FT.orangeSoft : FT.tealSoft;
      const dayLabel = pick._day === "day2" ? "6.14 (일)" : pick._day === "day1" ? "6.13 (토)" : "";
      return (
        <button key={`f${i}`} onClick={() => onOpenVenue && onOpenVenue()}
          aria-roledescription="slide" aria-label={`${i + 1}/${slides.length} · 행사: ${pick.title}`}
          tabIndex={i === safeIdx ? 0 : -1}
          style={{ flex: `0 0 ${100 / slides.length}%`, display: "flex", flexDirection: "column", gap: 3,
            background: "rgba(255,255,255,0.95)", color: FT.ink,
            border: "1.5px solid " + FT.mute + "55", borderRadius: 10,
            borderLeft: `4px solid ${accent}`, padding: "6px 9px", boxShadow: "none",
            fontFamily: "'Jua', sans-serif", cursor: "pointer", textAlign: "left" }}>
          <div style={{ fontSize: 12, color: FT.ink, fontWeight: 700, lineHeight: 1.25,
            display: "-webkit-box", WebkitLineClamp: 1, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
            {pick.title}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 10, color: accent, fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700,
              display: "inline-flex", alignItems: "center", gap: 4 }}>
              {pick.time}
              {pick.zone != null && <span style={{ fontSize: 9, opacity: 0.8 }}>· {pick.zone}존</span>}
              {slide.mode === "preview" && dayLabel && <span style={{ fontSize: 9, opacity: 0.8 }}>· {dayLabel}</span>}
            </span>
            <span style={{ fontSize: 10, color: accent, fontWeight: 700 }}>자세히</span>
          </div>
        </button>
      );
    } else {
      const pick = slide.data;
      const accent = FT.tealDark;
      const ageMin = Math.max(0, Math.floor((Date.now() - pick.ts) / 60000));
      const kindName = STICKER_LABEL[pick.kind] || "";
      return (
        <button key={`s${i}-${pick.id}`} onClick={() => onTapSticker && onTapSticker(pick)}
          aria-roledescription="slide" aria-label={`${i + 1}/${slides.length} · 스티커: ${pick.label || kindName}`}
          tabIndex={i === safeIdx ? 0 : -1}
          style={{ flex: `0 0 ${100 / slides.length}%`, display: "flex", alignItems: "center", gap: 8,
            background: "rgba(255,255,255,0.95)", color: FT.ink,
            border: "1.5px solid " + FT.mute + "55", borderRadius: 10,
            borderLeft: `4px solid ${accent}`, padding: "6px 9px", boxShadow: "none",
            fontFamily: "'Jua', sans-serif", cursor: "pointer", textAlign: "left" }}>
          <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center",
            width: 26, height: 26, borderRadius: "50%", background: "#fff",
            border: "1.5px solid " + accent, fontSize: 16, flexShrink: 0 }}>{pick.kind || "📍"}</span>
          <div style={{ flex: 1, minWidth: 0, lineHeight: 1.25,
            display: "flex", flexDirection: "column", gap: 1 }}>
            <div style={{ fontSize: 12, color: FT.ink, fontWeight: 700,
              overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
              display: "-webkit-box", WebkitLineClamp: 1, WebkitBoxOrient: "vertical" }}>
              {pick.label || kindName || "스티커"}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 10, color: accent, fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700 }}>
                {ageMin <= 0 ? "방금" : `${ageMin}분 전`}
                {kindName && pick.label ? <span style={{ fontSize: 9, opacity: 0.8 }}> · {kindName}</span> : null}
              </span>
              <span style={{ fontSize: 10, color: accent, fontWeight: 700 }}>찾기</span>
            </div>
          </div>
        </button>
      );
    }
  };

  return (
    <div role="region" aria-roledescription="carousel" aria-label="지도 상단 정보 배너">
      <div style={{ position: "relative", overflow: "hidden", borderRadius: 10 }}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
        onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}>
        <div style={{ display: "flex", width: `${slides.length * 100}%`,
          transform: `translateX(-${safeIdx * (100 / slides.length)}%)`,
          transition: "transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1)" }}>
          {slides.map((s, i) => renderSlide(s, i))}
        </div>
      </div>
      {slides.length > 1 && (
        <div style={{ display: "flex", justifyContent: "center", gap: 4, marginTop: 4 }}>
          {slides.map((s, i) => (
            <button key={i} onClick={() => { setIdx(i); setPaused(true); setTimeout(() => setPaused(false), 4000); }}
              aria-label={`슬라이드 ${i + 1}`}
              title={s.type === "festival" ? "행사" : "스티커"}
              style={{ width: i === safeIdx ? 12 : 4, height: 4, borderRadius: 999,
                background: i === safeIdx
                  ? (s.type === "festival" ? (s.data.zone % 2 ? FT.orangeDark : FT.tealDark) : FT.tealDark)
                  : FT.mute + "88",
                border: "none", padding: 0, cursor: "pointer",
                transition: "width 0.2s, background 0.2s" }} />
          ))}
        </div>
      )}
    </div>
  );
}

function UpcomingPromoCard({ onOpen, compact = false }) {
  const d = getNow();
  const todayDay = d.getMonth() === 5 && d.getDate() === 13 ? "day1"
    : d.getMonth() === 5 && d.getDate() === 14 ? "day2" : null;
  const today0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const day1Ts = new Date(2026, 5, 13).getTime();
  const day2Ts = new Date(2026, 5, 14).getTime();
  const preFestival = today0 < day1Ts;
  const postFestival = today0 > day2Ts;
  if (postFestival) return null; // 행사 종료 후엔 숨김
  const nm = d.getHours() * 60 + d.getMinutes();

  let slides = [];
  let mode = "preview";
  if (preFestival) {
    // 행사 전: 양일 통합 시간순 정렬 후 균등 간격(stride) 으로 5개 추출
    const all = [
      ...(FESTIVAL_PROGRAM.day1?.items || []).filter((it) => it.time && /^(\d\d:\d\d)~(\d\d:\d\d)$/.test(it.time)).map((it) => ({ ...it, _day: "day1" })),
      ...(FESTIVAL_PROGRAM.day2?.items || []).filter((it) => it.time && /^(\d\d:\d\d)~(\d\d:\d\d)$/.test(it.time)).map((it) => ({ ...it, _day: "day2" })),
    ].sort((a, b) => {
      const dayCmp = (a._day || "").localeCompare(b._day || "");
      if (dayCmp !== 0) return dayCmp;
      return (a.time || "").localeCompare(b.time || "");
    });
    if (all.length === 0) return null;
    const SLIDE_N = Math.min(5, all.length);
    if (all.length <= SLIDE_N) slides = all;
    else {
      const stride = all.length / SLIDE_N;
      slides = Array.from({ length: SLIDE_N }, (_, i) => all[Math.floor(i * stride)]);
    }
    mode = "preview";
  } else if (todayDay) {
    // 행사 당일: 오늘 프로그램 시간 상태별 분류
    const todayItems = (FESTIVAL_PROGRAM[todayDay]?.items || []).filter((it) => {
      if (!it.time) return false;
      return /^(\d\d:\d\d)~(\d\d:\d\d)$/.test(it.time);
    }).map((it) => ({ ...it, _day: todayDay }));
    if (todayItems.length === 0) return null;
    const upcoming = [], ongoing = [], past = [];
    todayItems.forEach((it) => {
      const [_, s, e] = it.time.match(/^(\d\d:\d\d)~(\d\d:\d\d)$/);
      const sMin = toMin(s), eMin = toMin(e);
      if (sMin > nm) upcoming.push(it);
      else if (eMin > nm) ongoing.push(it);
      else past.push(it);
    });
    const byStart = (a, b) => (a.time || "").localeCompare(b.time || "");
    upcoming.sort(byStart); ongoing.sort(byStart); past.sort(byStart);
    slides = [...upcoming, ...ongoing, ...past].slice(0, 5);
    mode = upcoming.length > 0 ? "upcoming" : ongoing.length > 0 ? "ongoing" : "ended";
  } else {
    return null;
  }

  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);
  useEffect(() => {
    if (paused || slides.length <= 1) return;
    const id = setInterval(() => setIdx((i) => (i + 1) % slides.length), 5000);
    return () => clearInterval(id);
  }, [paused, slides.length]);
  // 터치 스와이프
  const touchStartX = useRef(null);
  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; setPaused(true); };
  const onTouchEnd = (e) => {
    if (touchStartX.current == null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(dx) > 30) {
      if (dx < 0) setIdx((i) => (i + 1) % slides.length);
      else setIdx((i) => (i - 1 + slides.length) % slides.length);
    }
    touchStartX.current = null;
    setTimeout(() => setPaused(false), 4000); // 잠시 정지 후 자동재개
  };

  const safeIdx = Math.min(idx, slides.length - 1);

  return (
    <div style={{ marginTop: compact ? 0 : 12 }}
      role="region" aria-roledescription="carousel" aria-label="다가올 프로그램 미리보기">
      {/* 헤더 라인 — compact 모드에선 숨김(공간 절약) */}
      {!compact && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
          <div style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
            <span style={{ display: "inline-block", width: 6, height: 6, borderRadius: "50%",
              background: slides[safeIdx].zone % 2 ? FT.orangeDark : FT.tealDark }}
              className="animate-pulse" />
            <span style={{ fontSize: 11, color: FT.ink, fontWeight: 700, fontFamily: "'Jua', sans-serif", letterSpacing: 0.5 }}>
              {mode === "upcoming" ? "곧 시작해요"
                : mode === "ongoing" ? "지금 진행 중"
                : mode === "ended" ? "오늘 진행 종료"
                : "행사 미리보기"}
            </span>
            <span style={{ fontSize: 10, color: FT.inkSoft, fontWeight: 400 }}>
              · {safeIdx + 1}/{slides.length}
            </span>
          </div>
        </div>
      )}
      {/* 슬라이드 컨테이너 — overflow hidden + inner row translateX */}
      <div style={{ position: "relative", overflow: "hidden", borderRadius: 10 }}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
        onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}>
        <div style={{ display: "flex", width: `${slides.length * 100}%`,
          transform: `translateX(-${safeIdx * (100 / slides.length)}%)`,
          transition: "transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1)" }}>
          {slides.map((pick, i) => {
            const cDark = pick.zone % 2 ? FT.orangeDark : FT.tealDark;
            const cSoft = pick.zone % 2 ? FT.orangeSoft : FT.tealSoft;
            const dayLabel = pick._day === "day2" ? "6.14 (일)" : pick._day === "day1" ? "6.13 (토)" : "";
            return (
              <button key={i} onClick={onOpen}
                aria-roledescription="slide" aria-label={`${i + 1}/${slides.length} · ${pick.title}`}
                tabIndex={i === safeIdx ? 0 : -1}
                style={{ flex: `0 0 ${100 / slides.length}%`, display: "flex", flexDirection: "column", gap: compact ? 3 : 5,
                  background: compact ? "rgba(255,255,255,0.95)" : FT.paper, color: FT.ink,
                  border: "1.5px solid " + FT.mute + "55", borderRadius: 10,
                  padding: compact ? "6px 9px" : "8px 10px", boxShadow: "none",
                  borderLeft: `4px solid ${cDark}`,
                  fontFamily: "'Jua', sans-serif", cursor: "pointer", textAlign: "left" }}>
                {!compact && (
                  <div style={{ display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
                    {pick.cat && (
                      <span style={{ padding: "1px 7px", borderRadius: 999, background: cSoft, color: cDark,
                        fontSize: 10, fontWeight: 700, maxWidth: "70%",
                        overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {pick.cat}
                      </span>
                    )}
                    {pick.zone != null && (
                      <span style={{ padding: "1px 7px", borderRadius: 999, background: "transparent", color: cDark,
                        border: "1px solid " + cDark + "66", fontSize: 10, fontWeight: 700 }}>
                        {pick.zone}존
                      </span>
                    )}
                    {mode === "preview" && dayLabel && (
                      <span style={{ padding: "1px 7px", borderRadius: 999, background: "#fff", color: FT.inkSoft,
                        border: "1px solid " + FT.mute + "55", fontSize: 10, fontWeight: 700 }}>
                        {dayLabel}
                      </span>
                    )}
                  </div>
                )}
                <div style={{ fontSize: compact ? 12 : 13, color: FT.ink, fontWeight: 700, lineHeight: 1.25,
                  ...(compact ? { display: "-webkit-box", WebkitLineClamp: 1, WebkitBoxOrient: "vertical", overflow: "hidden" } : {}) }}>
                  {pick.title}
                </div>
                {!compact && pick.desc && (
                  <div style={{ fontSize: 11, color: FT.inkSoft, lineHeight: 1.5,
                    display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical",
                    overflow: "hidden", fontWeight: 400 }}>
                    {pick.desc}
                  </div>
                )}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 2 }}>
                  <span style={{ fontSize: compact ? 10 : 11, color: cDark, fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700,
                    display: "inline-flex", alignItems: "center", gap: 4 }}>
                    {pick.time}
                    {compact && pick.zone != null && (
                      <span style={{ fontSize: 9, color: cDark, opacity: 0.8 }}>· {pick.zone}존</span>
                    )}
                  </span>
                  <span style={{ fontSize: compact ? 10 : 11, color: cDark, fontWeight: 700 }}>
                    자세히
                  </span>
                </div>
              </button>
            );
          })}
        </div>
      </div>
      {/* dots 인디케이터 — compact 모드에선 더 작게 */}
      {slides.length > 1 && (
        <div style={{ display: "flex", justifyContent: "center", gap: compact ? 4 : 6, marginTop: compact ? 4 : 7 }}>
          {slides.map((_, i) => (
            <button key={i} onClick={() => { setIdx(i); setPaused(true); setTimeout(() => setPaused(false), 4000); }}
              aria-label={`슬라이드 ${i + 1}`}
              style={{ width: i === safeIdx ? (compact ? 12 : 16) : (compact ? 4 : 6),
                height: compact ? 4 : 6, borderRadius: 999,
                background: i === safeIdx ? FT.ink : FT.mute + "88",
                border: "none", padding: 0, cursor: "pointer",
                transition: "width 0.2s, background 0.2s" }} />
          ))}
        </div>
      )}
    </div>
  );
}

/* 승객 기본 화면 — 실시간 버스 목록(버스안내판 스타일) + 지도 탭. 제목 7번 탭하면 운영자(히든) 진입 */
function PassengerView({ dbUrl, onAdmin, initialTab = "list" }) {
  const [buses, setBuses] = useState({});
  const [tab, setTab] = useState(initialTab);
  // 탭 변경 시 통계 — view.{tab} + 펀넬용 transition.{from}_to_{to}
  const prevTabRef = useRef(null);
  useEffect(() => {
    try {
      if (prevTabRef.current && prevTabRef.current !== tab) {
        statsRef.current && statsRef.current.track(`transition_${prevTabRef.current}_to_${tab}`);
      }
      statsRef.current && statsRef.current.track(`view_${tab}`);
    } catch (_) {}
    prevTabRef.current = tab;
  }, [tab]);
  const [conn, setConn] = useState("loading"); // loading | ok | error
  const [showTimetable, setShowTimetable] = useState(false);
  const [tableFocus, setTableFocus] = useState(null); // { dir, ti } — 다음 출발 카드 탭 시 해당 회차 강조
  const openTableAt = (dir, ti) => {
    try {
      if (statsRef.current) {
        statsRef.current.track("open_timetable");
        // 어느 회차·방향을 확인하려고 진입했는지 — 운영자 분석용
        if (typeof ti === "number" && dir) {
          statsRef.current.track(`open_timetable_${dir}_trip_${ti + 1}`);
        }
      }
    } catch (_) {}
    setTableFocus({ dir, ti }); setShowTimetable(true);
  };
  const closeTable = () => { setShowTimetable(false); setTableFocus(null); };
  const [venueZone, setVenueZone] = useState(0);
  // 익명 사용 통계 — 행사 후 운영자가 분석. 개인정보 비수집, 카운트만.
  const statsRef = useRef(null);
  const tabRef = useRef(initialTab);
  useEffect(() => { tabRef.current = tab; }, [tab]);
  useEffect(() => {
    statsRef.current = createStatsTracker(dbUrl);
    // 전역 노출 — LiveMapView 등 자식 컴포넌트에서 직접 호출
    try { window.__mdsStats = { track: (k, n) => { try { statsRef.current && statsRef.current.track(k, n); } catch (_) {} } }; } catch (_) {}
    // session_start 는 별도 트래킹 안 함 — 세션 record 존재 자체가 세션 1건이며,
    // view_{initialTab} 가 곧 진입 신호이므로 중복(2건 등록되는 인상) 제거.
    // 종료 시점만 session_endView_{lastTab} 기록 (드롭오프 분석).
    return () => {
      try { statsRef.current && statsRef.current.track(`session_endView_${tabRef.current}`); } catch (_) {}
      try { statsRef.current && statsRef.current.destroy(); } catch (_) {}
      try { delete window.__mdsStats; } catch (_) {}
    };
  }, [dbUrl]);
  const trackStat = (key, n) => { try { statsRef.current && statsRef.current.track(key, n); } catch (_) {} };
  const [notice, setNotice] = useState(null); // P1-2: 운영자 공지/재난 안내
  const [noticeDismissedAt, setNoticeDismissedAt] = useState(() => parseInt(LS.get("noticeDismissedAt", "0"), 10) || 0);
  const tapRef = useRef(0), tapTimeRef = useRef(0);

  useEffect(() => {
    if (!dbUrl) { setConn("error"); return; }
    const base = dbUrl.replace(/\/+$/, "");
    let stopped = false;
    const poll = async () => {
      try {
        const r = await fetch(`${base}/buses.json`, { cache: "no-store" });
        const d = await r.json();
        setBuses(d || {});
        setConn("ok");
      } catch (_) { setConn("error"); try { statsRef.current && statsRef.current.track("error_conn_buses"); } catch (__) {} }
    };
    poll();
    const id = setInterval(() => { if (!stopped && !document.hidden) poll(); }, 3000);
    const onVis = () => { if (!stopped && !document.hidden) poll(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { stopped = true; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [dbUrl]);

  // P1-2: 공지(notice) 폴링 — 30초 간격
  useEffect(() => {
    if (!dbUrl) return;
    const base = dbUrl.replace(/\/+$/, "");
    let stopped = false;
    const fetchNotice = async () => {
      try {
        const r = await fetch(`${base}/notice.json`, { cache: "no-store" });
        const d = await r.json();
        if (d && d.active && d.message) setNotice(d); else setNotice(null);
      } catch (_) {}
    };
    fetchNotice();
    const id = setInterval(() => { if (!stopped && !document.hidden) fetchNotice(); }, 30000);
    const onVis = () => { if (!stopped && !document.hidden) fetchNotice(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { stopped = true; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [dbUrl]);

  const dismissNotice = () => {
    if (!notice) return;
    LS.set("noticeDismissedAt", String(notice.ts || Date.now()));
    setNoticeDismissedAt(notice.ts || Date.now());
    trackStat(`notice_dismiss_${notice.level || "info"}`);
  };
  /* 공지 표시 정책:
     - 신규 ts (운영자가 새 공지 발송) > 사용자가 마지막 dismiss 한 ts → 다시 노출 (= 새 공지)
     - 위험(danger) 레벨은 dismiss 후 30분 경과 시 자동 재노출 (안전 우선)
     - info/warn 은 같은 ts 면 dismiss 영구 유지 */
  const NOTICE_DANGER_REDISPLAY_MS = 30 * 60 * 1000;
  const showNotice = !!notice && (
    (notice.ts || 0) > noticeDismissedAt
    || (notice.level === "danger" && noticeDismissedAt > 0 && (Date.now() - noticeDismissedAt) > NOTICE_DANGER_REDISPLAY_MS)
  );
  // 공지 노출 시 통계 카운트 (level 별)
  useEffect(() => { if (showNotice && notice) trackStat(`notice_show_${notice.level || "info"}`); }, [showNotice]);

  const onTitleTap = () => {
    const t = Date.now();
    if (t - tapTimeRef.current > 1500) tapRef.current = 0;
    tapTimeRef.current = t;
    if (++tapRef.current >= 7) { tapRef.current = 0; onAdmin(); }
  };

  const now = Date.now();
  const agoText = (ts) => { if (!ts) return ""; const s = Math.round((now - ts) / 1000); return s < 5 ? "방금" : s < 60 ? `${s}초 전` : `${Math.floor(s / 60)}분 전`; };
  const live = Object.entries(buses)
    .filter(([, b]) => b && (b.lat != null || b.stop) && (!b.ts || now - b.ts < 60000))
    .sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));

  // 이탈 정보 — 운영자가 departedFrom/departedAt을 직접 송신하면 우선 사용, 없으면 폴백 추적
  const prevArrivedRef = useRef({});
  const departedFallbackRef = useRef({});
  useEffect(() => {
    Object.entries(buses).forEach(([id, b]) => {
      if (!b) return;
      const prev = prevArrivedRef.current[id];
      if (prev && prev.arrived && !b.arrived) {
        departedFallbackRef.current[id] = { stopName: prev.stop || b.stop, at: Date.now() };
      }
      if (prev && prev.stop && b.stop && prev.stop !== b.stop) {
        delete departedFallbackRef.current[id];
      }
      prevArrivedRef.current[id] = { arrived: !!b.arrived, stop: b.stop };
    });
  }, [buses]);
  const getDepartedInfo = (id, b) => {
    if (b && b.departedFrom && b.departedAt && Date.now() - b.departedAt < 90000) {
      return { stopName: b.departedFrom, at: b.departedAt };
    }
    return departedFallbackRef.current[id] || null;
  };

  // 시간표(승객용) — 일요일(6.14)은 5회차, 그 외 6회차
  const d = getNow();
  const tripsToday = d.getMonth() === 5 && d.getDate() === 14 ? 5 : ROUTES.outbound.trips.length;
  const nowMin = d.getHours() * 60 + d.getMinutes();
  // 행사일 판정 — 6.13(토)/6.14(일) 만 실제 운행. 그 외 날짜는 시간표 미리보기/안내만 노출
  const fDay = d.getMonth() === 5 ? d.getDate() : -1;
  const isFestivalDay = fDay === 13 || fDay === 14;
  const today0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const day1Ts = new Date(2026, 5, 13).getTime();
  const day2Ts = new Date(2026, 5, 14).getTime();
  const preFestival = today0 < day1Ts;
  const postFestival = today0 > day2Ts;

  /* 정류장 기준 도착 안내 — 버스별 카드만 사용하므로 미사용
  const _stopArrivals = (() => {
    const items = [];
    const liveTripSet = new Set(); // dir|trip — 라이브로 커버되는 회차는 시간표 항목 제외
    for (const [busId, b] of live) {
      const dir = b.dir === "inbound" ? "inbound" : "outbound";
      const route = ROUTES[dir];
      const stops = route.stops;
      let ci = stops.findIndex((s) => s.name === b.stop);
      if (ci < 0) continue;
      // GPS 좌표 기반으로 실제 진행 위치 보정: 버스가 b.stop을 이미 지나갔다면 가장 가까운 노선 정류장으로 ci 전진
      if (b.lat != null && b.lng != null) {
        let bestI = -1, bestD = Infinity;
        for (let i = 0; i < stops.length; i++) {
          const s = stops[i]; if (s.lat == null) continue;
          const d = distanceMeters({ lat: b.lat, lng: b.lng }, s);
          if (d < bestD) { bestD = d; bestI = i; }
        }
        if (bestI > ci) ci = bestI; // 뒤로는 가지 않음(차량이 막 지난 정류장 잠깐 표시 유지)
      }
      if (b.trip) liveTripSet.add(`${dir}|${b.trip}`);
      const sched = route.trips[(b.trip || 1) - 1];
      if (!sched || !sched[ci]) continue;
      const ciSchedMin = toMin(sched[ci]);
      // 곧 도착 정류장의 지연(분). 시간표보다 늦으면 양수, 빠르면 0.
      const delay = Math.max(0, nowMin - ciSchedMin);
      // 보정된 도착 판정(30m 이내)
      const ciStop = stops[ci];
      const distToCi = ciStop.lat != null ? distanceMeters({ lat: b.lat, lng: b.lng }, ciStop) : null;
      const arrivedAtCi = distToCi != null && distToCi < 30;
      const start = arrivedAtCi ? ci + 1 : ci;
      for (let i = start; i < stops.length; i++) {
        const t = sched[i]; if (!t) continue;
