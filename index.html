/* Geo helper */
function distanceMeters(a, b) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const lat1 = toRad(a.lat); const lat2 = toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* 지정한 멘트 설정(m)의 schedule에서, 축제장 도착(예정) 시각 이후 시작분만 골라 안내 문구 생성.
   refMin: 기준 시각(분). 없으면 현재 시각 사용 */
const buildProgramText = (m, dayKey, refMin) => {
  const list = dayKey === "day1" ? m.schedule.day1
    : dayKey === "day2" ? m.schedule.day2 : null;
  if (!list) return m.defaultProgram;
  const d = new Date();
  const nowMin = typeof refMin === "number" ? refMin : d.getHours() * 60 + d.getMinutes();
  const intro = "잠시 후, 무등생각 축제장에 도착합니다. ";
  const upcoming = list.filter(p => toMin(p.t) >= nowMin);
  if (upcoming.length === 0) {
    return intro + "오늘 준비된 주요 프로그램은 대부분 마무리되었어요. 그래도 " + m.allday + " 무등산에서 천천히, 편안한 시간 보내세요.";
  }
  const shown = upcoming.slice(0, 6); // 안내가 길어지지 않도록 다가오는 6개까지만
  const items = shown.map(p => `${spokenClock(p.t)}에는 ${p.d}`).join(", ");
  const more = upcoming.length > shown.length ? " 이 외에도 더 많은 프로그램이 여러분을 기다리고 있어요." : "";
  return intro + "도착하시면, " + items + " 등 다양한 프로그램을 만나보실 수 있습니다." + more + " 그리고 " + m.allday + " 오늘 무등생각과 함께, 마음을 쉬어가는 하루 보내세요.";
};

/* localStorage helpers — survive across reloads */
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem("shuttle:" + k); return v == null ? d : v; } catch (_) { return d; } },
  getJSON: (k, d) => { try { const v = localStorage.getItem("shuttle:" + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set: (k, v) => { try { localStorage.setItem("shuttle:" + k, v); } catch (_) {} },
  setJSON: (k, v) => { try { localStorage.setItem("shuttle:" + k, JSON.stringify(v)); } catch (_) {} },
};

/* Leaflet map picker — click or drag pin to choose a coordinate.
   radius(m): 자동 안내 시작 반경을 원으로 표시 */
function MapPicker({ lat, lng, radius, onPick }) {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);
  const circleRef = useRef(null);

  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const map = window.L.map(elRef.current).setView([lat, lng], 16);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap",
    }).addTo(map);
    const icon = window.L.icon({
      iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
      iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
      shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
      iconSize: [25, 41], iconAnchor: [12, 41],
    });
    const circle = window.L.circle([lat, lng], {
      radius: radius || 150, color: "#22d65f", weight: 1.5,
      fillColor: "#22d65f", fillOpacity: 0.12,
    }).addTo(map);
    const marker = window.L.marker([lat, lng], { draggable: true, icon }).addTo(map);
    const move = (la, ln) => { circle.setLatLng([la, ln]); onPick(la, ln); };
    marker.on("dragend", () => { const p = marker.getLatLng(); move(p.lat, p.lng); });
    map.on("click", (e) => { marker.setLatLng(e.latlng); move(e.latlng.lat, e.latlng.lng); });
    mapRef.current = map; markerRef.current = marker; circleRef.current = circle;
    setTimeout(() => map.invalidateSize(), 80);
    return () => { map.remove(); mapRef.current = null; markerRef.current = null; circleRef.current = null; };
  }, []);

  // Sync external (manual-input) coordinate changes onto the map
  useEffect(() => {
    if (!markerRef.current || !mapRef.current) return;
    const c = markerRef.current.getLatLng();
    if (Math.abs(c.lat - lat) > 1e-7 || Math.abs(c.lng - lng) > 1e-7) {
      markerRef.current.setLatLng([lat, lng]);
      circleRef.current?.setLatLng([lat, lng]);
      mapRef.current.panTo([lat, lng]);
    }
  }, [lat, lng]);

  // 반경 변경 시 원 갱신
  useEffect(() => {
    if (circleRef.current && radius) circleRef.current.setRadius(radius);
  }, [radius]);

  if (!window.L) {
    return (
      <div className="text-xs text-center py-6 rounded-lg"
        style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#fca5a5" }}>
        지도를 불러올 수 없습니다 (네트워크 확인). 아래 좌표 입력은 사용할 수 있어요.
      </div>
    );
  }
  return <div ref={elRef} style={{ width: "100%", height: "260px", borderRadius: "12px", overflow: "hidden" }} />;
}

/* 전체 수정사항 백업·복원 모달 — localStorage(shuttle:*) 키를 JSON으로 내보내고 다시 적용 */
function BackupModal({ onClose }) {
  const SENSITIVE = new Set(["driveremail", "driverpass", "apikey"]);
  const [includeSensitive, setIncludeSensitive] = useState(false);
  const [text, setText] = useState("");
  const [msg, setMsg] = useState("");
  const snapshot = (incl) => {
    const out = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith("shuttle:")) continue;
        const short = k.slice(8);
        if (!incl && SENSITIVE.has(short)) continue;
        out[short] = localStorage.getItem(k);
      }
    } catch (_) {}
    return { version: 1, savedAt: new Date().toISOString(), data: out };
  };
  useEffect(() => { setText(JSON.stringify(snapshot(includeSensitive), null, 2)); }, [includeSensitive]);
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); setMsg("✅ 클립보드에 복사했어요"); }
    catch (_) { setMsg("복사 실패 — 직접 선택해 복사하세요"); }
  };
  const saveFile = () => {
    try {
      const blob = new Blob([text], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `inmun-bus-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      setMsg("✅ 파일로 저장했어요");
    } catch (_) { setMsg("파일 저장 실패"); }
  };
  const loadFile = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { setText(String(reader.result)); setMsg("파일을 불러왔어요. '복원' 버튼을 누르면 적용됩니다."); };
    reader.readAsText(f);
    e.target.value = "";
  };
  const restore = () => {
    let parsed;
    try { parsed = JSON.parse(text); } catch (_) { setMsg("❌ JSON 형식이 올바르지 않습니다"); return; }
    const obj = parsed && typeof parsed === "object" && parsed.data ? parsed.data : parsed;
    if (!obj || typeof obj !== "object") { setMsg("❌ 데이터가 없습니다"); return; }
    if (!window.confirm("현재 수정사항을 이 백업으로 덮어씁니다. 계속할까요?")) return;
    try {
      Object.entries(obj).forEach(([k, v]) => {
        if (typeof v !== "string") return;
        try { localStorage.setItem("shuttle:" + k, v); } catch (_) {}
      });
      setMsg("✅ 복원했어요. 잠시 후 새로고침됩니다…");
      setTimeout(() => window.location.reload(), 800);
    } catch (_) { setMsg("❌ 복원 실패"); }
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(15,15,18,0.72)" }} onClick={onClose}>
      <div className="w-full max-w-md p-4 space-y-3 max-h-[88vh] overflow-y-auto"
        style={{ background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 16, boxShadow: "4px 4px 0 " + FT.ink }}
        onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div style={{ color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 15 }}>
            수정사항 백업·복원
          </div>
          <button onClick={onClose} aria-label="닫기"
            style={{ width: 28, height: 28, lineHeight: 1, borderRadius: 8, border: "2px solid " + FT.ink,
              background: "#fff", color: FT.ink, fontWeight: 700, fontFamily: "'Jua', sans-serif" }}>×</button>
        </div>
        <div style={{ fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif", lineHeight: 1.6 }}>
          정류장 좌표·안내 멘트·경유점·설정값을 한 번에 저장/복원합니다. 앱 업데이트, 새 기기 이전, 사고 대비용으로 쓰세요.
        </div>
        <label className="flex items-center gap-2" style={{ fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>
          <input type="checkbox" checked={includeSensitive} onChange={(e) => setIncludeSensitive(e.target.checked)} />
          기사 로그인(이메일·비밀번호·API 키)도 포함 <span style={{ color: FT.orange }}>⚠️ 공유 주의</span>
        </label>
        <textarea value={text} onChange={(e) => setText(e.target.value)}
          className="w-full p-2"
          style={{ background: FT.paper, border: "2px solid " + FT.ink, borderRadius: 8, color: FT.ink,
            fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, minHeight: 180, resize: "vertical" }} />
        <div className="grid grid-cols-2 gap-2">
          <button onClick={copy}
            style={{ background: "#fff", color: FT.ink, padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12 }}>📋 복사</button>
          <button onClick={saveFile}
            style={{ background: "#fff", color: FT.ink, padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12 }}>💾 파일로 저장</button>
          <label style={{ background: "#fff", color: FT.ink, padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12, textAlign: "center", cursor: "pointer" }}>
            📂 파일 불러오기
            <input type="file" accept="application/json,.json" onChange={loadFile} style={{ display: "none" }} />
          </label>
          <button onClick={restore}
            style={{ background: FT.orange, color: "#fff", padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12 }}>🔄 복원하기</button>
        </div>
        {msg && <div style={{ fontSize: 11, fontFamily: "'Jua', sans-serif",
          color: msg.startsWith("✅") ? FT.tealDark : msg.startsWith("❌") ? "#dc2626" : FT.inkSoft }}>{msg}</div>}
      </div>
    </div>
  );
}

/* 운행 정보(dir/trip/현재 정류장) + 현재 시간 → 직전 정류장과 현재 정류장 사이를 시간 비율로 보간한 위치 */
function operationBasedPos(dir, tripIdx, curStopName, nowMin) {
  const route = ROUTES[dir];
  const sched = route.trips[tripIdx];
  if (!sched) return null;
  const stops = route.stops;
  const i = stops.findIndex((s) => s.name === curStopName);
  if (i < 0) return null;
  if (i === 0) {
    return stops[0].lat != null ? { lat: stops[0].lat, lng: stops[0].lng, fromName: stops[0].name, toName: stops[0].name } : null;
  }
  const prev = stops[i - 1], cur = stops[i];
  if (prev.lat == null || cur.lat == null || !sched[i - 1] || !sched[i]) return null;
  const tPrev = toMin(sched[i - 1]), tCur = toMin(sched[i]);
  let t = (nowMin - tPrev) / Math.max(1, tCur - tPrev);
  t = Math.max(0, Math.min(1, t));
  return {
    lat: prev.lat + (cur.lat - prev.lat) * t,
    lng: prev.lng + (cur.lng - prev.lng) * t,
    fromName: prev.name, toName: cur.name,
  };
}

/* 시간표 기반 버스 추정 위치 — 운행 중 회차의 두 정류장 사이를 시간 비율로 보간 */
function scheduledBusPos(dir, tripIdx, nowMin) {
  const route = ROUTES[dir];
  const sched = route.trips[tripIdx];
  if (!sched) return null;
  const startMin = toMin(sched[0]);
  const endMin = toMin(sched[sched.length - 1]);
  if (nowMin < startMin || nowMin > endMin) return null;
  for (let i = 0; i < sched.length - 1; i++) {
    const a = toMin(sched[i]), b = toMin(sched[i + 1]);
    if (nowMin >= a && nowMin <= b) {
      const sa = route.stops[i], sb = route.stops[i + 1];
      if (sa.lat == null || sb.lat == null) return null;
      const t = b > a ? (nowMin - a) / (b - a) : 0;
      return {
        lat: sa.lat + (sb.lat - sa.lat) * t,
        lng: sa.lng + (sb.lng - sa.lng) * t,
        fromName: sa.name, toName: sb.name,
        nearIdx: t < 0.5 ? i : i + 1,
      };
    }
  }
  return null;
}

/* 두 점 사이의 거리(평면 근사). 짧은 거리에선 충분 */
const distLL = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
/* 점 P가 선분 AB에 떨어진 거리 — 가장 가까운 구간 찾기 */
const pointSegDist = (p, a, b) => {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  if (dx === 0 && dy === 0) return distLL(p, a);
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy)));
  return distLL(p, [a[0] + t * dx, a[1] + t * dy]);
};
/* 정류장의 approachVia 효과값 — localStorage 오버라이드 우선, 없으면 코드 기본값 */
const effectiveVia = (dir, stopName) => {
  const userVia = LS.getJSON("viapoints", {});
  const key = `${dir}|${stopName}`;
  if (key in userVia) return userVia[key];
  const s = ROUTES[dir].stops.find((x) => x.name === stopName);
  return s && Array.isArray(s.approachVia) ? s.approachVia : [];
};

/* 경유점 편집기 — 운영자 전용. 클릭하면 가장 가까운 구간의 도착 정류장 approachVia 끝에 추가. via 마커 탭하여 제거. */
function ViaEditor({ onClose, dbUrl, getAuth }) {
  const elRef = useRef(null), mapRef = useRef(null);
  const [viaMap, setViaMap] = useState(() => LS.getJSON("viapoints", {}));
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | local | syncing | synced | error
  const layersRef = useRef({ lines: [], stops: [], vias: [] });
  const isFirstRef = useRef(true);

  // 열릴 때 Firebase 최신값 가져와서 화면에 반영 (운영자 동기화)
  useEffect(() => {
    if (!dbUrl) return;
    fetch(`${dbUrl.replace(/\/+$/, "")}/viapoints.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => { if (d && typeof d === "object" && !Array.isArray(d)) { isFirstRef.current = true; setViaMap(d); LS.setJSON("viapoints", d); } })
      .catch(() => {});
  }, [dbUrl]);

  /* 방향별 시퀀스: [{kind:'stop'|'via', dir, stopName?, stopKey?, coord}] */
  const buildSeq = (dir) => {
    const stops = ROUTES[dir].stops.filter((s) => s.lat != null);
    const seq = [];
    stops.forEach((s, i) => {
      if (i > 0) {
        const key = `${dir}|${s.name}`;
        const via = key in viaMap ? viaMap[key] : (Array.isArray(s.approachVia) ? s.approachVia : []);
        via.forEach((v) => seq.push({ kind: "via", dir, stopKey: key, coord: v }));
      }
      seq.push({ kind: "stop", dir, stopName: s.name, coord: [s.lat, s.lng] });
    });
    return seq;
  };

  // 최초 맵 초기화 (의존성 없음 — 한 번만)
  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const L = window.L;
    const map = L.map(elRef.current, { zoomControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    const allCoords = [];
    ["outbound", "inbound"].forEach((dir) => ROUTES[dir].stops.forEach((s) => { if (s.lat != null) allCoords.push([s.lat, s.lng]); }));
    if (allCoords.length) map.fitBounds(allCoords, { padding: [80, 30] });
    else map.setView([35.135, 126.94], 14);

    // 클릭으로 경유점 추가 — 가장 가까운 구간의 도착 정류장에 append
    map.on("click", (e) => {
      const click = [e.latlng.lat, e.latlng.lng];
      let best = null;
      ["outbound", "inbound"].forEach((dir) => {
        const stops = ROUTES[dir].stops.filter((s) => s.lat != null);
        for (let i = 0; i < stops.length - 1; i++) {
          const a = [stops[i].lat, stops[i].lng];
          const b = [stops[i + 1].lat, stops[i + 1].lng];
          const d = pointSegDist(click, a, b);
          if (!best || d < best.d) best = { d, dir, toName: stops[i + 1].name };
        }
      });
      if (!best) return;
      const key = `${best.dir}|${best.toName}`;
      setViaMap((prev) => {
        const cur = key in prev ? prev[key] : (ROUTES[best.dir].stops.find((s) => s.name === best.toName)?.approachVia || []);
        return { ...prev, [key]: [...cur, click] };
      });
    });

    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // viaMap 변경 시 마커/선 재그리기 (직선 폴리라인 + 정류장/경유점 마커)
  useEffect(() => {
    const map = mapRef.current; if (!map) return;
    const L = window.L;
    layersRef.current.lines.forEach((l) => map.removeLayer(l)); layersRef.current.lines = [];
    if (layersRef.current.roads) Object.values(layersRef.current.roads).forEach((l) => l && map.removeLayer(l));
    layersRef.current.roads = {};
    layersRef.current.stops.forEach((l) => map.removeLayer(l)); layersRef.current.stops = [];
    layersRef.current.vias.forEach((l) => map.removeLayer(l)); layersRef.current.vias = [];

    ["outbound", "inbound"].forEach((dir) => {
      const color = dir === "outbound" ? FT.orange : FT.teal;
      const seq = buildSeq(dir);
      const lineCoords = seq.map((p) => p.coord);
      if (lineCoords.length >= 2) {
        // 직선 가이드(연하게) — OSRM 도착 전에도 시퀀스를 확인할 수 있게
        const line = L.polyline(lineCoords, { color, weight: 3, opacity: 0.35, dashArray: "4,6", lineCap: "round" }).addTo(map);
        layersRef.current.lines.push(line);
        // OSRM 도로 미리보기 — 승객 지도에 보일 실제 경로
        const path = lineCoords.map(([la, ln]) => `${ln},${la}`).join(";");
        fetch(`https://router.project-osrm.org/route/v1/driving/${path}?overview=full&geometries=geojson&continue_straight=false`)
          .then((r) => r.ok ? r.json() : null)
          .then((d) => {
            if (!d || d.code !== "Ok" || !d.routes || !d.routes[0]) return;
            const road = d.routes[0].geometry.coordinates.map(([ln, la]) => [la, ln]);
            if (layersRef.current.roads[dir]) map.removeLayer(layersRef.current.roads[dir]);
            layersRef.current.roads[dir] = L.polyline(road, { color, weight: 5, opacity: 0.9, dashArray: dir === "inbound" ? "10,8" : null, lineCap: "round", lineJoin: "round" }).addTo(map);
          })
          .catch(() => {});
      }
      seq.forEach((p) => {
        if (p.kind === "stop") {
          const shared = SHARED_STOPS.has(p.stopName);
          const m = L.circleMarker(p.coord, {
              radius: 6,
              color: shared ? FT.ink : color,
              fillColor: "#fff", fillOpacity: 1,
              weight: shared ? 2 : 2.5,
            })
            .addTo(map).bindTooltip(shared ? p.stopName : `${p.stopName} (${dir === "outbound" ? "축제장행" : "민주광장행"})`, { direction: "top" });
          layersRef.current.stops.push(m);
        } else {
          const icon = L.divIcon({
            className: "",
            html: `<div style="background:${color};color:#fff;border:2px solid ${FT.ink};border-radius:6px;padding:1px 7px;font-family:'Jua',sans-serif;font-size:11px;font-weight:700;cursor:move;box-shadow:1.5px 1.5px 0 ${FT.ink};white-space:nowrap;">⠿ via ×</div>`,
            iconSize: [56, 22], iconAnchor: [28, 11],
          });
          const m = L.marker(p.coord, { icon, draggable: true, autoPan: true }).addTo(map);
          // 드래그 종료 시 해당 경유점 좌표 갱신
          m.on("dragend", (e) => {
            const ll = e.target.getLatLng();
            const newCoord = [ll.lat, ll.lng];
            setViaMap((prev) => {
              const cur = p.stopKey in prev ? prev[p.stopKey] : (ROUTES[p.dir].stops.find((s) => `${p.dir}|${s.name}` === p.stopKey)?.approachVia || []);
              const idx = cur.findIndex((c) => c[0] === p.coord[0] && c[1] === p.coord[1]);
              if (idx < 0) return prev;
              const list = cur.slice();
              list[idx] = newCoord;
              return { ...prev, [p.stopKey]: list };
            });
          });
          // 단순 탭(드래그 없는 클릭)은 제거
          m.on("click", (e) => {
            if (e.originalEvent) { e.originalEvent.stopPropagation(); }
            setViaMap((prev) => {
              const cur = p.stopKey in prev ? prev[p.stopKey] : (ROUTES[p.dir].stops.find((s) => `${p.dir}|${s.name}` === p.stopKey)?.approachVia || []);
              const list = cur.filter((c) => !(c[0] === p.coord[0] && c[1] === p.coord[1]));
              return { ...prev, [p.stopKey]: list };
            });
          });
          layersRef.current.vias.push(m);
        }
      });
    });
  }, [viaMap]);

  // 자체 로그인(앱 토큰 없을 때 저장된 자격증명으로 시도)
  const editorTokenRef = useRef("");
  const ensureToken = async () => {
    const ext = getAuth ? getAuth() : "";
    if (ext) return ext;
    if (editorTokenRef.current) return editorTokenRef.current;
    const key = LS.get("apikey", SHARE_API_KEY);
    const email = LS.get("driveremail", "");
    const pass = LS.get("driverpass", "");
    if (!key || !email || !pass) return "";
    try {
      const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${key}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: pass, returnSecureToken: true }),
      });
      const d = await r.json();
      if (d.idToken) { editorTokenRef.current = d.idToken; return d.idToken; }
    } catch (_) {}
    return "";
  };

  const [syncDetail, setSyncDetail] = useState("");
  const pushNow = async () => {
    if (!dbUrl) { setSyncStatus("local"); setSyncDetail("DB 주소가 없음"); return; }
    setSyncStatus("syncing"); setSyncDetail("");
    const auth = await ensureToken();
    if (!auth) { setSyncStatus("local"); setSyncDetail("로그인 정보(이메일/비밀번호/API 키)가 없거나 로그인 실패"); return; }
    try {
      const r = await fetch(`${dbUrl.replace(/\/+$/, "")}/viapoints.json?auth=${encodeURIComponent(auth)}`, {
        method: "PUT", body: JSON.stringify(viaMap),
      });
      if (r.ok) { setSyncStatus("synced"); setSyncDetail(""); }
      else {
        const t = await r.text().catch(() => "");
        setSyncStatus("error");
        setSyncDetail(t && t.length < 200 ? t : `HTTP ${r.status} — Firebase 규칙에서 viapoints 쓰기 권한을 확인하세요`);
      }
    } catch (e) { setSyncStatus("error"); setSyncDetail("네트워크 오류"); }
  };

  // 변경 시 로컬 저장 + 자동 업로드
  useEffect(() => {
    LS.setJSON("viapoints", viaMap);
    if (isFirstRef.current) { isFirstRef.current = false; return; }
    pushNow();
  }, [viaMap]);

  const totalVia = Object.values(viaMap).reduce((n, v) => n + (Array.isArray(v) ? v.length : 0), 0);
  const syncLabel = { idle: "", local: "로컬만 저장됨 — 로그인 정보 확인 필요", syncing: "동기화 중…", synced: "✅ 모든 승객에게 반영됨", error: "❌ 업로드 실패" }[syncStatus];
  const syncColor = syncStatus === "synced" ? FT.teal : syncStatus === "error" ? "#dc2626" : syncStatus === "local" ? FT.orange : FT.inkSoft;

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 2000, background: "#000" }}>
      <div ref={elRef} style={{ width: "100%", height: "100%" }} />
      <div style={{ position: "absolute", top: 10, left: 10, right: 10, zIndex: 2100,
        display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
        <div style={{ background: "#fff", color: FT.ink, padding: "8px 12px", borderRadius: 10,
          border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, lineHeight: 1.4,
          boxShadow: "3px 3px 0 " + FT.ink, fontWeight: 700, maxWidth: "70%" }}>
          경유점 편집 · 빈 곳 클릭=추가 · via 드래그=이동 · via 탭=제거 <span style={{ color: FT.orange }}>(현재 {totalVia}개)</span>
          {syncLabel ? <div style={{ marginTop: 4, fontSize: 11, color: syncColor, fontWeight: 700 }}>{syncLabel}</div> : null}
          {syncDetail ? <div style={{ marginTop: 2, fontSize: 10, color: FT.inkSoft, fontWeight: 400 }}>{syncDetail}</div> : null}
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={pushNow}
            style={{ background: FT.teal, color: "#fff", padding: "8px 12px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, boxShadow: "2px 2px 0 " + FT.ink, fontWeight: 700 }}>🔄 지금 반영</button>
          <button onClick={() => { if (window.confirm("저장된 모든 경유점을 초기화할까요? (코드 기본값으로 복귀)")) setViaMap({}); }}
            style={{ background: "#fff", color: FT.ink, padding: "8px 12px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, boxShadow: "2px 2px 0 " + FT.ink, fontWeight: 700 }}>초기화</button>
          <button onClick={onClose}
            style={{ background: FT.orange, color: "#fff", padding: "8px 14px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, boxShadow: "2px 2px 0 " + FT.ink, fontWeight: 700 }}>닫기</button>
        </div>
      </div>
    </div>
  );
}

/* 승객용 실시간 위치 지도 — ?view=map&db=<DB주소> 로 진입. Firebase RTDB REST 폴링 */
function LiveMapView({ dbUrl }) {
  const elRef = useRef(null), mapRef = useRef(null), markersRef = useRef({}), schedMarkersRef = useRef({});
  const [count, setCount] = useState(0);
  const [status, setStatus] = useState("연결 중…");
  const [viaOverride, setViaOverride] = useState(() => LS.getJSON("viapoints", {}));
  const [coordOverride, setCoordOverride] = useState(() => LS.getJSON("coords", {}));
  const lineRefsRef = useRef({});
  const stopLayersRef = useRef([]);
  const hasFitRef = useRef(false);

  // 좌표 lookup — override(공유 키) 우선, 없으면 ROUTES 기본값
  const getCoord = (dir, s) => {
    const k = SHARED_STOPS.has(s.name) ? s.name : `${dir}|${s.name}`;
    const o = coordOverride[k];
    if (o && typeof o.lat === "number") return [o.lat, o.lng];
    if (s.lat != null) return [s.lat, s.lng];
    return null;
  };

  // 지도 초기화 (한 번)
  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const L = window.L;
    const map = L.map(elRef.current, { zoomControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    map.setView([35.135, 126.94], 14);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // Firebase에서 viapoints + coords 가져오기 (운영자가 수정한 값)
  useEffect(() => {
    if (!dbUrl) return;
    const base = dbUrl.replace(/\/+$/, "");
    fetch(`${base}/viapoints.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => {
        if (d && typeof d === "object" && !Array.isArray(d)) { setViaOverride(d); LS.setJSON("viapoints", d); }
      })
      .catch(() => {});
    fetch(`${base}/coords.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => {
        if (!d || typeof d !== "object" || Array.isArray(d)) return;
        const clean = {};
        Object.entries(d).forEach(([k, v]) => {
          if (v && typeof v.lat === "number" && typeof v.lng === "number") clean[k] = { lat: v.lat, lng: v.lng };
        });
        if (Object.keys(clean).length) { setCoordOverride(clean); LS.setJSON("coords", { ...LS.getJSON("coords", {}), ...clean }); }
      })
      .catch(() => {});
  }, [dbUrl]);

  // 정류장 마커 + 노선 폴리라인 그리기/다시 그리기 — 좌표/경유점 오버라이드 변경 시 재계산
  useEffect(() => {
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    stopLayersRef.current.forEach((l) => map.removeLayer(l)); stopLayersRef.current = [];
    Object.values(lineRefsRef.current).forEach((layer) => layer && map.removeLayer(layer));
    lineRefsRef.current = {};
    const getVia = (dir, name) => {
      const k = `${dir}|${name}`;
      if (k in viaOverride) return viaOverride[k] || [];
      const s = ROUTES[dir].stops.find((x) => x.name === name);
      return s && Array.isArray(s.approachVia) ? s.approachVia : [];
    };
    const seenShared = new Set();
    const allCoords = [];
    ["outbound", "inbound"].forEach((dir) => {
      const dirColor = dir === "outbound" ? FT.orange : FT.teal;
      const dash = dir === "inbound" ? "10,8" : null;
      // 정류장 마커
      ROUTES[dir].stops.forEach((s) => {
        const c = getCoord(dir, s); if (!c) return;
        allCoords.push(c);
        if (SHARED_STOPS.has(s.name)) {
          if (seenShared.has(s.name)) return; seenShared.add(s.name);
          const m = L.circleMarker(c, { radius: 5, color: FT.ink, fillColor: "#fff", fillOpacity: 1, weight: 2 })
            .addTo(map).bindTooltip(s.name, { permanent: true, direction: "top", offset: [0, -4], className: "fest-stop" });
          stopLayersRef.current.push(m);
        } else {
          const m = L.circleMarker(c, { radius: 5, color: dirColor, fillColor: "#fff", fillOpacity: 1, weight: 2.5 })
            .addTo(map).bindTooltip(s.name, { permanent: true, direction: dir === "outbound" ? "top" : "bottom", offset: [0, dir === "outbound" ? -4 : 4],
              className: `fest-stop ${dir === "outbound" ? "dir-out" : "dir-in"}` });
          stopLayersRef.current.push(m);
        }
      });
      // 폴리라인
      const stopsWithCoord = ROUTES[dir].stops.map((s) => ({ s, c: getCoord(dir, s) })).filter((x) => x.c);
      if (stopsWithCoord.length < 2) return;
      const stopCoords = stopsWithCoord.map((x) => x.c);
      const routePts = [];
      stopsWithCoord.forEach(({ s, c }, i) => {
        if (i > 0) getVia(dir, s.name).forEach((v) => routePts.push(v));
        routePts.push(c);
      });
      lineRefsRef.current[dir] = L.polyline(stopCoords, { color: dirColor, weight: 5, opacity: 0.45, dashArray: dash, lineCap: "round", lineJoin: "round" }).addTo(map);
      const path = routePts.map(([la, ln]) => `${ln},${la}`).join(";");
      fetch(`https://router.project-osrm.org/route/v1/driving/${path}?overview=full&geometries=geojson&continue_straight=false`)
        .then((r) => r.ok ? r.json() : null)
        .then((d) => {
          if (!d || d.code !== "Ok" || !d.routes || !d.routes[0]) return;
          const road = d.routes[0].geometry.coordinates.map(([ln, la]) => [la, ln]);
          if (lineRefsRef.current[dir]) map.removeLayer(lineRefsRef.current[dir]);
          lineRefsRef.current[dir] = L.polyline(road, { color: dirColor, weight: 5, opacity: 0.85, dashArray: dash, lineCap: "round", lineJoin: "round" }).addTo(map);
        })
        .catch(() => {});
    });
    if (!hasFitRef.current && allCoords.length) {
      map.fitBounds(allCoords, { padding: [80, 30] });
      hasFitRef.current = true;
    }
  }, [coordOverride, viaOverride]);

  useEffect(() => {
    if (!dbUrl) { setStatus("공유 주소(db)가 없습니다"); return; }
    let stopped = false;
    const base = dbUrl.replace(/\/+$/, "");
    const L = window.L;
    const makeIcon = (id, b, noGps) => {
      const dir = b.dir === "inbound" ? "inbound" : "outbound";
      const bg = dir === "inbound" ? FT.teal : FT.orange;
      const wait = b.waiting === true;
      const borderStyle = noGps ? "dashed" : "solid";
      const shadow = noGps ? "" : `box-shadow:2px 2px 0 ${FT.ink};`;
      const trailing = noGps ? " 예상" : "";
      const html = `<div style="display:inline-flex;align-items:center;gap:3px;background:${wait ? "#fff" : bg};color:${wait ? FT.ink : "#fff"};border:2.5px ${borderStyle} ${FT.ink};border-radius:999px;padding:3px 9px;${shadow}font-family:'Jua',sans-serif;font-weight:700;font-size:12px;white-space:nowrap;">${wait ? "🅿️" : "🚌"} ${id}${trailing}</div>`;
      return L.divIcon({ className: "", html, iconSize: [140, 28], iconAnchor: [70, 14] });
    };
    const schedIcon = (dir, tripNum) => {
      const c = dir === "inbound" ? FT.teal : FT.orange;
      const html = `<div style="display:inline-flex;align-items:center;gap:3px;background:#fff;color:${FT.ink};border:2px dashed ${c};border-radius:999px;padding:3px 9px;font-family:'Jua',sans-serif;font-weight:700;font-size:11px;white-space:nowrap;opacity:0.92;">📅 ${tripNum}회차 예상</div>`;
      return L.divIcon({ className: "", html, iconSize: [130, 26], iconAnchor: [65, 13] });
    };
    const poll = async () => {
      try {
        const r = await fetch(`${base}/buses.json`, { cache: "no-store" });
        const data = await r.json();
        const map = mapRef.current; if (!map) return;
        const now = Date.now(); let n = 0;
        const liveTripSet = new Set();
        const validIds = new Set();
        const nowDate = new Date();
        const nowMinTick = nowDate.getHours() * 60 + nowDate.getMinutes() + nowDate.getSeconds() / 60;
        Object.entries(data || {}).forEach(([id, b]) => {
          if (!b || (b.ts && now - b.ts > 60000)) return;
          // 좌표 결정: GPS 좌표 우선. 없으면 운행 정보+시간으로 직전↔현재 정류장 사이 보간. 둘 다 안 되면 정류장 좌표.
          let pos = null, noGps = false;
          if (b.lat != null && b.lng != null) {
            pos = [b.lat, b.lng];
          } else if (b.stop && b.dir) {
            const dirKey = b.dir === "inbound" ? "inbound" : "outbound";
            const op = b.trip ? operationBasedPos(dirKey, b.trip - 1, b.stop, nowMinTick) : null;
            if (op) { pos = [op.lat, op.lng]; noGps = true; }
            else {
              const route = ROUTES[dirKey];
              const s = route && route.stops.find((x) => x.name === b.stop);
              if (s && s.lat != null) { pos = [s.lat, s.lng]; noGps = true; }
            }
          }
          if (!pos) return;
          n++;
          validIds.add(id);
          const dir = b.dir === "inbound" ? "inbound" : "outbound";
          if (b.trip) liveTripSet.add(`${dir}|${b.trip}`);
          const label = `${id} · ${ROUTES[dir].label}${b.trip ? ` ${b.trip}회차` : ""}${b.stop ? ` · ${b.stop}` : ""}${b.waiting === true ? " · 출발 대기" : ""}${noGps ? " · 정류장 기반" : ""}`;
          let m = markersRef.current[id];
          if (!m) {
            m = L.marker(pos, { icon: makeIcon(id, b, noGps) }).addTo(map);
            markersRef.current[id] = m;
          } else {
            m.setLatLng(pos);
            m.setIcon(makeIcon(id, b, noGps));
          }
          m.bindTooltip(label, { direction: "top", offset: [0, -16] });
        });
        Object.keys(markersRef.current).forEach((id) => {
          if (!validIds.has(id)) { map.removeLayer(markersRef.current[id]); delete markersRef.current[id]; }
        });

        // 시간표 기반 추정 위치 — 라이브 운행 정보가 들어올 때만 보조 표시
        const schedKeys = new Set();
        let nSched = 0;
        if (validIds.size > 0) {
          const today = new Date();
          const tripsToday = today.getMonth() === 5 && today.getDate() === 14 ? 5 : ROUTES.outbound.trips.length;
          const nowMin = today.getHours() * 60 + today.getMinutes();
          ["outbound", "inbound"].forEach((dir) => {
            for (let ti = 0; ti < tripsToday; ti++) {
              const tripNum = ti + 1;
              if (liveTripSet.has(`${dir}|${tripNum}`)) continue;
              const pos = scheduledBusPos(dir, ti, nowMin);
              if (!pos) continue;
              const key = `${dir}|${tripNum}`;
              schedKeys.add(key); nSched++;
              const lbl = `예정 · ${ROUTES[dir].label} ${tripNum}회차 · ${pos.fromName} → ${pos.toName}`;
              let m = schedMarkersRef.current[key];
              if (!m) {
                m = L.marker([pos.lat, pos.lng], { icon: schedIcon(dir, tripNum) }).addTo(map);
                schedMarkersRef.current[key] = m;
              } else {
                m.setLatLng([pos.lat, pos.lng]);
                m.setIcon(schedIcon(dir, tripNum));
              }
              m.bindTooltip(lbl, { direction: "top", offset: [0, -16] });
            }
          });
        }
        Object.keys(schedMarkersRef.current).forEach((k) => {
          if (!schedKeys.has(k)) { map.removeLayer(schedMarkersRef.current[k]); delete schedMarkersRef.current[k]; }
        });

        setCount(n);
        const totalShown = n + nSched;
        setStatus(n > 0 && nSched > 0 ? `실시간 ${n}대 · 예정 ${nSched}대`
          : n > 0 ? "실시간"
          : nSched > 0 ? `시간표 기준 ${nSched}대`
          : "운행 중인 셔틀이 없습니다");
      } catch (_) { setCount(0); setStatus("연결 오류 — 잠시 후 다시 시도"); }
    };
    poll();
    const id = setInterval(() => { if (!stopped) poll(); }, 3000);
    return () => { stopped = true; clearInterval(id); };
  }, [dbUrl]);

  return (
    <div style={{ position: "relative" }}>
      <div ref={elRef} style={{ height: "100vh", width: "100%" }} />

/* 버스가 시발지 출발 전이거나 종점 도착 후 다음 출발 대기 중인지 자동 추론 */
function inferWaiting(bus, nowMin, tripsToday) {
  const dir = bus.dir === "inbound" ? "inbound" : "outbound";
  const route = ROUTES[dir];
  const stops = route.stops;
  const trip = (bus.trip || 1) - 1;
  const sched = route.trips[trip];
  if (!sched) return null;
  // 시발지에서 이번 회차 출발 시각 전
  if (bus.stop === stops[0].name && nowMin < toMin(sched[0])) {
    return { place: stops[0].name, time: sched[0], tripIdx: trip + 1, dir };
  }
  // 종점 도착 후 반대 방향 다음 회차 대기
  if (bus.stop === stops[stops.length - 1].name) {
    const opp = dir === "outbound" ? "inbound" : "outbound";
    const oppTrips = ROUTES[opp].trips.slice(0, tripsToday);
    for (let i = 0; i < oppTrips.length; i++) {
      if (toMin(oppTrips[i][0]) >= nowMin) {
        return { place: stops[stops.length - 1].name, time: oppTrips[i][0], tripIdx: i + 1, dir: opp };
      }
    }
  }
  return null;
}

/* 승객 화면 버스 카드 — 진행바를 현재 정류장으로 자동 스크롤, 다음 정류장·도착예정 표시 */
function BusCard({ id, bus, agoText, nowMin, tripsToday }) {
  const stripRef = useRef(null), activeRef = useRef(null);
  const dir = bus.dir === "inbound" ? "inbound" : "outbound";
  const route = ROUTES[dir];
  const stops = route.stops;
  const ci = stops.findIndex((s) => s.name === bus.stop);
  const sched = route.trips[(bus.trip || 1) - 1];
  const nextStop = ci >= 0 && ci < stops.length - 1 ? stops[ci + 1] : null;
  const nextEta = nextStop && sched ? sched[ci + 1] : null;
  const finalName = stops[stops.length - 1].name;
  const finalEta = sched ? sched[sched.length - 1] : null;
  const autoWait = inferWaiting(bus, nowMin, tripsToday);
  const waitInfo = bus.waiting === true ? (autoWait || { place: bus.stop || "—", time: null, tripIdx: null, dir }) : autoWait;
  useEffect(() => {
    if (waitInfo) return;
    const el = activeRef.current, c = stripRef.current;
    if (el && c) c.scrollTo({ left: el.offsetLeft - c.clientWidth / 2 + el.clientWidth / 2, behavior: "smooth" });
  }, [ci, waitInfo]);
  return (
    <div style={{ background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 12, boxShadow: "3px 3px 0 " + FT.ink, padding: 10 }}>
      <div className="flex items-center justify-between" style={{ marginBottom: 6 }}>
        <div className="flex items-center gap-2 min-w-0">
          <span style={{ fontSize: 20 }}>🚌</span>
          <span className="flex-shrink-0" style={{ color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{id}</span>
          <span className="truncate" style={{ background: dir === "outbound" ? FT.orange : FT.teal, color: "#fff",
            border: "1.5px solid " + FT.ink, padding: "2px 8px", borderRadius: 999,
            fontSize: 11, fontFamily: "'Jua', sans-serif" }}>
            {route.label} · {bus.trip || "-"}회차
          </span>
        </div>
        <span className="flex-shrink-0 ml-2 flex items-center gap-1" style={{ color: FT.mute, fontSize: 10 }}>
          <span className="animate-pulse" style={{ width: 7, height: 7, borderRadius: "50%", background: FT.teal }} />{agoText(bus.ts)}
        </span>
      </div>

      {waitInfo ? (
        <div style={{ background: FT.orangeSoft, border: "2px solid " + FT.ink, borderRadius: 10, padding: "16px 14px", textAlign: "center" }}>
          <div style={{ fontSize: 11, letterSpacing: 2, marginBottom: 4, color: FT.orangeDark, fontFamily: "'Jua', sans-serif" }}>
            🅿️ 출발 대기 중{bus.waiting === true ? " (기사 확인)" : ""}
          </div>
          <div style={{ fontSize: 18, fontWeight: 700, color: FT.ink, fontFamily: "'Jua', sans-serif" }}>{waitInfo.place}</div>
          <div style={{ fontSize: 14, marginTop: 8, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>
            다음 출발 <b style={{ color: FT.orangeDark }}>{waitInfo.time || "미정"}</b>
            {waitInfo.tripIdx ? <span style={{ fontSize: 11, color: FT.mute, marginLeft: 4 }}>({waitInfo.tripIdx}회차 · {ROUTES[waitInfo.dir].label})</span> : null}
          </div>
        </div>
      ) : (
      <React.Fragment>
      <div ref={stripRef} className="flex items-start gap-0 overflow-x-auto" style={{ scrollbarWidth: "none", paddingTop: 5, paddingBottom: 2 }}>
        {stops.map((s, i) => {
          // 정류장 점 색: 지나온 곳=청록, 곧 도착(ci)=주황(도착 시 청록), 미래=흰
          const isCur = i === ci;
          const isPast = i < ci;
          const dotBg = isCur ? (bus.arrived ? FT.teal : "#fff") : isPast ? FT.teal : "#fff";
          const dotBorder = isCur ? (bus.arrived ? FT.tealDark : FT.orangeDark) : isPast ? FT.tealDark : FT.mute;
          // 연결 막대 색: (i, i+1) 구간. (ci-1, ci) 구간은 주황 강조(곧 도착 막대)
          let segColor = "#D1D5DB", segH = 2;
          if (i < ci - 1) { segColor = FT.teal; }
          else if (i === ci - 1) { segColor = bus.arrived ? FT.teal : FT.orange; segH = 4; }
          return (
            <React.Fragment key={s.name}>
              <div ref={isCur ? activeRef : null} className="flex flex-col items-center flex-shrink-0">
                <div style={{
                  width: isCur ? 14 : 11, height: isCur ? 14 : 11, borderRadius: "50%",
                  background: dotBg, border: "2px solid " + dotBorder,
                  boxShadow: isCur && !bus.arrived ? `0 0 0 3px ${FT.orangeSoft}` : "none" }} />
                <span style={{ fontSize: 8, marginTop: 2, whiteSpace: "nowrap", padding: "0 4px",
                  color: isCur ? (bus.arrived ? FT.tealDark : FT.orangeDark) : isPast ? FT.tealDark : FT.mute,
                  fontWeight: isCur ? 700 : 400 }}>{s.name}</span>
              </div>
              {i < stops.length - 1 && <div className="flex-shrink-0 self-start" style={{ width: 16, height: segH, marginTop: 6 + (segH > 2 ? -1 : 0), background: segColor, borderRadius: 1 }} />}
            </React.Fragment>
          );
        })}
      </div>

      {/* 곧 도착 / 정차 중 정보 + 남은 정류장 도착 예상 — 진행바 아래 */}
      {(() => {
        const schedAt = sched && ci >= 0 ? sched[ci] : null;
        const mins = schedAt ? toMin(schedAt) - nowMin : null;
        const delayed = !bus.arrived && mins != null && mins < 0;
        const etaLabel = bus.arrived ? null
          : mins == null ? null
          : mins > 0 ? `약 ${mins}분 후`
          : mins === 0 ? "잠시 후"
          : `🔴 지연 ${-mins}분`;
        const accent = bus.arrived ? FT.tealDark : FT.orangeDark;
        const etaColor = delayed ? "#dc2626" : accent;
        return (
          <div style={{ marginTop: 6, padding: "7px 10px", borderRadius: 8,
            background: bus.arrived ? FT.tealSoft : delayed ? "#FEE2E2" : FT.orangeSoft,
            border: "1.5px solid " + (delayed ? "#dc2626" : accent),
            display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 11, color: delayed ? "#dc2626" : accent, fontFamily: "'Jua', sans-serif", fontWeight: 700, flexShrink: 0 }}>
              {bus.arrived ? "● 정차 중" : "곧 도착"}
            </span>
            <span className="truncate" style={{ fontSize: 13, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, flex: 1 }}>
              {bus.stop || "운행 중"}
            </span>
            <span style={{ flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "flex-end", lineHeight: 1.15 }}>
              {etaLabel && (
                <span style={{ fontSize: 12, color: etaColor, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{etaLabel}</span>
              )}
              {schedAt && (
                <span style={{ fontSize: 10, color: etaColor, fontFamily: "'IBM Plex Mono', monospace", opacity: 0.85 }}>
                  {delayed ? `${fromMin(toMin(schedAt) + (-mins))} 예상` : `${schedAt} 예정`}
                </span>
              )}
            </span>
          </div>
        );
      })()}

      {/* 남은 정류장 — 각 도착 예정 시각 (지연 누적 반영) */}
      {(() => {
        const ciSched = sched && ci >= 0 ? sched[ci] : null;
        if (!ciSched) return null;
        const ciSchedMin = toMin(ciSched);
        const delay = Math.max(0, nowMin - ciSchedMin); // 지연(분)
        const remaining = [];
        for (let i = ci + 1; i < stops.length; i++) {
          const t = sched && sched[i] ? sched[i] : null;
          if (!t) continue;
          const adj = (toMin(t) - ciSchedMin) + Math.max(0, ciSchedMin - nowMin);
          remaining.push({ name: stops[i].name, time: t, mins: adj, isFinal: i === stops.length - 1 });
        }
        if (remaining.length === 0) return null;
        return (
          <div style={{ marginTop: 6, padding: "7px 10px", background: FT.paper, border: "1.5px solid " + FT.mute + "55", borderRadius: 8 }}>
            <div className="flex items-center justify-between mb-1">
              <span style={{ fontSize: 10, color: FT.inkSoft, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>남은 정류장</span>
              {delay > 0 && <span style={{ fontSize: 10, color: "#dc2626", fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>🔴 +{delay}분 지연</span>}
            </div>
            <div className="space-y-1">
              {remaining.map((r) => (
                <div key={r.name} className="flex items-center gap-2" style={{ fontSize: 11, fontFamily: "'Jua', sans-serif" }}>
                  <span style={{ flex: 1, color: FT.ink, fontWeight: r.isFinal ? 700 : 400 }}>
                    {r.name}{r.isFinal ? " (종점)" : ""}
                  </span>
                  <span style={{ color: delay > 0 ? "#dc2626" : FT.inkSoft, fontWeight: 700, minWidth: 56, textAlign: "right" }}>
                    {r.mins === 0 ? "곧" : `${r.mins}분 후`}
                  </span>
                  <span style={{ color: FT.mute, fontFamily: "'IBM Plex Mono', monospace", minWidth: 44, textAlign: "right" }}>
                    {delay > 0 ? fromMin(toMin(r.time) + delay) : r.time}
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}
      </React.Fragment>
      )}
    </div>
  );
}

/* 승객 기본 화면 — 실시간 버스 목록(버스안내판 스타일) + 지도 탭. 제목 7번 탭하면 운영자(히든) 진입 */
function PassengerView({ dbUrl, onAdmin, initialTab = "list" }) {
  const [buses, setBuses] = useState({});
  const [tab, setTab] = useState(initialTab);
  const [conn, setConn] = useState("loading"); // loading | ok | error
  const [showTimetable, setShowTimetable] = useState(false);
  const [showVenue, setShowVenue] = useState(false);
  const [venueZone, setVenueZone] = useState(0);
  const tapRef = useRef(0), tapTimeRef = useRef(0);

  useEffect(() => {
    if (!dbUrl) { setConn("error"); return; }
    const base = dbUrl.replace(/\/+$/, "");
    let stopped = false;
    const poll = async () => {
      try {
        const r = await fetch(`${base}/buses.json`, { cache: "no-store" });
        const d = await r.json();
        setBuses(d || {});
        setConn("ok");
      } catch (_) { setConn("error"); }
    };
    poll();
    const id = setInterval(() => { if (!stopped) poll(); }, 3000);
    return () => { stopped = true; clearInterval(id); };
  }, [dbUrl]);

  const onTitleTap = () => {
    const t = Date.now();
    if (t - tapTimeRef.current > 1500) tapRef.current = 0;
    tapTimeRef.current = t;
    if (++tapRef.current >= 7) { tapRef.current = 0; onAdmin(); }
  };

  const now = Date.now();
  const agoText = (ts) => { if (!ts) return ""; const s = Math.round((now - ts) / 1000); return s < 5 ? "방금" : s < 60 ? `${s}초 전` : `${Math.floor(s / 60)}분 전`; };
  const live = Object.entries(buses)
    .filter(([, b]) => b && (b.lat != null || b.stop) && (!b.ts || now - b.ts < 60000))
    .sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));

  // 시간표(승객용) — 일요일(6.14)은 5회차, 그 외 6회차
  const d = new Date();
  const tripsToday = d.getMonth() === 5 && d.getDate() === 14 ? 5 : ROUTES.outbound.trips.length;
  const nowMin = d.getHours() * 60 + d.getMinutes();

  /* 정류장 기준 도착 안내 — 버스별 카드만 사용하므로 미사용

    for (const [busId, b] of live) {
      const dir = b.dir === "inbound" ? "inbound" : "outbound";
      const route = ROUTES[dir];
      const stops = route.stops;
      let ci = stops.findIndex((s) => s.name === b.stop);
      if (ci < 0) continue;
      // GPS 좌표 기반으로 실제 진행 위치 보정: 버스가 b.stop을 이미 지나갔다면 가장 가까운 노선 정류장으로 ci 전진
      if (b.lat != null && b.lng != null) {
        let bestI = -1, bestD = Infinity;
        for (let i = 0; i < stops.length; i++) {

      }
      if (b.trip) liveTripSet.add(`${dir}|${b.trip}`);

        items.push({

    const routePos = {};

    ROUTES.inbound.stops.forEach((s) => {
      const k = SHARED_STOPS.has(s.name) ? s.name : `${s.name} (${inLabel})`;
      if (!(k in routePos)) routePos[k] = p++;

    const out = [];

    });
    out.sort((a, b) => (routePos[a.key] ?? 999) - (routePos[b.key] ?? 999));
    return out;
  })();
  */
  const nextDep = (dir) => {
    const ts = ROUTES[dir].trips.slice(0, tripsToday);
    for (let i = 0; i < ts.length; i++) { if (toMin(ts[i][0]) >= nowMin) return { idx: i, time: ts[i][0] }; }
    return null;
  };
  const statusText = conn === "error" ? "연결 오류 — 잠시 후 다시 시도합니다"
    : conn === "loading" ? "연결 중…"
    : live.length > 0 ? `실시간 운행 중 · ${live.length}대` : "현재 운행 중인 셔틀이 없습니다";

  if (tab === "map") {
    return (
      <div style={{ position: "relative" }}>
        <LiveMapView dbUrl={dbUrl} />

        </button>

    );
  }

            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>생각을 끄고, 생각을 켜다</div>
              <div style={{ fontSize: 14, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, marginTop: 2 }}>제4회 동구 무등산 인문축제</div>
              <div onClick={onTitleTap} className="select-none"
                style={{ fontSize: 22, color: FT.orange, fontFamily: "'Jua', sans-serif", fontWeight: 700, lineHeight: 1.15, marginTop: 4 }}>
                &lt;무등생각&gt; 셔틀버스 안내

              <div style={{ marginTop: 10, display: "inline-flex", alignItems: "center", gap: 6,
                background: conn === "error" ? "#FEE2E2" : live.length > 0 ? FT.tealSoft : "#EEEFF1",
                border: "1.5px solid " + (conn === "error" ? "#B91C1C" : live.length > 0 ? FT.tealDark : FT.mute),
                borderRadius: 999, padding: "4px 10px", fontFamily: "'Jua', sans-serif", fontSize: 11,
                color: conn === "error" ? "#B91C1C" : live.length > 0 ? FT.tealDark : FT.inkSoft }}>
                <span className={live.length > 0 ? "animate-pulse" : ""}

                    background: conn === "error" ? "#B91C1C" : live.length > 0 ? FT.teal : FT.mute }} />

            {live.length === 0 ? (

                {["outbound", "inbound"].map((dir) => {
                  const nd = nextDep(dir);

                      style={{ background: "#fff", border: "2px solid " + FT.ink, borderRadius: 12,
                        padding: "10px 12px 10px 14px", boxShadow: "2px 2px 0 " + FT.ink,
                        borderLeft: `8px solid ${c}` }}>
                      <div className="flex items-center gap-2" style={{ marginBottom: 4 }}>
                        <span style={{ fontSize: 11, color: c, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{ROUTES[dir].label}</span>
                        {nd && <span style={{ marginLeft: "auto", fontSize: 10, color: FT.mute, fontFamily: "'Jua', sans-serif" }}>{nd.idx + 1}회차</span>}
                      </div>
                      <div className="flex items-baseline" style={{ gap: 10 }}>
                        <span style={{ fontSize: 24, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, lineHeight: 1, fontFamily: "'IBM Plex Mono', monospace" }}>
                          {nd ? nd.time : "—"}
                        </span>
                        <span style={{ fontSize: 13, color: c, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
                          {nd ? (mins > 0 ? `약 ${mins}분 후` : "잠시 후") : "운행 종료"}

            {/* 행사 안내 — 버스 위치 아래 항상 표시 */}

              <div className="space-y-2">
                {FESTIVAL_ZONES.map((z) => (
                  <div key={z.num} onClick={() => { setVenueZone(z.num); setShowVenue(true); }}

                      border: "1.5px solid " + FT.ink, borderRadius: 10, padding: "8px 10px", cursor: "pointer" }}>
                    <div style={{ width: 26, height: 26, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",

                      fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 13 }}>{z.num}</div>

          {/* 하단 고정 액션 바 — 항상 보임 */}

            <button onClick={() => setTab("map")} className="py-2.5 text-[12px]"
              style={{ background: FT.teal, color: "#fff", border: "2px solid " + FT.ink, borderRadius: 10,
                boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
