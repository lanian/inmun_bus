  .boot img { width: 92px; height: auto;

  .leaflet-container .leaflet-tile,

/* Geo helper */
function distanceMeters(a, b) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const lat1 = toRad(a.lat); const lat2 = toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

const fromMin = (m) => { const x = ((m % (24 * 60)) + 24 * 60) % (24 * 60); return `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`; };

/* Phase 0.5: 가짜 시각/가속 — 행사 전 시연·테스트용. 영구 저장(localStorage) + URL 우선.

   실제 시각 기록(broadcast ts, dateKey 등 데이터 무결성)은 Date.now() 그대로 사용. */
const FAKE = (() => {
  try {
    const params = new URLSearchParams(window.location.search || "");
    const fromUrl = params.get("fake") || null;
    const fromLs = (typeof localStorage !== "undefined") ? (localStorage.getItem("shuttle:fakeNow") || null) : null;
    const base = fromUrl || fromLs;
    const speedRaw = params.get("fakeSpeed") || (typeof localStorage !== "undefined" ? localStorage.getItem("shuttle:fakeSpeed") : null) || "1";
    const speed = parseFloat(speedRaw) || 1;
    if (!base) return null;
    const baseDate = new Date(base);
    if (isNaN(baseDate.getTime())) return null;
    return { baseMs: baseDate.getTime(), wallStart: Date.now(), speed };
  } catch (_) { return null; }
})();
const getNow = () => {
  if (!FAKE) return new Date();
  const elapsed = Date.now() - FAKE.wallStart;
  return new Date(FAKE.baseMs + elapsed * FAKE.speed);
};
const getNowMin = () => { const d = getNow(); return d.getHours() * 60 + d.getMinutes(); };

};

/* 승객 안내용 시각 표현 — "13:00" → "오후 1시", "10:20" → "오전 10시 20분" */
const spokenClock = (hm) => {
  let [h, m] = hm.split(":").map(Number);
  const ampm = h < 12 ? "오전" : "오후";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return m === 0 ? `${ampm} ${h12}시` : `${ampm} ${h12}시 ${m}분`;

/* 지정한 멘트 설정(m)의 schedule에서, 축제장 도착(예정) 시각 이후 시작분만 골라 안내 문구 생성.
   refMin: 기준 시각(분). 없으면 현재 시각 사용 */
const buildProgramText = (m, dayKey, refMin) => {
  const list = dayKey === "day1" ? m.schedule.day1
    : dayKey === "day2" ? m.schedule.day2 : null;
  if (!list) return m.defaultProgram;
  const d = new Date();
  const nowMin = typeof refMin === "number" ? refMin : d.getHours() * 60 + d.getMinutes();
  const intro = "잠시 후, 무등생각 축제장에 도착합니다. ";
  const upcoming = list.filter(p => toMin(p.t) >= nowMin);
  if (upcoming.length === 0) {
    return intro + "오늘 준비된 주요 프로그램은 대부분 마무리되었어요. 그래도 " + m.allday + " 무등산에서 천천히, 편안한 시간 보내세요.";
  }
  const shown = upcoming.slice(0, 6); // 안내가 길어지지 않도록 다가오는 6개까지만
  const items = shown.map(p => `${spokenClock(p.t)} ${p.d}`).join(", ");
  const more = upcoming.length > shown.length ? " 이 외에도 더 많은 프로그램이 여러분을 기다리고 있어요." : "";
  return intro + "도착하시면, " + items + " 등 다양한 프로그램을 만나보실 수 있습니다." + more + " 그리고 " + m.allday + " 오늘 무등생각과 함께, 마음을 쉬어가는 하루 보내세요.";
};

/* localStorage helpers — survive across reloads */
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem("shuttle:" + k); return v == null ? d : v; } catch (_) { return d; } },
  getJSON: (k, d) => { try { const v = localStorage.getItem("shuttle:" + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set: (k, v) => { try { localStorage.setItem("shuttle:" + k, v); } catch (_) {} },
  setJSON: (k, v) => { try { localStorage.setItem("shuttle:" + k, JSON.stringify(v)); } catch (_) {} },
};

/* Leaflet map picker — click or drag pin to choose a coordinate.
   radius(m): 자동 안내 시작 반경을 원으로 표시 */
function MapPicker({ lat, lng, radius, onPick }) {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);
  const circleRef = useRef(null);

  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const map = window.L.map(elRef.current).setView([lat, lng], 16);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap",
    }).addTo(map);
    const icon = window.L.icon({
      iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
      iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
      shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
      iconSize: [25, 41], iconAnchor: [12, 41],
    });
    const circle = window.L.circle([lat, lng], {
      radius: radius || 150, color: "#22d65f", weight: 1.5,
      fillColor: "#22d65f", fillOpacity: 0.12,
    }).addTo(map);
    const marker = window.L.marker([lat, lng], { draggable: true, icon }).addTo(map);
    const move = (la, ln) => { circle.setLatLng([la, ln]); onPick(la, ln); };
    marker.on("dragend", () => { const p = marker.getLatLng(); move(p.lat, p.lng); });
    map.on("click", (e) => { marker.setLatLng(e.latlng); move(e.latlng.lat, e.latlng.lng); });
    mapRef.current = map; markerRef.current = marker; circleRef.current = circle;
    setTimeout(() => map.invalidateSize(), 80);
    return () => { map.remove(); mapRef.current = null; markerRef.current = null; circleRef.current = null; };
  }, []);

  // Sync external (manual-input) coordinate changes onto the map
  useEffect(() => {
    if (!markerRef.current || !mapRef.current) return;
    const c = markerRef.current.getLatLng();
    if (Math.abs(c.lat - lat) > 1e-7 || Math.abs(c.lng - lng) > 1e-7) {
      markerRef.current.setLatLng([lat, lng]);
      circleRef.current?.setLatLng([lat, lng]);
      mapRef.current.panTo([lat, lng]);
    }
  }, [lat, lng]);

  // 반경 변경 시 원 갱신
  useEffect(() => {
    if (circleRef.current && radius) circleRef.current.setRadius(radius);
  }, [radius]);

  if (!window.L) {
    return (
      <div className="text-xs text-center py-6 rounded-lg"
        style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#fca5a5" }}>
        지도를 불러올 수 없습니다 (네트워크 확인). 아래 좌표 입력은 사용할 수 있어요.
      </div>
    );
  }
  return <div ref={elRef} style={{ width: "100%", height: "260px", borderRadius: "12px", overflow: "hidden" }} />;
}

/* 운행 시간표 모달 — 양방향 전체 회차×정류장 시각 표. 현재 시각 기준 운행 회차 강조 (focusTrip 지정 시 해당 회차 우선) */
function TimetableModal({ tripsToday, onClose, focusTrip = null }) {
  const now = getNow();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  // 하루 전체에서 현재 운행 중(또는 다음) 회차 1개 계산
  const all = [];
  ["outbound", "inbound"].forEach((dir) => ROUTES[dir].trips.forEach((t, i) => {
    if (i < tripsToday) all.push({ dir, idx: i, dep: toMin(t[0]), arr: toMin(t[t.length - 1]) });
  }));
  all.sort((a, b) => a.dep - b.dep);
  const running = all.find((l) => nowMin >= l.dep && nowMin <= l.arr + 40);
  const autoActive = running || all.find((l) => l.dep > nowMin) || null;
  // focusTrip 우선 — 카드 탭으로 진입했을 때 해당 회차 강조 + 자동 스크롤
  const focusActive = focusTrip && typeof focusTrip.ti === "number" && focusTrip.dir
    ? { dir: focusTrip.dir, idx: focusTrip.ti } : null;
  const active = focusActive || autoActive;
  const activeState = focusActive ? "선택" : (running ? "운행 중" : "다음");
  const focusRowRef = useRef(null);
  useEffect(() => {
    if (focusRowRef.current && typeof focusRowRef.current.scrollIntoView === "function") {
      try { focusRowRef.current.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (_) {}
    }
  }, []);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(15,15,18,0.72)" }} onClick={onClose}>
      <div className="w-full max-w-md p-4 space-y-3 max-h-[85vh] overflow-y-auto"
        style={{ background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 16, boxShadow: "4px 4px 0 " + FT.ink }}
        onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div style={{ color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 15 }}>
            운행 시간표 <span style={{ color: FT.orange }}>· {tripsToday}회차</span>
          </div>
          <button onClick={onClose} aria-label="닫기"
            style={{ width: 28, height: 28, lineHeight: 1, borderRadius: 8, border: "2px solid " + FT.ink,
              background: "#fff", color: FT.ink, fontWeight: 700, fontFamily: "'Jua', sans-serif" }}>×</button>
        </div>
        {active && (
          <div style={{ display: "inline-flex", alignItems: "center", gap: 6,
              background: running ? FT.tealSoft : FT.orangeSoft,
              border: "1.5px solid " + (running ? FT.tealDark : FT.orangeDark),
              color: running ? FT.tealDark : FT.orangeDark,
              padding: "4px 10px", borderRadius: 999, fontSize: 11, fontFamily: "'Jua', sans-serif" }}>
            지금 {activeState}: {ROUTES[active.dir].label} {active.idx + 1}회차 ({ROUTES[active.dir].trips[active.idx][0]} 출발)
          </div>
        )}
        {["outbound", "inbound"].map((dir) => (
          <div key={dir} className="space-y-2">
            <div className="flex items-center gap-2">
              <span style={{ background: dir === "outbound" ? FT.orange : FT.teal, color: "#fff",
                border: "1.5px solid " + FT.ink, padding: "2px 10px", borderRadius: 999,
                fontSize: 11, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
                {ROUTES[dir].label}
              </span>
              <span style={{ fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>{ROUTES[dir].full}</span>
            </div>
            <div className="overflow-x-auto" style={{ border: "2px solid " + FT.ink, borderRadius: 10, background: "#fff" }}>
              <table className="text-[10px]" style={{ borderCollapse: "collapse", fontFamily: "'IBM Plex Mono', monospace" }}>
                <thead>
                  <tr style={{ background: FT.paper, borderBottom: "2px solid " + FT.ink }}>
                    <th className="px-2 py-1.5 whitespace-nowrap"
                      style={{ position: "sticky", left: 0, background: FT.paper, color: FT.ink, fontFamily: "'Jua', sans-serif" }}>회차</th>
                    {ROUTES[dir].stops.map((s, i) => (
                      <th key={i} className="px-2 py-1.5 whitespace-nowrap text-center"
                        style={{ color: FT.ink, fontFamily: "'Jua', sans-serif" }}>{s.name}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {ROUTES[dir].trips.slice(0, tripsToday).map((t, ti) => {
                    const isActive = active && active.dir === dir && active.idx === ti;
                    const rowBg = isActive ? FT.orangeSoft : (ti % 2 ? FT.paper : "#fff");
                    return (
                    <tr key={ti} ref={isActive ? focusRowRef : null} style={{ borderTop: "1px solid #E5E0CE", background: rowBg }}>
                      <td className="px-2 py-1.5 whitespace-nowrap"
                        style={{ color: isActive ? FT.orangeDark : FT.ink, fontWeight: 700,
                          position: "sticky", left: 0, background: rowBg, fontFamily: "'Jua', sans-serif" }}>
                        {isActive ? "▶ " : ""}{ti + 1}회
                      </td>
                      {t.map((time, si) => (
                        <td key={si} className="px-2 py-1.5 text-center whitespace-nowrap"
                          style={{ color: isActive ? FT.orangeDark : (si === 0 || si === t.length - 1 ? FT.ink : FT.inkSoft),
                            fontWeight: isActive || si === 0 || si === t.length - 1 ? 700 : 400 }}>{time}</td>
                      ))}
                    </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        ))}
        <div style={{ fontSize: 10, color: FT.inkSoft, lineHeight: 1.6, fontFamily: "'Jua', sans-serif" }}>
          ※ 6.13.(토) 1~6회차 · 6.14.(일) 1~5회차 운영 · 축제장에서 약 15분 휴식 후 회차 전환
        </div>
      </div>
    </div>
  );
}

/* 전체 수정사항 백업·복원 모달 — localStorage(shuttle:*) 키를 JSON으로 내보내고 다시 적용 */
function BackupModal({ onClose, counts, dateKey }) {
  const SENSITIVE = new Set(["driveremail", "driverpass", "apikey"]);
  const [includeSensitive, setIncludeSensitive] = useState(false);
  const [text, setText] = useState("");
  const [msg, setMsg] = useState("");
  const snapshot = (incl) => {
    const out = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith("shuttle:")) continue;
        const short = k.slice(8);
        if (!incl && SENSITIVE.has(short)) continue;
        out[short] = localStorage.getItem(k);
      }
    } catch (_) {}
    const snap = { version: 1, savedAt: new Date().toISOString(), data: out };
    if (counts && Object.keys(counts).length) snap.counts = { date: dateKey, entries: counts };
    return snap;
  };
  useEffect(() => { setText(JSON.stringify(snapshot(includeSensitive), null, 2)); }, [includeSensitive, counts, dateKey]);
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); setMsg("✅ 클립보드에 복사했어요"); }
    catch (_) { setMsg("복사 실패 — 직접 선택해 복사하세요"); }
  };
  const saveFile = () => {
    try {
      const blob = new Blob([text], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `inmun-bus-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      setMsg("✅ 파일로 저장했어요");
    } catch (_) { setMsg("파일 저장 실패"); }
  };
  const loadFile = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { setText(String(reader.result)); setMsg("파일을 불러왔어요. '복원' 버튼을 누르면 적용됩니다."); };
    reader.readAsText(f);
    e.target.value = "";
  };
  const restore = () => {
    let parsed;
    try { parsed = JSON.parse(text); } catch (_) { setMsg("❌ JSON 형식이 올바르지 않습니다"); return; }
    const obj = parsed && typeof parsed === "object" && parsed.data ? parsed.data : parsed;
    if (!obj || typeof obj !== "object") { setMsg("❌ 데이터가 없습니다"); return; }
    if (!window.confirm("현재 수정사항을 이 백업으로 덮어씁니다. 계속할까요?")) return;
    try {
      Object.entries(obj).forEach(([k, v]) => {
        if (typeof v !== "string") return;
        try { localStorage.setItem("shuttle:" + k, v); } catch (_) {}
      });
      setMsg("✅ 복원했어요. 잠시 후 새로고침됩니다…");
      setTimeout(() => window.location.reload(), 800);
    } catch (_) { setMsg("❌ 복원 실패"); }
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(15,15,18,0.72)" }} onClick={onClose}>
      <div className="w-full max-w-md p-4 space-y-3 max-h-[88vh] overflow-y-auto"

          정류장 좌표·안내 멘트·경유점·설정값을 한 번에 저장/복원합니다. 앱 업데이트, 새 기기 이전, 사고 대비용으로 쓰세요.
        </div>
        <label className="flex items-center gap-2" style={{ fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>
          <input type="checkbox" checked={includeSensitive} onChange={(e) => setIncludeSensitive(e.target.checked)} />
          기사 로그인(이메일·비밀번호·API 키)도 포함 <span style={{ color: FT.orange }}>⚠️ 공유 주의</span>
        </label>
        <textarea value={text} onChange={(e) => setText(e.target.value)}
          className="w-full p-2"
          style={{ background: FT.paper, border: "2px solid " + FT.ink, borderRadius: 8, color: FT.ink,
            fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, minHeight: 180, resize: "vertical" }} />
        <div className="grid grid-cols-2 gap-2">
          <button onClick={copy}
            style={{ background: "#fff", color: FT.ink, padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12 }}>복사</button>
          <button onClick={saveFile}
            style={{ background: "#fff", color: FT.ink, padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12 }}>파일로 저장</button>
          <label style={{ background: "#fff", color: FT.ink, padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12, textAlign: "center", cursor: "pointer" }}>
            파일 불러오기
            <input type="file" accept="application/json,.json" onChange={loadFile} style={{ display: "none" }} />
          </label>
          <button onClick={restore}
            style={{ background: FT.orange, color: "#fff", padding: "8px 10px", borderRadius: 8, border: "2px solid " + FT.ink, boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 12 }}>복원하기</button>
        </div>
        {msg && <div style={{ fontSize: 11, fontFamily: "'Jua', sans-serif",
          color: msg.startsWith("✅") ? FT.tealDark : msg.startsWith("❌") ? "#dc2626" : FT.inkSoft }}>{msg}</div>}
      </div>
    </div>
  );
}

/* 타원 → 폴리곤 좌표 배열로 근사 (n=48개 점) */
function ellipsePolygon(centerLat, centerLng, semiAm, semiBm, rotationDeg, n = 48) {
  const cosLat = Math.cos(centerLat * Math.PI / 180);
  const aDeg = (semiAm || 0) / 111000; // 1 lat 도 ≈ 111km
  const bDeg = (semiBm || 0) / 111000;
  const rot = (rotationDeg || 0) * Math.PI / 180;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * 2 * Math.PI;
    const x = aDeg * Math.cos(t);
    const y = bDeg * Math.sin(t);
    const xr = x * Math.cos(rot) - y * Math.sin(rot);
    const yr = x * Math.sin(rot) + y * Math.cos(rot);
    pts.push([centerLat + yr, centerLng + xr / Math.max(cosLat, 1e-6)]);
  }
  return pts;
}

/* 운영자 전용 — 오늘 일자 승하차 카운트 통계 모달 (회차별·정류장별 합계 + CSV 추출) */
function StatsModal({ counts, dateKey, onClose, onReset, busCapacity, setBusCapacity, countsEnabled, setCountsEnabled }) {
  const rows = Object.entries(counts).map(([k, v]) => {
    const [dir, trip, stop] = k.split("|");
    return { dir, trip: Number(trip), stop, board: v.board || 0, alight: v.alight || 0 };
  });
  const byTrip = {};
  const byStop = {};
  let totalBoard = 0, totalAlight = 0;
  rows.forEach((r) => {
    const tk = `${r.dir}|${r.trip}`;
    byTrip[tk] = byTrip[tk] || { board: 0, alight: 0 };
    byTrip[tk].board += r.board; byTrip[tk].alight += r.alight;
    const sk = `${r.dir}|${r.stop}`;
    byStop[sk] = byStop[sk] || { board: 0, alight: 0 };
    byStop[sk].board += r.board; byStop[sk].alight += r.alight;
    totalBoard += r.board; totalAlight += r.alight;
  });
  const dirLabel = (d) => d === "outbound" ? "축제장행" : "광장행";
  const tripEntries = Object.entries(byTrip).sort((a, b) => a[0].localeCompare(b[0]));
  const stopEntries = Object.entries(byStop).sort((a, b) => a[0].localeCompare(b[0]));
  const exportCsv = () => {
    const header = "date,direction,trip,stop,board,alight";
    const lines = rows.slice().sort((a, b) =>
      a.dir.localeCompare(b.dir) || a.trip - b.trip || a.stop.localeCompare(b.stop)
    ).map((r) => `${dateKey},${r.dir},${r.trip},"${r.stop}",${r.board},${r.alight}`);
    const csv = [header, ...lines].join("\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `counts-${dateKey}.csv`; a.click();
    URL.revokeObjectURL(url);
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3 max-h-[88vh] overflow-y-auto"
        style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div className="text-sm font-bold" style={{ color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
            오늘 승하차 통계 · {dateKey}
          </div>
          <button onClick={onClose} className="text-slate-400 text-lg leading-none px-1">×</button>
        </div>
        <div className="grid grid-cols-2 gap-2 text-center">
          <div className="rounded-lg p-2" style={{ background: "rgba(34,214,95,0.12)", border: "1px solid rgba(34,214,95,0.3)" }}>
            <div className="text-[10px] text-emerald-400/70" style={{ fontFamily: "'Jua', sans-serif" }}>총 탑승</div>
            <div className="text-2xl font-bold" style={{ color: "#22d65f", fontFamily: "'Black Han Sans', sans-serif" }}>{totalBoard}</div>
          </div>
          <div className="rounded-lg p-2" style={{ background: "rgba(251,146,60,0.12)", border: "1px solid rgba(251,146,60,0.3)" }}>
            <div className="text-[10px]" style={{ color: "#fb923c", opacity: 0.7, fontFamily: "'Jua', sans-serif" }}>총 하차</div>
            <div className="text-2xl font-bold" style={{ color: "#fb923c", fontFamily: "'Black Han Sans', sans-serif" }}>{totalAlight}</div>
          </div>
        </div>
        <div>
          <div className="text-[11px] text-slate-400 mb-1" style={{ fontFamily: "'Jua', sans-serif" }}>회차별 합계</div>
          {tripEntries.length === 0 ? (
            <div className="text-[11px] text-slate-600 text-center py-2">기록 없음</div>
          ) : tripEntries.map(([k, v]) => {
            const [d, t] = k.split("|");
            return (
              <div key={k} className="flex items-center text-xs py-1 border-b border-slate-700">
                <span style={{ color: d === "outbound" ? "#fb923c" : "#22d65f", minWidth: 80 }}>{dirLabel(d)} {t}회차</span>
                <span className="ml-auto text-emerald-400">탑 {v.board}</span>
                <span className="ml-3 text-orange-400">하 {v.alight}</span>
              </div>
            );
          })}
        </div>
        <div>
          <div className="text-[11px] text-slate-400 mb-1" style={{ fontFamily: "'Jua', sans-serif" }}>정류장별 합계</div>
          {stopEntries.length === 0 ? (
            <div className="text-[11px] text-slate-600 text-center py-2">기록 없음</div>
          ) : stopEntries.map(([k, v]) => {
            const [d, stop] = k.split("|");
            return (
              <div key={k} className="flex items-center text-xs py-1 border-b border-slate-700">
                <span style={{ color: d === "outbound" ? "#fb923c" : "#22d65f", minWidth: 80 }}>{dirLabel(d)}</span>
                <span className="text-slate-300 truncate" style={{ flex: 1 }}>{stop}</span>
                <span className="ml-2 text-emerald-400">탑 {v.board}</span>
                <span className="ml-2 text-orange-400">하 {v.alight}</span>
              </div>
            );
          })}
        </div>
        {typeof busCapacity === "number" && setBusCapacity && (
          <div className="flex items-center justify-between gap-2 pt-2 border-t border-slate-700">
            <span className="text-[11px] text-slate-400" style={{ fontFamily: "'Jua', sans-serif" }}>버스 정원 (혼잡도 색 기준)</span>
            <input type="number" min="1" value={busCapacity}
              onChange={(e) => setBusCapacity(Math.max(1, parseInt(e.target.value, 10) || 25))}
              className="w-20 px-2 py-1 rounded text-sm text-right"
              style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1" }} />
          </div>
        )}
        {typeof countsEnabled === "boolean" && setCountsEnabled && (
          <div className="flex items-center justify-between gap-2">
            <span className="text-[11px] text-slate-400" style={{ fontFamily: "'Jua', sans-serif" }}>
              운행 화면 승하차 입력 {countsEnabled ? "" : "(숨김)"}
            </span>
            <button onClick={() => setCountsEnabled(!countsEnabled)}
              className="relative w-12 h-7 rounded-full"
              style={{ background: countsEnabled ? "#22d65f" : "#3a3f54" }}>
              <div className="absolute top-0.5 w-6 h-6 rounded-full bg-white shadow"
                style={{ transform: countsEnabled ? "translateX(22px)" : "translateX(2px)", transition: "transform 0.2s" }} />
            </button>
          </div>
        )}
        <button onClick={exportCsv}
          className="w-full px-3 py-2 rounded-lg text-xs font-bold"
          style={{ background: "#22d65f", color: "#0a0b0f", fontFamily: "'Jua', sans-serif" }}>
          CSV 내려받기
        </button>
        <button onClick={() => {
            if (!window.confirm(`${dateKey} 의 모든 승하차 기록을 초기화합니다. 되돌릴 수 없어요. 계속할까요?`)) return;
            onReset && onReset();
          }}
          className="w-full px-3 py-2 rounded-lg text-[11px] font-bold"
          style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)", fontFamily: "'Jua', sans-serif" }}>
          오늘 기록 초기화
        </button>
      </div>
    </div>
  );
}

      const mm = it.time.match(/^(\d\d:\d\d)~(\d\d:\d\d)$/);
      if (!mm) return false;
      return toMin(mm[1]) <= nowMin && nowMin < toMin(mm[2]);
    });
  })();

  const isPastItem = (item, dayKey) => {

    const end = (item.time.split("~")[1] || item.time).trim();
    if (!/^\d/.test(end)) return false;
    const now = getNow();
    const m = now.getMonth(), d = now.getDate();
    const targetDay = dayKey === "day1" ? 13 : 14;
    if (m !== 5) return m > 5; // 6월이 아니면: 7월 이후=과거, 5월 이전=미래
    if (d > targetDay) return true;
    if (d < targetDay) return false;
    return toMin(end) < (now.getHours() * 60 + now.getMinutes());
  };
  const progSrc = progDay === "day1" ? "program-day1.png" : "program-day2.png";

/* 폴리라인 투영 — 정류장 시퀀스를 직선 세그먼트 폴리라인으로 보고 GPS를 수직 투영.
   반환: { ci: 다음 도착 정류장 인덱스, perpDist: 수직 거리(m), routePos: 시작점부터 거리(m) } 또는 null. */
function projectOnRoute(pos, stops) {
  if (!pos || pos.lat == null) return null;
  const cum = [0];
  for (let i = 1; i < stops.length; i++) {
    if (stops[i - 1].lat == null || stops[i].lat == null) { cum.push(cum[i - 1]); continue; }
    cum.push(cum[i - 1] + distanceMeters(stops[i - 1], stops[i]));
  }
  let bestI = -1, bestDist = Infinity, bestT = 0;
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (a.lat == null || b.lat == null) continue;
    const dx = b.lat - a.lat, dy = b.lng - a.lng;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1e-12) continue;
    const t = Math.max(0, Math.min(1, ((pos.lat - a.lat) * dx + (pos.lng - a.lng) * dy) / len2));
    const proj = { lat: a.lat + t * dx, lng: a.lng + t * dy };
    const d = distanceMeters(pos, proj);
    if (d < bestDist) { bestDist = d; bestI = i; bestT = t; }
  }
  if (bestI < 0) return null;
  const segLen = distanceMeters(stops[bestI], stops[bestI + 1]);
  const routePos = cum[bestI] + bestT * segLen;
  // ci = routePos보다 같거나 큰 cum을 가진 첫 정류장(=다음 도착)
  // grace를 50m로 — 정류장 막 지났을 때 ci가 즉시 점프하는 것 방지(운영자 화면과 일관 유지)
  let ci = stops.length - 1;
  for (let i = 0; i < stops.length; i++) {
    if (cum[i] + 50 >= routePos) { ci = i; break; }
  }
  return { ci, perpDist: bestDist, routePos };
}

/* 전체 노선 폴리라인 — 정류장 + approachVia 경유점을 순서대로 합쳐 한 줄로 구성 */
function buildRoutePolyline(dir, stops) {
  const points = [];
  for (let i = 0; i < stops.length; i++) {
    if (i > 0) {
      try {
        const via = effectiveVia(dir, stops[i].name) || [];
        via.forEach((v) => points.push({ lat: v[0], lng: v[1] }));
      } catch (_) {}
    }
    if (stops[i].lat != null) points.push({ lat: stops[i].lat, lng: stops[i].lng });
  }
  return points;
}
/* GPS 좌표를 노선 폴리라인에 수직 투영(가장 가까운 세그먼트). 반환: { snapped, perpDist } 또는 null.
   polyOverride([[lat,lng],...]) 주어지면 그것 사용(OSRM 도로 곡선) — 없으면 정류장+via 직선 폴리라인 fallback */
function snapToRoute(pos, dir, stops, polyOverride) {
  if (!pos || pos.lat == null) return null;
  let poly;
  if (Array.isArray(polyOverride) && polyOverride.length >= 2) {
    poly = polyOverride.map((p) => Array.isArray(p) ? { lat: p[0], lng: p[1] } : p);
  } else {
    poly = buildRoutePolyline(dir, stops);
  }
  if (poly.length < 2) return null;
  let bestDist = Infinity, bestProj = null;
  for (let i = 0; i < poly.length - 1; i++) {
    const a = poly[i], b = poly[i + 1];
    const dx = b.lat - a.lat, dy = b.lng - a.lng;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1e-12) continue;
    const t = Math.max(0, Math.min(1, ((pos.lat - a.lat) * dx + (pos.lng - a.lng) * dy) / len2));
    const proj = { lat: a.lat + t * dx, lng: a.lng + t * dy };
    const d = distanceMeters(pos, proj);
    if (d < bestDist) { bestDist = d; bestProj = proj; }
  }
  return bestProj ? { snapped: bestProj, perpDist: bestDist } : null;
}

/* 두 정류장 사이의 폴리라인(앞 정류장→approachVia 경유점→뒤 정류장) 구성 */
function buildSegmentPolyline(dir, prevStop, curStop) {
  const points = [{ lat: prevStop.lat, lng: prevStop.lng }];
  try {
    const via = effectiveVia(dir, curStop.name) || [];
    via.forEach((v) => points.push({ lat: v[0], lng: v[1] }));
  } catch (_) {}
  points.push({ lat: curStop.lat, lng: curStop.lng });
  return points;
}
/* 폴리라인의 누적 거리 비율 t(0~1)에 해당하는 좌표를 직선 구간 따라 보간 */
function interpolateAlongPolyline(points, t) {
  if (!points || points.length === 0) return null;
  if (points.length === 1) return points[0];
  const segLens = [];
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    const d = distanceMeters(points[i - 1], points[i]);
    segLens.push(d); total += d;
  }
  if (total < 1e-6) return points[0];
  let target = Math.max(0, Math.min(1, t)) * total;
  for (let i = 0; i < segLens.length; i++) {
    if (target <= segLens[i]) {
      const f = segLens[i] > 0 ? target / segLens[i] : 0;
      return {
        lat: points[i].lat + (points[i + 1].lat - points[i].lat) * f,
        lng: points[i].lng + (points[i + 1].lng - points[i].lng) * f,
      };
    }
    target -= segLens[i];
  }
  return points[points.length - 1];
}

/* 운행 정보(dir/trip/현재 정류장) + 시간 + 대기 플래그 → 보간 위치 + 상태(phase)
   phase: waiting/before/approaching/at/passed/end */
function operationBasedPos(dir, tripIdx, curStopName, nowMin, waiting) {
  const route = ROUTES[dir];
  const sched = route.trips[tripIdx];
  if (!sched) return null;
  const stops = route.stops;
  const i = stops.findIndex((s) => s.name === curStopName);
  if (i < 0) return null;
  const at = (idx, phase) => stops[idx] && stops[idx].lat != null ? { lat: stops[idx].lat, lng: stops[idx].lng, fromName: stops[idx].name, toName: stops[idx].name, phase } : null;
  if (waiting) return at(i, "waiting");
  const tCur = sched[i] ? toMin(sched[i]) : null;
  const tPrev = i > 0 && sched[i - 1] ? toMin(sched[i - 1]) : null;
  const tNext = i < stops.length - 1 && sched[i + 1] ? toMin(sched[i + 1]) : null;
  // 진입 구간(prev → cur) — approachVia 포함 폴리라인 따라 보간
  if (i > 0 && tPrev != null && tCur != null && nowMin < tCur) {
    const prev = stops[i - 1], cur = stops[i];
    if (prev.lat == null || cur.lat == null) return at(i, "approaching");
    const t = Math.max(0, Math.min(1, (nowMin - tPrev) / Math.max(1, tCur - tPrev)));
    const phase = (tCur - nowMin) <= 1 ? "approaching" : "between";
    const p = interpolateAlongPolyline(buildSegmentPolyline(dir, prev, cur), t);
    return { ...p, fromName: prev.name, toName: cur.name, phase };
  }
  // 시발지 출발 시각 전 — 정류장에서 대기
  if (i === 0 && tCur != null && nowMin < tCur) return at(0, "before");
  // 통과 구간(cur → next) — 동일하게 폴리라인 보간
  if (tCur != null && tNext != null && nowMin >= tCur && nowMin <= tNext) {
    const cur = stops[i], nxt = stops[i + 1];
    if (cur.lat == null || nxt.lat == null) return at(i, "passed");
    const t = Math.max(0, Math.min(1, (nowMin - tCur) / Math.max(1, tNext - tCur)));
    const phase = (nowMin - tCur) <= 1 ? "at" : "passed";
    const p = interpolateAlongPolyline(buildSegmentPolyline(dir, cur, nxt), t);
    return { ...p, fromName: cur.name, toName: nxt.name, phase };
  }
  // 종점 또는 다음 정류장도 지나간 경우 — 가장 근접한 정류장에 고정
  if (i === stops.length - 1) return at(i, "end");
  return at(i, "at");
}

/* 시간표 기반 버스 추정 위치 — 운행 중 회차의 두 정류장 사이를 시간 비율로 보간 */
function scheduledBusPos(dir, tripIdx, nowMin) {
  const route = ROUTES[dir];
  const sched = route.trips[tripIdx];
  if (!sched) return null;
  const startMin = toMin(sched[0]);
  const endMin = toMin(sched[sched.length - 1]);
  if (nowMin < startMin || nowMin > endMin) return null;
  for (let i = 0; i < sched.length - 1; i++) {
    const a = toMin(sched[i]), b = toMin(sched[i + 1]);
    if (nowMin >= a && nowMin <= b) {
      const sa = route.stops[i], sb = route.stops[i + 1];
      if (sa.lat == null || sb.lat == null) return null;
      const t = b > a ? (nowMin - a) / (b - a) : 0;
      // A9: 폴리라인(approachVia 포함) 기반 보간 — 운영자측 operationBasedPos 와 위치 일치
      let p;
      try {
        const poly = buildSegmentPolyline(dir, sa, sb);
        p = interpolateAlongPolyline(poly, t);
      } catch (_) { p = null; }
      if (!p || typeof p.lat !== "number") {
        p = { lat: sa.lat + (sb.lat - sa.lat) * t, lng: sa.lng + (sb.lng - sa.lng) * t };
      }
      return {
        lat: p.lat, lng: p.lng,
        fromName: sa.name, toName: sb.name,
        nearIdx: t < 0.5 ? i : i + 1,
      };
    }
  }
  return null;
}

/* 두 점 사이의 거리(평면 근사). 짧은 거리에선 충분 */
const distLL = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
/* 점 P가 선분 AB에 떨어진 거리 — 가장 가까운 구간 찾기 */
const pointSegDist = (p, a, b) => {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  if (dx === 0 && dy === 0) return distLL(p, a);
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy)));
  return distLL(p, [a[0] + t * dx, a[1] + t * dy]);
};
/* 정류장의 approachVia 효과값 — localStorage 오버라이드 우선, 없으면 코드 기본값 */
const effectiveVia = (dir, stopName) => {
  const userVia = LS.getJSON("viapoints", {});
  const key = `${dir}|${stopName}`;
  if (key in userVia) return userVia[key];
  const s = ROUTES[dir].stops.find((x) => x.name === stopName);
  return s && Array.isArray(s.approachVia) ? s.approachVia : [];
};

/* P1-2: 운영자 공지/재난 안내 편집기 — /notice 노드에 PUT, 승객 페이지 상단에 빨간/노란 띠로 표시 */
function NoticeEditor({ onClose, dbUrl, getAuth, refreshAuth }) {
  const [cur, setCur] = useState(null);
  const [msg, setMsg] = useState("");
  const [level, setLevel] = useState("warn"); // info|warn|danger
  const [text, setText] = useState("");
  const [active, setActive] = useState(true);
  const [status, setStatus] = useState("");
  useEffect(() => {
    if (!dbUrl) return;
    const base = dbUrl.replace(/\/+$/, "");
    fetch(`${base}/notice.json`).then((r) => r.json()).then((d) => {
      if (d && typeof d === "object") {
        setCur(d);
        setText(d.message || "");
        setLevel(d.level || "warn");
        setActive(d.active !== false);
      }
    }).catch(() => {});
  }, [dbUrl]);
  const put = async (tok, body) => {
    const base = dbUrl.replace(/\/+$/, "");
    const auth = tok ? `?auth=${encodeURIComponent(tok)}` : "";
    return fetch(`${base}/notice.json${auth}`, { method: "PUT", body: JSON.stringify(body) });
  };
  const save = async (publish) => {
    const body = { message: text.trim(), level, active: !!publish, ts: Date.now() };
    if (publish && !body.message) { setStatus("⚠ 공지 내용을 입력하세요"); return; }
    if (!dbUrl) { setStatus("⚠ DB 주소 없음 — 고급 설정에서 Firebase DB 주소를 먼저 입력하세요"); return; }
    const initialTok = getAuth && getAuth();
    if (!initialTok && !refreshAuth) {
      setStatus("⚠ 쓰기 로그인 미설정 — 고급 설정에서 기사 이메일·비밀번호 입력 후 위치 공유를 한 번 켜 토큰을 받아오세요");
      return;
    }
    setStatus("저장 중…");
    try {
      let r = await put(initialTok, body);
      if ((r.status === 401 || r.status === 403) && refreshAuth) {
        setStatus("인증 갱신 중…");
        const tok = await refreshAuth();
        if (tok) r = await put(tok, body);
        else { setStatus("⚠ 쓰기 로그인 실패 — 기사 이메일·비밀번호 확인 후 다시 시도하세요"); return; }
      }
      if (r.ok) { setStatus(publish ? "✅ 공지 발송 — 전 승객 화면 상단에 표시됨" : "✅ 공지 해제됨"); setCur(body); setActive(!!publish); }
      else if (r.status === 401 || r.status === 403) {
        let detail = "";
        try { const j = await r.json(); detail = j && j.error ? " · " + j.error : ""; } catch (_) {}
        setStatus(`⚠ 권한 없음 (HTTP ${r.status})${detail} — RTDB rules 에 /notice 쓰기 권한이 있는 UID(/admins 또는 driver) 인지 확인하세요`);
      }
      else {
        let body2 = "";
        try { body2 = await r.text(); } catch (_) {}
        setStatus(`⚠ Firebase 응답 ${r.status}${body2 ? " · " + body2.slice(0, 80) : ""}`);
      }
    } catch (e) { setStatus(`⚠ 네트워크 오류 · ${e && e.message ? e.message : ""}`); }
  };
  const presets = [
    { label: "🌧 우천 지연", lv: "warn", t: "우천으로 셔틀 운행이 지연되고 있습니다. 잠시만 기다려 주세요." },
    { label: "🚧 노선 변경", lv: "warn", t: "교통 통제로 일부 노선이 변경되었습니다. 안내방송을 확인해 주세요." },
    { label: "⛔ 운행 중단", lv: "danger", t: "안전상의 이유로 셔틀 운행이 일시 중단되었습니다. 추후 안내 드리겠습니다." },
    { label: "ⓘ 정상 운행", lv: "info", t: "셔틀이 정상 운행 중입니다." },
  ];
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3 max-h-[92vh] overflow-y-auto"
        style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div className="text-sm font-bold" style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
            📢 공지·재난 안내
          </div>
          <button onClick={onClose} className="text-slate-400 text-lg leading-none px-1" aria-label="닫기">×</button>
        </div>
        <div className="text-[10px] text-slate-500">
          모든 승객 화면 상단에 빨간/노란 띠로 표시됩니다. 새 공지는 ts 가 갱신돼 이전에 닫은 사용자에게도 다시 나타납니다.
        </div>
        {cur && cur.active && (
          <div className="text-[10px]" style={{ color: "#22d65f" }}>
            ● 현재 표시 중: <span style={{ color: "#cbd5e1" }}>{cur.message}</span>
          </div>
        )}
        <div className="grid grid-cols-4 gap-1">
          {presets.map((p) => (
            <button key={p.label} onClick={() => { setText(p.t); setLevel(p.lv); }}
              className="px-1.5 py-1 rounded text-[10px]"
              style={{ background: "#1c2030", color: "#cbd5e1", border: "1px solid #3a3f54", fontFamily: "'Jua', sans-serif" }}>
              {p.label}
            </button>
          ))}
        </div>
        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={4}
          placeholder="공지 내용을 입력하세요"
          className="w-full px-2 py-1.5 rounded text-[12px]"
          style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }} />
        <div className="flex items-center gap-2 text-[11px]" style={{ fontFamily: "'Jua', sans-serif" }}>
          <span style={{ color: "#94a3b8" }}>중요도</span>
          {[{ v: "info", t: "정보", c: "#fb923c" }, { v: "warn", t: "경고", c: "#f59e0b" }, { v: "danger", t: "위험", c: "#dc2626" }].map((o) => (
            <button key={o.v} onClick={() => setLevel(o.v)}
              className="px-2 py-0.5 rounded font-bold"
              style={{ background: level === o.v ? o.c : "rgba(255,255,255,0.04)", color: level === o.v ? "#fff" : "#cbd5e1",
                border: "1px solid " + (level === o.v ? o.c : "#3a3f54") }}>
              {o.t}
            </button>
          ))}
        </div>
        {status && <div className="text-[11px]" style={{ color: status.startsWith("✅") ? "#22d65f" : status.startsWith("⚠") ? "#fca5a5" : "#fbbf24" }}>{status}</div>}
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => save(false)}
            className="px-3 py-2 rounded-lg text-xs font-bold"
            style={{ background: "rgba(100,116,139,0.18)", color: "#cbd5e1", border: "1px solid #3a3f54", fontFamily: "'Jua', sans-serif" }}>
            공지 해제
          </button>
          <button onClick={() => save(true)}
            className="px-3 py-2 rounded-lg text-xs font-bold"
            style={{ background: "#dc2626", color: "#fff", fontFamily: "'Jua', sans-serif" }}>
            발송
          </button>
        </div>
      </div>
    </div>
  );
}

/* 행사 구역 좌표 편집기 — 운영자 전용. 지도에서 드래그로 위치 설정 + Firebase /zones 동기화 */
function ZoneEditor({ onClose, dbUrl, getAuth, refreshAuth }) {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const markersRef = useRef({});
  const subMarkersRef = useRef({}); // { [zoneNum]: [marker, ...] }
  const zonesRef = useRef({});
  const cleanSubs = (arr) => Array.isArray(arr)
    ? arr.filter((s) => s && typeof s.lat === "number" && typeof s.lng === "number")
        .map((s) => ({ name: String(s.name || ""), lat: s.lat, lng: s.lng }))
    : [];
  const [zones, setZones] = useState(() => {
    const ls = LS.getJSON("zones", {});
    const out = {};
    FESTIVAL_ZONES.forEach((z) => {
      const o = ls[z.num] || {};
      out[z.num] = {
        lat: typeof o.lat === "number" ? o.lat : z.lat,
        lng: typeof o.lng === "number" ? o.lng : z.lng,
        rA: typeof o.rA === "number" ? o.rA : (z.rA || 80),
        rB: typeof o.rB === "number" ? o.rB : (z.rB || 80),
        rot: typeof o.rot === "number" ? o.rot : (z.rot || 0),
        subs: Array.isArray(o.subs) ? cleanSubs(o.subs) : cleanSubs(z.subs),
      };
    });
    return out;
  });
  useEffect(() => { zonesRef.current = zones; }, [zones]);
  const [msg, setMsg] = useState("");
  /* Firebase에서 초기 zones 불러오기 */
  useEffect(() => {
    if (!dbUrl) return;
    const base = dbUrl.replace(/\/+$/, "");
    fetch(`${base}/zones.json`).then((r) => r.json()).then((d) => {
      if (!d || typeof d !== "object") return;
      setZones((prev) => {
        const next = { ...prev };
        Object.entries(d).forEach(([k, v]) => {
          if (v && typeof v.lat === "number" && typeof v.lng === "number") {
            next[k] = {
              lat: v.lat, lng: v.lng,
              rA: typeof v.rA === "number" ? v.rA : (prev[k]?.rA || 80),
              rB: typeof v.rB === "number" ? v.rB : (prev[k]?.rB || 80),
              rot: typeof v.rot === "number" ? v.rot : (prev[k]?.rot || 0),
              subs: Array.isArray(v.subs) ? cleanSubs(v.subs) : (prev[k]?.subs || []),
            };
          }
        });
        return next;
      });
    }).catch(() => {});
  }, [dbUrl]);
  /* 지도 초기화 + 5개 zone draggable 마커 추가(한 번만) */
  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const L = window.L;
    const init = zonesRef.current;
    const initLat = (Object.values(init)[0] || {}).lat || 35.133;
    const initLng = (Object.values(init)[0] || {}).lng || 126.96;
    const map = L.map(elRef.current).setView([initLat, initLng], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    mapRef.current = map;
    FESTIVAL_ZONES.forEach((z) => {
      const v = init[z.num] || { lat: z.lat, lng: z.lng, rA: 80, rB: 80, rot: 0 };
      const c = z.num % 2 ? "#fb923c" : "#22d65f";
      const html = `<div style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:${c};color:#0a0b0f;border:2px solid #101113;box-shadow:2px 2px 0 #101113;font-family:'Jua',sans-serif;font-weight:700;font-size:13px;">${z.num}</div>`;
      const icon = L.divIcon({ className: "", html, iconSize: [32, 32], iconAnchor: [16, 16] });
      // 타원 미리보기 폴리곤
      const poly = L.polygon(ellipsePolygon(v.lat, v.lng, v.rA || 80, v.rB || 80, v.rot || 0), {
        color: c, weight: 2, opacity: 0.85, fillColor: c, fillOpacity: 0.2,
      }).addTo(map);
      const marker = L.marker([v.lat, v.lng], { draggable: true, icon }).addTo(map).bindTooltip(z.title);
      marker.on("dragend", () => {
        const p = marker.getLatLng();
        setZones((prev) => {
          const nz = { ...(prev[z.num] || {}), lat: p.lat, lng: p.lng };
          return { ...prev, [z.num]: nz };
        });
      });
      markersRef.current[z.num] = { marker, poly };
    });
    // 5개 모두 보이도록 fitBounds
    const coords = Object.values(init).map((v) => [v.lat, v.lng]);
    if (coords.length) map.fitBounds(coords, { padding: [40, 40] });
    setTimeout(() => map.invalidateSize(), 80);
    return () => { map.remove(); mapRef.current = null; markersRef.current = {}; subMarkersRef.current = {}; };
  }, []);
  /* zones 변경(기본값 복원/숫자 입력 등) 시 마커 위치 + 타원 폴리곤 동기화 */
  useEffect(() => {
    Object.entries(markersRef.current).forEach(([num, ref]) => {
      const v = zones[num]; if (!v || !ref) return;
      const { marker, poly } = ref;
      if (marker) {
        const c = marker.getLatLng();
        if (Math.abs(c.lat - v.lat) > 1e-7 || Math.abs(c.lng - v.lng) > 1e-7) marker.setLatLng([v.lat, v.lng]);
      }
      if (poly) poly.setLatLngs(ellipsePolygon(v.lat, v.lng, v.rA || 80, v.rB || 80, v.rot || 0));
    });
  }, [zones]);
  /* subs 변경 시 세부장소 마커 재구축(드래그/추가/삭제/이름 변경 반영) */
  useEffect(() => {
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    Object.values(subMarkersRef.current).forEach((list) => list.forEach((m) => map.removeLayer(m)));
    subMarkersRef.current = {};
    Object.entries(zones).forEach(([num, v]) => {
      const subs = Array.isArray(v.subs) ? v.subs : [];
      if (!subs.length) return;
      const c = (Number(num) % 2) ? "#fb923c" : "#22d65f";
      subMarkersRef.current[num] = subs.map((s, idx) => {
        if (typeof s.lat !== "number" || typeof s.lng !== "number") return null;
        const label = (s.name || "(이름 없음)").replace(/</g, "&lt;");
        const html = `<div><span class="dot" style="background:${c}"></span><span>${label}</span></div>`;
        const icon = L.divIcon({ className: "fest-sub-marker", html, iconSize: [140, 22], iconAnchor: [70, 11] });
        const m = L.marker([s.lat, s.lng], { draggable: true, icon }).addTo(map).bindTooltip(`${num}-${idx + 1} 세부장소`);
        m.on("dragend", () => {
          const p = m.getLatLng();
          setZones((prev) => {
            const cur = prev[num] || {};
            const arr = Array.isArray(cur.subs) ? [...cur.subs] : [];
            if (!arr[idx]) return prev;
            arr[idx] = { ...arr[idx], lat: p.lat, lng: p.lng };
            return { ...prev, [num]: { ...cur, subs: arr } };
          });
        });
        return m;
      }).filter(Boolean);
    });
  }, [zones]);
  const putZones = async (tok, payload) => {
    const base = dbUrl.replace(/\/+$/, "");
    const auth = tok ? `?auth=${encodeURIComponent(tok)}` : "";
    return fetch(`${base}/zones.json${auth}`, { method: "PUT", body: JSON.stringify(payload || zones) });
  };
  const cleaned = () => {
    const out = {};
    Object.entries(zones).forEach(([k, v]) => {
      out[k] = {
        lat: v.lat, lng: v.lng,
        rA: typeof v.rA === "number" ? v.rA : 80,
        rB: typeof v.rB === "number" ? v.rB : 80,
        rot: typeof v.rot === "number" ? v.rot : 0,
        subs: cleanSubs(v.subs),
      };
    });
    return out;
  };
  const save = async () => {
    const data = cleaned();
    LS.setJSON("zones", data);
    if (!dbUrl) { setMsg("✅ 로컬만 저장 (DB 주소 미설정)"); return; }
    setMsg("저장 중…");
    try {
      let r = await putZones(getAuth && getAuth(), data);
      if ((r.status === 401 || r.status === 403) && refreshAuth) {
        // 토큰 만료 — 재로그인 후 한 번 더 시도
        setMsg("인증 갱신 중…");
        const newTok = await refreshAuth();
        if (newTok) r = await putZones(newTok, data);
      }
      if (r.ok) setMsg("✅ 저장 완료 — 승객 지도 새로고침 시 반영");
      else if (r.status === 401 || r.status === 403) setMsg("⚠ 인증 실패 (HTTP " + r.status + ") — 고급 설정에서 기사 로그인 확인");
      else setMsg("⚠ Firebase 응답 " + r.status + " — 로컬만 저장됨");
    } catch (_) { setMsg("⚠ 네트워크 오류 — 로컬만 저장됨"); }
  };
  const resetToDefaults = () => {
    if (!window.confirm("기본 좌표/반경/회전/세부장소로 되돌립니다. 계속할까요?")) return;
    const out = {};
    FESTIVAL_ZONES.forEach((z) => {
      out[z.num] = { lat: z.lat, lng: z.lng, rA: z.rA || 80, rB: z.rB || 80, rot: z.rot || 0, subs: cleanSubs(z.subs) };
    });
    setZones(out);
    setMsg("기본값으로 되돌림 — 저장 버튼으로 적용");
  };
  /* 세부장소 헬퍼 — 추가/삭제/이름 수정 */
  const addSub = (num) => {
    setZones((prev) => {
      const cur = prev[num] || {};
      const arr = Array.isArray(cur.subs) ? [...cur.subs] : [];
      arr.push({ name: "", lat: cur.lat, lng: cur.lng });
      return { ...prev, [num]: { ...cur, subs: arr } };
    });
  };
  const removeSub = (num, idx) => {
    setZones((prev) => {
      const cur = prev[num] || {};
      const arr = Array.isArray(cur.subs) ? [...cur.subs] : [];
      arr.splice(idx, 1);
      return { ...prev, [num]: { ...cur, subs: arr } };
    });
  };
  const updateSubName = (num, idx, name) => {
    setZones((prev) => {
      const cur = prev[num] || {};
      const arr = Array.isArray(cur.subs) ? [...cur.subs] : [];
      if (!arr[idx]) return prev;
      arr[idx] = { ...arr[idx], name };
      return { ...prev, [num]: { ...cur, subs: arr } };
    });
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3 max-h-[92vh] overflow-y-auto"
        style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <div className="text-sm font-bold" style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
            🎪 행사 주요 구역 좌표
          </div>
          <button onClick={onClose} className="text-slate-400 text-lg leading-none px-1">×</button>
        </div>
        <div className="text-[10px] text-slate-500">
          번호(주황/녹) 마커는 구역 중심, 흰색 작은 마커는 세부장소입니다. 드래그로 이동, 아래 목록에서 추가/삭제·이름 편집. 저장 시 Firebase /zones에 업로드.
        </div>
        <div ref={elRef} style={{ width: "100%", height: 360, borderRadius: 10, overflow: "hidden", border: "1px solid #3a3f54" }} />
        <div className="grid grid-cols-1 gap-1">
          {FESTIVAL_ZONES.map((z) => {
            const c = z.num % 2 ? "#fb923c" : "#22d65f";
            const v = zones[z.num] || { lat: 0, lng: 0, rA: 80, rB: 80, rot: 0 };
            const update = (key, val) => {
              // 빈 문자열도 그대로 저장 (지웠다가 다시 입력하는 동안 허용)
              if (val === "") { setZones((prev) => ({ ...prev, [z.num]: { ...prev[z.num], [key]: "" } })); return; }
              const n = parseFloat(val); if (Number.isNaN(n)) return;
              setZones((prev) => ({ ...prev, [z.num]: { ...prev[z.num], [key]: n } }));
            };
            const commitDefault = (key, def) => {
              setZones((prev) => {
                const cur = prev[z.num] || {};
                if (cur[key] === "" || cur[key] == null) return { ...prev, [z.num]: { ...cur, [key]: def } };
                return prev;
              });
            };
            return (
              <div key={z.num} className="p-2 rounded-lg" style={{ background: "rgba(255,255,255,0.04)", border: "1px solid #2c3142" }}>
                <div className="flex items-center gap-2 mb-1">
                  <span style={{ width: 20, height: 20, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                    background: c, color: "#0a0b0f", borderRadius: 5, fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 11 }}>{z.num}</span>
                  <span className="truncate text-[11px]" style={{ flex: 1, color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }}>{z.title}</span>
                  <span className="text-[9px]" style={{ color: "#94a3b8", fontFamily: "'IBM Plex Mono', monospace" }}>{v.lat.toFixed(5)}, {v.lng.toFixed(5)}</span>
                </div>
                <div className="flex items-center gap-1 text-[10px]" style={{ color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }}>
                  <span style={{ width: 24, color: "#94a3b8" }}>가로</span>
                  <input type="number" min="10" step="10" value={v.rA ?? ""} onChange={(e) => update("rA", e.target.value)} onBlur={() => commitDefault("rA", 80)}
                    className="w-14 px-1 py-0.5 rounded" style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
                  <span style={{ color: "#64748b" }}>m</span>
                  <span style={{ width: 24, color: "#94a3b8", marginLeft: 6 }}>세로</span>
                  <input type="number" min="10" step="10" value={v.rB ?? ""} onChange={(e) => update("rB", e.target.value)} onBlur={() => commitDefault("rB", 80)}
                    className="w-14 px-1 py-0.5 rounded" style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
                  <span style={{ color: "#64748b" }}>m</span>
                  <span style={{ width: 24, color: "#94a3b8", marginLeft: 6 }}>회전</span>
                  <input type="number" min="0" max="180" step="5" value={v.rot ?? ""} onChange={(e) => update("rot", e.target.value)} onBlur={() => commitDefault("rot", 0)}
                    className="w-12 px-1 py-0.5 rounded" style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
                  <span style={{ color: "#64748b" }}>°</span>
                </div>
                <div className="mt-2 pt-1.5" style={{ borderTop: "1px dashed #2c3142" }}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[10px]" style={{ color: "#94a3b8", fontFamily: "'Jua', sans-serif" }}>세부장소 ({(v.subs || []).length})</span>
                    <button onClick={() => addSub(z.num)} className="text-[10px] px-2 py-0.5 rounded font-bold"
                      style={{ background: "rgba(251,191,36,0.15)", color: "#fbbf24", border: "1px solid rgba(251,191,36,0.4)", fontFamily: "'Jua', sans-serif" }}>
                      + 추가
                    </button>
                  </div>
                  {(v.subs || []).map((s, i) => (
                    <div key={i} className="flex items-center gap-1 mb-1">
                      <span className="text-[9px]" style={{ width: 14, textAlign: "center", color: c, fontFamily: "'Jua', sans-serif" }}>{i + 1}</span>
                      <input type="text" value={s.name || ""} onChange={(e) => updateSubName(z.num, i, e.target.value)} placeholder="장소명"
                        className="flex-1 px-1.5 py-0.5 rounded text-[10px]"
                        style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'Jua', sans-serif" }} />
                      <span className="text-[9px]" style={{ color: "#64748b", fontFamily: "'IBM Plex Mono', monospace", whiteSpace: "nowrap" }}>
                        {typeof s.lat === "number" ? s.lat.toFixed(5) : "-"},{typeof s.lng === "number" ? s.lng.toFixed(5) : "-"}
                      </span>
                      <button onClick={() => removeSub(z.num, i)} className="text-[10px] leading-none px-1.5 py-0.5 rounded font-bold"
                        style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)", fontFamily: "'Jua', sans-serif" }} title="삭제">
                        ×
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
        {msg && <div className="text-[11px]" style={{ color: msg.startsWith("✅") ? "#22d65f" : msg.startsWith("⚠") ? "#fca5a5" : "#fbbf24" }}>{msg}</div>}
        <div className="grid grid-cols-2 gap-2">
          <button onClick={resetToDefaults}
            className="px-3 py-2 rounded-lg text-xs font-bold"
            style={{ background: "rgba(239,68,68,0.12)", color: "#fca5a5", border: "1px solid rgba(239,68,68,0.3)", fontFamily: "'Jua', sans-serif" }}>
            기본값 복원
          </button>
          <button onClick={save}
            className="px-3 py-2 rounded-lg text-xs font-bold"
            style={{ background: "#fbbf24", color: "#0a0b0f", fontFamily: "'Jua', sans-serif" }}>
            저장
          </button>
        </div>
      </div>
    </div>
  );
}

/* 경유점 편집기 — 운영자 전용. 클릭하면 가장 가까운 구간의 도착 정류장 approachVia 끝에 추가. via 마커 탭하여 제거. */
function ViaEditor({ onClose, dbUrl, getAuth }) {
  const elRef = useRef(null), mapRef = useRef(null);
  const [viaMap, setViaMap] = useState(() => LS.getJSON("viapoints", {}));
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | local | syncing | synced | error
  const layersRef = useRef({ lines: [], stops: [], vias: [] });
  const isFirstRef = useRef(true);

  // 열릴 때 Firebase 최신값 가져와서 화면에 반영 (운영자 동기화)
  useEffect(() => {
    if (!dbUrl) return;
    fetch(`${dbUrl.replace(/\/+$/, "")}/viapoints.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => { if (d && typeof d === "object" && !Array.isArray(d)) { isFirstRef.current = true; setViaMap(d); LS.setJSON("viapoints", d); } })
      .catch(() => {});
  }, [dbUrl]);

  /* 방향별 시퀀스: [{kind:'stop'|'via', dir, stopName?, stopKey?, coord}] */
  const buildSeq = (dir) => {
    const stops = ROUTES[dir].stops.filter((s) => s.lat != null);
    const seq = [];
    stops.forEach((s, i) => {
      if (i > 0) {
        const key = `${dir}|${s.name}`;
        const via = key in viaMap ? viaMap[key] : (Array.isArray(s.approachVia) ? s.approachVia : []);
        via.forEach((v) => seq.push({ kind: "via", dir, stopKey: key, coord: v }));
      }
      seq.push({ kind: "stop", dir, stopName: s.name, coord: [s.lat, s.lng] });
    });
    return seq;
  };

  // 최초 맵 초기화 (의존성 없음 — 한 번만)
  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const L = window.L;
    const map = L.map(elRef.current, { zoomControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    const allCoords = [];
    ["outbound", "inbound"].forEach((dir) => ROUTES[dir].stops.forEach((s) => { if (s.lat != null) allCoords.push([s.lat, s.lng]); }));
    if (allCoords.length) map.fitBounds(allCoords, { padding: [80, 30] });
    else map.setView([35.135, 126.94], 14);

    // 클릭으로 경유점 추가 — 가장 가까운 구간의 도착 정류장에 append
    map.on("click", (e) => {
      const click = [e.latlng.lat, e.latlng.lng];
      let best = null;
      ["outbound", "inbound"].forEach((dir) => {
        const stops = ROUTES[dir].stops.filter((s) => s.lat != null);
        for (let i = 0; i < stops.length - 1; i++) {
          const a = [stops[i].lat, stops[i].lng];
          const b = [stops[i + 1].lat, stops[i + 1].lng];
          const d = pointSegDist(click, a, b);
          if (!best || d < best.d) best = { d, dir, toName: stops[i + 1].name };
        }
      });
      if (!best) return;
      const key = `${best.dir}|${best.toName}`;
      setViaMap((prev) => {
        const cur = key in prev ? prev[key] : (ROUTES[best.dir].stops.find((s) => s.name === best.toName)?.approachVia || []);
        return { ...prev, [key]: [...cur, click] };
      });
    });

    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // viaMap 변경 시 마커/선 재그리기 (직선 폴리라인 + 정류장/경유점 마커)
  useEffect(() => {
    const map = mapRef.current; if (!map) return;
    const L = window.L;
    layersRef.current.lines.forEach((l) => map.removeLayer(l)); layersRef.current.lines = [];
    if (layersRef.current.roads) Object.values(layersRef.current.roads).forEach((l) => l && map.removeLayer(l));
    layersRef.current.roads = {};
    layersRef.current.stops.forEach((l) => map.removeLayer(l)); layersRef.current.stops = [];
    layersRef.current.vias.forEach((l) => map.removeLayer(l)); layersRef.current.vias = [];

    ["outbound", "inbound"].forEach((dir) => {
      const color = dir === "outbound" ? FT.orange : FT.teal;
      const seq = buildSeq(dir);
      const lineCoords = seq.map((p) => p.coord);
      if (lineCoords.length >= 2) {
        // 직선 가이드(연하게) — OSRM 도착 전에도 시퀀스를 확인할 수 있게
        const line = L.polyline(lineCoords, { color, weight: 3, opacity: 0.35, dashArray: "4,6", lineCap: "round" }).addTo(map);
        layersRef.current.lines.push(line);
        // OSRM 도로 미리보기 — 승객 지도에 보일 실제 경로
        const path = lineCoords.map(([la, ln]) => `${ln},${la}`).join(";");
        fetch(`https://router.project-osrm.org/route/v1/driving/${path}?overview=full&geometries=geojson&continue_straight=false`)
          .then((r) => r.ok ? r.json() : null)
          .then((d) => {
            if (!d || d.code !== "Ok" || !d.routes || !d.routes[0]) return;
            const road = d.routes[0].geometry.coordinates.map(([ln, la]) => [la, ln]);
            if (layersRef.current.roads[dir]) map.removeLayer(layersRef.current.roads[dir]);
            layersRef.current.roads[dir] = L.polyline(road, { color, weight: 5, opacity: 0.9, dashArray: dir === "inbound" ? "10,8" : null, lineCap: "round", lineJoin: "round" }).addTo(map);
          })
          .catch(() => {});
      }
      seq.forEach((p) => {
        if (p.kind === "stop") {
          const shared = SHARED_STOPS.has(p.stopName);
          const m = L.circleMarker(p.coord, {
              radius: 6,
              color: shared ? FT.ink : color,
              fillColor: "#fff", fillOpacity: 1,
              weight: shared ? 2 : 2.5,
            })
            .addTo(map).bindTooltip(shared ? p.stopName : `${p.stopName} (${dir === "outbound" ? "축제장행" : "민주광장행"})`, { direction: "top" });
          layersRef.current.stops.push(m);
        } else {
          const icon = L.divIcon({
            className: "",
            html: `<div style="background:${color};color:#fff;border:2px solid ${FT.ink};border-radius:6px;padding:1px 7px;font-family:'Jua',sans-serif;font-size:11px;font-weight:700;cursor:move;box-shadow:1.5px 1.5px 0 ${FT.ink};white-space:nowrap;">⠿ via ×</div>`,
            iconSize: [56, 22], iconAnchor: [28, 11],
          });
          const m = L.marker(p.coord, { icon, draggable: true, autoPan: true }).addTo(map);
          // 드래그 종료 시 해당 경유점 좌표 갱신
          m.on("dragend", (e) => {
            const ll = e.target.getLatLng();
            const newCoord = [ll.lat, ll.lng];
            setViaMap((prev) => {
              const cur = p.stopKey in prev ? prev[p.stopKey] : (ROUTES[p.dir].stops.find((s) => `${p.dir}|${s.name}` === p.stopKey)?.approachVia || []);
              const idx = cur.findIndex((c) => c[0] === p.coord[0] && c[1] === p.coord[1]);
              if (idx < 0) return prev;
              const list = cur.slice();
              list[idx] = newCoord;
              return { ...prev, [p.stopKey]: list };
            });
          });
          // 단순 탭(드래그 없는 클릭)은 제거
          m.on("click", (e) => {
            if (e.originalEvent) { e.originalEvent.stopPropagation(); }
            setViaMap((prev) => {
              const cur = p.stopKey in prev ? prev[p.stopKey] : (ROUTES[p.dir].stops.find((s) => `${p.dir}|${s.name}` === p.stopKey)?.approachVia || []);
              const list = cur.filter((c) => !(c[0] === p.coord[0] && c[1] === p.coord[1]));
              return { ...prev, [p.stopKey]: list };
            });
          });
          layersRef.current.vias.push(m);
        }
      });
    });
  }, [viaMap]);

  // 자체 로그인(앱 토큰 없을 때 저장된 자격증명으로 시도)
  const editorTokenRef = useRef("");
  const ensureToken = async () => {
    const ext = getAuth ? getAuth() : "";
    if (ext) return ext;
    if (editorTokenRef.current) return editorTokenRef.current;
    const key = LS.get("apikey", SHARE_API_KEY);
    const email = LS.get("driveremail", "");
    const pass = LS.get("driverpass", "");
    if (!key || !email || !pass) return "";
    try {
      const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${key}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: pass, returnSecureToken: true }),
      });
      const d = await r.json();
      if (d.idToken) { editorTokenRef.current = d.idToken; return d.idToken; }
    } catch (_) {}
    return "";
  };

  const [syncDetail, setSyncDetail] = useState("");
  const pushNow = async () => {
    if (!dbUrl) { setSyncStatus("local"); setSyncDetail("DB 주소가 없음"); return; }
    setSyncStatus("syncing"); setSyncDetail("");
    const auth = await ensureToken();
    if (!auth) { setSyncStatus("local"); setSyncDetail("로그인 정보(이메일/비밀번호/API 키)가 없거나 로그인 실패"); return; }
    try {
      const r = await fetch(`${dbUrl.replace(/\/+$/, "")}/viapoints.json?auth=${encodeURIComponent(auth)}`, {
        method: "PUT", body: JSON.stringify(viaMap),
      });
      if (r.ok) { setSyncStatus("synced"); setSyncDetail(""); }
      else {
        const t = await r.text().catch(() => "");
        setSyncStatus("error");
        setSyncDetail(t && t.length < 200 ? t : `HTTP ${r.status} — Firebase 규칙에서 viapoints 쓰기 권한을 확인하세요`);
      }
    } catch (e) { setSyncStatus("error"); setSyncDetail("네트워크 오류"); }
  };

  // 변경 시 로컬 저장 + 자동 업로드
  useEffect(() => {
    LS.setJSON("viapoints", viaMap);
    if (isFirstRef.current) { isFirstRef.current = false; return; }
    pushNow();
  }, [viaMap]);

  const totalVia = Object.values(viaMap).reduce((n, v) => n + (Array.isArray(v) ? v.length : 0), 0);
  const syncLabel = { idle: "", local: "로컬만 저장됨 — 로그인 정보 확인 필요", syncing: "동기화 중…", synced: "✅ 모든 승객에게 반영됨", error: "❌ 업로드 실패" }[syncStatus];
  const syncColor = syncStatus === "synced" ? FT.teal : syncStatus === "error" ? "#dc2626" : syncStatus === "local" ? FT.orange : FT.inkSoft;

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 2000, background: "#000" }}>
      <div ref={elRef} style={{ width: "100%", height: "100%" }} />
      <div style={{ position: "absolute", top: 10, left: 10, right: 10, zIndex: 2100,
        display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
        <div style={{ background: "#fff", color: FT.ink, padding: "8px 12px", borderRadius: 10,
          border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, lineHeight: 1.4,
          boxShadow: "3px 3px 0 " + FT.ink, fontWeight: 700, maxWidth: "70%" }}>
          경유점 편집 · 빈 곳 클릭=추가 · via 드래그=이동 · via 탭=제거 <span style={{ color: FT.orange }}>(현재 {totalVia}개)</span>
          {syncLabel ? <div style={{ marginTop: 4, fontSize: 11, color: syncColor, fontWeight: 700 }}>{syncLabel}</div> : null}
          {syncDetail ? <div style={{ marginTop: 2, fontSize: 10, color: FT.inkSoft, fontWeight: 400 }}>{syncDetail}</div> : null}
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={pushNow}
            style={{ background: FT.teal, color: "#fff", padding: "8px 12px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, boxShadow: "2px 2px 0 " + FT.ink, fontWeight: 700 }}>지금 반영</button>
          <button onClick={() => { if (window.confirm("저장된 모든 경유점을 초기화할까요? (코드 기본값으로 복귀)")) setViaMap({}); }}
            style={{ background: "#fff", color: FT.ink, padding: "8px 12px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, boxShadow: "2px 2px 0 " + FT.ink, fontWeight: 700 }}>초기화</button>
          <button onClick={onClose}
            style={{ background: FT.orange, color: "#fff", padding: "8px 14px", borderRadius: 10,
              border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 12, boxShadow: "2px 2px 0 " + FT.ink, fontWeight: 700 }}>닫기</button>
        </div>
      </div>
    </div>
  );
}

/* 승객용 실시간 위치 지도 — ?view=map&db=<DB주소> 로 진입. Firebase RTDB REST 폴링 */
function LiveMapView({ dbUrl, onHome }) {
  const elRef = useRef(null), mapRef = useRef(null), markersRef = useRef({}), schedMarkersRef = useRef({});
  const [count, setCount] = useState(0);
  const [status, setStatus] = useState("연결 중…");
  const [viaOverride, setViaOverride] = useState(() => LS.getJSON("viapoints", {}));
  const [coordOverride, setCoordOverride] = useState(() => LS.getJSON("coords", {}));
  const [zoneOverride, setZoneOverride] = useState(() => LS.getJSON("zones", {}));
  /* 진행 중 프로그램 재계산 트리거 — 1분마다 tick */
  const [_zoneTick, _setZoneTick] = useState(0);
  useEffect(() => { const id = setInterval(() => _setZoneTick((t) => t + 1), 60000); return () => clearInterval(id); }, []);
  const lineRefsRef = useRef({});
  const osrmPolyRef = useRef({}); // { [dir]: [[lat,lng], ...] } — 마커 노선 스냅에 사용
  const stopLayersRef = useRef([]);
  const zoneLayersRef = useRef([]);
  const hasFitRef = useRef(false);

  // 좌표 lookup — override(공유 키) 우선, 없으면 ROUTES 기본값
  const getCoord = (dir, s) => {
    const k = SHARED_STOPS.has(s.name) ? s.name : `${dir}|${s.name}`;
    const o = coordOverride[k];
    if (o && typeof o.lat === "number") return [o.lat, o.lng];
    if (s.lat != null) return [s.lat, s.lng];
    return null;
  };

  // 지도 초기화 (한 번) + 행사장 지도 이미지 오버레이(토글 가능)
  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const L = window.L;
    // 줌 컨트롤을 우하단으로 이동 — 좌상단 '← 무등생각 지도' 버튼 / 우상단 운행 칩과 충돌 회피
    const map = L.map(elRef.current, { zoomControl: false });
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    // P1-6: 명시적 pane 분리 — 아래에서 위로 zone(390) → route(395) → stops(400 기본) → markers(600 기본)
    map.createPane("zonePane"); map.getPane("zonePane").style.zIndex = 390;
    map.createPane("routePane"); map.getPane("routePane").style.zIndex = 395;
    map.setView([35.135, 126.94], 14);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // Firebase에서 viapoints + coords 가져오기 (운영자가 수정한 값)
  useEffect(() => {
    if (!dbUrl) return;
    const base = dbUrl.replace(/\/+$/, "");
    fetch(`${base}/viapoints.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => {
        if (d && typeof d === "object" && !Array.isArray(d)) { setViaOverride(d); LS.setJSON("viapoints", d); }
      })
      .catch(() => {});
    fetch(`${base}/coords.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => {
        if (!d || typeof d !== "object" || Array.isArray(d)) return;
        const clean = {};
        Object.entries(d).forEach(([k, v]) => {
          if (v && typeof v.lat === "number" && typeof v.lng === "number") clean[k] = { lat: v.lat, lng: v.lng };
        });
        if (Object.keys(clean).length) { setCoordOverride(clean); LS.setJSON("coords", { ...LS.getJSON("coords", {}), ...clean }); }
      })
      .catch(() => {});
    fetch(`${base}/zones.json`, { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => {
        if (!d || typeof d !== "object") return;
        const clean = {};
        Object.entries(d).forEach(([k, v]) => {
          if (v && typeof v.lat === "number" && typeof v.lng === "number") {
            const c = {
              lat: v.lat, lng: v.lng,
              rA: typeof v.rA === "number" ? v.rA : 80,
              rB: typeof v.rB === "number" ? v.rB : 80,
              rot: typeof v.rot === "number" ? v.rot : 0,
            };
            if (Array.isArray(v.subs)) {
              c.subs = v.subs
                .filter((s) => s && typeof s.lat === "number" && typeof s.lng === "number")
                .map((s) => ({ name: String(s.name || ""), lat: s.lat, lng: s.lng }));
            }
            clean[k] = c;
          }
        });
        if (Object.keys(clean).length) { setZoneOverride(clean); LS.setJSON("zones", clean); }
      })
      .catch(() => {});
  }, [dbUrl]);

  // 정류장 마커 + 노선 폴리라인 그리기/다시 그리기 — 좌표/경유점 오버라이드 변경 시 재계산
  useEffect(() => {
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    stopLayersRef.current.forEach((l) => map.removeLayer(l)); stopLayersRef.current = [];
    Object.values(lineRefsRef.current).forEach((layer) => layer && map.removeLayer(layer));
    lineRefsRef.current = {};
    const getVia = (dir, name) => {
      const k = `${dir}|${name}`;
      if (k in viaOverride) return viaOverride[k] || [];
      const s = ROUTES[dir].stops.find((x) => x.name === name);
      return s && Array.isArray(s.approachVia) ? s.approachVia : [];
    };
    const seenShared = new Set();
    const allCoords = [];
    // 정류장 팝업용 — 오늘 회차 수, 현재 시각
    const today = getNow();
    const tripsToday2 = today.getMonth() === 5 && today.getDate() === 14 ? 5 : ROUTES.outbound.trips.length;
    const nowMinNow2 = today.getHours() * 60 + today.getMinutes();
    const buildStopPopup = (stopName, sub, dirs) => {
      const sections = dirs.map((d) => {
        const route = ROUTES[d];
        const idx = route.stops.findIndex((x) => x.name === stopName);
        if (idx < 0) return "";
        const times = route.trips.slice(0, tripsToday2).map((t, i) => ({ trip: i + 1, time: t[idx] })).filter((x) => x.time);
        const nextTime = times.find((x) => toMin(x.time) >= nowMinNow2 - 1);
        const rows = times.map(({ trip, time }) => {
          const m = toMin(time);
          const past = m < nowMinNow2 - 1;
          const isNext = nextTime && nextTime.trip === trip;
          const style = past
            ? "color:#94a3b8;text-decoration:line-through"
            : isNext ? "color:#dc2626;font-weight:700" : "color:#101113";
          return `<div style="font-size:11px;${style};margin:1px 0">${trip}회차 · ${time}${isNext ? " ← 다음 도착" : ""}</div>`;
        }).join("");
        const dColor = d === "outbound" ? FT.orange : FT.teal;
        const dLabel = route.label;
        return `<div style="margin-top:6px"><div style="font-size:11px;color:${dColor};font-weight:700;margin-bottom:2px">● ${dLabel}</div>${rows}</div>`;
      }).join("");
      return `<div style="font-family:'Jua',sans-serif;max-width:240px"><b>${stopName}</b>`
        + (sub ? `<div style="color:#4A4E55;font-size:11px">${sub}</div>` : "")
        + sections
        + `</div>`;
    };
    ["outbound", "inbound"].forEach((dir) => {
      const dirColor = dir === "outbound" ? FT.orange : FT.teal;
      const dash = dir === "inbound" ? "10,8" : null;
      // 정류장 마커
      ROUTES[dir].stops.forEach((s) => {
        const c = getCoord(dir, s); if (!c) return;
        allCoords.push(c);
        if (SHARED_STOPS.has(s.name)) {
          if (seenShared.has(s.name)) return; seenShared.add(s.name);
          const m = L.circleMarker(c, { radius: 5, color: FT.ink, fillColor: "#fff", fillOpacity: 1, weight: 2 })
            .addTo(map).bindTooltip(s.name, { permanent: true, direction: "top", offset: [0, -4], className: "fest-stop" })
            .bindPopup(buildStopPopup(s.name, s.sub, ["outbound", "inbound"]));
          stopLayersRef.current.push(m);
        } else {
          // 축제장행(outbound) 라벨은 마커 아래, 민주광장행(inbound) 라벨은 마커 위 — 위치+색으로 방향 구분
          const m = L.circleMarker(c, { radius: 5, color: dirColor, fillColor: "#fff", fillOpacity: 1, weight: 2.5 })
            .addTo(map).bindTooltip(s.name, { permanent: true,
              direction: dir === "outbound" ? "bottom" : "top",
              offset: [0, dir === "outbound" ? 4 : -4],
              className: `fest-stop ${dir === "outbound" ? "dir-out" : "dir-in"}` })
            .bindPopup(buildStopPopup(s.name, s.sub, [dir]));
          stopLayersRef.current.push(m);
        }
      });
      // 폴리라인
      const stopsWithCoord = ROUTES[dir].stops.map((s) => ({ s, c: getCoord(dir, s) })).filter((x) => x.c);
      if (stopsWithCoord.length < 2) return;
      const stopCoords = stopsWithCoord.map((x) => x.c);
      const routePts = [];
      stopsWithCoord.forEach(({ s, c }, i) => {
        if (i > 0) getVia(dir, s.name).forEach((v) => routePts.push(v));
        routePts.push(c);
      });
      lineRefsRef.current[dir] = L.polyline(stopCoords, { pane: "routePane", color: dirColor, weight: 5, opacity: 0.45, dashArray: dash, lineCap: "round", lineJoin: "round" }).addTo(map);
      const path = routePts.map(([la, ln]) => `${ln},${la}`).join(";");
      // P0-4: OSRM 결과 localStorage 캐시(path 해시 기준) — OSRM 장애·rate-limit 시 즉시 노선 표시
      const cacheKey = `osrm:${dir}:${path}`;
      const drawRoad = (road) => {
        if (lineRefsRef.current[dir]) map.removeLayer(lineRefsRef.current[dir]);
        lineRefsRef.current[dir] = L.polyline(road, { pane: "routePane", color: dirColor, weight: 5, opacity: 0.85, dashArray: dash, lineCap: "round", lineJoin: "round" }).addTo(map);
        osrmPolyRef.current[dir] = road; // 마커 곡선 스냅용
      };
      const cached = LS.getJSON(cacheKey, null);
      if (Array.isArray(cached) && cached.length) drawRoad(cached); // 즉시 캐시로 그림
      fetch(`https://router.project-osrm.org/route/v1/driving/${path}?overview=full&geometries=geojson&continue_straight=false`)
        .then((r) => r.ok ? r.json() : null)
        .then((d) => {
          if (!d || d.code !== "Ok" || !d.routes || !d.routes[0]) return;
          const road = d.routes[0].geometry.coordinates.map(([ln, la]) => [la, ln]);
          LS.setJSON(cacheKey, road);
          drawRoad(road);
        })
        .catch(() => {});
    });
    if (!hasFitRef.current && allCoords.length) {
      map.fitBounds(allCoords, { padding: [80, 30] });
      hasFitRef.current = true;
    }
  }, [coordOverride, viaOverride]);

  /* 행사 주요 구역 마커 — 자체 effect (zoneOverride·_zoneTick 변경 시만 재계산, 노선 폴리라인은 건드리지 않음) */
  useEffect(() => {
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    zoneLayersRef.current.forEach((l) => map.removeLayer(l));
    zoneLayersRef.current = [];
    const today = getNow();
    const isToday = today.getMonth() === 5 && (today.getDate() === 13 || today.getDate() === 14);
    // 행사 기간이면 그날의 일정, 아니면 day1을 기본 미리보기로
    const dayKey = (today.getMonth() === 5 && today.getDate() === 14) ? "day2" : "day1";
    const dayLabel = FESTIVAL_PROGRAM[dayKey]?.label || "";
    const nowMinNow = today.getHours() * 60 + today.getMinutes();
    const isLive = (item) => {
      if (!isToday) return false; // 행사 기간 외엔 라이브 강조 없음
      if (item.time === "상시") return true;
      const mm = item.time.match(/^(\d\d:\d\d)~(\d\d:\d\d)$/);
      if (!mm) return false;
      return toMin(mm[1]) <= nowMinNow && nowMinNow < toMin(mm[2]);
    };
    FESTIVAL_ZONES.forEach((z) => {
      const o = zoneOverride[z.num];
      const lat = o && typeof o.lat === "number" ? o.lat : z.lat;
      const lng = o && typeof o.lng === "number" ? o.lng : z.lng;
      const rA = o && typeof o.rA === "number" ? o.rA : (z.rA || 80);
      const rB = o && typeof o.rB === "number" ? o.rB : (z.rB || 80);
      const rot = o && typeof o.rot === "number" ? o.rot : (z.rot || 0);
      if (lat == null || lng == null) return;
      const c = z.num % 2 ? FT.orange : FT.teal;
      const zoneItems = (FESTIVAL_PROGRAM[dayKey]?.items || []).filter((it) => it.zone === z.num);
      const liveItems = isToday ? zoneItems.filter(isLive) : [];
      // 타원 영역 폴리곤
      if (rA > 0 && rB > 0) {
        const poly = L.polygon(ellipsePolygon(lat, lng, rA, rB, rot), {
          pane: "zonePane",
          color: c, weight: 2, opacity: 0.85, fillColor: c, fillOpacity: 0.18, lineCap: "round", lineJoin: "round",
        }).addTo(map);
        zoneLayersRef.current.push(poly);
      }
      const badge = liveItems.length > 0 ? `<span style="display:inline-flex;align-items:center;justify-content:center;min-width:14px;height:14px;border-radius:7px;background:#dc2626;color:#fff;font-size:9px;padding:0 4px;margin-left:3px">${liveItems.length}</span>` : "";
