                style={{ background: "rgba(251, 191, 36, 0.1)",
                  border: "1px solid rgba(251, 191, 36, 0.3)", color: "#fbbf24" }}>
                <SkipForward size={22} />
              </button>
            </div>
            {isAnnouncing && (
              <button onClick={stopAnnounce}
                className="px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5"
                style={{ background: "rgba(239,68,68,0.15)", color: "#fca5a5",
                  border: "1px solid rgba(239,68,68,0.4)", fontFamily: "'Jua', sans-serif" }}>
                <Pause size={12} /> 안내 정지
              </button>
            )}
          </div>

          {/* Bottom: 대기 큰 1차 버튼(C) + 보조 토글 row(H 13px) */}
          {/* 1차 액션 — 대기 ON/OFF: 운행 중 가장 자주 누르는 버튼이라 풀폭 강조 */}
          {sharing && (
            <button onClick={() => setManualWaiting((v) => !v)}
              className="mt-3 w-full flex items-center justify-center gap-2 px-4 rounded-2xl"
              style={{
                background: manualWaiting ? "linear-gradient(180deg, rgba(96,165,250,0.32) 0%, rgba(96,165,250,0.18) 100%)" : "linear-gradient(180deg, rgba(34,214,95,0.18) 0%, rgba(34,214,95,0.08) 100%)",
                color: manualWaiting ? "#60a5fa" : "#22d65f",
                border: `2px solid ${manualWaiting ? "rgba(96,165,250,0.5)" : "rgba(34, 214, 95, 0.35)"}`,
                fontFamily: "'Jua', sans-serif", fontWeight: 700, fontSize: 16,
                height: 56, boxShadow: manualWaiting ? "0 0 24px rgba(96,165,250,0.35)" : "none",
                transition: "all 0.18s",
              }}>
              {manualWaiting ? "🅿️ 대기 해제 (출발)" : "▶ 운행 중 — 탭하여 대기"}
            </button>
          )}
          {/* 본문 끝에 풋터 패널 높이만큼 공간 확보 — fixed 풋터가 콘텐츠를 가리지 않게 */}
          <div aria-hidden="true" style={{ height: bottomPanelOpen ? "calc(330px + env(safe-area-inset-bottom, 0px))" : "calc(56px + env(safe-area-inset-bottom, 0px))" }} />

          {/* 하단 고정 설정 패널 — 핸들 + 펼침 시 타일 그리드 */}
          <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 90,
            background: "linear-gradient(180deg, rgba(10,11,15,0.92) 0%, #0a0b0f 60%)",
            backdropFilter: "blur(6px)",
            borderTop: "1px solid #1c1f2b",
            paddingBottom: "env(safe-area-inset-bottom, 0px)",
            transition: "transform 0.18s",
          }}>
            <button onClick={() => setBottomPanelOpen((v) => !v)}
              aria-expanded={bottomPanelOpen}
              aria-label={bottomPanelOpen ? "설정 패널 숨기기" : "설정 패널 펼치기"}
              style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                padding: "10px 14px", background: "transparent", border: "none", cursor: "pointer",
                fontFamily: "'Jua', sans-serif", fontSize: 13, fontWeight: 700, color: "#94a3b8" }}>
              <span style={{ fontSize: 16, lineHeight: 1 }}>{bottomPanelOpen ? "▼" : "▲"}</span>
              <span>{bottomPanelOpen ? "설정 숨기기" : "설정 펼치기"}</span>
              <span style={{ fontSize: 10, color: "#475569", fontFamily: "'IBM Plex Mono', monospace", marginLeft: 8 }}>
                {currentIdx + 1}/{stops.length} · {tripsToday}회 · {BUILD}
              </span>
            </button>
            {bottomPanelOpen && (
            <div className="grid grid-cols-3 gap-3 px-3 pb-3">
            {(() => {
              const tileStyle = (active, color, off = "#94a3b8") => ({
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6,
                padding: "14px 10px 12px", borderRadius: 10, minHeight: 88,
                background: active ? color.bg : "rgba(100, 116, 139, 0.08)",
                color: active ? color.fg : off,
                border: `1.5px solid ${active ? color.border : "rgba(100,116,139,0.28)"}`,
                fontFamily: "'Jua', sans-serif", fontSize: 13, fontWeight: 700, lineHeight: 1.2, textAlign: "center",
                cursor: "pointer",
              });
              return (
                <>
                  <button onClick={() => {
                      if (permissionState === "denied") { setMode("advanced"); return; }
                      if (!autoMode) {
                        primeTTS();
                        if (timetableMode) setTimetableMode(false);
                        lastAnnounceRef.current = { idx: -1, at: 0 };
                      }
                      setAutoMode(!autoMode);
                    }}
                    className="op-tile"
                    style={tileStyle(autoMode, { bg: "rgba(34, 214, 95, 0.22)", bg2: "rgba(34, 214, 95, 0.08)", fg: "#22d65f", border: "rgba(34, 214, 95, 0.45)", shadow: "rgba(34,214,95,0.25)" })}>
                    <Navigation size={26} />
                    <span>GPS 자동</span>
                    <span style={{ fontSize: 10, opacity: 0.85, fontWeight: 400 }}>
                      {autoMode ? (userPos ? (gpsStale ? "신호 약함" : `${triggerRadius}m`) : "신호 대기") : "OFF"}
                    </span>
                  </button>
                  <button onClick={() => {
                      if (!timetableMode) {
                        primeTTS();
                        if (autoMode) setAutoMode(false);
                        lastAnnounceRef.current = { idx: -1, at: 0 };
                      }
                      setTimetableMode(!timetableMode);
                    }}
                    title="시간표 시각에 맞춰 자동으로 진행·안내"
                    className="op-tile"
                    style={tileStyle(timetableMode, { bg: "rgba(251,191,36,0.25)", bg2: "rgba(251,191,36,0.08)", fg: "#fbbf24", border: "rgba(251,191,36,0.5)", shadow: "rgba(251,191,36,0.25)" })}>
                    <Clock size={26} />
                    <span>시간표 자동</span>
                    <span style={{ fontSize: 10, opacity: 0.85, fontWeight: 400 }}>{timetableMode ? "ON" : "OFF"}</span>
                  </button>
                  <button onClick={toggleSharing}
                    className="op-tile"
                    style={tileStyle(sharing, { bg: "rgba(96,165,250,0.25)", bg2: "rgba(96,165,250,0.08)", fg: "#60a5fa", border: "rgba(96,165,250,0.45)", shadow: "rgba(96,165,250,0.25)" })}>
                    <span style={{ position: "relative", display: "inline-block", width: 26, height: 26 }}>
                      <span style={{ position: "absolute", inset: 0, borderRadius: "50%", border: "2.5px solid currentColor" }} />
                      <span className={sharing ? "absolute animate-pulse" : "absolute"}
                        style={{ width: 8, height: 8, borderRadius: "50%", background: sharing ? "#60a5fa" : "#64748b", top: "50%", left: "50%", transform: "translate(-50%, -50%)" }} />
                    </span>
                    <span>{sharing ? "공유" : "공유 OFF"}</span>
                    <span style={{ fontSize: 10, opacity: 0.85, fontWeight: 400 }}>
                      {sharing ? (locShare ? "위치+운행" : "운행만") : "—"}
                    </span>
                  </button>
                  {sharing && (
                    <button onClick={() => setLocShare((v) => !v)}
                      title={locShare ? "GPS 좌표 송신 중 — 끄면 운행 정보만" : "운행 정보만 송신 중 — 켜면 좌표도 송신"}
                      className="op-tile"
                      style={tileStyle(locShare, { bg: "rgba(96,165,250,0.25)", bg2: "rgba(96,165,250,0.08)", fg: "#60a5fa", border: "rgba(96,165,250,0.45)", shadow: "rgba(96,165,250,0.25)" })}>
                      <span style={{ fontSize: 28, lineHeight: 1 }}>📍</span>
                      <span>위치 송신</span>
                      <span style={{ fontSize: 10, opacity: 0.85, fontWeight: 400 }}>{locShare ? "ON" : "OFF"}</span>
                    </button>
                  )}
                  <button onClick={() => setShowTimetable(true)}
                    className="op-tile"
                    style={tileStyle(true, { bg: "rgba(251,191,36,0.10)", bg2: "rgba(251,191,36,0.03)", fg: "#fbbf24", border: "rgba(251,191,36,0.30)", shadow: "rgba(251,191,36,0.18)" })}>
                    <Clock size={26} />
                    <span>시간표</span>
                    <span style={{ fontSize: 10, opacity: 0.7, fontWeight: 400 }}>회차 표</span>
                  </button>
                  <button onClick={() => {
                      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
                      else document.exitFullscreen?.();
                    }}
                    className="op-tile"
                    style={tileStyle(true, { bg: "rgba(203,213,225,0.08)", bg2: "rgba(203,213,225,0.02)", fg: "#cbd5e1", border: "rgba(203,213,225,0.25)", shadow: "rgba(0,0,0,0.25)" })}>
                    <span style={{ fontSize: 28, lineHeight: 1 }}>⛶</span>
                    <span>전체화면</span>
                    <span style={{ fontSize: 10, opacity: 0.7, fontWeight: 400 }}>F</span>
                  </button>
                </>
              );
            })()}
            </div>
            )}
          </div>

          {showTimetable && <TimetableModal tripsToday={tripsToday} onClose={() => setShowTimetable(false)} />}
          {showStats && <StatsModal counts={counts} dateKey={dateKey} onClose={() => setShowStats(false)} onReset={resetCountsToday} busCapacity={busCapacity} setBusCapacity={setBusCapacity} countsEnabled={countsEnabled} setCountsEnabled={setCountsEnabled} />}
        </div>
      </div>
    );
  }

  /* ===== ADVANCED MODE — full controls (풀스크린 무카드) ===== */
  return (
    <div className="min-h-screen w-full flex flex-col items-stretch"
      style={{ background: "radial-gradient(ellipse at top, #1a1d29 0%, #0a0b10 60%, #050608 100%)" }}>
      {resetToastNode}
      <div className="w-full max-w-2xl mx-auto flex flex-col" style={{ flex: 1 }}>

        {/* Header */}
        <div className="relative px-5 py-4"
          style={{ background: "linear-gradient(180deg, #2d3142 0%, #1c1f2b 100%)", borderBottom: "1px solid #3a3f54" }}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-xl flex items-center justify-center shadow-lg"
                style={{ background: "linear-gradient(135deg, #f59e0b 0%, #d97706 100%)", color: "#fff",
                  fontFamily: "'Black Han Sans', sans-serif", fontSize: "1rem", lineHeight: 1,
                  boxShadow: "0 0 20px rgba(245, 158, 11, 0.4)" }}>
                셔틀
              </div>
              <div>
                <div className="text-[10px] text-amber-400/80 tracking-widest mb-0.5">제4회 무등산 인문축제</div>
                <div className="text-xl leading-none" style={{ color: "#fbbf24",
                  fontFamily: "'Black Han Sans', sans-serif", textShadow: "0 0 12px rgba(251, 191, 36, 0.4)" }}>
                  {route.label}
                </div>
              </div>
            </div>
            <div className="flex flex-col items-end gap-1">
              <div className="flex items-center gap-1.5">
                {autoMode && <Navigation2 size={11} className={userPos ? "" : "animate-pulse"}
                  style={{ color: userPos ? "#22d65f" : "#fbbf24" }} />}
                <div className={`w-2 h-2 rounded-full ${isAnnouncing ? "animate-pulse" : ""}`}
                  style={{ background: isAnnouncing ? "#ef4444" : "#475569" }} />
              </div>
              <span className="text-[10px] text-slate-500 tracking-wider">
                {isAnnouncing ? "ON AIR" : autoMode ? (userPos ? "GPS LOCKED" : "GPS …") : "STAND BY"}
              </span>
            </div>
          </div>

          {/* Direction swap */}
          <div className="mt-3 flex gap-2">
            <button onClick={() => setMode("simple")}
              className="px-3 py-2 rounded-lg flex items-center gap-1 text-xs"
              style={{ background: "rgba(100, 116, 139, 0.15)", border: "1px solid #3a3f54",
                color: "#94a3b8", fontFamily: "'Jua', sans-serif" }}>
              <ChevronLeft size={12} />
              운행
            </button>
            <button onClick={swapDirection}
              className="flex-1 px-3 py-2 rounded-lg flex items-center justify-center gap-2 text-xs transition-colors"
              style={{ background: "rgba(251, 191, 36, 0.1)", border: "1px solid rgba(251, 191, 36, 0.3)",
                color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
              <ArrowLeftRight size={12} />
              {route.full} · 방향 전환
            </button>
          </div>
        </div>

        {/* Trip selector */}
        <div className="px-5 py-3"
          style={{ background: "#13151c", borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54" }}>
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <Clock size={12} style={{ color: tripStatus.color }} />
              <span className="text-xs font-bold" style={{ color: tripStatus.color, fontFamily: "'Jua', sans-serif" }}>
                {tripIdx + 1}회차 · {trip[0]} 출발 · {trip[trip.length - 1]} 도착
              </span>
            </div>
            <span className="text-[10px] px-2 py-0.5 rounded-full"
              style={{ background: `${tripStatus.color}22`, color: tripStatus.color,
                fontFamily: "'IBM Plex Mono', monospace" }}>
              {tripStatus.label}
            </span>
          </div>
          <div className="text-[10px] text-slate-500 mb-1" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
            오늘 운행 {tripsToday}회차 {festivalDay === "auto" ? "(자동)" : festivalDay === "day2" ? "(6.14 일)" : "(6.13 토)"}
          </div>
          <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${tripsToday}, minmax(0, 1fr))` }}>
            {route.trips.slice(0, tripsToday).map((t, i) => (
              <button key={i} onClick={() => { setTripIdx(i); setCurrentIdx(0); announcedRef.current = new Set(); }}
                className="py-1.5 rounded text-[11px] font-bold transition-all"
                style={{
                  background: i === tripIdx ? "#fbbf24" : "rgba(251, 191, 36, 0.08)",
                  color: i === tripIdx ? "#0a0b0f" : "#fbbf24",
                  border: `1px solid ${i === tripIdx ? "#fbbf24" : "rgba(251, 191, 36, 0.2)"}`,
                  fontFamily: "'Jua', sans-serif"
                }}>
                {i + 1}회
              </button>
            ))}
          </div>
          <div className="mt-2 flex gap-1">
            <button onClick={selectLegByClock}
              title={timetableMode ? "시간표 자동 동기화 중 — 강제 1회 sync"
                : userPos ? "GPS 좌표로 시각·정류장 동시 보정"
                : "현재 시각 기준으로 회차 선택(GPS OFF — 정류장은 출발지)"}
              className="flex-1 py-1.5 rounded text-[11px] flex items-center justify-center gap-1"
              style={{ background: timetableMode ? "rgba(251,191,36,0.12)" : "rgba(100,116,139,0.12)",
                color: timetableMode ? "#fbbf24" : "#94a3b8",
                border: "1px solid " + (timetableMode ? "rgba(251,191,36,0.3)" : "#3a3f54"),
                fontFamily: "'Jua', sans-serif" }}>
              <Clock size={11} />
              {timetableMode
                ? "시간표 강제 sync"
                : userPos
                  ? "현재 시각·위치 기준 재설정"
                  : "현재 시각 기준 재설정"}
            </button>
            <button onClick={() => setShowTimetable(true)}
              className="flex-1 py-1.5 rounded text-[11px] flex items-center justify-center gap-1"
              style={{ background: "rgba(251,191,36,0.1)", color: "#fbbf24", border: "1px solid rgba(251,191,36,0.3)",

              🕘 시간표
            </button>

        <div className="px-5 py-6"

            <span className="text-[11px] tracking-[0.3em] px-3 py-1 rounded-full"
              style={{ color: "#fbbf24", background: "rgba(251, 191, 36, 0.1)",
                fontFamily: "'IBM Plex Mono', monospace" }}>
              이번 정류장 · {trip[currentIdx]}
            </span>

          <div className="text-center py-3">
            <div className="text-5xl font-black leading-tight break-keep"

            <div className="flex items-center justify-between">
              <div className="text-sm font-bold" style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
                {stops[editing.idx]?.name} 위치 설정
                <span className="text-[10px] text-slate-500 ml-2">{route.label}</span>
              </div>
              <button onClick={() => setEditing(null)} className="text-slate-400 hover:text-amber-400 text-lg leading-none px-1">×</button>
            </div>
            <div className="text-[11px] text-slate-500">지도를 탭하거나 핀을 끌어 위치를 지정하세요. <span style={{ color: "#22d65f" }}>초록 원</span>은 자동 안내가 시작되는 반경({triggerRadius}m)입니다.</div>
            <MapPicker lat={parseFloat(editing.lat) || 35.130} lng={parseFloat(editing.lng) || 126.940}
              radius={triggerRadius}
              onPick={(la, ln) => setEditing(e => ({ ...e, lat: la, lng: ln }))} />
            <div className="flex gap-2">
              <div className="flex-1">
                <label className="text-[10px] text-slate-400">위도(lat)</label>
                <input type="number" step="0.0001" value={editing.lat}
                  onChange={(e) => setEditing(p => ({ ...p, lat: e.target.value }))}
                  className="w-full px-2 py-1.5 rounded text-xs"
                  style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
              </div>
              <div className="flex-1">
                <label className="text-[10px] text-slate-400">경도(lng)</label>
                <input type="number" step="0.0001" value={editing.lng}
                  onChange={(e) => setEditing(p => ({ ...p, lng: e.target.value }))}
                  className="w-full px-2 py-1.5 rounded text-xs"
                  style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#cbd5e1", fontFamily: "'IBM Plex Mono', monospace" }} />
              </div>
            </div>
            <div className="flex gap-2 pt-1">
              {userPos && (
                <button onClick={() => setEditing(p => ({ ...p, lat: userPos.lat, lng: userPos.lng }))}
                  className="px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1"
                  style={{ background: "rgba(34, 214, 95, 0.15)", color: "#22d65f", border: "1px solid rgba(34, 214, 95, 0.3)" }}>
                  <Crosshair size={12} /> 현재 GPS
                </button>
              )}
              <button onClick={() => setEditing(null)}
                className="flex-1 px-3 py-2 rounded-lg text-xs"
                style={{ background: "rgba(100, 116, 139, 0.15)", color: "#94a3b8", border: "1px solid #3a3f54" }}>
                취소
              </button>
              <button onClick={saveCoordEditor}
                className="flex-1 px-3 py-2 rounded-lg text-xs font-bold"
                style={{ background: "#fbbf24", color: "#0a0b0f", fontFamily: "'Jua', sans-serif" }}>
                저장
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Intro() {
  return (
    <div className="boot">
      <img src="logo.png" alt="무등생각" />
      <div className="slogan">생각을 끄고, 생각을 켜다</div>
      <div className="who">제4회 동구 무등산 인문축제</div>
      <div className="accent">&lt;무등생각&gt; 셔틀버스 안내</div>
      <div className="dots"><span className="dot"></span><span className="dot"></span><span className="dot"></span></div>
    </div>
  );
}
function Root() {
  const params = new URLSearchParams(window.location.search);
  const [admin, setAdmin] = useState(params.get("admin") === "1");
  const [ready, setReady] = useState(false);
  useEffect(() => { const t = setTimeout(() => setReady(true), 2000); return () => clearTimeout(t); }, []);
  if (!ready) return <Intro />;
  // P2-3: ?view=ops — 운영자 본부 대시보드 (Intro 끝난 뒤 즉시 진입)
  if (params.get("view") === "ops") return <OpsDashboard dbUrl={params.get("db") || SHARE_DB} />;
  if (admin) return <App />;
  const initialTab = params.get("view") === "map" ? "map" : "list";
  return <PassengerView dbUrl={params.get("db") || SHARE_DB} onAdmin={() => setAdmin(true)} initialTab={initialTab} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
<script>
  /* P1-3: 지도 타일 캐시 서비스워커 등록 + 행사장 영역 z14~16 prefetch.
     이전 자폭 SW 가 설치돼 있어도 update 시점에 새 sw.js 로 교체됨.
     SW 는 *.tile.openstreetmap.org 만 cache-first 로 가로채므로 index.html 등은 항상 네트워크. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js")
        .then((reg) => {
          // 행사장 영역 z14~16 타일 prefetch — 24h 안에 한 번만, LTE 약전계 대비
          try {
            const PREFETCH_KEY = "shuttle:tilesPrefetchAt";
            const last = parseInt(localStorage.getItem(PREFETCH_KEY) || "0", 10);
            if (Date.now() - last < 24 * 3600 * 1000) return;
            const subdomains = ["a", "b", "c"];
            const bounds = { latMin: 35.125, latMax: 35.150, lngMin: 126.915, lngMax: 126.970 };
            const tileXY = (lat, lng, z) => {
              const n = Math.pow(2, z);
              const x = Math.floor((lng + 180) / 360 * n);
              const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);
              return { x, y };
            };
            const urls = [];
            for (const z of [14, 15, 16]) {
              const min = tileXY(bounds.latMax, bounds.lngMin, z);
              const max = tileXY(bounds.latMin, bounds.lngMax, z);
              for (let x = min.x; x <= max.x; x++) {
                for (let y = min.y; y <= max.y; y++) {
                  const s = subdomains[(x + y) % subdomains.length];
                  urls.push(`https://${s}.tile.openstreetmap.org/${z}/${x}/${y}.png`);
                }
              }
            }
            const send = () => {
              if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: "PREFETCH_TILES", urls });
                localStorage.setItem(PREFETCH_KEY, String(Date.now()));
              }
            };
            if (navigator.serviceWorker.controller) send();
            else navigator.serviceWorker.addEventListener("controllerchange", send, { once: true });
          } catch (_) {}
        })
        .catch(() => {});
    });
  }
</script>
