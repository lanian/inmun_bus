/* Geo helper */
function distanceMeters(a, b) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const lat1 = toRad(a.lat); const lat2 = toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

  return m === 0 ? `${h}시` : `${h}시 ${m}분`;
};

/* 승객 안내용 시각 표현 — "13:00" → "오후 1시", "10:20" → "오전 10시 20분" */
const spokenClock = (hm) => {
  let [h, m] = hm.split(":").map(Number);

  return m === 0 ? `${ampm} ${h12}시` : `${ampm} ${h12}시 ${m}분`;
};

/* 지정한 멘트 설정(m)의 schedule에서, 축제장 도착(예정) 시각 이후 시작분만 골라 안내 문구 생성.
   refMin: 기준 시각(분). 없으면 현재 시각 사용 */
const buildProgramText = (m, dayKey, refMin) => {
  const list = dayKey === "day1" ? m.schedule.day1
    : dayKey === "day2" ? m.schedule.day2 : null;
  if (!list) return m.defaultProgram;
  const d = new Date();
  const nowMin = typeof refMin === "number" ? refMin : d.getHours() * 60 + d.getMinutes();
  const intro = "잠시 후, 무등생각 축제장에 도착합니다. ";
  const upcoming = list.filter(p => toMin(p.t) >= nowMin);
  if (upcoming.length === 0) {
    return intro + "오늘 준비된 주요 프로그램은 대부분 마무리되었어요. 그래도 " + m.allday + " 무등산에서 천천히, 편안한 시간 보내세요.";
  }
  const shown = upcoming.slice(0, 6); // 안내가 길어지지 않도록 다가오는 6개까지만
  const items = shown.map(p => `${spokenClock(p.t)}에는 ${p.d}`).join(", ");
  const more = upcoming.length > shown.length ? " 이 외에도 더 많은 프로그램이 여러분을 기다리고 있어요." : "";
  return intro + "도착하시면, " + items + " 등 다양한 프로그램을 만나보실 수 있습니다." + more + " 그리고 " + m.allday + " 오늘 무등생각과 함께, 마음을 쉬어가는 하루 보내세요.";
};

/* localStorage helpers — survive across reloads */
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem("shuttle:" + k); return v == null ? d : v; } catch (_) { return d; } },
  getJSON: (k, d) => { try { const v = localStorage.getItem("shuttle:" + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set: (k, v) => { try { localStorage.setItem("shuttle:" + k, v); } catch (_) {} },
  setJSON: (k, v) => { try { localStorage.setItem("shuttle:" + k, JSON.stringify(v)); } catch (_) {} },
};

/* Leaflet map picker — click or drag pin to choose a coordinate.
   radius(m): 자동 안내 시작 반경을 원으로 표시 */
function MapPicker({ lat, lng, radius, onPick }) {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);
  const circleRef = useRef(null);

  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const map = window.L.map(elRef.current).setView([lat, lng], 16);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap",
    }).addTo(map);
    const icon = window.L.icon({
      iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
      iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
      shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
      iconSize: [25, 41], iconAnchor: [12, 41],
    });
    const circle = window.L.circle([lat, lng], {
      radius: radius || 150, color: "#22d65f", weight: 1.5,
      fillColor: "#22d65f", fillOpacity: 0.12,
    }).addTo(map);
    const marker = window.L.marker([lat, lng], { draggable: true, icon }).addTo(map);
    const move = (la, ln) => { circle.setLatLng([la, ln]); onPick(la, ln); };
    marker.on("dragend", () => { const p = marker.getLatLng(); move(p.lat, p.lng); });
    map.on("click", (e) => { marker.setLatLng(e.latlng); move(e.latlng.lat, e.latlng.lng); });
    mapRef.current = map; markerRef.current = marker; circleRef.current = circle;
    setTimeout(() => map.invalidateSize(), 80);
    return () => { map.remove(); mapRef.current = null; markerRef.current = null; circleRef.current = null; };
  }, []);

  // Sync external (manual-input) coordinate changes onto the map
  useEffect(() => {
    if (!markerRef.current || !mapRef.current) return;
    const c = markerRef.current.getLatLng();
    if (Math.abs(c.lat - lat) > 1e-7 || Math.abs(c.lng - lng) > 1e-7) {
      markerRef.current.setLatLng([lat, lng]);
      circleRef.current?.setLatLng([lat, lng]);
      mapRef.current.panTo([lat, lng]);
    }
  }, [lat, lng]);

  // 반경 변경 시 원 갱신
  useEffect(() => {
    if (circleRef.current && radius) circleRef.current.setRadius(radius);
  }, [radius]);

  if (!window.L) {
    return (
      <div className="text-xs text-center py-6 rounded-lg"
        style={{ background: "#0a0b0f", border: "1px solid #3a3f54", color: "#fca5a5" }}>
        지도를 불러올 수 없습니다 (네트워크 확인). 아래 좌표 입력은 사용할 수 있어요.
      </div>
    );
  }
  return <div ref={elRef} style={{ width: "100%", height: "260px", borderRadius: "12px", overflow: "hidden" }} />;
}

function TimetableModal({ tripsToday, onClose }) {
  const now = new Date();

  // 하루 전체에서 현재 운행 중(또는 다음) 회차 1개 계산
  const all = [];
  ["outbound", "inbound"].forEach((dir) => ROUTES[dir].trips.forEach((t, i) => {
    if (i < tripsToday) all.push({ dir, idx: i, dep: toMin(t[0]), arr: toMin(t[t.length - 1]) });
  }));
  all.sort((a, b) => a.dep - b.dep);
  const running = all.find((l) => nowMin >= l.dep && nowMin <= l.arr + 40);
  const active = running || all.find((l) => l.dep > nowMin) || null;
  const activeState = running ? "운행 중" : "다음";

    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: "rgba(0,0,0,0.8)" }} onClick={onClose}>
      <div className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3 max-h-[85vh] overflow-y-auto"
        style={{ background: "#13151c", borderColor: "#3a3f54" }} onClick={(e) => e.stopPropagation()}>

          <button onClick={onClose} className="text-slate-400 hover:text-amber-400 text-lg leading-none px-1">×</button>
        </div>
        {active && (
          <div className="text-[11px]" style={{ color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
            지금 {activeState}: {ROUTES[active.dir].label} {active.idx + 1}회차 ({ROUTES[active.dir].trips[active.idx][0]} 출발)
          </div>
        )}
        {["outbound", "inbound"].map((dir) => (
          <div key={dir} className="space-y-1">
            <div className="text-xs font-bold" style={{ color: dir === "outbound" ? "#fbbf24" : "#22d65f", fontFamily: "'Jua', sans-serif" }}>
              {ROUTES[dir].label} · {ROUTES[dir].full}
            </div>
            <div className="overflow-x-auto rounded-lg" style={{ border: "1px solid #3a3f54" }}>
              <table className="text-[10px]" style={{ borderCollapse: "collapse", fontFamily: "'IBM Plex Mono', monospace" }}>
                <thead>
                  <tr style={{ background: "#0a0b0f" }}>
                    <th className="px-2 py-1 text-slate-500 whitespace-nowrap" style={{ position: "sticky", left: 0, background: "#0a0b0f" }}>회차</th>
                    {ROUTES[dir].stops.map((s, i) => (
                      <th key={i} className="px-2 py-1 text-slate-300 whitespace-nowrap text-center">{s.name}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {ROUTES[dir].trips.slice(0, tripsToday).map((t, ti) => {
                    const isActive = active && active.dir === dir && active.idx === ti;
                    const rowBg = isActive ? "rgba(34,214,95,0.16)" : "transparent";
                    return (
                    <tr key={ti} style={{ borderTop: "1px solid #23283a", background: rowBg }}>
                      <td className="px-2 py-1 font-bold whitespace-nowrap"
                        style={{ color: isActive ? "#22d65f" : "#fbbf24", position: "sticky", left: 0, background: isActive ? "#13301f" : "#13151c" }}>
                        {isActive ? "▶ " : ""}{ti + 1}회
                      </td>
                      {t.map((time, si) => (
                        <td key={si} className="px-2 py-1 text-center whitespace-nowrap"
                          style={{ color: isActive ? "#bbf7d0" : (si === 0 || si === t.length - 1 ? "#e2e8f0" : "#94a3b8") }}>{time}</td>
                      ))}
                    </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        ))}
        <div className="text-[10px] text-slate-500 leading-relaxed">
          ※ 6.13.(토) 1~6회차 · 6.14.(일) 1~5회차 운영 · 축제장에서 약 15분 휴식 후 회차 전환
        </div>

/* 승객용 실시간 위치 지도 — ?view=map&db=<DB주소> 로 진입. Firebase RTDB REST 폴링 */
function LiveMapView({ dbUrl }) {
  const elRef = useRef(null), mapRef = useRef(null), markersRef = useRef({});
  const [status, setStatus] = useState("연결 중…");
  useEffect(() => {
    if (!window.L || !elRef.current || mapRef.current) return;
    const map = window.L.map(elRef.current).setView([35.135, 126.94], 14);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    const seen = new Set();
    ["outbound", "inbound"].forEach((dir) => ROUTES[dir].stops.forEach((s) => {
      if (seen.has(s.name) || s.lat == null) return; seen.add(s.name);
      window.L.circleMarker([s.lat, s.lng], { radius: 4, color: "#fbbf24", fillColor: "#fbbf24", fillOpacity: 0.8, weight: 1 })
        .addTo(map).bindTooltip(s.name, { direction: "top" });
    }));
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
    return () => { map.remove(); mapRef.current = null; };
  }, []);
  useEffect(() => {
    if (!dbUrl) { setStatus("공유 주소(db)가 없습니다"); return; }
    let stopped = false;
    const base = dbUrl.replace(/\/+$/, "");
    const poll = async () => {
      try {
        const r = await fetch(`${base}/buses.json`, { cache: "no-store" });
        const data = await r.json();
        const map = mapRef.current; if (!map) return;
        const now = Date.now(); let count = 0;
        Object.entries(data || {}).forEach(([id, b]) => {
          if (!b || b.lat == null || (b.ts && now - b.ts > 60000)) return; // 60초 이상 미갱신 숨김
          count++;
          const label = `${id}호차 · ${b.dir === "inbound" ? "민주광장 방향" : "축제장 방향"} ${b.trip || ""}회차`;
          let m = markersRef.current[id];
          if (!m) {
            const icon = window.L.divIcon({ className: "", html: '<div style="font-size:26px;line-height:1">🚌</div>', iconSize: [30, 30], iconAnchor: [15, 15] });
            m = window.L.marker([b.lat, b.lng], { icon }).addTo(map);
            markersRef.current[id] = m;
          } else m.setLatLng([b.lat, b.lng]);
          m.bindTooltip(label, { permanent: true, direction: "top", offset: [0, -14] });
        });
        Object.keys(markersRef.current).forEach((id) => {
          const b = data && data[id];
          if (!b || (b.ts && now - b.ts > 60000)) { map.removeLayer(markersRef.current[id]); delete markersRef.current[id]; }
        });
        setStatus(count > 0 ? `운행 중 셔틀 ${count}대 · 실시간` : "운행 중인 셔틀이 없습니다");
      } catch (_) { setStatus("연결 오류 — 잠시 후 다시 시도합니다"); }
    };
    poll();
    const id = setInterval(() => { if (!stopped) poll(); }, 4000);
    return () => { stopped = true; clearInterval(id); };
  }, [dbUrl]);
  return (
    <div style={{ position: "relative" }}>
      <div ref={elRef} style={{ height: "100vh", width: "100%" }} />
      <div style={{ position: "absolute", top: 10, left: 10, right: 10, zIndex: 1000,
        background: FT.teal, color: "#fff", padding: "8px 12px", borderRadius: 10,
        border: "2px solid " + FT.ink, fontFamily: "'Jua', sans-serif", fontSize: 13, textAlign: "center",
        boxShadow: "3px 3px 0 " + FT.ink }}>
        <span style={{ color: FT.orange, fontWeight: 700 }}>무등생각</span> 셔틀 실시간 위치 · {status}
      </div>
    </div>
  );
}

/* 버스가 시발지 출발 전이거나 종점 도착 후 다음 출발 대기 중인지 자동 추론 */
function inferWaiting(bus, nowMin, tripsToday) {
  const dir = bus.dir === "inbound" ? "inbound" : "outbound";
  const route = ROUTES[dir];
  const stops = route.stops;
  const trip = (bus.trip || 1) - 1;
  const sched = route.trips[trip];
  if (!sched) return null;
  // 시발지에서 이번 회차 출발 시각 전
  if (bus.stop === stops[0].name && nowMin < toMin(sched[0])) {
    return { place: stops[0].name, time: sched[0], tripIdx: trip + 1, dir };
  }
  // 종점 도착 후 반대 방향 다음 회차 대기
  if (bus.stop === stops[stops.length - 1].name) {
    const opp = dir === "outbound" ? "inbound" : "outbound";
    const oppTrips = ROUTES[opp].trips.slice(0, tripsToday);
    for (let i = 0; i < oppTrips.length; i++) {
      if (toMin(oppTrips[i][0]) >= nowMin) {
        return { place: stops[stops.length - 1].name, time: oppTrips[i][0], tripIdx: i + 1, dir: opp };
      }
    }
  }
  return null;
}

/* 승객 화면 버스 카드 — 진행바를 현재 정류장으로 자동 스크롤, 다음 정류장·도착예정 표시 */

  const stripRef = useRef(null), activeRef = useRef(null);
  const dir = bus.dir === "inbound" ? "inbound" : "outbound";
  const route = ROUTES[dir];
  const stops = route.stops;
  const ci = stops.findIndex((s) => s.name === bus.stop);
  const sched = route.trips[(bus.trip || 1) - 1];
  const nextStop = ci >= 0 && ci < stops.length - 1 ? stops[ci + 1] : null;
  const nextEta = nextStop && sched ? sched[ci + 1] : null;
  const finalName = stops[stops.length - 1].name;
  const finalEta = sched ? sched[sched.length - 1] : null;
  const autoWait = inferWaiting(bus, nowMin, tripsToday);
  const waitInfo = bus.waiting === true ? (autoWait || { place: bus.stop || "—", time: null, tripIdx: null, dir }) : autoWait;
  useEffect(() => {
    if (waitInfo) return;
    const el = activeRef.current, c = stripRef.current;
    if (el && c) c.scrollTo({ left: el.offsetLeft - c.clientWidth / 2 + el.clientWidth / 2, behavior: "smooth" });
  }, [ci, waitInfo]);
  return (
    <div style={{ background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 12, boxShadow: "3px 3px 0 " + FT.ink, padding: 12 }}>
      <div className="flex items-center justify-between mb-2">
        <div className="flex items-center gap-2 min-w-0">
          <span style={{ fontSize: 20 }}>🚌</span>
          <span className="flex-shrink-0" style={{ color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>{id}호차</span>
          <span className="truncate" style={{ background: dir === "outbound" ? FT.orange : FT.teal, color: "#fff",
            border: "1.5px solid " + FT.ink, padding: "2px 8px", borderRadius: 999,
            fontSize: 11, fontFamily: "'Jua', sans-serif" }}>
            {route.label} · {bus.trip || "-"}회차
          </span>
        </div>
        <span className="flex-shrink-0 ml-2 flex items-center gap-1" style={{ color: FT.mute, fontSize: 10 }}>
          <span className="animate-pulse" style={{ width: 7, height: 7, borderRadius: "50%", background: FT.teal }} />{agoText(bus.ts)}
        </span>
      </div>

      {waitInfo ? (
        <div style={{ background: FT.orangeSoft, border: "2px solid " + FT.ink, borderRadius: 10, padding: "16px 14px", textAlign: "center" }}>
          <div style={{ fontSize: 11, letterSpacing: 2, marginBottom: 4, color: FT.orangeDark, fontFamily: "'Jua', sans-serif" }}>
            🅿️ 출발 대기 중{bus.waiting === true ? " (기사 확인)" : ""}
          </div>
          <div style={{ fontSize: 18, fontWeight: 700, color: FT.ink, fontFamily: "'Jua', sans-serif" }}>{waitInfo.place}</div>
          <div style={{ fontSize: 14, marginTop: 8, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>
            다음 출발 <b style={{ color: FT.orangeDark }}>{waitInfo.time || "미정"}</b>
            {waitInfo.tripIdx ? <span style={{ fontSize: 11, color: FT.mute, marginLeft: 4 }}>({waitInfo.tripIdx}회차 · {ROUTES[waitInfo.dir].label})</span> : null}
          </div>
        </div>
      ) : (
      <React.Fragment>
      <div className="flex items-stretch gap-2 mb-2.5">
        <div className="flex-1 px-3 py-2" style={{ background: FT.paper, border: "1.5px solid " + FT.ink, borderRadius: 8 }}>
          <div style={{ fontSize: 9, color: FT.mute, marginBottom: 2 }}>현재 위치</div>
          <div className="truncate" style={{ fontSize: 14, fontWeight: 700, color: FT.ink, fontFamily: "'Jua', sans-serif" }}>{bus.stop || "운행 중"}</div>
        </div>
        <div className="flex-1 px-3 py-2" style={{ background: FT.orangeSoft, border: "1.5px solid " + FT.ink, borderRadius: 8 }}>
          <div style={{ fontSize: 9, color: FT.orangeDark, marginBottom: 2 }}>{nextStop ? "다음 정류장" : "종점"}</div>
          <div className="truncate" style={{ fontSize: 14, fontWeight: 700, color: FT.ink, fontFamily: "'Jua', sans-serif" }}>
            {nextStop ? nextStop.name : finalName}
            {(nextStop ? nextEta : finalEta) ? <span style={{ fontSize: 10, color: FT.orangeDark, marginLeft: 4 }}>{nextStop ? nextEta : finalEta} 예정</span> : null}
          </div>

      <div ref={stripRef} className="flex items-start gap-0 overflow-x-auto pb-1" style={{ scrollbarWidth: "none" }}>

          <React.Fragment key={s.name}>

              <div style={{

                background: i === ci ? FT.orange : i < ci ? FT.teal : "#fff",
                border: "1.5px solid " + (i === ci ? FT.orangeDark : i < ci ? FT.tealDark : FT.mute),
                boxShadow: i === ci ? "0 0 0 3px " + FT.orangeSoft : "none" }} />

        ))}

      </React.Fragment>
      )}

  );

/* 승객 기본 화면 — 실시간 버스 목록(버스안내판 스타일) + 지도 탭. 제목 7번 탭하면 운영자(히든) 진입 */
function PassengerView({ dbUrl, onAdmin }) {
  const [buses, setBuses] = useState({});
  const [tab, setTab] = useState("list");
  const [conn, setConn] = useState("loading"); // loading | ok | error
  const [showTimetable, setShowTimetable] = useState(false);
  const tapRef = useRef(0), tapTimeRef = useRef(0);

  useEffect(() => {
    if (!dbUrl) { setConn("error"); return; }
    const base = dbUrl.replace(/\/+$/, "");
    let stopped = false;
    const poll = async () => {
      try {
        const r = await fetch(`${base}/buses.json`, { cache: "no-store" });
        const d = await r.json();
        setBuses(d || {});
        setConn("ok");
      } catch (_) { setConn("error"); }
    };
    poll();
    const id = setInterval(() => { if (!stopped) poll(); }, 4000);
    return () => { stopped = true; clearInterval(id); };
  }, [dbUrl]);

  const onTitleTap = () => {
    const t = Date.now();
    if (t - tapTimeRef.current > 1500) tapRef.current = 0;
    tapTimeRef.current = t;
    if (++tapRef.current >= 7) { tapRef.current = 0; onAdmin(); }
  };

  const now = Date.now();
  const agoText = (ts) => { if (!ts) return ""; const s = Math.round((now - ts) / 1000); return s < 5 ? "방금" : s < 60 ? `${s}초 전` : `${Math.floor(s / 60)}분 전`; };
  const live = Object.entries(buses)
    .filter(([, b]) => b && b.lat != null && (!b.ts || now - b.ts < 60000))
    .sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));

  // 시간표(승객용) — 일요일(6.14)은 5회차, 그 외 6회차
  const d = new Date();
  const tripsToday = d.getMonth() === 5 && d.getDate() === 14 ? 5 : ROUTES.outbound.trips.length;
  const nowMin = d.getHours() * 60 + d.getMinutes();
  const nextDep = (dir) => {
    const ts = ROUTES[dir].trips.slice(0, tripsToday);
    for (let i = 0; i < ts.length; i++) { if (toMin(ts[i][0]) >= nowMin) return { idx: i, time: ts[i][0] }; }
    return null;
  };
  const statusText = conn === "error" ? "연결 오류 — 잠시 후 다시 시도합니다"
    : conn === "loading" ? "연결 중…"
    : live.length > 0 ? `실시간 운행 중 · ${live.length}대` : "현재 운행 중인 셔틀이 없습니다";

    return (

        <button onClick={() => setTab("list")}

            background: FT.orange, color: "#fff", padding: "10px 24px", borderRadius: 999,
            fontFamily: "'Jua', sans-serif", fontWeight: 700, border: "2.5px solid " + FT.ink,
            boxShadow: "3px 3px 0 " + FT.ink }}>
          ☰ 목록으로
        </button>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full p-4 sm:p-6 flex justify-center"
      style={{ background: FT.paper,
        backgroundImage: "radial-gradient(circle at 15% -10%, rgba(22,168,158,0.18), transparent 45%), radial-gradient(circle at 85% 110%, rgba(238,107,46,0.14), transparent 45%)" }}>
      <div className="w-full max-w-md">
        <div style={{ background: "#fff", border: "2.5px solid " + FT.ink, borderRadius: 18, boxShadow: "4px 4px 0 " + FT.ink, overflow: "hidden" }}>
          {/* header */}
          <div style={{ padding: "16px 18px 14px 18px", borderBottom: "2.5px solid " + FT.ink, background: "#fff" }}>
            <div style={{ fontSize: 11, color: FT.inkSoft, fontFamily: "'Jua', sans-serif" }}>생각을 끄고, 생각을 켜다</div>
            <div style={{ fontSize: 14, color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700, marginTop: 2 }}>제4회 동구 무등산 인문축제</div>
            <div onClick={onTitleTap} className="select-none"
              style={{ fontSize: 22, color: FT.orange, fontFamily: "'Jua', sans-serif", fontWeight: 700, lineHeight: 1.15, marginTop: 4 }}>
              &lt;무등생각&gt; 셔틀버스 안내
            </div>
            <div style={{ marginTop: 10, display: "inline-flex", alignItems: "center", gap: 6,
              background: conn === "error" ? "#FEE2E2" : live.length > 0 ? FT.tealSoft : "#EEEFF1",
              border: "1.5px solid " + (conn === "error" ? "#B91C1C" : live.length > 0 ? FT.tealDark : FT.mute),
              borderRadius: 999, padding: "4px 10px", fontFamily: "'Jua', sans-serif", fontSize: 11,
              color: conn === "error" ? "#B91C1C" : live.length > 0 ? FT.tealDark : FT.inkSoft }}>
              <span className={live.length > 0 ? "animate-pulse" : ""}
                style={{ width: 7, height: 7, borderRadius: "50%",
                  background: conn === "error" ? "#B91C1C" : live.length > 0 ? FT.teal : FT.mute }} />
              {statusText}
            </div>
          </div>

          {/* tabs */}
          <div className="flex" style={{ borderBottom: "2.5px solid " + FT.ink }}>
            <button onClick={() => setTab("list")} className="flex-1 py-2.5 text-sm"
              style={{ background: FT.orange, color: "#fff", fontFamily: "'Jua', sans-serif", fontWeight: 700, borderRight: "2.5px solid " + FT.ink }}>목록</button>
            <button onClick={() => setTab("map")} className="flex-1 py-2.5 text-sm"
              style={{ background: "#fff", color: FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>지도 보기</button>
          </div>

          {/* body */}
          <div className="space-y-3" style={{ background: FT.paper, padding: 12 }}>
            {live.length === 0 ? (
              <div className="py-2">
                <div style={{ textAlign: "center", color: FT.inkSoft, fontFamily: "'Jua', sans-serif", fontSize: 13, lineHeight: 1.5, marginBottom: 14 }}>
                  {conn === "error" ? "연결을 확인하는 중입니다…" : "지금은 운행 중인 셔틀이 없어요."}
                </div>
                <div style={{ fontSize: 11, color: FT.inkSoft, marginBottom: 8, paddingLeft: 4, fontFamily: "'Jua', sans-serif" }}>다음 출발 예정</div>
                {["outbound", "inbound"].map((dir) => {
                  const nd = nextDep(dir);
                  return (
                    <div key={dir} className="flex items-center justify-between mb-2"
                      style={{ background: "#fff", border: "2px solid " + FT.ink, borderRadius: 10, padding: "10px 12px", boxShadow: "2px 2px 0 " + FT.ink }}>
                      <div className="flex items-center gap-2 min-w-0">
                        <span className="flex-shrink-0" style={{ background: dir === "outbound" ? FT.orange : FT.teal, color: "#fff",
                          border: "1.5px solid " + FT.ink, padding: "2px 8px", borderRadius: 999,
                          fontSize: 11, fontFamily: "'Jua', sans-serif" }}>
                          {ROUTES[dir].label}
                        </span>
                        <span className="truncate" style={{ fontSize: 10, color: FT.mute }}>{ROUTES[dir].full}</span>
                      </div>
                      <span className="flex-shrink-0 ml-2" style={{ color: nd ? FT.ink : FT.mute, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
                        {nd ? `${nd.time} (${nd.idx + 1}회차)` : "운행 종료"}
                      </span>
                    </div>
                  );
                })}
              </div>
            ) : (
              live.map(([id, b]) => <BusCard key={id} id={id} bus={b} agoText={agoText} nowMin={nowMin} tripsToday={tripsToday} />)
            )}

            <div className="flex gap-2 pt-1">
              <button onClick={() => setTab("map")} className="flex-1 py-2.5 text-sm"
                style={{ background: FT.teal, color: "#fff", border: "2px solid " + FT.ink, borderRadius: 10,
                  boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
                🗺️ 지도 보기
              </button>
              <button onClick={() => setShowTimetable(true)} className="flex-1 py-2.5 text-sm"
                style={{ background: FT.orange, color: "#fff", border: "2px solid " + FT.ink, borderRadius: 10,
                  boxShadow: "2px 2px 0 " + FT.ink, fontFamily: "'Jua', sans-serif", fontWeight: 700 }}>
                🕑 시간표·정류장
              </button>
            </div>
          </div>
        </div>

        <div style={{ textAlign: "center", marginTop: 12, fontSize: 10, color: FT.mute, fontFamily: "'Jua', sans-serif" }}>
          실시간 위치는 약 4초마다 갱신됩니다
        </div>
      </div>
      {showTimetable && <TimetableModal tripsToday={tripsToday} onClose={() => setShowTimetable(false)} />}
    </div>
  );
}

function App() {
  const [mode, setMode] = useState(() => LS.get("mode", "simple"));
  const [direction, setDirection] = useState("outbound");
  const [tripIdx, setTripIdx] = useState(0);
  const [currentIdx, setCurrentIdx] = useState(0);
  const [isAnnouncing, setIsAnnouncing] = useState(false);
  const [rate, setRate] = useState(() => parseFloat(LS.get("rate", "0.95")));

  // Coordinates keyed by 방향|정류장이름 (방향별 분리) — defaults from ROUTES, overridden by localStorage
  const [coords, setCoords] = useState(() => {
    const base = {};
    ["outbound", "inbound"].forEach(dir => {
      ROUTES[dir].stops.forEach(s => {
        if (s.lat != null && s.lng != null) base[coordKey(dir, s.name)] = { lat: s.lat, lng: s.lng };
      });
    });
    const stored = LS.getJSON("coords", {});
    const migrated = {};
    Object.entries(stored).forEach(([k, v]) => {
      if (k.includes("|")) migrated[k] = v;               // 이미 방향별 키
      else if (SHARED_STOPS.has(k)) migrated[k] = v;      // 단일 승강장: 이름 키 그대로 공유
      // 그 외(건너편 있는) 레거시 이름 키는 양방향으로 베이킹하지 않고 무시 → ROUTES 기본값 사용
    });
    return { ...base, ...migrated };
  });

  // 안내 멘트 설정 (기본 FESTIVAL + localStorage 사용자 수정본)
  const [ments, setMents] = useState(() => {
    const stored = LS.getJSON("ments", null);
    return stored ? { ...FESTIVAL, ...stored } : FESTIVAL;
  });
  useEffect(() => LS.setJSON("ments", ments), [ments]);

  // GPS / auto
  const [autoMode, setAutoMode] = useState(false);
  const [userPos, setUserPos] = useState(null);
  const [gpsError, setGpsError] = useState(null);
  const [triggerRadius, setTriggerRadius] = useState(() => parseInt(LS.get("radius", "150")));
  const [permissionState, setPermissionState] = useState("unknown");
  const [showHelp, setShowHelp] = useState(false);
  const [autoLegSwitch, setAutoLegSwitch] = useState(() => LS.get("autoleg", "0") === "1");
  const [festivalDay, setFestivalDay] = useState(() => LS.get("festday", "auto")); // auto|day1|day2
  // 실시간 위치 공유 (Firebase RTDB REST)
  const [shareUrl, setShareUrl] = useState(() => LS.get("shareurl", SHARE_DB));
  const [busId, setBusId] = useState(() => LS.get("busid", "1"));
  const [driverEmail, setDriverEmail] = useState(() => LS.get("driveremail", "")); // 기사 쓰기 로그인(이 기기에만 저장)
  const [driverPass, setDriverPass] = useState(() => LS.get("driverpass", ""));
  const [apiKey, setApiKey] = useState(() => LS.get("apikey", SHARE_API_KEY)); // 웹 API 키(이 기기에만 저장)
  const [authStatus, setAuthStatus] = useState("");
  const [sharing, setSharing] = useState(false);
  const [manualWaiting, setManualWaiting] = useState(false);
  const lastShareRef = useRef(0);
  const authTokenRef = useRef("");
  const [progTimeBase, setProgTimeBase] = useState(() => LS.get("progbase", "now")); // now|trip

  // TTS
  const [voices, setVoices] = useState([]);
  const [selectedVoiceURI, setSelectedVoiceURI] = useState(() => LS.get("voice", null));
  const [ttsStatus, setTtsStatus] = useState("unknown");
  const [ttsPrimed, setTtsPrimed] = useState(false);
  const [chimeEnabled, setChimeEnabled] = useState(() => LS.get("chime", "1") === "1");
  const [useClips, setUseClips] = useState(() => LS.get("clips", "0") === "1");

  const watchIdRef = useRef(null);
  const announcedRef = useRef(new Set());
  const utterRef = useRef(null);
  const audioCtxRef = useRef(null);
  const audioElRef = useRef(null);
  const legSwitchArmedRef = useRef(false);
  const legDepartCountRef = useRef(0);     // 종점 이탈 연속 카운트 (자동 전환 히스테리시스)
  const resetStopRef = useRef(null);       // 레그 변경 시 currentIdx를 0이 아닌 특정 정류장으로 설정(GPS 스냅)
  const wakeLockRef = useRef(null);
  const rateRef = useRef(rate);            // 자동 안내 시 최신 값 참조용
  const voiceRef = useRef(selectedVoiceURI);
  useEffect(() => { rateRef.current = rate; }, [rate]);
  useEffect(() => { voiceRef.current = selectedVoiceURI; }, [selectedVoiceURI]);

  // 현재 시각 — 설정한 주기마다 갱신해 운행 상태/남은 시간/회차 판정을 최신으로 유지
  const [tickSec, setTickSec] = useState(() => parseInt(LS.get("ticksec", "5")) || 5);
  useEffect(() => LS.set("ticksec", String(tickSec)), [tickSec]);
  const [nowTick, setNowTick] = useState(() => Date.now());
  useEffect(() => {
    const id = setInterval(() => setNowTick(Date.now()), tickSec * 1000);
    return () => clearInterval(id);
  }, [tickSec]);

  // Persist on change
  useEffect(() => LS.set("mode", mode), [mode]);
  useEffect(() => LS.setJSON("coords", coords), [coords]);
  useEffect(() => LS.set("rate", String(rate)), [rate]);
  useEffect(() => LS.set("radius", String(triggerRadius)), [triggerRadius]);
  useEffect(() => { if (selectedVoiceURI) LS.set("voice", selectedVoiceURI); }, [selectedVoiceURI]);
  useEffect(() => LS.set("chime", chimeEnabled ? "1" : "0"), [chimeEnabled]);
  useEffect(() => LS.set("clips", useClips ? "1" : "0"), [useClips]);
  useEffect(() => LS.set("autoleg", autoLegSwitch ? "1" : "0"), [autoLegSwitch]);
  useEffect(() => LS.set("festday", festivalDay), [festivalDay]);
  useEffect(() => LS.set("progbase", progTimeBase), [progTimeBase]);
  useEffect(() => LS.set("shareurl", shareUrl), [shareUrl]);
  useEffect(() => LS.set("busid", busId), [busId]);
  useEffect(() => LS.set("driveremail", driverEmail), [driverEmail]);
  useEffect(() => LS.set("driverpass", driverPass), [driverPass]);
  useEffect(() => LS.set("apikey", apiKey), [apiKey]);

  // 안내에 사용할 축제일 결정 (수동 지정 우선, 아니면 오늘 날짜로 판단)
  const resolveFestivalDay = () => {
    if (festivalDay === "day1" || festivalDay === "day2") return festivalDay;
    const d = new Date();
    if (d.getMonth() === 5 && d.getDate() === 13) return "day1";
    if (d.getMonth() === 5 && d.getDate() === 14) return "day2";
    return null;
  };

  const route = ROUTES[direction];
  const stops = route.stops;
  const trip = route.trips[tripIdx];

  /* --- 운행 회차 수: 6.14(일)은 5회차까지만, 그 외 6회차.
     기준일 설정(festivalDay)이 지정되면 그에 따르고, 자동이면 기기 날짜로 판단 --- */
  const tripsToday = useMemo(() => {
    if (festivalDay === "day2") return 5;
    if (festivalDay === "day1") return ROUTES.outbound.trips.length;
    const d = new Date();
    if (d.getMonth() === 5 && d.getDate() === 14) return 5;
    return ROUTES.outbound.trips.length;
  }, [nowTick, festivalDay]);

  /* --- Circular route: next leg computation ---
     outbound n → inbound n (15분 후, 축제장 휴식)
     inbound n → outbound n+1 (즉시 환승, 같은 시각)
     마지막 회차 → 운행 종료 */
  const nextLeg = useMemo(() => {
    if (direction === "outbound") return { direction: "inbound", tripIdx };
    if (tripIdx < tripsToday - 1)
      return { direction: "outbound", tripIdx: tripIdx + 1 };
    return null; // last leg of the day
  }, [direction, tripIdx, tripsToday]);

  const nextLegInfo = nextLeg ? {
    label: ROUTES[nextLeg.direction].label,
    departTime: ROUTES[nextLeg.direction].trips[nextLeg.tripIdx][0],
    tripNum: nextLeg.tripIdx + 1,
  } : null;

  const isAtTerminus = currentIdx === stops.length - 1;

  const goToNextLeg = () => {
    if (!nextLeg) return;
    legSwitchArmedRef.current = false;
    legDepartCountRef.current = 0;
    setDirection(nextLeg.direction);
    setTripIdx(nextLeg.tripIdx);
    setCurrentIdx(0);
    announcedRef.current = new Set();
  };

  /* --- 현재 시각 기준으로 운행 중/다음 회차 선택 (마운트 시 1회 + 수동 재설정 버튼) --- */
  const selectLegByClock = () => {
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const all = [];
    ["outbound", "inbound"].forEach(dir => {
      ROUTES[dir].trips.forEach((t, i) => {
        if (i >= tripsToday) return; // 6.14(일) 6회차 제외
        all.push({ dir, idx: i, dep: toMin(t[0]), arr: toMin(t[t.length - 1]) });
      });
    });
    all.sort((a, b) => a.dep - b.dep);
    // 운행 중인 회차 (지연 40분까지 허용)
    let target = all.find(l => nowMin >= l.dep && nowMin <= l.arr + 40);
    if (!target) target = all.find(l => l.dep > nowMin); // 다음 예정 회차
    if (!target) target = all[0];                        // 그 외 첫 회차

    // GPS가 있으면 그 방향에서 현재 위치와 가장 가까운 정류장을 현재 승강장으로 설정
    let ni = 0;
    if (userPos) {
      let bd = Infinity;
      ROUTES[target.dir].stops.forEach((s, i) => {
        const c = coords[coordKey(target.dir, s.name)];
        if (!c) return;
        const d = distanceMeters(userPos, c);
        if (d < bd) { bd = d; ni = i; }
      });
    }
    const sameLeg = direction === target.dir && tripIdx === target.idx;
    resetStopRef.current = ni;
    setDirection(target.dir);
    setTripIdx(target.idx);
    if (sameLeg) {
      // 레그가 그대로면 리셋 effect가 안 돌므로 직접 적용
      setCurrentIdx(ni);
      const set = new Set();
      for (let k = 0; k < ni; k++) set.add(k);
      announcedRef.current = set;
      resetStopRef.current = null;
    }
  };
  useEffect(() => { selectLegByClock(); }, []); // mount only

  /* --- 운행 회차 수가 줄면(예: 6.14 선택) 현재 회차를 범위 안으로 보정 --- */
  useEffect(() => {
    if (tripIdx > tripsToday - 1) setTripIdx(tripsToday - 1);
  }, [tripsToday, tripIdx]);

  /* --- Reset position when leg (direction or trip) changes ---
     resetStopRef가 지정돼 있으면(GPS 스냅) 그 정류장으로, 아니면 0(출발지)으로 --- */
  useEffect(() => {
    const ni = resetStopRef.current != null ? resetStopRef.current : 0;
    setCurrentIdx(ni);
    const set = new Set();
    for (let k = 0; k < ni; k++) set.add(k); // 지나온 정류장은 안내 완료 처리
    announcedRef.current = set;
    resetStopRef.current = null;
    legSwitchArmedRef.current = false;
    legDepartCountRef.current = 0;
  }, [direction, tripIdx]);

  /* --- Cleanup on unmount --- */
  useEffect(() => () => {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (watchIdRef.current !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchIdRef.current);
  }, []);

  /* --- Permission state --- */
  useEffect(() => {
    if (!navigator.permissions?.query) return;
    let permRef = null;
    navigator.permissions.query({ name: "geolocation" })
      .then((p) => { permRef = p; setPermissionState(p.state); p.onchange = () => setPermissionState(p.state); })
      .catch(() => {});
    return () => { if (permRef) permRef.onchange = null; };
  }, []);

  /* --- TTS voices --- */
  useEffect(() => {
    if (!window.speechSynthesis) { setTtsStatus("unsupported"); return; }
    const load = () => {
      const list = window.speechSynthesis.getVoices();
      setVoices(list);
      const ko = list.filter(v => v.lang === "ko-KR" || v.lang.startsWith("ko"));
      if (list.length === 0) return;
      if (ko.length === 0) setTtsStatus("no-korean");
      else {
        setTtsStatus("ready");
        setSelectedVoiceURI((prev) => prev && ko.find(v => v.voiceURI === prev) ? prev :
          (ko.find(v => v.localService) || ko[0]).voiceURI);
      }
    };
    load();
    window.speechSynthesis.onvoiceschanged = load;
    // iOS는 getVoices()가 처음 비어 있고 onvoiceschanged가 늦거나 안 올 수 있어 재시도
    const retries = [400, 1200, 3000].map(ms => setTimeout(load, ms));
    return () => {
      if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = null;
      retries.forEach(clearTimeout);
    };
  }, []);

  /* --- Wake Lock: 앱이 떠 있는 동안 화면이 자동으로 꺼지지 않게 유지 ---
     (모바일은 화면이 꺼지면 음성·GPS가 멈추므로 화면을 깨워둠. 단, 전원 버튼으로
      직접 끄는 것은 막을 수 없음) */
  useEffect(() => {
    const acquire = async () => {
      try {
        if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLockRef.current) {
          wakeLockRef.current = await navigator.wakeLock.request("screen");
          wakeLockRef.current.addEventListener?.("release", () => { wakeLockRef.current = null; });
        }
      } catch (_) {}
    };
    const onVis = () => {
      if (document.visibilityState === "visible") {
        acquire();
        if (audioCtxRef.current?.state === "suspended") audioCtxRef.current.resume();
        if (window.speechSynthesis?.paused) window.speechSynthesis.resume();
      }
    };
    acquire();
    document.addEventListener("visibilitychange", onVis);
    return () => {
      document.removeEventListener("visibilitychange", onVis);
      try { wakeLockRef.current?.release?.(); } catch (_) {}
      wakeLockRef.current = null;
    };
  }, []);

  /* 긴 문장은 브라우저가 ~15초에서 끊으므로 문장·쉼표 단위로 짧게 분할 */
  const chunkText = (text) => {
    const out = [];
    (text.match(/[^.!?。]+[.!?。]?/g) || [text]).forEach(s => {
      let seg = s.trim(); if (!seg) return;
      if (seg.length <= 110) { out.push(seg); return; }
      let buf = "";
      seg.split(/,\s*/).forEach(part => {
        if (buf && (buf + ", " + part).length > 110) { out.push(buf); buf = part; }
        else buf = buf ? buf + ", " + part : part;
      });
      if (buf) out.push(buf);
    });
    return out.length ? out : [text];
  };

  const speak = (text) => {
    if (!window.speechSynthesis) { setTtsStatus("unsupported"); return; }
    if (window.speechSynthesis.paused) window.speechSynthesis.resume();
    window.speechSynthesis.cancel();
    const wantURI = voiceRef.current || selectedVoiceURI;
    const chosen = voices.find(v => v.voiceURI === wantURI)
      || voices.find(v => v.lang === "ko-KR" || v.lang.startsWith("ko"));
    const parts = chunkText(text);
    // cancel() 직후 약간의 지연을 둔 뒤 분할 발화를 순차 큐잉
    setTimeout(() => {
      parts.forEach((p, i) => {
        const u = new SpeechSynthesisUtterance(p);
        u.lang = "ko-KR"; u.rate = rateRef.current || rate; u.pitch = 1.0;
        if (chosen) u.voice = chosen;
        if (i === 0) u.onstart = () => setIsAnnouncing(true);
        if (i === parts.length - 1) u.onend = () => setIsAnnouncing(false);
        u.onerror = (e) => {
          if (e.error && e.error !== "interrupted" && e.error !== "canceled") {
            setIsAnnouncing(false); setTtsStatus("error");
          }
        };
        utterRef.current = u;
        window.speechSynthesis.speak(u);
      });
    }, 60);
  };

  /* SpeechSynthesis가 장시간 발화 중 멈추는 크롬 버그 방지 — pause 없이 resume만 (모바일 안전) */
  useEffect(() => {
    if (!window.speechSynthesis) return;
    const id = setInterval(() => {
      const s = window.speechSynthesis;
      if (s.speaking && !s.paused) s.resume();
    }, 10000);
    return () => clearInterval(id);
  }, []);

  /* 화면 복귀 시 오디오 컨텍스트 재개 (잠금 후 음성/벨 무음 방지) */
  useEffect(() => {
    const onVis = () => {
      if (document.visibilityState !== "visible") return;
      if (audioCtxRef.current && audioCtxRef.current.state === "suspended") audioCtxRef.current.resume();
      if (window.speechSynthesis && window.speechSynthesis.paused) window.speechSynthesis.resume();
    };
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, []);

  /* Bus arrival chime — two-tone "딩-동" via Web Audio, then speak */
  const playChime = (onDone) => {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { onDone && onDone(); return; }
      if (!audioCtxRef.current) audioCtxRef.current = new Ctx();
      const ctx = audioCtxRef.current;
      if (ctx.state === "suspended") ctx.resume();
      const t0 = ctx.currentTime + 0.02;
      const dur = 0.5;
      [{ f: 988, t: 0 }, { f: 740, t: 0.22 }].forEach(({ f, t }) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, t0 + t);
        g.gain.setValueAtTime(0.0001, t0 + t);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + dur);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t0 + t);
        osc.stop(t0 + t + dur + 0.05);
      });
      if (onDone) setTimeout(onDone, 850);
    } catch (_) { onDone && onDone(); }
  };

  const chimeThenSpeak = (text) => {
    if (chimeEnabled) playChime(() => speak(text));
    else speak(text);
  };

  /* mp3 우선 재생, 없거나 실패하면 기기 TTS로 폴백. audioKey 없으면 바로 TTS */
  const speakOrClip = (text, audioKey) => {
    const run = () => {
      if (useClips && audioKey) {
        try {
          if (audioElRef.current) { audioElRef.current.pause(); audioElRef.current = null; }
          const a = new Audio(`audio/${audioKey}.mp3`);
          audioElRef.current = a;
          a.onplay = () => setIsAnnouncing(true);
          a.onended = () => { setIsAnnouncing(false); audioElRef.current = null; };
          a.onerror = () => { audioElRef.current = null; speak(text); }; // 파일 없으면 TTS
          a.play().catch(() => { audioElRef.current = null; speak(text); });
        } catch (_) { speak(text); }
      } else {
        speak(text);
      }
    };
    if (chimeEnabled) playChime(run); else run();
  };

  const primeTTS = () => {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        if (!audioCtxRef.current) audioCtxRef.current = new Ctx();
        if (audioCtxRef.current.state === "suspended") audioCtxRef.current.resume();
      }
    } catch (_) {}
    if (!window.speechSynthesis || ttsPrimed) return;
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0; u.rate = 1;
    try { window.speechSynthesis.speak(u); setTtsPrimed(true); } catch (_) {}
  };

  const testVoice = () => { primeTTS(); chimeThenSpeak("안녕하세요. 무등산 인문축제 셔틀버스 음성 안내 테스트입니다."); };

  const announceStop = (idx) => {
    const cur = stops[idx]; if (!cur) return;
    const nxt = stops[idx + 1];
    const curSay = spokenName(cur.name);
    // 축제장 방향 출발지(5·18민주광장) — 축제 환영 안내 (다음 정류장 안내는 생략)
    if (direction === "outbound" && idx === 0) {
      speakOrClip(ments.welcome, AUDIO_KEYS.welcome);
      return;
    }
    // 민주광장 방향 출발지(축제장) — 하차 안내 포함
    if (direction === "inbound" && idx === 0) {
      let t = ments.alight;
      if (nxt) t += ` 다음 정류장은 ${spokenName(nxt.name)}입니다.`;
      speakOrClip(t, AUDIO_KEYS.alight);
      return;
    }
    // 그 외 출발(시작) 승강장 — 도착 안내 대신 출발 안내
    if (idx === 0 && nxt) {
      chimeThenSpeak(`잠시 후 출발합니다. 다음 정류장은 ${spokenName(nxt.name)}입니다.`);
      return;
    }
    let text;
    if (nxt) {
      // 축제장 방향: 대부분 종점까지 가므로 일반 정류장 도착 안내는 생략하고 축제 홍보/프로그램만
      if (direction === "outbound") {
        if (ments.promos[cur.name]) { speakOrClip(ments.promos[cur.name], AUDIO_KEYS[cur.name]); return; }
        if (cur.name === ments.programStop) {
          // 기준 시각: 시간표 기준이면 이 회차의 축제장 도착 시각, 아니면 현재 시각 + 남은 운행 시간
          let arrivalMin;
          if (progTimeBase === "trip") {
            arrivalMin = toMin(trip[trip.length - 1]);
          } else {
            const now = new Date();
            const remain = Math.max(0, toMin(trip[trip.length - 1]) - toMin(trip[idx]));
            arrivalMin = now.getHours() * 60 + now.getMinutes() + remain;
          }
          chimeThenSpeak(buildProgramText(ments, resolveFestivalDay(), arrivalMin));
          return;
        }
        return; // 그 외 중간 정류장은 안내 없음
      }
      // 민주광장 방향: 하차가 많으므로 정류장 안내 전체 유지
      text = `이번 정류장은 ${curSay}, ${curSay}입니다. 다음 정류장은 ${spokenName(nxt.name)}입니다.`;
    } else {
      // Terminus — include circular connection info
      const base = direction === "outbound"
        ? `종점, 무등생각 축제장에 도착했습니다. 함께해 주셔서 감사합니다. 즐거운 축제 되세요. 차가 완전히 멈춘 뒤 안전하게 내려주시기 바랍니다.`
        : `이번 정류장은 ${curSay}입니다. 이번 정류장이 종점입니다. 안전하게 내려주세요.`;
      if (nextLegInfo) {
        // 출발 예정 시각이 이미 지났으면(지연 운행) 절대 시각 대신 '잠시 후'로 안내
        const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
        const onTime = toMin(nextLegInfo.departTime) >= nowMin;
        const when = onTime ? `${spokenTime(nextLegInfo.departTime)}에` : "잠시 후";
        text = `${base} ${when} ${nextLegInfo.label} ${nextLegInfo.tripNum}회차 셔틀버스가 출발합니다.`;
      } else {
        text = `${base} 오늘 운행이 종료되었습니다. 이용해 주셔서 감사합니다.`;
      }
    }
    chimeThenSpeak(text);
  };

  // 탭하면 항상 현재 정류장을 (다시) 안내 — 실수로 한 번 더 눌러도 무음 전환되지 않음
  const announce = () => { primeTTS(); announceStop(currentIdx); };
  // 진행 중인 안내를 멈춤 (정지 버튼 전용)
  const stopAnnounce = () => {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (audioElRef.current) { try { audioElRef.current.pause(); } catch (_) {} audioElRef.current = null; }
    setIsAnnouncing(false);
  };

  const next = () => currentIdx < stops.length - 1 && setCurrentIdx(currentIdx + 1);
  const prev = () => currentIdx > 0 && setCurrentIdx(currentIdx - 1);

  const swapDirection = () => {
    setDirection(direction === "outbound" ? "inbound" : "outbound");
    setTripIdx(t => Math.min(t, tripsToday - 1)); // 일요일 6회차 등 비운행 회차 방지
  };

  const setStopCoordHere = (i) => {
    if (!userPos) { setGpsError("먼저 자동 모드를 켜서 GPS를 활성화하세요"); return; }
    setCoords(prev => ({ ...prev, [coordKey(direction, stops[i].name)]: { lat: userPos.lat, lng: userPos.lng } }));
  };

  // Coordinate editor (map + manual input)
  const [editing, setEditing] = useState(null); // { idx, lat, lng }
  const openCoordEditor = (i) => {
    const c = coords[coordKey(direction, stops[i].name)];
    setEditing({ idx: i, lat: c ? c.lat : 35.130, lng: c ? c.lng : 126.940 });
  };
  const saveCoordEditor = () => {
    if (!editing) return;
    const la = parseFloat(editing.lat), ln = parseFloat(editing.lng);
    if (Number.isFinite(la) && Number.isFinite(ln)) {
      setCoords(prev => ({ ...prev, [coordKey(direction, stops[editing.idx].name)]: { lat: la, lng: ln } }));
    }
    setEditing(null);
  };

  // 좌표 백업·복원 (내보내기/불러오기)
  const [backup, setBackup] = useState(null);     // null | 텍스트(JSON)
  const [backupMsg, setBackupMsg] = useState("");
  const openBackup = () => { setBackupMsg(""); setBackup(JSON.stringify(coords, null, 2)); };
  const resetCoords = () => {
    const base = {};
    ["outbound", "inbound"].forEach(dir => {
      ROUTES[dir].stops.forEach(s => {
        if (s.lat != null && s.lng != null) base[coordKey(dir, s.name)] = { lat: s.lat, lng: s.lng };
      });
    });
    setCoords(base);
    setBackup(JSON.stringify(base, null, 2));
    setBackupMsg("기본 좌표로 초기화했어요");
  };
  const copyBackup = () => {
    try { navigator.clipboard.writeText(backup); setBackupMsg("클립보드에 복사했어요"); }
    catch (_) { setBackupMsg("복사 실패 — 직접 선택해 복사하세요"); }
  };
  const applyBackup = () => {
    try {
      const obj = JSON.parse(backup);
      const clean = {};
      Object.entries(obj).forEach(([k, v]) => {
        if (v && Number.isFinite(+v.lat) && Number.isFinite(+v.lng)) clean[k] = { lat: +v.lat, lng: +v.lng };
      });
      if (!Object.keys(clean).length) { setBackupMsg("유효한 좌표가 없습니다"); return; }
      setCoords(prev => ({ ...prev, ...clean }));
      setBackupMsg(`${Object.keys(clean).length}개 좌표를 불러왔어요`);
    } catch (_) { setBackupMsg("형식이 올바르지 않습니다 (JSON 확인)"); }
  };
  const downloadBackup = () => {
    try {
      const blob = new Blob([JSON.stringify(coords, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "무등생각셔틀-좌표.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setBackupMsg("파일로 저장했어요");
    } catch (_) { setBackupMsg("파일 저장 실패"); }
  };
  const uploadBackup = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { setBackup(String(reader.result)); setBackupMsg("파일을 불러왔어요. '불러오기'를 눌러 적용하세요"); };
    reader.readAsText(file);
  };

  // 멘트(안내 문구) 백업·복원
  const [mentBackup, setMentBackup] = useState(null);
  const [mentMsg, setMentMsg] = useState("");
  const [showTimetable, setShowTimetable] = useState(false);
  const openMentBackup = () => { setMentMsg(""); setMentBackup(JSON.stringify(ments, null, 2)); };
  const copyMent = () => {
    try { navigator.clipboard.writeText(mentBackup); setMentMsg("클립보드에 복사했어요"); }
    catch (_) { setMentMsg("복사 실패 — 직접 선택해 복사하세요"); }
  };
  const applyMent = () => {
    try {
      const obj = JSON.parse(mentBackup);
      if (typeof obj !== "object" || !obj.welcome) { setMentMsg("멘트 형식이 올바르지 않습니다"); return; }
      setMents({ ...FESTIVAL, ...obj });
      setMentMsg("멘트를 불러왔어요");
    } catch (_) { setMentMsg("형식이 올바르지 않습니다 (JSON 확인)"); }
  };
  const resetMent = () => { setMents(FESTIVAL); setMentBackup(JSON.stringify(FESTIVAL, null, 2)); setMentMsg("기본 멘트로 되돌렸어요"); };
  const downloadMent = () => {
    try {
      const blob = new Blob([JSON.stringify(ments, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "무등생각셔틀-멘트.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setMentMsg("파일로 저장했어요");
    } catch (_) { setMentMsg("파일 저장 실패"); }
  };
  const uploadMent = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { setMentBackup(String(reader.result)); setMentMsg("파일을 불러왔어요. '불러오기'를 눌러 적용하세요"); };
    reader.readAsText(file);
  };

  /* --- GPS watch --- */
  useEffect(() => {
    if (!autoMode) {
      if (watchIdRef.current !== null && navigator.geolocation) { navigator.geolocation.clearWatch(watchIdRef.current); watchIdRef.current = null; }
      setUserPos(null); return;
    }
    if (!navigator.geolocation) { setGpsError("이 기기는 GPS를 지원하지 않아요"); setAutoMode(false); return; }
    if (permissionState === "denied") { setGpsError("위치 권한이 차단되어 있어요"); setAutoMode(false); return; }
    setGpsError(null);
    watchIdRef.current = navigator.geolocation.watchPosition(
      (pos) => {
        setUserPos({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy });
        setGpsError(null);
        if (permissionState !== "granted") setPermissionState("granted");
      },
      (err) => {
        if (err.code === 1) { setPermissionState("denied"); setGpsError("위치 권한이 거부되었어요"); }
        else if (err.code === 2) setGpsError("위치 신호를 가져올 수 없어요 (실외에서 다시 시도)");
        else setGpsError("위치 요청 시간 초과");
        setAutoMode(false);
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
    return () => { if (watchIdRef.current !== null) { navigator.geolocation.clearWatch(watchIdRef.current); watchIdRef.current = null; } };
  }, [autoMode, permissionState]);

  const retryPermission = () => {
    setGpsError(null);
    if (navigator.permissions?.query) {
      navigator.permissions.query({ name: "geolocation" }).then((p) => {
        setPermissionState(p.state);
        if (p.state !== "denied") setAutoMode(true);
        else setGpsError("아직 차단된 상태예요. 브라우저 설정을 확인해주세요.");
      });
    } else setAutoMode(true);
  };

  const ua = typeof navigator !== "undefined" ? navigator.userAgent : "";
  const isIOS = /iPad|iPhone|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);

  /* --- Auto announce: 반경 내 가장 가까운 '아직 안내 안 한 전방 정류장'을 선택,
         지나친 정류장은 passed 처리해 건너뜀에서 복구 가능하도록 함 --- */
  useEffect(() => {
    if (!autoMode || !userPos) return;
    let nearestIdx = -1, nearestDist = Infinity;
    for (let i = currentIdx; i < stops.length; i++) {
      const c = coords[coordKey(direction, stops[i].name)]; if (!c) continue;
      const d = distanceMeters(userPos, c);
      if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
    }
    if (nearestIdx === -1) return;
    if (nearestDist <= triggerRadius && !announcedRef.current.has(nearestIdx)) {
      // 건너뛴 앞쪽 정류장들은 지나간 것으로 표시 (이후 재안내 방지)
      for (let k = currentIdx; k < nearestIdx; k++) announcedRef.current.add(k);
      announcedRef.current.add(nearestIdx);
      setCurrentIdx(nearestIdx);
      // 시작 승강장 안내: 출발지(5·18민주광장 환영 / 축제장 하차 안내)도 자동 방송
      announceStop(nearestIdx);
      // 종점 도착 시 자동 회차 전환 무장
      if (nearestIdx === stops.length - 1 && nextLeg) { legSwitchArmedRef.current = true; legDepartCountRef.current = 0; }
      return;
    }
    // 안내한 현재 정류장을 통과(반경 밖 + 다음 정류장이 더 가까움)하면 표시를 다음 정류장으로 전환
    if (currentIdx < stops.length - 1 && announcedRef.current.has(currentIdx)) {
      const curC = coords[coordKey(direction, stops[currentIdx].name)];
      const nextC = coords[coordKey(direction, stops[currentIdx + 1].name)];
      if (curC && nextC) {
        const dCur = distanceMeters(userPos, curC);
        const dNext = distanceMeters(userPos, nextC);
        if (dCur > triggerRadius && dNext < dCur) setCurrentIdx(currentIdx + 1);
      }
    }
  }, [userPos, autoMode, stops, triggerRadius, coords, direction, currentIdx]);

  /* --- Auto leg-switch: 종점 도착 후, 연속으로 반경*1.5를 벗어나면 전환 (GPS 노이즈 히스테리시스) --- */
  useEffect(() => {
    if (!autoMode || !autoLegSwitch || !userPos) return;
    if (!isAtTerminus || !nextLeg || !legSwitchArmedRef.current) return;
    const tc = coords[coordKey(direction, stops[stops.length - 1].name)];
    if (!tc) return;
    if (distanceMeters(userPos, tc) > triggerRadius * 1.5) {
      legDepartCountRef.current += 1;
      if (legDepartCountRef.current >= 3) goToNextLeg(); // 연속 3회 확인 후 전환
    } else {
      legDepartCountRef.current = 0; // 다시 반경 안이면 리셋
    }
  }, [userPos, autoMode, autoLegSwitch, isAtTerminus, nextLeg, triggerRadius, coords]);

  useEffect(() => { if (!autoMode) { announcedRef.current = new Set(); legSwitchArmedRef.current = false; legDepartCountRef.current = 0; } }, [autoMode]);

  const curStop = stops[currentIdx];
  const nextStop = stops[currentIdx + 1];
  const curCoord = curStop ? coords[coordKey(direction, curStop.name)] : undefined;
  const nextCoord = nextStop ? coords[coordKey(direction, nextStop.name)] : undefined;
  const distToNext = autoMode && userPos && nextCoord ? distanceMeters(userPos, nextCoord) : null;
  const fmtDist = (m) => (m == null ? null : m < 1000 ? `${Math.round(m)}m` : `${(m / 1000).toFixed(2)}km`);

  /* --- 기사 쓰기 로그인(선택): 이메일/비밀번호가 있으면 로그인해 토큰 발급(50분마다 갱신). 없으면 인증 없이 공개 쓰기. --- */
  const firebaseSignIn = async () => {
    const key = apiKey || SHARE_API_KEY;
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${key}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: driverEmail, password: driverPass, returnSecureToken: true }),
    });
    return r.json();
  };
  const testLogin = async () => {
    const key = apiKey || SHARE_API_KEY;
    if (!key) { setAuthStatus("❌ 웹 API 키를 입력하세요"); return; }
    if (!driverEmail || !driverPass) { setAuthStatus("❌ 이메일·비밀번호를 입력하세요"); return; }
    setAuthStatus("로그인 시도 중…");
    try {
      const d = await firebaseSignIn();
      if (d.idToken) setAuthStatus(`✅ 로그인 성공! 규칙에 넣을 UID: ${d.localId}`);
      else setAuthStatus("❌ " + ((d.error && d.error.message) || "로그인 실패"));
    } catch (_) { setAuthStatus("❌ 네트워크 오류"); }
  };
  useEffect(() => {
    if (!sharing) return;
    if (!(apiKey || SHARE_API_KEY) || !driverEmail || !driverPass) return; // 로그인 미설정 → 테스트 모드(공개 쓰기)
    let stopped = false, timer;
    const signIn = async () => {
      try {
        const d = await firebaseSignIn();
        if (d.idToken) { authTokenRef.current = d.idToken; setGpsError(""); }
        else { authTokenRef.current = ""; setGpsError("쓰기 로그인 실패: " + ((d.error && d.error.message) || "정보 확인")); }
      } catch (_) { setGpsError("쓰기 로그인 네트워크 오류"); }
    };
    signIn();
    timer = setInterval(() => { if (!stopped) signIn(); }, 50 * 60 * 1000);
    return () => { stopped = true; clearInterval(timer); };
  }, [sharing, driverEmail, driverPass, apiKey]);

  /* --- 실시간 위치 공유: 켜져 있고 GPS가 있으면 3초마다 Firebase RTDB에 위치 PUT --- */
  useEffect(() => {
    if (!sharing || !shareUrl || !userPos) return;
    const now = Date.now();
    if (now - lastShareRef.current < 3000) return;
    lastShareRef.current = now;
    const base = shareUrl.replace(/\/+$/, "");
    const auth = authTokenRef.current ? `?auth=${encodeURIComponent(authTokenRef.current)}` : "";
    const body = JSON.stringify({
      lat: userPos.lat, lng: userPos.lng, dir: direction, trip: tripIdx + 1,
      stop: curStop?.name || "", ts: now, waiting: manualWaiting || undefined,
    });
    fetch(`${base}/buses/${encodeURIComponent(busId || "1")}.json${auth}`, { method: "PUT", body }).catch(() => {});
  }, [userPos, sharing, shareUrl, busId, direction, tripIdx, curStop, manualWaiting]);

  // 공유를 끄면(켰다가 끈 경우만) 내 위치 노드 삭제 — 지도에서 사라지게
  const wasSharingRef = useRef(false);
  useEffect(() => {
    if (sharing) { wasSharingRef.current = true; return; }
    if (!wasSharingRef.current || !shareUrl) return;
    wasSharingRef.current = false;
    const base = shareUrl.replace(/\/+$/, "");
    const auth = authTokenRef.current ? `?auth=${encodeURIComponent(authTokenRef.current)}` : "";
    fetch(`${base}/buses/${encodeURIComponent(busId || "1")}.json${auth}`, { method: "DELETE" }).catch(() => {});
  }, [sharing]);

  /* --- Trip status (출발 전/운행 중/지연/종료) — 지연 운행을 '종료'로 오표시하지 않음 --- */
  const tripStatus = useMemo(() => {
    const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes();
    const start = toMin(trip[0]); const end = toMin(trip[trip.length - 1]);
    if (nowMin < start) return { state: "upcoming", label: `${start - nowMin}분 후 출발`, color: "#22d65f" };
    if (nowMin <= end + 5) return { state: "active", label: "운행 중", color: "#fbbf24" };
    if (nowMin <= end + 40) return { state: "active", label: "운행 중(지연)", color: "#fb923c" };
    return { state: "done", label: "운행 종료", color: "#64748b" };
  }, [trip, nowTick]);

  /* ===== SIMPLE MODE — operator/driver view ===== */
  if (mode === "simple") {
    const arrivalDistText = distToNext != null ? fmtDist(distToNext) : null;
    // 시간표상 다음 정류장 예정 시각까지 남은 시간(초). +면 여유, -면 지연
    const _now = new Date();
    const nowSecNow = _now.getHours() * 3600 + _now.getMinutes() * 60 + _now.getSeconds();
    const nextSchedDiffSec = nextStop ? toMin(trip[currentIdx + 1]) * 60 - nowSecNow : null;
    // 이번 정류장 예정 시각 대비 (음수=지연, 양수=빠름)
    const curSchedDiffSec = curStop ? toMin(trip[currentIdx]) * 60 - nowSecNow : null;
    const fmtMS = (sec) => { const a = Math.abs(sec); const m = Math.floor(a / 60), s = a % 60; return m > 0 ? `${m}분 ${s}초` : `${s}초`; };
    return (
      <div className="min-h-screen w-full p-4 sm:p-6 flex items-center justify-center"
        style={{ background: "radial-gradient(ellipse at top, #1a1d29 0%, #0a0b10 60%, #050608 100%)" }}>
        <div className="w-full max-w-md">

          {/* Compact header */}
          <div className="rounded-t-3xl px-5 py-3 border-2 border-b-0 flex items-center justify-between"
            style={{ background: "linear-gradient(180deg, #2d3142 0%, #1c1f2b 100%)", borderColor: "#3a3f54" }}>
            <div>
              <div className="text-[10px] text-amber-400/80 tracking-widest">제4회 무등산 인문축제</div>
              <div className="text-base font-bold leading-tight"
                style={{ color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
                {route.label} · {tripIdx + 1}회차
              </div>
              <div className="text-[10px] text-slate-400 mt-0.5"
                style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                {trip[0]} 출발 · {trip[trip.length - 1]} 도착 · <span style={{ color: tripStatus.color }}>{tripStatus.label}</span>
              </div>
            </div>
            <div className="flex flex-col items-end gap-1">
              <div className="flex items-center gap-1.5">
                {autoMode && <Navigation2 size={11} className={userPos ? "" : "animate-pulse"}
                  style={{ color: userPos ? "#22d65f" : "#fbbf24" }} />}
                <div className={`w-2 h-2 rounded-full ${isAnnouncing ? "animate-pulse" : ""}`}
                  style={{ background: isAnnouncing ? "#ef4444" : "#475569" }} />
              </div>
              <button onClick={() => setMode("advanced")}
                title="고급 설정으로 전환"
                className="text-slate-400 hover:text-amber-400 p-1">
                <Settings size={16} />
              </button>
            </div>
          </div>

          {/* Big glanceable status bar */}
          <div className="px-3 py-2 border-x-2 flex items-center justify-between gap-2"
            style={{
              background: isAnnouncing ? "rgba(239,68,68,0.18)"
                : autoMode ? (userPos ? "rgba(34,214,95,0.15)" : "rgba(251,191,36,0.12)")
                : "rgba(100,116,139,0.12)",
              borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54",
            }}>
            <div className="flex items-center gap-2 min-w-0">
              <div className={`w-3 h-3 rounded-full flex-shrink-0 ${isAnnouncing || (autoMode && !userPos) ? "animate-pulse" : ""}`}
                style={{ background: isAnnouncing ? "#ef4444" : autoMode ? (userPos ? "#22d65f" : "#fbbf24") : "#64748b" }} />
              <span className="text-base font-bold truncate"
                style={{ fontFamily: "'Jua', sans-serif",
                  color: isAnnouncing ? "#fca5a5" : autoMode ? (userPos ? "#22d65f" : "#fbbf24") : "#94a3b8" }}>
                {isAnnouncing ? "📢 안내 방송 중"
                  : autoMode ? (userPos ? "GPS 자동 · 위치 정상" : "GPS 자동 · 신호 대기")
                  : "수동 대기 중"}
              </span>
            </div>
            {autoMode && autoLegSwitch && (
              <span className="flex-shrink-0 text-[10px] font-bold px-2 py-1 rounded"
                style={{ background: "rgba(34,214,95,0.2)", color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                자동 전환 ON
              </span>
            )}
          </div>

          {/* Current stop — BIG */}
          <div className="px-5 py-8 border-x-2"
            style={{ background: "#0a0b0f", borderColor: "#3a3f54",
              backgroundImage: "repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px)" }}>
            <div className="text-center mb-3">
              <span className="text-[11px] tracking-[0.3em] px-3 py-1 rounded-full"
                style={{ color: "#fbbf24", background: "rgba(251, 191, 36, 0.1)",
                  fontFamily: "'IBM Plex Mono', monospace" }}>
                이번 정류장 · {trip[currentIdx]}
              </span>
            </div>
            {curSchedDiffSec != null && (
              <div className="text-center -mt-1 mb-2 text-[11px]"
                style={{ fontFamily: "'Jua', sans-serif",
                  color: curSchedDiffSec < -5 ? "#fb923c" : curSchedDiffSec > 5 ? "#22d65f" : "#94a3b8" }}>
                {curSchedDiffSec < -5 ? `시간표보다 ${fmtMS(curSchedDiffSec)} 지연`
                  : curSchedDiffSec > 5 ? `시간표보다 ${fmtMS(curSchedDiffSec)} 빠름`
                  : "정시 운행"}
              </div>
            )}
            <div className="text-center">
              <div style={{
                color: "#fbbf24",
                fontFamily: "'Black Han Sans', sans-serif",
                fontSize: "clamp(2.5rem, 14vw, 4.5rem)",
                lineHeight: 1,
                textShadow: "0 0 24px rgba(251, 191, 36, 0.7), 0 0 48px rgba(251, 191, 36, 0.3)",
                letterSpacing: "-0.02em",
                wordBreak: "keep-all",
              }}>
                {curStop?.name || "—"}
              </div>
              {curStop?.sub && (
                <div className="text-sm text-amber-500/70 mt-2">{curStop.sub}</div>
              )}
              {curStop?.terminus && (
                <div className="mt-3 inline-block px-2 py-0.5 rounded text-[10px]"
                  style={{ background: "rgba(239, 68, 68, 0.15)", color: "#fca5a5",
                    border: "1px solid rgba(239, 68, 68, 0.3)" }}>
                  종점
                </div>
              )}
            </div>
          </div>

          {/* Next stop — medium */}
          <div className="px-5 py-4 border-x-2 flex items-center justify-between gap-3"
            style={{ background: "#13151c", borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54" }}>
            <div className="flex-shrink-0 flex flex-col items-center px-2 py-1 rounded"
              style={{ background: "rgba(34, 214, 95, 0.12)", minWidth: 56 }}>
              <span className="text-[9px] tracking-widest text-emerald-400/80"
                style={{ fontFamily: "'IBM Plex Mono', monospace" }}>NEXT</span>
              <span className="text-sm font-black text-emerald-400"
                style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                {nextStop ? trip[currentIdx + 1] : "종점"}
              </span>
            </div>
            <div className="flex-1 min-w-0 text-right">
              <div className="text-2xl font-bold leading-tight break-keep"
                style={{ color: nextStop ? "#e2e8f0" : "#64748b", fontFamily: "'Jua', sans-serif" }}>
                {nextStop?.name || "운행 종료"}
              </div>
              {nextStop && nextSchedDiffSec != null && (
                <div className="text-[11px] mt-1"
                  style={{ color: nextSchedDiffSec < 0 ? "#fb923c" : "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                  {nextSchedDiffSec >= 0 ? `예정까지 ${fmtMS(nextSchedDiffSec)}` : `${fmtMS(nextSchedDiffSec)} 지연`}
                </div>
              )}
              {arrivalDistText && nextStop && (
                <div className="text-[11px] mt-0.5"
                  style={{ color: distToNext < triggerRadius ? "#ef4444" : "#22d65f",
                    fontFamily: "'IBM Plex Mono', monospace" }}>
                  ↓ {arrivalDistText}
                </div>
              )}
            </div>
          </div>

          {/* Next leg connection (only at terminus or end) */}
          {nextLegInfo ? (
            isAtTerminus && (
              <div className="px-5 py-3 border-x-2 flex items-center justify-between gap-3"
                style={{ background: "rgba(34, 214, 95, 0.15)", borderColor: "#3a3f54",
                  borderBottom: "1px solid #3a3f54" }}>
                <div className="flex items-center gap-2 min-w-0">
                  <div className="flex flex-col items-center px-2 py-1 rounded"
                    style={{ background: "#22d65f" }}>
                    <span className="text-[8px] tracking-widest"
                      style={{ color: "#0a0b0f", fontFamily: "'IBM Plex Mono', monospace" }}>NEXT</span>
                    <span className="text-xs font-black"
                      style={{ color: "#0a0b0f", fontFamily: "'IBM Plex Mono', monospace" }}>
                      {nextLegInfo.departTime}
                    </span>
                  </div>
                  <div className="text-sm font-bold truncate"
                    style={{ color: "#22d65f", fontFamily: "'Jua', sans-serif" }}>
                    {nextLegInfo.label} {nextLegInfo.tripNum}회차
                  </div>
                </div>
                <button onClick={goToNextLeg}
                  className="flex-shrink-0 px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap"
                  style={{ background: "#22d65f", color: "#0a0b0f",
                    fontFamily: "'Jua', sans-serif",
                    boxShadow: "0 0 16px rgba(34, 214, 95, 0.4)" }}>
                  전환 →
                </button>
              </div>
            )
          ) : isAtTerminus && (
            <div className="px-5 py-3 border-x-2"
              style={{ background: "rgba(100, 116, 139, 0.1)", borderColor: "#3a3f54",
                borderBottom: "1px solid #3a3f54" }}>
              <div className="text-xs text-center text-slate-400" style={{ fontFamily: "'Jua', sans-serif" }}>
                🏁 오늘 운행 종료
              </div>
            </div>
          )}

          {/* GPS error banner (compact) — 운전 화면에서 바로 재시도 */}
          {(gpsError || permissionState === "denied") && (
            <div className="px-5 py-2 border-x-2 flex items-center gap-2 text-xs"
              style={{ background: "rgba(239,68,68,0.08)", borderColor: "#3a3f54",
                borderBottom: "1px solid #3a3f54", color: "#fca5a5" }}>
              <AlertCircle size={12} />
              <span className="flex-1">{permissionState === "denied" ? "위치 권한 차단됨" : gpsError}</span>
              <button onClick={retryPermission} className="text-emerald-400 underline">🔄 다시</button>
              <button onClick={() => setMode("advanced")}
                className="text-amber-400 underline">설정</button>
            </div>
          )}

          {/* Controls — big announce/replay (prev/next spaced apart to avoid mis-taps) */}
          <div className="px-5 py-6 border-2 border-t-0 rounded-b-3xl flex flex-col items-center gap-3"
            style={{ background: "linear-gradient(180deg, #1c1f2b 0%, #13151c 100%)", borderColor: "#3a3f54" }}>
            <div className="flex items-center justify-between w-full">
              <button onClick={prev} disabled={currentIdx === 0}
                className="w-14 h-14 rounded-full flex items-center justify-center disabled:opacity-30"
                style={{ background: "rgba(251, 191, 36, 0.1)",
                  border: "1px solid rgba(251, 191, 36, 0.3)", color: "#fbbf24" }}>
                <SkipBack size={22} />
              </button>
              <button onClick={announce}
                className="w-24 h-24 rounded-full flex flex-col items-center justify-center relative"
                style={{
                  background: "linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%)",
                  boxShadow: isAnnouncing ? "0 0 36px rgba(239, 68, 68, 0.6)" : "0 0 36px rgba(251, 191, 36, 0.5)",
                  color: "#0a0b0f" }}>
                <Volume2 size={34} />
                <span className="text-[10px] font-bold mt-0.5" style={{ fontFamily: "'Jua', sans-serif" }}>
                  {isAnnouncing ? "다시" : "안내"}
                </span>
                {isAnnouncing && (<div className="absolute inset-0 rounded-full animate-ping"
                  style={{ background: "rgba(239, 68, 68, 0.35)" }} />)}
              </button>
              <button onClick={next} disabled={currentIdx >= stops.length - 1}
                className="w-14 h-14 rounded-full flex items-center justify-center disabled:opacity-30"
                style={{ background: "rgba(251, 191, 36, 0.1)",
                  border: "1px solid rgba(251, 191, 36, 0.3)", color: "#fbbf24" }}>
                <SkipForward size={22} />
              </button>
            </div>
            {isAnnouncing && (
              <button onClick={stopAnnounce}
                className="px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5"
                style={{ background: "rgba(239,68,68,0.15)", color: "#fca5a5",
                  border: "1px solid rgba(239,68,68,0.4)", fontFamily: "'Jua', sans-serif" }}>
                <Pause size={12} /> 안내 정지
              </button>
            )}
          </div>

          {/* Bottom: GPS auto toggle (compact) */}
          <div className="mt-3 flex items-center justify-between px-2">
            <button onClick={() => {
                if (permissionState === "denied") { setMode("advanced"); return; }
                if (!autoMode) primeTTS();
                setAutoMode(!autoMode);
              }}
              className="flex items-center gap-2 text-xs px-3 py-1.5 rounded-full"
              style={{
                background: autoMode ? "rgba(34, 214, 95, 0.15)" : "rgba(100, 116, 139, 0.1)",
                color: autoMode ? "#22d65f" : "#94a3b8",
                border: `1px solid ${autoMode ? "rgba(34, 214, 95, 0.3)" : "#3a3f54"}`,
                fontFamily: "'Jua', sans-serif",
              }}>
              <Navigation size={12} />
              GPS 자동 {autoMode ? (userPos ? `· ${triggerRadius}m` : "· 신호 대기") : "OFF"}
            </button>
            <button onClick={() => setShowTimetable(true)}
              className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full"
              style={{ background: "rgba(251, 191, 36, 0.1)", color: "#fbbf24",
                border: "1px solid rgba(251, 191, 36, 0.3)", fontFamily: "'Jua', sans-serif" }}>
              🕘 시간표
            </button>
            <div className="text-[10px] text-slate-600 tracking-wider"
              style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
              {currentIdx + 1}/{stops.length} · {tripsToday}회 · {BUILD}
            </div>
          </div>

          {showTimetable && <TimetableModal tripsToday={tripsToday} onClose={() => setShowTimetable(false)} />}
        </div>
      </div>
    );
  }

  /* ===== ADVANCED MODE — full controls ===== */
  return (
    <div className="min-h-screen w-full p-4 sm:p-6 flex items-center justify-center"
      style={{ background: "radial-gradient(ellipse at top, #1a1d29 0%, #0a0b10 60%, #050608 100%)" }}>
      <div className="w-full max-w-md">

        {/* Header */}
        <div className="relative rounded-t-3xl px-5 py-4 border-2 border-b-0"
          style={{ background: "linear-gradient(180deg, #2d3142 0%, #1c1f2b 100%)", borderColor: "#3a3f54" }}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-xl flex items-center justify-center shadow-lg"
                style={{ background: "linear-gradient(135deg, #f59e0b 0%, #d97706 100%)", color: "#fff",
                  fontFamily: "'Black Han Sans', sans-serif", fontSize: "1rem", lineHeight: 1,
                  boxShadow: "0 0 20px rgba(245, 158, 11, 0.4)" }}>
                셔틀
              </div>
              <div>
                <div className="text-[10px] text-amber-400/80 tracking-widest mb-0.5">제4회 무등산 인문축제</div>
                <div className="text-xl leading-none" style={{ color: "#fbbf24",
                  fontFamily: "'Black Han Sans', sans-serif", textShadow: "0 0 12px rgba(251, 191, 36, 0.4)" }}>
                  {route.label}
                </div>
              </div>
            </div>
            <div className="flex flex-col items-end gap-1">
              <div className="flex items-center gap-1.5">
                {autoMode && <Navigation2 size={11} className={userPos ? "" : "animate-pulse"}
                  style={{ color: userPos ? "#22d65f" : "#fbbf24" }} />}
                <div className={`w-2 h-2 rounded-full ${isAnnouncing ? "animate-pulse" : ""}`}
                  style={{ background: isAnnouncing ? "#ef4444" : "#475569" }} />
              </div>
              <span className="text-[10px] text-slate-500 tracking-wider">
                {isAnnouncing ? "ON AIR" : autoMode ? (userPos ? "GPS LOCKED" : "GPS …") : "STAND BY"}
              </span>
            </div>
          </div>

          {/* Direction swap */}
          <div className="mt-3 flex gap-2">
            <button onClick={() => setMode("simple")}
              className="px-3 py-2 rounded-lg flex items-center gap-1 text-xs"
              style={{ background: "rgba(100, 116, 139, 0.15)", border: "1px solid #3a3f54",
                color: "#94a3b8", fontFamily: "'Jua', sans-serif" }}>
              <ChevronLeft size={12} />
              운행
            </button>
            <button onClick={swapDirection}
              className="flex-1 px-3 py-2 rounded-lg flex items-center justify-center gap-2 text-xs transition-colors"
              style={{ background: "rgba(251, 191, 36, 0.1)", border: "1px solid rgba(251, 191, 36, 0.3)",
                color: "#fbbf24", fontFamily: "'Jua', sans-serif" }}>
              <ArrowLeftRight size={12} />
              {route.full} · 방향 전환
            </button>
          </div>
        </div>

        {/* Trip selector */}
        <div className="px-5 py-3 border-x-2"
          style={{ background: "#13151c", borderColor: "#3a3f54", borderBottom: "1px solid #3a3f54" }}>
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <Clock size={12} style={{ color: tripStatus.color }} />
              <span className="text-xs font-bold" style={{ color: tripStatus.color, fontFamily: "'Jua', sans-serif" }}>
